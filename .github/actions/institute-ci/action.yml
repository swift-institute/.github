name: 'Institute CI binary'
description: >-
  Provision the `institute-continuous-integration` executable from its
  published rolling release, verify its checksum and its recorded source
  revision, and refuse before any caller trusts it.

# Installed, never compiled.
#
# The retired mechanism built this package from source, on the consumer,
# through the Workspace coordinate: a Swift toolchain install, two
# checkouts, a SwiftPM build, and an apt provisioning set, all on the
# critical path of the `plan` job — the first job of every run of every
# package in the fleet. It was fast only while an actions/cache entry
# happened to survive. The entry's key is exact by policy, so the first
# change to the sources or the provisioning set forced the cold path, and
# the cold path had gone unexecuted long enough to have broken (run
# 31598019355: `--static-swift-stdlib` links Foundation statically, which
# needs libcurl symbols the runner did not provide).
#
# The producer is publish-ci-binaries.yml in
# swift-institute/institute-continuous-integration. Its MANIFEST.txt
# records the source revision and every branch-resolved dependency HEAD
# the published bytes were built from.
#
# Evidence class: tracked, verified, recorded. The release tag is not a
# pin and is never treated as one — every run checks SHA256SUMS and
# compares the manifest's recorded revision against the fleet pin before
# executing anything, and reports the revision it resolved.

inputs:
  sources-revision:
    description: >-
      The exact commit of swift-institute/institute-continuous-integration
      the published binary must have been built from. Empty — the default —
      reads the single authority, `.institute-ci-pin` at this repository's
      root. A value that is not a full 40-hex SHA refuses here.
    required: false
    default: ''

outputs:
  binary:
    description: 'Absolute path to the verified executable.'
    value: ${{ steps.install.outputs.binary }}
  sources-revision:
    description: 'Commit the published binary was built from, as verified.'
    value: ${{ steps.identity.outputs.sources-revision }}

runs:
  using: composite
  steps:
    - name: Institute CI source identity
      id: identity
      shell: bash
      env:
        SOURCES_REVISION: ${{ inputs.sources-revision }}
      run: |
        set -euo pipefail
        # One authority. `.institute-ci-pin` sits three levels above this
        # action file, at the repository root; reading it here rather than
        # copying its value into each caller is what keeps a partial pin
        # advance from splitting the fleet across two revisions.
        if [ -z "$SOURCES_REVISION" ]; then
          PIN_FILE="${GITHUB_ACTION_PATH}/../../../.institute-ci-pin"
          [ -f "$PIN_FILE" ] \
            || { echo "::error::no Institute CI pin at $PIN_FILE"; exit 1; }
          SOURCES_REVISION="$(tr -d '[:space:]' < "$PIN_FILE")"
        fi
        [[ "$SOURCES_REVISION" =~ ^[0-9a-f]{40}$ ]] \
          || { echo "::error::refusing malformed Institute CI source revision: '$SOURCES_REVISION'"; exit 1; }
        echo "sources-revision=$SOURCES_REVISION" >> "$GITHUB_OUTPUT"

    - name: Install the published Institute CI binary
      id: install
      shell: bash
      env:
        RELEASE: https://github.com/swift-institute/institute-continuous-integration/releases/download/ci-binaries
        SOURCES_REVISION: ${{ steps.identity.outputs.sources-revision }}
      run: |
        set -euo pipefail
        command -v curl >/dev/null || { apt-get update -qq && apt-get install -qq -y curl; }
        work="$(mktemp -d)"
        for asset in SHA256SUMS institute-continuous-integration MANIFEST.txt; do
          curl --fail --silent --show-error --location --retry 2 \
            --output "$work/$asset" "$RELEASE/$asset"
        done
        (cd "$work" && sha256sum --check SHA256SUMS)

        # The checksum proves the bytes are the ones published; it says
        # nothing about which sources they came from. The manifest does,
        # and disagreeing with the fleet pin is fail-closed: a pin advance
        # whose publish has not landed must stop here rather than run an
        # older binary under a newer pin's name.
        PUBLISHED="$(sed -n 's/^sources-revision=//p' "$work/MANIFEST.txt")"
        if [ "$PUBLISHED" != "$SOURCES_REVISION" ]; then
          echo "::error::published Institute CI binary was built from '$PUBLISHED', but the fleet pin is '$SOURCES_REVISION'. Run publish-ci-binaries.yml on institute-continuous-integration at the pinned revision, or correct .institute-ci-pin."
          exit 1
        fi
        install -m 0755 "$work/institute-continuous-integration" "$work/bin-institute-continuous-integration"
        echo "binary=$work/bin-institute-continuous-integration" >> "$GITHUB_OUTPUT"
        {
          echo "### Institute CI binary"
          echo
          echo "Verified against \`SHA256SUMS\`, built from \`${PUBLISHED}\`."
          echo
          echo '```'
          cat "$work/MANIFEST.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
