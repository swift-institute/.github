name: 'Institute CI planner'
description: >-
  Build the `institute` executable from swift-institute/institute-application
  at the pinned revision and hand its path to the caller. The planner now
  ships as source: the typed `institute ci` verbs replaced the retired
  `institute-continuous-integration` binary.

# Built from source, at an exact pinned revision.
#
# The previous mechanism installed a prebuilt binary from the rolling
# `ci-binaries` release on swift-institute/institute-continuous-integration
# and verified its checksum and recorded source revision. That repository
# was archived on 2026-08-23 with the release asset missing, which took the
# whole fleet's Plan step down (swift-institute/.github#632): an archived
# repository's releases are read-only, so the transport could not be
# repaired in place. The planner logic itself had already been reabsorbed
# into the institute package family as the typed `institute ci` verbs, so
# this action now builds that executable directly from source.
#
# Identity: `.institute-ci-pin` on the default branch of
# swift-institute/.github names the exact swift-institute/institute-application
# commit to build — it is no longer an institute-continuous-integration
# revision. The checkout is fetched over HTTPS at that exact SHA and the
# resulting HEAD is read back before anything is compiled, so the binary's
# source identity is proven, not assumed. The pin does not freeze the
# dependency graph: institute-application declares branch dependencies and
# commits no Package.resolved, so SwiftPM resolves dependency heads afresh
# for each build. Package.resolved and .build remain ephemeral generated
# state and are never cached or committed.
#
# Cost: every invocation compiles the full closure from source. Publishing a
# binary would create a new release surface, which needs principal approval
# this cutover does not have.

inputs:
  sources-revision:
    description: >-
      The exact commit of swift-institute/institute-application to build the
      planner from. Empty — the default — reads the single authority,
      `.institute-ci-pin` on the default branch of swift-institute/.github,
      live at run time. A value that is not a full 40-hex SHA refuses here.
    required: false
    default: ''
  swift-version:
    description: 'Swift toolchain used to build the planner.'
    required: false
    default: '6.4'

  subject-mode:
    description: >-
      Paired-source mode only: `subject` when the workspace is the ci-subject
      checkout, `aggregate` when it is the .github policy checkout of ci-ok.
    required: false
    default: ''
  subject-repository:
    description: 'Paired-source mode only: trusted subject repository from the plan.'
    required: false
    default: ''
  subject-sha:
    description: 'Paired-source mode only: trusted 40-hex subject SHA from the plan.'
    required: false
    default: ''
  plan-result:
    description: 'Paired-source aggregate mode only: needs.plan.result.'
    required: false
    default: ''
outputs:
  binary:
    description: 'Absolute path to the smoke-launched `institute` executable.'
    value: ${{ steps.transport.outputs.binary }}
  runtime-library-path:
    description: >-
      Darwin deployment-runtime directory required to launch the executable;
      empty on platforms whose native runtime launches it directly.
    value: ${{ steps.transport.outputs.runtime-library-path }}
  sources-revision:
    description: 'Commit the planner was built from, as verified.'
    value: ${{ steps.identity.outputs.sources-revision }}
  planner-mode:
    description: >-
      `pair` only while the reviewed migration pair is active for one of the
      two migration subjects; `pin` otherwise. Callers may couple
      migration-only verification (the full tier) to this value.
    value: ${{ steps.identity.outputs.mode }}

runs:
  using: composite
  steps:
    - name: Institute CI source identity
      id: identity
      shell: bash
      env:
        SOURCES_REVISION: ${{ inputs.sources-revision }}
        REQUESTED_REVISION: ${{ inputs.sources-revision }}
        PAIR: ${{ github.action_path }}/pair.sh
        SUBJECT_MODE: ${{ inputs.subject-mode }}
        SUBJECT_REPOSITORY: ${{ inputs.subject-repository }}
        SUBJECT_SHA: ${{ inputs.subject-sha }}
        PLAN_RESULT: ${{ inputs.plan-result }}
      run: |
        set -euo pipefail
        "$PAIR" stage identity started
        # One authority. `.institute-ci-pin` on the default branch of the
        # central repository, read live at run time. Reading it through
        # GITHUB_ACTION_PATH was a frozen copy: callers self-pin this
        # action's revision, so the vendored file lagged the branch and a
        # pin advance split the fleet until every internal ref was also
        # advanced (incident 2026-08-18, #626/#628). The branch file is
        # the pin's entire job; ref lag must not shadow it.
        #
        # The file may carry `#` comment lines; the pin is the single
        # 40-hex line that remains after dropping them.
        command -v curl >/dev/null || { apt-get update -qq && apt-get install -qq -y curl; }
        if [ -z "$SOURCES_REVISION" ]; then
          SOURCES_REVISION="$(curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/swift-institute/.github/main/.institute-ci-pin \
            | grep -v '^[[:space:]]*#' | tr -d '[:space:]')" \
            || { echo "::error::could not read .institute-ci-pin from swift-institute/.github@main"; exit 1; }
        fi
        [[ "$SOURCES_REVISION" =~ ^[0-9a-f]{40}$ ]] \
          || { echo "::error::refusing malformed Institute CI source revision: '$SOURCES_REVISION'"; exit 1; }
        # Transitional paired sources, only when no explicit revision was
        # requested: .institute-ci-pair and its approved Package.resolved,
        # both read live from the default branch. 404 means no pair.
        MODE=pin
        ROUTE=pin
        if [ -z "$REQUESTED_REVISION" ]; then
          # Two-subject routing from trusted identity, decided before any pair
          # authority is fetched. Missing or malformed identity refuses.
          "$PAIR" stage routing started
          ROUTE="$("$PAIR" route "$SUBJECT_MODE" "$SUBJECT_REPOSITORY" "$SUBJECT_SHA" "$PLAN_RESULT")"
          "$PAIR" note route "$ROUTE"
          "$PAIR" stage routing ok
          [ "$ROUTE" = pair ] || "$PAIR" note mode pin
        fi
        if [ -z "$REQUESTED_REVISION" ] && [ "$ROUTE" = pair ]; then
          "$PAIR" stage pair-authority started
          "$PAIR" note pair-authority requested
          PAIR_FILE="$RUNNER_TEMP/institute-ci-pair"
          code="$(curl --silent --show-error --location --retry 3 -o "$PAIR_FILE" -w '%{http_code}' \
            https://raw.githubusercontent.com/swift-institute/.github/main/.institute-ci-pair)" \
            || { echo "::error::could not read .institute-ci-pair from swift-institute/.github@main"; exit 1; }
          case "$code" in
            404) "$PAIR" note mode pin; "$PAIR" stage pair-authority ok ;;
            200)
              ENTRIES="$("$PAIR" read-pair "$PAIR_FILE")"
              if [ -n "$ENTRIES" ]; then
                get() { printf '%s\n' "$ENTRIES" | sed -n "s/^$1=//p"; }
                RESOLVED_FILE="$RUNNER_TEMP/institute-ci-pair.resolved"
                curl --fail --silent --show-error --location --retry 3 -o "$RESOLVED_FILE" \
                  https://raw.githubusercontent.com/swift-institute/.github/main/.institute-ci-pair.resolved \
                  || { echo "::error::could not read .institute-ci-pair.resolved"; exit 1; }
                [ "$("$PAIR" sha256 "$RESOLVED_FILE")" = "$(get resolved-sha256)" ] \
                  || { echo "::error::.institute-ci-pair.resolved does not match its approved sha256."; exit 1; }
                MODE=pair
                SOURCES_REVISION="$(get application)"
                "$PAIR" note pair-file-sha256 "$("$PAIR" sha256 "$PAIR_FILE")"
                "$PAIR" note approved-resolved-sha256 "$(get resolved-sha256)"
                "$PAIR" note application-revision "$SOURCES_REVISION"
                "$PAIR" note application-tree "$(get application-tree)"
                "$PAIR" note expires "$(get expires)"
                {
                  echo "application-tree=$(get application-tree)"
                  echo "institute-revision=$(get institute)"
                  echo "institute-tree=$(get institute-tree)"
                  echo "resolved-file=$RESOLVED_FILE"
                  echo "resolved-sha256=$(get resolved-sha256)"
                  echo "pins=$(get pins)"
                } >> "$GITHUB_OUTPUT"
                "$PAIR" note mode pair
                "$PAIR" stage pair-authority ok
              fi
              ;;
            *) echo "::error::reading .institute-ci-pair returned HTTP $code"; exit 1 ;;
          esac
        fi
        if [ -n "$REQUESTED_REVISION" ]; then "$PAIR" note mode pin; fi
        echo "mode=$MODE" >> "$GITHUB_OUTPUT"
        "$PAIR" stage identity ok
        echo "sources-revision=$SOURCES_REVISION" >> "$GITHUB_OUTPUT"

    # A plain fetch into RUNNER_TEMP, not actions/checkout: the sources
    # must live OUTSIDE the subject workspace. `institute ci package
    # validate` walks the subject root recursively (broken-symlink scan),
    # and a SwiftPM checkout tree parked inside the workspace would feed
    # the planner's own dependency fixtures into every repository's
    # verdict.
    - name: Fetch planner sources at the pinned revision
      id: sources
      shell: bash
      env:
        SOURCES_REVISION: ${{ steps.identity.outputs.sources-revision }}
        MODE: ${{ steps.identity.outputs.mode }}
        PAIR: ${{ github.action_path }}/pair.sh
        APPLICATION_TREE: ${{ steps.identity.outputs.application-tree }}
        INSTITUTE_REVISION: ${{ steps.identity.outputs.institute-revision }}
        INSTITUTE_TREE: ${{ steps.identity.outputs.institute-tree }}
        SUBJECT_MODE: ${{ inputs.subject-mode }}
        SUBJECT_REPOSITORY: ${{ inputs.subject-repository }}
        SUBJECT_SHA: ${{ inputs.subject-sha }}
        PLAN_RESULT: ${{ inputs.plan-result }}
      run: |
        set -euo pipefail
        "$PAIR" stage app-fetch started
        DIR="$RUNNER_TEMP/institute-ci-sources"
        rm -rf "$DIR"
        git init --quiet "$DIR"
        git -C "$DIR" remote add origin https://github.com/swift-institute/institute-application.git
        git -C "$DIR" fetch --quiet --depth 1 origin "$SOURCES_REVISION"
        git -C "$DIR" checkout --quiet --detach FETCH_HEAD
        HEAD="$(git -C "$DIR" rev-parse HEAD)"
        if [ "$HEAD" != "$SOURCES_REVISION" ]; then
          echo "::error::planner checkout is at '$HEAD', not the pinned '$SOURCES_REVISION'."
          exit 1
        fi
        "$PAIR" stage app-fetch ok
        if [ "$MODE" = pair ]; then
          "$PAIR" stage sources started
          [ "$(git -C "$DIR" rev-parse 'HEAD^{tree}')" = "$APPLICATION_TREE" ] \
            || { echo "::error::paired application tree is not the approved '$APPLICATION_TREE'."; exit 1; }
          INST="$RUNNER_TEMP/institute-ci-institute"
          rm -rf "$INST"
          git init --quiet "$INST"
          git -C "$INST" remote add origin https://github.com/swift-institute/institute.git
          git -C "$INST" fetch --quiet --depth 1 origin "$INSTITUTE_REVISION"
          git -C "$INST" checkout --quiet -B main FETCH_HEAD
          [ "$(git -C "$INST" rev-parse HEAD)" = "$INSTITUTE_REVISION" ] \
            || { echo "::error::paired institute checkout is not at '$INSTITUTE_REVISION'."; exit 1; }
          [ "$(git -C "$INST" rev-parse 'HEAD^{tree}')" = "$INSTITUTE_TREE" ] \
            || { echo "::error::paired institute tree is not the approved '$INSTITUTE_TREE'."; exit 1; }
          "$PAIR" note institute-revision "$INSTITUTE_REVISION"
          "$PAIR" note institute-tree "$INSTITUTE_TREE"
          echo "institute-directory=$INST" >> "$GITHUB_OUTPUT"
          "$PAIR" stage sources ok
          "$PAIR" stage subject started
          "$PAIR" verify-subject "$SUBJECT_MODE" "$SUBJECT_REPOSITORY" "$SUBJECT_SHA" "$PLAN_RESULT" \
            "$GITHUB_WORKSPACE" "$APPLICATION_TREE" "$INSTITUTE_TREE"
          "$PAIR" stage subject ok
        fi
        echo "directory=$DIR" >> "$GITHUB_OUTPUT"

    - name: Install Swift
      uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
      with:
        swift-version: ${{ inputs.swift-version }}

    - name: Build the planner
      id: build
      shell: bash
      env:
        DIR: ${{ steps.sources.outputs.directory }}
        SOURCES_REVISION: ${{ steps.identity.outputs.sources-revision }}
        MODE: ${{ steps.identity.outputs.mode }}
        PAIR: ${{ github.action_path }}/pair.sh
        INSTITUTE_DIR: ${{ steps.sources.outputs.institute-directory }}
        INSTITUTE_REVISION: ${{ steps.identity.outputs.institute-revision }}
        INSTITUTE_TREE: ${{ steps.identity.outputs.institute-tree }}
        RESOLVED_FILE: ${{ steps.identity.outputs.resolved-file }}
        RESOLVED_SHA256: ${{ steps.identity.outputs.resolved-sha256 }}
        PINS: ${{ steps.identity.outputs.pins }}
      run: |
        set -euo pipefail
        START="$(date +%s)"

        # Same class of problem install-system-deps solves for the matrix
        # legs: C-shim targets `#include` system headers whose `-dev`
        # packages the environment does not ship (canary evidence: the
        # planner graph pulls swift-linux-standard, whose Linux Kernel
        # Shims need uuid-dev). Derive the packages from the resolved
        # graph's `.linkedLibrary` declarations. The mapping mirrors
        # .github/actions/install-system-deps — that action targets root
        # container jobs and the current workspace, this build runs
        # unprivileged on the runner host against RUNNER_TEMP; keep the
        # two maps in step until they are unified.
        RESOLVE_FLAGS=""
        if [ "$MODE" = pair ]; then
          RESOLVE_FLAGS="--force-resolved-versions"
          "$PAIR" stage resolve started
          # CI-only resolution override, confined to this RUNNER_TEMP checkout.
          swift package --package-path "$DIR" config set-mirror \
            --original https://github.com/swift-institute/institute.git \
            --mirror "$INSTITUTE_DIR"
          # The approved graph: the reviewed Package.resolved, byte for byte.
          cp "$RESOLVED_FILE" "$DIR/Package.resolved"
          swift package --package-path "$DIR" --force-resolved-versions resolve
          "$PAIR" stage resolve ok
          "$PAIR" stage graph-after-resolve started
          "$PAIR" verify-graph "$DIR" "$RESOLVED_SHA256" "$INSTITUTE_REVISION" "$INSTITUTE_TREE" "$PINS"
          "$PAIR" stage graph-after-resolve ok
        fi
        if command -v apt-get >/dev/null 2>&1; then
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          "$PAIR" stage apt-resolve started
          swift package --package-path "$DIR" $RESOLVE_FLAGS resolve
          "$PAIR" stage apt-resolve ok
          shopt -s nullglob
          manifests=("$DIR"/Package.swift "$DIR"/Package@swift-*.swift \
            "$DIR"/.build/checkouts/*/Package.swift "$DIR"/.build/checkouts/*/Package@swift-*.swift)
          libs=$(grep -hroE '\.linkedLibrary\("[^"]+"' "${manifests[@]}" 2>/dev/null \
                 | sed -E 's/.*"([^"]+)".*/\1/' | sort -u || true)
          map_lib() {
            case "$1" in
              uuid)     echo uuid-dev ;;
              uring)    echo liburing-dev ;;
              z)        echo zlib1g-dev ;;
              ssl|crypto) echo libssl-dev ;;
              curl)     echo libcurl4-openssl-dev ;;
              sqlite3)  echo libsqlite3-dev ;;
              xml2)     echo libxml2-dev ;;
              c|dl|m|pthread|rt|util|resolv) echo "" ;;
              *)        echo __UNMAPPED__ ;;
            esac
          }
          pkgs=""
          for lib in $libs; do
            p=$(map_lib "$lib")
            if [ "$p" = "__UNMAPPED__" ]; then
              echo "::warning::No apt mapping for linked library '$lib' in the planner graph."
            elif [ -n "$p" ]; then
              pkgs="$pkgs $p"
            fi
          done
          pkgs=$(printf '%s\n' $pkgs | sort -u | tr '\n' ' ')
          if [ -n "${pkgs// }" ]; then
            echo "Installing system dev-packages for the planner build: $pkgs"
            $SUDO apt-get update -qq
            $SUDO apt-get install -qq -y $pkgs
          fi
        fi

        if [ "$MODE" = pair ]; then
          "$PAIR" stage graph-before-build started
          "$PAIR" verify-graph "$DIR" "$RESOLVED_SHA256" "$INSTITUTE_REVISION" "$INSTITUTE_TREE" "$PINS"
          "$PAIR" stage graph-before-build ok
          "$PAIR" stage build started
          swift build --package-path "$DIR" --force-resolved-versions -c release --product institute
          "$PAIR" stage build ok
        else
          swift build --package-path "$DIR" -c release --product institute
        fi
        WALL="$(( $(date +%s) - START ))"
        {
          echo "### Institute CI planner"
          echo
          echo "Built \`institute\` from swift-institute/institute-application@\`${SOURCES_REVISION}\`."
          echo
          echo "Build wall clock: ${WALL}s."
        } >> "$GITHUB_STEP_SUMMARY"

    # A successful link is not sufficient transport evidence on Darwin.
    # The xcode-27 image currently runs macOS 26 while Institute requires
    # macOS 27; directly launching a package-built executable therefore
    # resolves against an older system Swift runtime and aborts before main.
    # Locate only deployment runtimes owned by the selected Swift/Xcode
    # toolchains, smoke-launch the exact bytes, and expose outputs afterwards.
    - name: Verify planner transport
      id: transport
      shell: bash
      env:
        DIR: ${{ steps.sources.outputs.directory }}
        PAIR: ${{ github.action_path }}/pair.sh
      run: |
        set -euo pipefail
        "$PAIR" stage transport started
        BINARY="$DIR/.build/release/institute"
        [ -x "$BINARY" ] \
          || { echo "::error::planner build produced no executable at $BINARY"; exit 1; }

        RUNTIME_LIBRARY_PATH=""
        if [ "$(uname -s)" = Darwin ]; then
          diagnostics="$RUNNER_TEMP/institute-ci-smoke.stderr"
          : > "$diagnostics"
          if ! "$BINARY" --help >/dev/null 2>"$diagnostics"; then
            [ -n "${TOOLCHAINS:-}" ] \
              || { echo "::error::Darwin planner transport has no selected Swift toolchain identity."; exit 1; }
            SWIFT_EXECUTABLE="$(xcrun --toolchain "$TOOLCHAINS" --find swift)"
            SWIFT_USR="$(cd "$(dirname "$SWIFT_EXECUTABLE")/.." && pwd -P)"
            DEVELOPER="$(xcode-select -p)"
            candidates=(
              "$SWIFT_USR/lib/swift-5.0/macosx"
              "$SWIFT_USR/lib/swift/macosx"
              "$DEVELOPER/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/macosx"
            )
            for candidate in "${candidates[@]}"; do
              [ -f "$candidate/libswiftCore.dylib" ] || continue
              if DYLD_LIBRARY_PATH="$candidate" "$BINARY" --help \
                >/dev/null 2>"$diagnostics"
              then
                RUNTIME_LIBRARY_PATH="$candidate"
                break
              fi
            done
            if [ -z "$RUNTIME_LIBRARY_PATH" ]; then
              echo "::error::neither the native runtime nor a selected Swift/Xcode deployment runtime could launch $BINARY on $(sw_vers -productVersion)."
              printf 'Tried runtime: %s\n' "${candidates[@]}" >&2
              [ ! -s "$diagnostics" ] || cat "$diagnostics" >&2
              exit 1
            fi
          fi
        else
          "$BINARY" --help >/dev/null
        fi

        echo "binary=$BINARY" >> "$GITHUB_OUTPUT"
        "$PAIR" stage transport ok
        echo "runtime-library-path=$RUNTIME_LIBRARY_PATH" >> "$GITHUB_OUTPUT"


    - name: Institute CI planner provenance
      if: ${{ always() }}
      shell: bash
      env:
        PAIR: ${{ github.action_path }}/pair.sh
      run: |
        "$PAIR" provenance >> "$GITHUB_STEP_SUMMARY"