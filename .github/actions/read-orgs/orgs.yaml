# Canonical Swift Institute ecosystem orgs manifest.
#
# This file is the single source of truth for the org list consumed by
# cross-org sweep workflows (sync-metadata-nightly, link-check-weekly,
# the cron-audit-base family, submit-dep-graph-weekly, and any future
# orchestrator that operates per-org).
#
# Schema:
#   - name:   GitHub org slug (kebab-case)
#     layer:  Architectural layer assignment (L1 | L2 | L3 | meta)
#     status: active | archived  (default active; archived orgs are filtered
#             out by default in the read-orgs composite)
#
# Layer assignment per swift-institute/Skills/swift-institute/SKILL.md
# five-layer architecture:
#   L1 Primitives — atomic building blocks
#   L2 Standards  — specification implementations (incl. spec-authority orgs
#                   like swift-ietf, swift-iso, etc.; CPU spec orgs like
#                   swift-arm-ltd, swift-intel, swift-riscv)
#   L3 Foundations — composed building blocks (incl. foundation-specific
#                    deps orgs like swift-linux-foundation, swift-microsoft)
#   meta          — institute-meta repos (Skills, Research, Audits, etc.)
#
# Adding an org: append a new record here. The change propagates to every
# orchestrator on the next workflow_dispatch / scheduled run via the
# read-orgs composite — no per-orchestrator edit required.
#
# Removing or archiving an org: set `status: archived`. Orgs at archived
# status are filtered out by default; orchestrators wanting them can
# pass `include-archived: 'true'` (or filter explicitly).
#
# SCOPE — enumerate everything, filter afterwards (measured 2026-07-28):
#
# Enumeration is deliberately unfiltered: 59 orgs holding 2,638 repos, of
# which 474 are public and non-archived. That discipline is load-bearing —
# an earlier sweep went wrong by mistaking a count of "what had been looked
# at" for the population — so nothing here licenses enumerating selectively.
# The filter is a separate step applied AFTER enumeration, and both numbers
# get reported.
#
# Applying scope: 473 of the 474 are in-scope and sit in the 17 orgs below.
# The one exclusion is `rule-institute/.github`.
#
# `rule-institute` is OUT OF SCOPE by principal ruling, 2026-07-28: it is a
# peer institute of swift-institute, not part of swift-institute's
# automation. Independently verified the same day: the `swift-institute-bot`
# App is not installed on that org, so minting a token fails with `Not
# Found` (dispatch run 30370255166). Two reasons, one decision.
#
# So the in-scope population is 473, and convergence against it is 473/473.
# This is a settled boundary, not unfinished business — do not add the org
# here to "close the gap", and do not install the App to enable it.
#
# NARROW READING WARNING: out of scope for CONVERGENCE is not out of scope
# for REFERENCE HYGIENE. The skills corpus's sanctioned-reference check
# deliberately watches `rule-*` namespaces by shape, because a mention of a
# peer institute in public Institute prose is exactly the cross-institute
# reference it exists to surface. That watch is unaffected by this ruling
# and must not be narrowed to match it. Different purposes, different scopes.

