# Read the canonical ecosystem orgs manifest and emit a JSON array of org
# names matching a jq filter. Orchestrators call this from one config job and
# populate their matrix via fromJSON, instead of hardcoding an org list each.
#
# Manifest source of truth: `${github.action_path}/orgs.yaml` beside this
# action. Adding an ecosystem org is an edit to that ONE file.
#
# PEER-INSTITUTE CONSUMPTION (#212). The manifest SOURCE is parameterizable so
# a peer institute can consume these public reusables with its own org
# population and its own App credentials. Precedence: `manifest-path` (a file
# already on the runner) > `manifest-repository` (owner/repo whose
# default-branch root orgs.yaml is fetched via the API) > the in-action
# default. Both default empty, so an existing caller behaves byte-identically.
#
# This parameterizes CONSUMPTION, NOT enrollment: rule orgs never enter the
# swift-institute manifest and swift-institute-bot is never installed on them.
# No swift-institute workflow passes either input.
#
# Peer thin-caller pattern — drivers stay institute-local; this composite and
# the per-org reusables are the shared surface:
#
#   jobs:
#     config:
#       runs-on: ubuntu-latest
#       outputs:
#         orgs: ${steps.read.outputs.orgs}
#       steps:
#         - id: read
#           uses: swift-institute/.github/.github/actions/read-orgs@main
#           with:
#             manifest-repository: rule-institute/.github
#             filter: 'select(.status=="active") | .name'
#     sweep:
#       needs: config
#       strategy:
#         matrix:
#           org: ${fromJSON(needs.config.outputs.orgs)}
#       permissions:
#         contents: read
#       uses: swift-institute/.github/.github/workflows/sync-metadata.yml@main
#       with:
#         org: ${matrix.org}
#       secrets:
#         SWIFT_INSTITUTE_BOT_APP_CLIENT_ID: ${secrets.RULE_INSTITUTE_BOT_APP_CLIENT_ID}
#         SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY: ${secrets.RULE_INSTITUTE_BOT_APP_PRIVATE_KEY}
#
# (Single-brace ${...} above stands for GitHub's ${{ ... }} syntax.)
#
# TRAP for peer manifests: the automatic `select(.status!="archived")`
# pre-filter encodes THIS manifest's status vocabulary (active | archived). A
# peer vocabulary is NOT narrowed by it — measured 2026-08-03, the default
# filter passed `reserved` and `frozen` orgs straight through. A peer must pass
# an explicit filter such as `select(.status=="active") | .name`.
#
# The secret SLOT names are the callee's binding names, not a claim about whose
# App is used: `secrets: inherit` does not cross the org boundary, so a peer
# maps its own credentials onto the slots explicitly. Reusables accepting them:
# sync-metadata.yml, validate-branch-pins.yml, validate-sub-org-wrappers.yml,
# swift-ci.yml, swift-docs.yml. The first two also accept
# `manifest-repository` directly and thread it to their own read-orgs calls.
#
# `filter` is a PER-RECORD jq expression — this action handles iteration and
# array-wrapping. Use `select(...)` to narrow and a final `.name` to project:
#   '.name'                                          (all orgs by name)
#   'select(.layer=="L1") | .name'                   (L1 only)
#   'select(.name=="swift-primitives") | .name'      (single org)
#   'select(.layer=="L1" or .name=="swift-institute") | .name'
#
# By default, archived orgs are filtered out via an automatic pre-filter
# `select(.status!="archived")`. Pass `include-archived: 'true'` to skip
# that pre-filter.
#
# Per [CI-030] @main pinning during active dev. Container compatibility:
# yq (mikefarah/yq v4) and jq are installed if not already present;
# ubuntu-latest runners pre-install jq, but swift:* containers may need
# the install path.

name: 'Read orgs manifest'
description: >
  Read an ecosystem orgs manifest and emit a JSON array of matching org
  names suitable for matrix:org via fromJSON. Default source is the
  canonical Swift Institute manifest in the action directory; a peer
  institute may point `manifest-path` or `manifest-repository` at its
  own manifest instead.

inputs:
  filter:
    description: >
      Per-record jq expression. The composite handles iteration over
      records and wraps the result in a JSON array; the filter operates
      on one record at a time. Use `select(...)` to narrow records and
      a final `.name` (or other field) to project the value. Default
      `.name` emits all (active) org names. Examples in header.
    required: false
    default: '.name'
  include-archived:
    description: >
      When the literal string `true`, archived orgs are NOT filtered out.
      Default `false` (archived orgs excluded by an automatic
      `select(.status!="archived")` pre-filter).
    required: false
    default: 'false'
  manifest-path:
    description: >
      Path to an orgs manifest file already present on the runner (for
      example from a prior checkout step). When non-empty, that file is
      read INSTEAD of the in-action orgs.yaml. Takes precedence over
      `manifest-repository`. Default empty: the in-action manifest,
      byte-identical to pre-parameterization behavior.
    required: false
    default: ''
  manifest-repository:
    description: >
      GitHub repository (`owner/repo`) whose default-branch root
      `orgs.yaml` is fetched via the API and read INSTEAD of the
      in-action manifest. Ignored when `manifest-path` is set. Default
      empty: the in-action manifest. This parameterizes peer-institute
      CONSUMPTION of the workflows; it does not enroll any org in the
      swift-institute manifest (the 2026-07-28 ruling in orgs.yaml
      stands).
    required: false
    default: ''
  token:
    description: >
      Token used to fetch `manifest-repository` contents via the GitHub
      API. Defaults to the workflow's `github.token`, which can read the
      calling repository — the common case where a peer manifest lives
      in the caller's own `.github` repository. Unused when
      `manifest-repository` is empty.
    required: false
    default: ${{ github.token }}

outputs:
  orgs:
    description: 'JSON array of matching org names. Suitable for fromJSON in matrix:org.'
    value: ${{ steps.read.outputs.orgs }}
  manifest-file:
    description: >
      Runner-local path of the manifest file the composite actually read
      (the in-action orgs.yaml, the `manifest-path` file, or the
      temporary file fetched from `manifest-repository`). Lets a caller
      hand the SAME manifest to a downstream consumer.
    value: ${{ steps.read.outputs.manifest-file }}

runs:
  using: 'composite'
  steps:
    # Tool-binary cache per [CI-044]: keyed exact-match-only on yq version.
    # Cache hit → /usr/local/bin/yq exists, found by `command -v` in the
    # next step. Miss → install step writes to the same path.
    - name: Cache yq binary
      id: cache-yq
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: /usr/local/bin/yq
        key: ${{ runner.os }}-yq-v4.45.4

    - id: read
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
        INCLUDE_ARCHIVED: ${{ inputs.include-archived }}
        ACTION_PATH: ${{ github.action_path }}
        MANIFEST_PATH: ${{ inputs.manifest-path }}
        MANIFEST_REPOSITORY: ${{ inputs.manifest-repository }}
        MANIFEST_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        # Resolve the manifest source (#212). Default — both inputs empty,
        # every pre-existing caller — is the in-action manifest, exactly
        # as before parameterization.
        if [[ -n "$MANIFEST_PATH" ]]; then
          if [[ ! -f "$MANIFEST_PATH" ]]; then
            echo "::error::read-orgs: manifest-path '$MANIFEST_PATH' does not exist on the runner."
            exit 1
          fi
          MANIFEST="$MANIFEST_PATH"
        elif [[ -n "$MANIFEST_REPOSITORY" ]]; then
          # Shape guard: owner/repo only — the value is interpolated into
          # an API URL, so reject anything with path or query characters.
          if [[ ! "$MANIFEST_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::read-orgs: manifest-repository must be 'owner/repo', got '$MANIFEST_REPOSITORY'."
            exit 1
          fi
          MANIFEST=$(mktemp "${RUNNER_TEMP:-/tmp}/read-orgs-manifest.XXXXXX")
          auth_args=()
          if [[ -n "$MANIFEST_TOKEN" ]]; then
            auth_args=(-H "Authorization: Bearer ${MANIFEST_TOKEN}")
          fi
          if ! curl -fsSL "${auth_args[@]}" \
              -H "Accept: application/vnd.github.raw+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${MANIFEST_REPOSITORY}/contents/orgs.yaml" \
              -o "$MANIFEST"; then
            echo "::error::read-orgs: failed to fetch orgs.yaml from the root of ${MANIFEST_REPOSITORY}'s default branch. Check the repository name and the token's read access."
            exit 1
          fi
        else
          MANIFEST="${ACTION_PATH}/orgs.yaml"
        fi
        # Install yq to /usr/local/bin/yq specifically (not "wherever").
        # Path-specific gate is load-bearing: ubuntu-latest pre-installs
        # yq in /usr/bin/, which `command -v yq` would find — but the
        # cache step at /usr/local/bin/yq would then have nothing to save
        # because the install step skipped (Path Validation Error on
        # post-cache). Fix: gate on the specific cache path.
        if [[ ! -x /usr/local/bin/yq ]]; then
          # EUID check: containers run as root (no sudo needed; sudo may
          # not be installed). Non-container ubuntu runners need sudo to
          # write /usr/local/bin.
          if [[ $EUID -eq 0 ]]; then SUDO=""; else SUDO="sudo"; fi
          # [CI-082] fetch-verify-place: curl to /tmp, sha256sum -c against
          # pinned digest, only then move into /usr/local/bin/yq. Re-lock
          # YQ_SHA256 when bumping YQ_VERSION (see [CI-107]).
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/v4.45.4/yq_linux_amd64" -o /tmp/yq
          echo "b96de04645707e14a12f52c37e6266832e03c29e95b9b139cddcae7314466e69  /tmp/yq" | sha256sum -c -
          $SUDO mv /tmp/yq /usr/local/bin/yq
          $SUDO chmod +x /usr/local/bin/yq
        fi
        YQ=/usr/local/bin/yq
        # Install jq if not present (swift:6.3 container doesn't ship jq).
        # Not cached: apt-installed packages have multiple files + dependencies;
        # caching them isn't worth the complexity for ~1s install savings.
        if ! command -v jq >/dev/null 2>&1; then
          apt-get update -qq && apt-get install -qq -y jq
        fi
        # Compose the full jq pipeline: iterate records, apply status
        # pre-filter (unless include-archived), apply caller filter,
        # wrap result in array.
        if [[ "$INCLUDE_ARCHIVED" == "true" ]]; then
          status_prefilter=""
        else
          status_prefilter='select(.status!="archived") |'
        fi
        result=$("$YQ" -o=json -I=0 "$MANIFEST" \
          | jq -c "[ .[] | ${status_prefilter} ${FILTER} ]")
        echo "orgs=${result}" >> "$GITHUB_OUTPUT"
        echo "manifest-file=${MANIFEST}" >> "$GITHUB_OUTPUT"
        echo "Resolved orgs from ${MANIFEST}: ${result}"
