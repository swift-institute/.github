# tools-tests.yml — run the test suites of the Tools packages on hosted CI.
#
# PS-3 (Goal swift-institute/.github#358, F18 review): the Tools
# packages — institute-ci, repository-policy — carry test suites, but
# until now no hosted gate ran them. lint-validator-fixtures.yml runs two filtered institute-ci suites
# as embedded-shell controls, and everything else was "verified by
# `institute package test`" only on whichever machine remembered to run
# it. An untriggered test suite is the same category of artifact as an
# unproven gate: it looks like coverage and provides none.
#
# TX-1 of the reduction census (swift-institute/.github#515): the
# pull-request-transaction suite now tests the seeded repository,
# swift-institute/institute-pull-request-transaction, at its exact main
# pin. TX-2 deleted the Tools/ copy. The seed is private, so its
# generated ci.yml is zero-signal by design (visibility gate); this job
# is its only hosted test evidence until the repository is public. The
# matrix job retires when that happens (census TX-2..5 sequencing).
#
# TX-3 (#515): the institute-ci-control suite now tests the seeded
# repository, swift-institute/institute-continuous-integration-control,
# at its exact main pin, the same shape as pull-request-transaction
# above. The Tools/ copy is deleted in this same transaction.
#
# One job per package, on Linux, through the sanctioned Workspace
# coordinate — the same bootstrap shape swift-ci.yml's plan job and the
# institute-ci composite action use, with `test` in place of `build`.
# There is no .build cache by policy: branch dependencies plus
# uncommitted Package.resolved mean no key can prove a cached graph, so
# every run is a cold bootstrap (~12-14 minutes per job).
#
# Standalone workflow with no workflow_call trigger, so it carries a
# deny-all permissions floor and grants read on the jobs that need it.

name: tools-tests

permissions: {}

on:
  push:
    branches: [main]
    paths:
      - 'Tools/**'
      - '.github/workflows/tools-tests.yml'
  pull_request:
    paths:
      - 'Tools/**'
      - '.github/workflows/tools-tests.yml'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    # Cold Workspace bootstrap (SwiftPM compiles the coordinator, then the
    # package under test) takes well over the 10-minute default; same
    # allowance lint-validator-fixtures.yml carries for the same reason.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - institute-ci
          - institute-ci-control
          - pull-request-transaction
          - repository-policy
    name: test (${{ matrix.package }})
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Swift toolchain
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9  # v1.14.0
        with:
          swift-version: '6.3'

      - name: Checkout Workspace at exact main pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: swift-institute/institute-application
          # Advance with pin-advance flow; must stay a full SHA (branch-pin
          # guard). Mirrors the institute-ci composite action's default pin.
          ref: 72d4b2ae1e5b6a2b49fc22e0240dad0a34a9618f
          path: .workspace
          persist-credentials: false

      # TX-1 (#515): the transaction package's sources come from its seeded
      # private repository; transient contents:read App token scoped to
      # exactly that repository (private-verification.yml's narrowed-mint
      # shape), never persisted.
      - name: Mint read-only token for the seeded transaction package
        if: ${{ matrix.package == 'pull-request-transaction' }}
        id: prt-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: swift-institute
          repositories: institute-pull-request-transaction
          permission-contents: read

      - name: Checkout the seeded transaction package at exact main pin
        if: ${{ matrix.package == 'pull-request-transaction' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: swift-institute/institute-pull-request-transaction
          # Advance with pin-advance flow; must stay a full SHA (branch-pin
          # guard). Same pin as review-pr-transaction.yml and
          # verify-post-merge.yml.
          ref: 5528f99b5792c6bd65269b74f19d6e54e8b8316d
          path: .pr-transaction
          token: ${{ steps.prt-token.outputs.token }}
          persist-credentials: false

      # TX-3 (#515): the institute-ci-control package's sources come from
      # its seeded private repository; transient contents:read App token
      # scoped to exactly that repository, never persisted. Same shape as
      # the pull-request-transaction block above.
      - name: Mint read-only token for the seeded institute-ci-control package
        if: ${{ matrix.package == 'institute-ci-control' }}
        id: cicontrol-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: swift-institute
          repositories: institute-continuous-integration-control
          permission-contents: read

      - name: Checkout the seeded institute-ci-control package at exact main pin
        if: ${{ matrix.package == 'institute-ci-control' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: swift-institute/institute-continuous-integration-control
          # Advance with pin-advance flow; must stay a full SHA (branch-pin
          # guard). Same pin as cron-audit-base.yml and
          # submit-dep-graph-weekly.yml.
          ref: f9832144acacc43cbe6fb8d86b50435f68dd41c5
          path: .institute-ci-control
          token: ${{ steps.cicontrol-token.outputs.token }}
          persist-credentials: false

      # uuid-dev: the typed F2/F10 provisioning input (swift-linux-standard's
      # CLinuxKernelShim includes uuid/uuid.h); absent on the bare runner.
      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -qq -y uuid-dev

      - name: Run the package test suite through Workspace
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          # TX-APP1Z: institute-application's Swift package moved from Application/ to
          # the repository root. This checkout is pinned to a caller-supplied or
          # hard-pinned revision, so it must build either layout. The probe retires
          # once every pin in the fleet is post-flatten.


          workspace_package_path=.workspace
          if [ -f .workspace/Application/Package.swift ]; then
            workspace_package_path=.workspace/Application
          fi
          # TX-1/TX-3 (#515): pull-request-transaction and
          # institute-ci-control test their seeded external checkouts;
          # every other package still tests its Tools/ sources.
          subject_package_path="Tools/${PACKAGE}"
          if [ "$PACKAGE" = "pull-request-transaction" ]; then
            subject_package_path=".pr-transaction"
          elif [ "$PACKAGE" = "institute-ci-control" ]; then
            subject_package_path=".institute-ci-control"
          fi
          swift run --package-path "$workspace_package_path" institute package test \
            --package-path "$subject_package_path"
