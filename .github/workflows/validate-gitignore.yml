# validate-gitignore.yml — verify the canonical package `.gitignore`
# [GH-IGNORE-001] [GH-IGNORE-002].
#
# Reusable workflow. For the given `org` (or single `repo`), enumerates
# non-archived repos, clones each (shallow), and runs the Swift validator
# (`institute-ci validate --script .github/scripts/validate-gitignore.py` —
# the script path is the validator's registry IDENTITY, not a file; the
# Swift owner is `CI.Validation.Gitignore` and the .py is deleted) against
# the cloned tree.
#
# Canon: `canon/gitignore-package.txt` in this repository, propagated by
# sync-gitignore.yml. This workflow is the enforcement half of that pair —
# propagation makes the fleet conformant, this keeps it that way.
#
# The canonical package `.gitignore` is a WHITELIST: `/*` denies every
# top-level entry and `!/...` re-includes the ones carrying real work, plus
# `**/.*/` denying tool-state dot-directories at every depth. Same posture as
# the typed Actions whitelist, applied to the working tree.
#
# TWO rules, and the second is the one that makes the first safe:
#
#   [GH-IGNORE-001] the CANONICAL section matches canon byte-for-byte.
#   [GH-IGNORE-002] the whitelist does not deny real work — a fixed probe set
#                   of legitimate paths run through `git check-ignore`.
#
# A whitelist inverts the failure mode. Before it, junk crept in and `git
# status` showed you; after it, anything not explicitly allowed is untracked
# and `git status` says NOTHING. A gate that asked only "is junk denied?"
# would report a repository clean while it silently drops a research paper.
# 002 is what makes that loud. Do not soften it to a warning, and when the
# whitelist gains a directory, extend WORK_PROBES in the same change.
#
# Sequencing note, so nobody re-derives it: this gate was authored while the
# fleet was still non-conformant (442 packages — 417 byte-exact, 15 differing
# only by the Workspace#16 provenance header, 10 with no canonical section).
# Propagation ran FIRST and the gate turned on against a conformant corpus,
# per the standing rule that a red gate must be actionable by whoever sees it.

name: validate-gitignore

on:
  workflow_call:
    inputs:
      repo:
        description: 'Owner/name of a single repo to scan.'
        type: string
        required: false
        default: ''
      org:
        description: 'Org to sweep (ignored if repo is set).'
        type: string
        required: false
        default: ''
      dry-run:
        description: 'Run checks but do not fail the job on findings.'
        type: boolean
        required: false
        default: false
      visibility:
        description: 'Filter by visibility (public | private | internal | all).'
        type: string
        required: false
        default: 'public'
    outputs:
      total-violations:
        description: 'Total count of individual violations.'
        value: ${{ jobs.scan.outputs.total-violations }}

  workflow_dispatch:
    inputs:
      repo:
        description: 'Owner/name of a single repo (optional).'
        type: string
        required: false
      org:
        description: 'Org to sweep (optional; ignored if repo is set).'
        type: string
        required: false
      dry-run:
        description: 'Run checks but do not fail the job on findings.'
        type: boolean
        required: false
        default: false
      visibility:
        description: 'Filter by visibility (public | private | internal | all).'
        type: string
        required: false
        default: 'public'

jobs:
  scan:
    if: ${{ !github.event.repository.private }}     # [CI-032]
    runs-on: ubuntu-latest
    # 60, up from 30: the F12 cold bootstrap (a Workspace source build of
    # institute-ci) runs in this job on a cache miss and takes ~30 minutes;
    # warm-cache runs restore in seconds. Same allowance swift-ci.yml's plan
    # job already carries. Measured the hard way — the first canary
    # (run 31164499832) was killed at exactly 30 minutes mid-bootstrap.
    timeout-minutes: 60
    outputs:
      total-violations: ${{ steps.aggregate.outputs.total-violations }}
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Mint installation token (swift-institute-bot)
        id: mint-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ inputs.org || github.repository_owner }}

      - name: Checkout swift-institute/.github (validator + canon)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          path: institute-github
          ref: ${{ job.workflow_sha }}

      - name: Provision the Institute CI binary
        id: institute-ci
        uses: ./institute-github/.github/actions/institute-ci
        with:
          sources-root: ${{ github.workspace }}/institute-github

      - name: Prove the validator's own controls fire
        # The fixture suite runs BEFORE the sweep, not in a separate workflow.
        # A validator whose controls are checked elsewhere is a validator whose
        # controls can rot while it reports green across 400 repositories; the
        # fail/ fixtures are what distinguish "found nothing" from "looked for
        # nothing". Authoring this gate, the JUNK_PROBES control caught a real
        # harness bug — the `.gitignore` probe truncated the file under test,
        # which made every verdict vacuous — so this step has already paid for
        # itself once.
        run: |
          set -euo pipefail
          # From the control-plane checkout: the registered Gitignore
          # validator resolves canon/gitignore-package.txt by walking up
          # from the working directory, and the workspace root does not
          # carry it.
          cd "${{ github.workspace }}/institute-github"
          "${{ steps.institute-ci.outputs.binary }}" validate-fixtures \
            --corpus "${{ github.workspace }}/institute-github/.github/scripts/tests/fixtures" \
            --scripts "${{ github.workspace }}/institute-github/.github/scripts" \
            --rule-prefix gh-ignore-

      - name: Resolve target repos
        id: targets
        env:
          GH_TOKEN: ${{ steps.mint-token.outputs.token }}
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_ORG: ${{ inputs.org }}
          INPUT_VISIBILITY: ${{ inputs.visibility }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_REPO" ]; then
            echo "$INPUT_REPO" > /tmp/targets.txt
          else
            : "${INPUT_ORG:?org or repo input required}"
            gh repo list "$INPUT_ORG" --no-archived --limit 1000 \
              --visibility "$INPUT_VISIBILITY" \
              --json nameWithOwner --jq '.[].nameWithOwner' > /tmp/targets.txt
          fi

      - name: Run gitignore validation
        id: check
        env:
          GH_TOKEN: ${{ steps.mint-token.outputs.token }}
          INSTITUTE_CI: ${{ steps.institute-ci.outputs.binary }}
        run: |
          set -euo pipefail
          : > /tmp/findings.tsv
          # cwd is the control-plane checkout, deliberately: the Swift
          # Gitignore validator resolves canon/gitignore-package.txt by
          # walking up from the working directory (the retired script's
          # `__file__`-relative resolution has no Swift equivalent — a
          # built binary is not in the checkout it validates).
          cd "${{ github.workspace }}/institute-github"
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            workdir=$(mktemp -d)
            if ! gh repo clone "$repo" "$workdir" -- --depth 1 --quiet 2>/dev/null; then
              echo "$repo	clone-failed	-" >> /tmp/findings.tsv
              rm -rf "$workdir"
              continue
            fi
            # Ported contract: findings ride the TSV, never the exit code —
            # 0 means "ran" (with or without findings), anything else means
            # the validator could not answer (missing canon, git failure),
            # so every nonzero rc is a crash, not a verdict.
            rc=0
            "$INSTITUTE_CI" validate --script .github/scripts/validate-gitignore.py \
              --repository "$repo" --root "$workdir" >> /tmp/findings.tsv || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "$repo	validator-crashed	-" >> /tmp/findings.tsv
            fi
            rm -rf "$workdir"
          done < /tmp/targets.txt

      - name: Aggregate findings
        id: aggregate
        run: |
          set -euo pipefail
          # RULE_RE must list EVERY rule the Gitignore validator can emit. The
          # cost of getting this wrong is not a smaller number — it is findings
          # that were scanned, found, and then dropped from both the count and
          # the table, which is how validate-file-naming reported success over
          # 753 live TEST-009 findings.
          RULE_RE='^(GH-IGNORE-001|GH-IGNORE-002)$'
          violations=$(awk -F'\t' -v re="$RULE_RE" '$2 ~ re' /tmp/findings.tsv | wc -l | tr -d ' ')
          work_loss=$(awk -F'\t' '$2 == "GH-IGNORE-002"' /tmp/findings.tsv | wc -l | tr -d ' ')
          clone_failures=$(awk -F'\t' '$2 == "clone-failed"' /tmp/findings.tsv | wc -l | tr -d ' ')
          validator_crashes=$(awk -F'\t' '$2 == "validator-crashed"' /tmp/findings.tsv | wc -l | tr -d ' ')
          echo "total-violations=$violations" >> "$GITHUB_OUTPUT"
          {
            echo "## validate-gitignore findings"
            echo "Total violations: $violations"
            echo
            if [ "$work_loss" -gt 0 ]; then
              echo "> [!WARNING]"
              echo "> ${work_loss} GH-IGNORE-002 finding(s): a whitelist is denying paths that carry real work. Those files are untracked and \`git status\` will not mention them. Fix the whitelist before anyone runs \`git clean\`."
              echo
            fi
            if [ "$clone_failures" -gt 0 ] || [ "$validator_crashes" -gt 0 ]; then
              echo "> [!CAUTION]"
              echo "> ${clone_failures} target(s) failed to clone and ${validator_crashes} crashed the validator — those repos were NOT scanned, so the count above is a floor, not a total. Treat this run as failed."
              echo
              awk -F'\t' '$2 == "clone-failed" || $2 == "validator-crashed" { printf("- %s: `%s`\n", $2, $1) }' /tmp/findings.tsv
              echo
            fi
            if [ "$violations" -gt 0 ]; then
              echo "### By rule"
              echo
              awk -F'\t' -v re="$RULE_RE" '$2 ~ re {n[$2]++} END {for (r in n) printf("- `%s`: %d\n", r, n[r])}' /tmp/findings.tsv | sort
              echo
              echo "| Repo | Rule | Message |"
              echo "|---|---|---|"
              awk -F'\t' -v re="$RULE_RE" '$2 ~ re {
                gsub(/\|/, "\\|", $3);
                printf("| `%s` | `%s` | %s |\n", $1, $2, $3)
              }' /tmp/findings.tsv
            fi
          } > "$GITHUB_STEP_SUMMARY"
          # Also to stdout — a step-summary-only report is a report nobody reads.
          echo "validate-gitignore: ${violations} violation(s), ${clone_failures} clone failure(s), ${validator_crashes} validator crash(es)"
          if [ "$clone_failures" -gt 0 ] || [ "$validator_crashes" -gt 0 ]; then
            echo "::error::${clone_failures} clone failure(s) and ${validator_crashes} validator crash(es) — those targets were never scanned, so a green result here would be false."
          fi
          if { [ "$violations" -gt 0 ] || [ "$clone_failures" -gt 0 ] || [ "$validator_crashes" -gt 0 ]; } \
             && [ "${{ inputs.dry-run }}" != "true" ]; then
            exit 1
          fi
