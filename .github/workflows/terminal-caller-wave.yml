name: Terminal caller wave

permissions: {}

on:
  workflow_dispatch:
    inputs:
      expected_host_source:
        description: Exact approved swift-institute/.github protected-main revision.
        required: true
        type: string
      policy_source:
        description: Exact approved Repository Policy protected-main revision.
        required: true
        type: string
      policy_digest:
        description: Exact immutable Repository Policy bundle digest.
        required: true
        type: string

concurrency:
  group: terminal-caller-wave
  cancel-in-progress: false

env:
  POLICY_REPOSITORY: swift-institute/institute-continuous-integration
  POLICY_RELEASE: repository-policy-binaries
  SWIFT_INSTITUTE_BOT_INTEGRATION_ID: "3543256"

jobs:
  census:
    name: Exact fleet census
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      organizations: ${{ steps.population.outputs.organizations }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Require the exact approved host and policy sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HOST_SOURCE: ${{ inputs.expected_host_source }}
          POLICY_SOURCE: ${{ inputs.policy_source }}
          POLICY_DIGEST: ${{ inputs.policy_digest }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HOST_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$POLICY_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$POLICY_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [ "$GITHUB_REF" = refs/heads/main ]
          [ "$GITHUB_SHA" = "$EXPECTED_HOST_SOURCE" ]
          host_main="$(gh api repos/swift-institute/.github/git/ref/heads/main --jq .object.sha)"
          policy_main="$(gh api "repos/${POLICY_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          [ "$host_main" = "$EXPECTED_HOST_SOURCE" ]
          [ "$policy_main" = "$POLICY_SOURCE" ]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_host_source }}
          sparse-checkout: .github/policy/fleet.json
          persist-credentials: false

      - name: Acquire and verify the explicitly authorized immutable Swift owner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_SOURCE: ${{ inputs.policy_source }}
          POLICY_DIGEST: ${{ inputs.policy_digest }}
        run: |
          set -euo pipefail
          install -d transaction-input
          binary="repository-policy-${POLICY_DIGEST}"
          manifest="repository-policy-${POLICY_DIGEST}.manifest"
          resolution="repository-policy-${POLICY_DIGEST}.resolution.json"
          checksums="repository-policy-${POLICY_DIGEST}.sha256"
          gh release download "$POLICY_RELEASE" --repo "$POLICY_REPOSITORY" \
            --pattern "$binary" --pattern "$manifest" --pattern "$resolution" \
            --pattern "$checksums" --dir transaction-input
          (cd transaction-input && sha256sum -c "$checksums")
          manifest_path="transaction-input/${manifest}"
          [ "$(wc -l < "$manifest_path")" -eq 9 ]
          [ "$(sed -n '1s/^digest=//p' "$manifest_path")" = "$POLICY_DIGEST" ]
          [ "$(sed -n '2s/^source-revision=//p' "$manifest_path")" = "$POLICY_SOURCE" ]
          resolution_sha="$(sha256sum "transaction-input/${resolution}" | cut -d' ' -f1)"
          [ "$(sed -n '3s/^resolution-sha256=//p' "$manifest_path")" = "$resolution_sha" ]
          [ "$(sed -n '9s/^resolution-asset=//p' "$manifest_path")" = "$resolution" ]
          identity="$(sed -n '2,8p' "$manifest_path" | sha256sum | cut -d' ' -f1)"
          [ "$identity" = "$POLICY_DIGEST" ]
          policy_main="$(gh api "repos/${POLICY_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          [ "$policy_main" = "$POLICY_SOURCE" ]
          install -m 0755 "transaction-input/${binary}" transaction-input/repository-policy
          cp .github/policy/fleet.json transaction-input/fleet.json
          gh api "repos/${POLICY_REPOSITORY}/contents/Policy/protected-main-ruleset.json?ref=${POLICY_SOURCE}" \
            --jq '.content' | tr -d '\n' | base64 --decode \
            > transaction-input/protected-main-ruleset.json
          transaction-input/repository-policy render-caller --form terminal \
            > transaction-input/terminal-caller.yml
          test -s transaction-input/terminal-caller.yml
          test -s transaction-input/protected-main-ruleset.json
          printf '%s\n' "$POLICY_DIGEST" > transaction-input/POLICY_DIGEST
          printf '%s\n' "$POLICY_SOURCE" > transaction-input/POLICY_SOURCE

      - name: Mint the bounded read-only census token
        id: census-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: swift-institute
          repositories: .github
          permission-contents: read

      - name: Require capacity for both complete fleet enumerations
        shell: bash
        env:
          GH_TOKEN: ${{ steps.census-token.outputs.token }}
        run: |
          set -euo pipefail
          # The current 504-repository fleet needs at most about 3,100 core
          # requests per exact enumeration; reserve both passes before mutation.
          transaction-input/repository-policy caller-wave capacity \
            --required 6500 \
            --output transaction-input/census-capacity.json

      - name: Enumerate the complete active public fleet
        shell: bash
        env:
          GH_TOKEN: ${{ steps.census-token.outputs.token }}
        run: |
          set -euo pipefail
          transaction-input/repository-policy caller-wave census \
            --fleet transaction-input/fleet.json \
            --output transaction-input/census.json

      - name: Revoke the census token before organization credentials
        if: ${{ always() && steps.census-token.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.census-token.outputs.token }}
        run: gh api --method DELETE installation/token

      - name: Export the exact organization matrix
        id: population
        shell: bash
        run: |
          set -euo pipefail
          organizations="$(jq -c '.organizations' transaction-input/census.json)"
          [ "$(jq 'length' <<< "$organizations")" -gt 0 ]
          [ "$(jq '.subjects | length' transaction-input/census.json)" -gt 0 ]
          echo "organizations=$organizations" >> "$GITHUB_OUTPUT"

      - name: Preserve exact immutable input and original population
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-caller-wave-input
          path: transaction-input
          if-no-files-found: error
          retention-days: 30

  preflight:
    name: Preflight · ${{ matrix.organization }}
    needs: census
    runs-on: ubuntu-latest
    environment: terminal-caller-wave
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        organization: ${{ fromJSON(needs.census.outputs.organizations) }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Restore exact transaction input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-caller-wave-input
          path: transaction-input

      - name: Restore the verified owner executable mode
        run: chmod 0755 transaction-input/repository-policy

      - name: Resolve the complete exact repository grant
        id: grant
        shell: bash
        env:
          ORGANIZATION: ${{ matrix.organization }}
        run: |
          set -euo pipefail
          repositories="$(jq -r --arg owner "$ORGANIZATION" '
            [.subjects[].repository
              | select(startswith($owner + "/"))
              | split("/")[1]]
            | join(",")
          ' transaction-input/census.json)"
          count="$(jq --arg owner "$ORGANIZATION" \
            '[.subjects[].repository | select(startswith($owner + "/"))] | length' \
            transaction-input/census.json)"
          [ -n "$repositories" ]
          [ "$count" -gt 0 ]
          echo "repositories=$repositories" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Mint the bounded preflight token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ matrix.organization }}
          repositories: ${{ steps.grant.outputs.repositories }}
          permission-administration: write
          permission-contents: write

      - name: Prove installation, grants, permissions, recovery, and capacity
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORGANIZATION: ${{ matrix.organization }}
          SUBJECT_COUNT: ${{ steps.grant.outputs.count }}
        run: |
          set -euo pipefail
          install -d preflight-evidence/recoveries preflight-evidence/receipts \
            preflight-evidence/capacity
          required=$((SUBJECT_COUNT * 64 + 128))
          transaction-input/repository-policy caller-wave capacity \
            --required "$required" \
            --output "preflight-evidence/capacity/${ORGANIZATION}.json"
          policy_digest="$(cat transaction-input/POLICY_DIGEST)"
          policy_source="$(cat transaction-input/POLICY_SOURCE)"
          while IFS= read -r repository; do
            safe="${repository//\//--}"
            transaction-input/repository-policy caller-wave preflight \
              --repository "$repository" \
              --population transaction-input/census.json \
              --caller transaction-input/terminal-caller.yml \
              --policy transaction-input/protected-main-ruleset.json \
              --integration-id "$SWIFT_INSTITUTE_BOT_INTEGRATION_ID" \
              --policy-digest "$policy_digest" \
              --policy-source "$policy_source" \
              --recovery "preflight-evidence/recoveries/${safe}.json" \
              --receipt "preflight-evidence/receipts/${safe}.json"
          done < <(jq -r --arg owner "$ORGANIZATION" '
            .subjects[].repository | select(startswith($owner + "/"))
          ' transaction-input/census.json)

      - name: Preserve complete organization preflight
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caller-wave-preflight-${{ matrix.organization }}
          path: preflight-evidence
          if-no-files-found: error
          retention-days: 30

  preflight_gate:
    name: Complete zero-mutation preflight
    if: ${{ always() && needs.census.result == 'success' }}
    needs: [census, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Restore exact transaction input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-caller-wave-input
          path: transaction-input

      - name: Restore the verified owner executable mode
        run: chmod 0755 transaction-input/repository-policy

      - name: Restore every organization preflight
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: caller-wave-preflight-*
          path: preflight-evidence
          merge-multiple: true

      - name: Require the exact original subject and organization sets
        shell: bash
        run: |
          set -euo pipefail
          subjects="$(jq '.subjects | length' transaction-input/census.json)"
          organizations="$(jq '.organizations | length' transaction-input/census.json)"
          [ "$(find preflight-evidence/recoveries -maxdepth 1 -type f -name '*.json' | wc -l)" -eq "$subjects" ]
          [ "$(find preflight-evidence/receipts -maxdepth 1 -type f -name '*.json' | wc -l)" -eq "$subjects" ]
          [ "$(find preflight-evidence/capacity -maxdepth 1 -type f -name '*.json' | wc -l)" -eq "$organizations" ]
          while IFS= read -r organization; do
            capacity="preflight-evidence/capacity/${organization}.json"
            test -f "$capacity"
            jq -e '.accepted == true and .remaining >= .required and .required > 0' "$capacity" >/dev/null
          done < <(jq -r '.organizations[]' transaction-input/census.json)
          policy_digest="$(cat transaction-input/POLICY_DIGEST)"
          policy_source="$(cat transaction-input/POLICY_SOURCE)"
          while IFS=$'\t' read -r repository repository_id head blob; do
            safe="${repository//\//--}"
            receipt="preflight-evidence/receipts/${safe}.json"
            recovery="preflight-evidence/recoveries/${safe}.json"
            test -f "$receipt"
            test -f "$recovery"
            recovery_digest="$(sha256sum "$recovery" | cut -d' ' -f1)"
            jq -e --arg repository "$repository" --arg digest "$recovery_digest" \
              --slurpfile original transaction-input/census.json '
                .repository == $repository
                and .organization == ($repository | split("/")[0])
                and .accepted == true and .canPush == true and .canAdminister == true
                and .recoveryDigest == $digest
                and .population == $original[0].commitment
              ' "$receipt" >/dev/null
            jq -e --arg repository "$repository" --argjson repositoryID "$repository_id" \
              --arg head "$head" --arg blob "$blob" --arg policyDigest "$policy_digest" \
              --arg policySource "$policy_source" --slurpfile original transaction-input/census.json '
                .repository == $repository and .repositoryID == $repositoryID
                and .rollbackHead == $head and .caller.blob == $blob
                and .policyDigest == $policyDigest and .policySource == $policySource
                and .population == $original[0].commitment
              ' "$recovery" >/dev/null
          done < <(jq -r '.subjects[] | [.repository, .repositoryID, .head, .caller.blob] | @tsv' \
            transaction-input/census.json)

      - name: Durably retain the complete recovery journal before mutation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-caller-wave-preflight
          path: preflight-evidence
          if-no-files-found: error
          retention-days: 30

  apply:
    name: Apply · ${{ matrix.organization }}
    needs: [census, preflight_gate]
    runs-on: ubuntu-latest
    environment: terminal-caller-wave
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        organization: ${{ fromJSON(needs.census.outputs.organizations) }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Restore exact transaction input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-caller-wave-input
          path: transaction-input

      - name: Restore the verified owner executable mode
        run: chmod 0755 transaction-input/repository-policy

      - name: Restore the durable recovery journal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-caller-wave-preflight
          path: preflight-evidence

      - name: Resolve the exact repository grant
        id: grant
        shell: bash
        env:
          ORGANIZATION: ${{ matrix.organization }}
        run: |
          set -euo pipefail
          repositories="$(jq -r --arg owner "$ORGANIZATION" '
            [.subjects[].repository
              | select(startswith($owner + "/"))
              | split("/")[1]]
            | join(",")
          ' transaction-input/census.json)"
          [ -n "$repositories" ]
          echo "repositories=$repositories" >> "$GITHUB_OUTPUT"

      - name: Mint the bounded mutation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ matrix.organization }}
          repositories: ${{ steps.grant.outputs.repositories }}
          permission-administration: write
          permission-contents: write

      - name: Apply bounded recoverable transactions
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORGANIZATION: ${{ matrix.organization }}
        run: |
          set -euo pipefail
          install -d apply-evidence/receipts apply-evidence/events
          while IFS= read -r repository; do
            safe="${repository//\//--}"
            transaction-input/repository-policy caller-wave apply \
              --recovery "preflight-evidence/recoveries/${safe}.json" \
              --caller transaction-input/terminal-caller.yml \
              --events "apply-evidence/events/${safe}.jsonl" \
              --receipt "apply-evidence/receipts/${safe}.json"
          done < <(jq -r --arg owner "$ORGANIZATION" '
            .subjects[].repository | select(startswith($owner + "/"))
          ' transaction-input/census.json)

      - name: Preserve organization mutation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caller-wave-apply-${{ matrix.organization }}
          path: apply-evidence
          if-no-files-found: error
          retention-days: 30

  closure:
    name: Closure · ${{ matrix.organization }}
    if: ${{ always() && needs.census.result == 'success' && needs.preflight_gate.result == 'success' }}
    needs: [census, preflight_gate, apply]
    runs-on: ubuntu-latest
    environment: terminal-caller-wave
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        organization: ${{ fromJSON(needs.census.outputs.organizations) }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Restore exact transaction input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-caller-wave-input
          path: transaction-input

      - name: Restore the verified owner executable mode
        run: chmod 0755 transaction-input/repository-policy

      - name: Restore the durable recovery journal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-caller-wave-preflight
          path: preflight-evidence

      - name: Resolve the exact closure grant
        id: grant
        shell: bash
        env:
          ORGANIZATION: ${{ matrix.organization }}
        run: |
          set -euo pipefail
          repositories="$(jq -r --arg owner "$ORGANIZATION" '
            [.subjects[].repository
              | select(startswith($owner + "/"))
              | split("/")[1]]
            | join(",")
          ' transaction-input/census.json)"
          [ -n "$repositories" ]
          echo "repositories=$repositories" >> "$GITHUB_OUTPUT"

      - name: Mint the independently bounded closure token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ matrix.organization }}
          repositories: ${{ steps.grant.outputs.repositories }}
          permission-administration: write
          permission-contents: write

      - name: Close and verify every original privilege window
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORGANIZATION: ${{ matrix.organization }}
        run: |
          set -euo pipefail
          install -d closure-evidence
          mapfile -t repositories < <(jq -r --arg owner "$ORGANIZATION" '
            .subjects[].repository | select(startswith($owner + "/"))
          ' transaction-input/census.json)
          [ "${#repositories[@]}" -gt 0 ]
          status=0
          for repository in "${repositories[@]}"; do
            safe="${repository//\//--}"
            if ! transaction-input/repository-policy caller-wave close \
              --recovery "preflight-evidence/recoveries/${safe}.json" \
              --caller transaction-input/terminal-caller.yml \
              --output "closure-evidence/${safe}.json"
            then
              {
                echo "repository=$repository"
                echo 'status=closure-failed'
              } > "closure-evidence/${safe}.failure"
              status=1
            fi
          done
          exit "$status"

      - name: Preserve explicit closure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caller-wave-closure-${{ matrix.organization }}
          path: closure-evidence
          if-no-files-found: error
          retention-days: 30

  recensus:
    name: Terminal receipt and closure recensus
    if: ${{ always() && needs.census.result == 'success' }}
    needs: [census, preflight_gate, apply, closure]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Mint the bounded read-only recensus token
        id: recensus-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: swift-institute
          repositories: .github
          permission-contents: read

      - name: Restore exact transaction input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-caller-wave-input
          path: transaction-input

      - name: Restore the verified owner executable mode
        run: chmod 0755 transaction-input/repository-policy

      - name: Restore every mutation receipt and event
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: caller-wave-apply-*
          path: apply-evidence
          merge-multiple: true

      - name: Restore every closure result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: caller-wave-closure-*
          path: closure-evidence
          merge-multiple: true

      - name: Prove exact receipts, callers, population, and closed rulesets
        shell: bash
        env:
          GH_TOKEN: ${{ steps.recensus-token.outputs.token }}
        run: |
          set -euo pipefail
          # Refuse terminal closure unless one complete fresh pass still fits.
          transaction-input/repository-policy caller-wave capacity \
            --required 3200 \
            --output recensus-capacity.json
          transaction-input/repository-policy caller-wave recensus \
            --fleet transaction-input/fleet.json \
            --original transaction-input/census.json \
            --caller transaction-input/terminal-caller.yml \
            --receipts apply-evidence/receipts \
            --events apply-evidence/events \
            --closures closure-evidence \
            --policy-digest "$(cat transaction-input/POLICY_DIGEST)" \
            --policy-source "$(cat transaction-input/POLICY_SOURCE)" \
            --output terminal-recensus.json

      - name: Revoke the recensus token
        if: ${{ always() && steps.recensus-token.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.recensus-token.outputs.token }}
        run: gh api --method DELETE installation/token

      - name: Preserve terminal closure receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-caller-wave-recensus
          path: |
            recensus-capacity.json
            terminal-recensus.json
          if-no-files-found: error
          retention-days: 30
