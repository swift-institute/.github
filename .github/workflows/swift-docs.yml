name: Swift DocC (reusable)

# Reusable DocC validation for Institute packages on the umbrella-module
# single-catalog pattern ([DOC-019a]). A build-time GATE: if `docc convert`
# fails (broken cross-refs, unresolved symbols, schema drift, tutorial syntax)
# the job goes red. The .doccarchive is deliberately NOT uploaded — Swift
# Package Index serves visitor-facing docs from tagged releases and no other
# consumer exists. Adding an upload later needs a tar wrapper: DocC slug
# filenames contain `:` for `init(_:)`-shaped symbols, which
# `actions/upload-artifact@v4+` rejects.
#
# Third-party consumers: unintended but permitted. No compatibility
# guarantee — pin `@<sha>`, not `@main`.
#
# Runner is a Linux container, not macOS: DocC ships in the Swift Linux
# toolchain (`xcrun docc` was macOS-only convenience syntax), which is ~10x
# cheaper to compile and needs no Xcode-version tracking. Same toolchain DocC,
# so validation parity holds.
#
# SCHEDULING — NOT ON EVERY PUSH (ruling 2026-07-29). Runs on tag refs,
# workflow_dispatch, schedule, the '[ci docs]' token, and the ci-sweep rotation
# (which passes `target-repo`). Basis: an org is capped at 20 concurrent
# runner-backed jobs, pinned for 94.7% of contended time, and on the measured
# day this job alone took 21.7 slot-hours in swift-foundations — 34.2% of the
# org's daily CI compute, its single largest consumer. Removing it from
# per-push cut modelled drain from 151 to 100 minutes; every other candidate
# measured under -5%. Expect nearer -11% in practice: `linux-6-4` went
# every-push one day AFTER that data and adds back ~11.6 slot-hours.
#
# Trade-off: docs regressions surface at the tag boundary and weekly rotation,
# not minutes after the push. Ruled acceptable ONLY because nothing consumes
# the archives yet. REVISIT WHEN DOCS BECOME VISITOR-FACING — the argument is
# "no consumer", not "low value".
#
# Not a precedent for other legs: swift-ci.yml keeps a build leg on every push
# because a docs-only diff CAN change the build outcome here (deps float on
# `main` with no Package.resolved). That does not transfer — a floating-dep
# change that breaks docs breaks the build first.
#
# Acronym preservation list: umbrella metadata is DISCOVERED from the single
# catalog under `Sources/*/*.docc` (parent-directory basename = display name).
# The kebab→TitleCase heuristic and the acronym list survive ONLY as a tiebreak
# when a repo ships MULTIPLE catalogs, preserving all-caps tokens verbatim
# (`swift-cpu-primitives` → `CPU_Primitives`, not `Cpu_Primitives`). The list
# lives in the `Derive umbrella metadata` step; keep it sorted, uppercase,
# space-separated, and extend it when a new spec acronym appears.
#
# Consume via YOUR LAYER ORG's swift-docs.yml wrapper, NOT this workflow
# directly. Org-secret delivery across an org boundary requires explicit
# forwarding — `secrets: inherit` on a cross-org call delivers no org
# secrets (proven 2026-06-04, byte-primitives run 26959288611:
# "Configured 0" via cross-org inherit vs "Configured 4" via the
# same-org-wrapper -> explicit-forward chain). The layer wrappers carry
# the explicit `secrets:` block; a direct cross-org call leaves the
# private-dep credentials behind and resolve fails on any private dep.
#
#   jobs:
#     docs:
#       uses: swift-primitives/.github/.github/workflows/swift-docs.yml@main
#       # (or swift-standards/… / swift-foundations/… per your layer;
#       # sub-org consumers: your PARENT layer org's wrapper, with the
#       # explicit secrets block per the [CI-059] sub-org caveat)
#       with:
#         umbrella-module: Property_Primitives
#         umbrella-display-name: "Property Primitives"
#         umbrella-bundle-id: "swift-property-primitives.Property-Primitives"
#         umbrella-docc-path: "Sources/Property Primitives/Property Primitives.docc"
#         exclude-modules: "Property_Primitives_Test_Support"
#       secrets: inherit
#
# All `umbrella-*` and `exclude-modules` inputs are OPTIONAL — when
# omitted (or empty), values are DISCOVERED from the single DocC catalog
# under `Sources/*/*.docc` (its parent-directory basename is the umbrella
# display name); a repo with no catalog is skipped by design. Pass
# overrides only when the package's layout deviates.
#
# Pipeline:
#   1. `swift build` with symbol-graph emission (preserves @_exported doc comments)
#   2. Pool per-module graphs, excluding caller-specified modules (e.g. Test Support)
#   3. Isolate the umbrella graph via `institute-ci symbol-graph-umbrella`. This step
#      is load-bearing for in-catalog `Symbol` cross-reference resolution —
#      passing the full pool to `docc convert` triggers cross-module
#      ambiguity and every symbol reference fails silently. The script's
#      doc-comment injection is a defensive no-op under `swift build` but
#      catches any future regression of @_exported preservation.
#   4. `docc convert` on the umbrella catalog pointed at ONLY the
#      isolated umbrella graph — single-archive output, clean cross-refs.
#
# Details: swift-institute/Research/docc-multi-target-documentation-aggregation.md

on:
  workflow_call:
    inputs:
      umbrella-module:
        type: string
        default: ""
        description: "Override (default: discovered from the single Sources/*/*.docc catalog — its parent-directory basename with spaces→underscores)."
      umbrella-display-name:
        type: string
        default: ""
        description: "Override (default: the discovered DocC catalog's parent-directory basename)."
      umbrella-bundle-id:
        type: string
        default: ""
        description: "Override (default: <repo-name>.<DisplayHyphenated>)."
      umbrella-docc-path:
        type: string
        default: ""
        description: "Override (default: the discovered Sources/*/*.docc catalog path)."
      exclude-modules:
        type: string
        default: ""
        description: "Override (default: <Module>_Test_Support; non-existent module names are no-op for `rm -f`)."
      enable-private-repos:
        type: boolean
        default: true
        description: "If true, configure credentialed git url rewrites (App-token primary, PRIVATE_REPO_TOKEN fallback) for github.com clones during DocC's `swift build`. Default true: most consumers depend on private deps; public-only consumers may pass false explicitly."
      swift-image:
        type: string
        default: ""
        description: |
          Exact container image for this workflow's Swift job, supplied by the
          universal swift-ci.yml as `needs.plan.outputs.linux-image`. Empty
          (the standalone/dispatch path) falls back to `swift:<swift-version>`,
          which is the terminal state once the floor's release image exists.
          Carries the ONE release-floor exception rather than restating it
          (swift-institute/.github#491).
      swift-version:
        type: string
        default: "6.3"
        description: "Swift toolchain version for the DocC build container (swift:<version>). Mirrors the universal swift-ci.yml's input so callers bumping the floor flip both in lockstep."
      target-repo:
        type: string
        default: ""
        description: "Sweep-only target selector (set by ci-sweep.yml's docs-sweep job). When non-empty, the package checkout takes this `owner/name` instead of the caller's own repo, umbrella metadata derives from ITS name, and the job's scheduling guard is satisfied by this input alone. Empty default — every push/PR/tag/wrapper call passes nothing — so the checkout falls back to github.repository, bit-identical to the pre-sweep implicit-default checkout. Mirrors the sanctioned dispatch-input exception in swift-ci.yml; the scripts checkout is NOT retargeted."
      ref:
        type: string
        default: ""
        description: "Sweep-only target ref (set by ci-sweep.yml). Selects the branch/tag/SHA of `target-repo` to document. Threaded into the PACKAGE checkout only. Empty default resolves the triggering ref, bit-identical to before."
    secrets:
      PRIVATE_REPO_TOKEN:
        required: false
        description: |
          Legacy github.com-wide fallback credential for private-dep
          clones. Superseded by the App-token path; retained for orgs
          not yet provisioned with the App secrets.
      SWIFT_INSTITUTE_BOT_APP_CLIENT_ID:
        required: false
        description: |
          swift-institute-bot App client ID (org-level secret). With the
          private key, lets configure-private-repos mint per-job
          contents:read installation tokens for the layer orgs so DocC's
          `swift build` can clone private intra-Institute deps.
      SWIFT_INSTITUTE_BOT_APP_ID:
        required: false
        description: |
          Legacy-era App ID secret name carried by some orgs (e.g.
          swift-primitives; numeric App ID value class). Accepted as
          fallback when _APP_CLIENT_ID is absent; configure-private-repos
          routes it into create-github-app-token's `client-id` input,
          never the deprecated `app-id` input (#139).
      SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY:
        required: false
        description: |
          swift-institute-bot App private key (org-level secret).
          Counterpart of SWIFT_INSTITUTE_BOT_APP_CLIENT_ID.

jobs:
  docs:
    name: DocC archive
    # Scheduling guard (see header). Disjuncts: target-repo != '' (ci-sweep
    # rotation), refs/tags/* (release boundary), workflow_dispatch, schedule,
    # '[ci docs]' (per-push opt-in). An ordinary push matches none and skips.
    #
    # It SKIPS THE JOB rather than short-circuiting inside it: a skipped job
    # acquires no runner, and the runner slot is the scarce resource. An `if:`
    # on the steps would still hold a slot to do nothing.
    #
    # `github.event.head_commit` is null on pull_request; `contains` coerces
    # null to '' and returns false, so PRs take the skip path.
    if: >-
      ${{ !github.event.repository.private
          && ( inputs.target-repo != ''
            || startsWith(github.ref, 'refs/tags/')
            || github.event_name == 'workflow_dispatch'
            || github.event_name == 'schedule'
            || contains(github.event.head_commit.message, '[ci docs]') ) }}
    runs-on: ubuntu-latest
    container: ${{ inputs.swift-image || format('swift:{0}', inputs.swift-version) }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # Package checkout. The scripts checkout further down stays pinned to
      # swift-institute/.github and is NOT retargeted.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.target-repo || github.repository }}
          ref: ${{ inputs.ref }}

      - uses: swift-institute/.github/.github/actions/configure-private-repos@6f73c2ebff00e4f05375794905926bdd7a0ca14b  # main 2026-08-04, identity-pin to main HEAD (swift-institute/.github#286); no functional change to this action in range
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          app-client-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
          app-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_ID }}
          app-private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          enabled: ${{ inputs.enable-private-repos }}

      - uses: swift-institute/.github/.github/actions/install-system-deps@6f73c2ebff00e4f05375794905926bdd7a0ca14b  # main 2026-08-04, identity-pin to main HEAD (swift-institute/.github#286); no functional change to this action in range; pin does not cover apt-fetched packages

      - name: Derive umbrella metadata
        env:
          INPUT_UMBRELLA_MODULE: ${{ inputs.umbrella-module }}
          INPUT_UMBRELLA_DISPLAY_NAME: ${{ inputs.umbrella-display-name }}
          INPUT_UMBRELLA_BUNDLE_ID: ${{ inputs.umbrella-bundle-id }}
          INPUT_UMBRELLA_DOCC_PATH: ${{ inputs.umbrella-docc-path }}
          INPUT_EXCLUDE_MODULES: ${{ inputs.exclude-modules }}
          # Must name the repo being DOCUMENTED, not the trigger — REPO_NAME
          # feeds BUNDLE_ID and the multi-catalog heuristic, and under the
          # ci-sweep rotation the trigger is swift-institute/.github, which
          # would stamp every swept package with the sweeper's identity.
          REPO_SLUG: ${{ inputs.target-repo || github.repository }}
        run: |
          set -euo pipefail
          REPO_NAME="${REPO_SLUG##*/}"

          # ─── Discover umbrella metadata from source truth ───────────────
          # The repo convention is exactly ONE DocC catalog living inside its
          # umbrella target directory (Sources/<Umbrella Target>/<X>.docc), so
          # the catalog's parent-directory basename IS the authoritative
          # umbrella display name. Discovering it beats guessing from the repo
          # name: the old kebab→TitleCase heuristic diverged from real module
          # names (e.g. derived Copy_On_Write vs actual Copy_on_Write, or
          # Svg_Standard vs SVG_Standard) and killed the docs job at
          # `institute-ci symbol-graph-umbrella` ("no symbol graph found for umbrella
          # module ..."). Discovery only replaces the guessing FALLBACK — the
          # explicit umbrella-* inputs below still win when supplied.

          # One catalog level under each target dir: Sources/<target>/<X>.docc.
          # nullglob → empty array (not the literal pattern) when none exist.
          shopt -s nullglob
          CATALOGS=(Sources/*/*.docc)
          shopt -u nullglob

          DISPLAY=""
          DOCC_PATH=""

          if [ "${#CATALOGS[@]}" -eq 1 ]; then
            # Single catalog: unambiguous source of truth.
            DOCC_PATH="${CATALOGS[0]}"
            DISPLAY="$(basename "$(dirname "$DOCC_PATH")")"
          elif [ "${#CATALOGS[@]}" -gt 1 ]; then
            # Multiple catalogs: reuse the legacy repo-name heuristic to choose
            # the umbrella, preferring the discovered catalog whose parent-dir
            # basename matches it (tiebreak). Acronyms preserved verbatim
            # (e.g. swift-cpu-primitives → CPU_Primitives). Falls back to the
            # first catalog with a warning when none matches.
            ACRONYMS="ABI ASCII AST CPU CSS HTML IETF IO IP IR ISO JSON RFC SSL TCP TLS UDP URI URL UUID XML YAML"
            STEM="${REPO_NAME#swift-}"
            HEURISTIC=""
            IFS='-' read -ra PARTS <<< "$STEM"
            for part in "${PARTS[@]}"; do
              upper=$(printf '%s' "$part" | tr '[:lower:]' '[:upper:]')
              cased="$(printf '%s' "${part:0:1}" | tr '[:lower:]' '[:upper:]')${part:1}"
              for acr in $ACRONYMS; do
                if [ "$upper" = "$acr" ]; then
                  cased="$upper"
                  break
                fi
              done
              HEURISTIC="${HEURISTIC:+$HEURISTIC }$cased"
            done
            for candidate in "${CATALOGS[@]}"; do
              name="$(basename "$(dirname "$candidate")")"
              if [ "$name" = "$HEURISTIC" ]; then
                DOCC_PATH="$candidate"
                DISPLAY="$name"
                break
              fi
            done
            if [ -z "$DOCC_PATH" ]; then
              DOCC_PATH="${CATALOGS[0]}"
              DISPLAY="$(basename "$(dirname "$DOCC_PATH")")"
              echo "::warning::Multiple DocC catalogs under Sources/*/*.docc; none matched repo-name heuristic '$HEURISTIC'. Using '$DISPLAY' ($DOCC_PATH)."
            else
              echo "Multiple DocC catalogs under Sources/*/*.docc; selected '$DISPLAY' ($DOCC_PATH) via repo-name heuristic tiebreak."
            fi
          fi

          # Dependent fields derive from the discovered display name, mirroring
          # the previous scheme (spaces→underscores for the module, spaces→
          # hyphens for the bundle id, <Module>_Test_Support for the exclude).
          MODULE="${DISPLAY// /_}"
          BUNDLE_ID="${REPO_NAME}.${DISPLAY// /-}"
          DEFAULT_EXCLUDE="${MODULE:+${MODULE}_Test_Support}"

          # Override-precedence: input non-empty → use input; else → discovered
          # value. An all-inputs caller is unaffected by discovery (the
          # explicit override path works exactly as before).
          UMBRELLA_MODULE="${INPUT_UMBRELLA_MODULE:-$MODULE}"
          UMBRELLA_DISPLAY_NAME="${INPUT_UMBRELLA_DISPLAY_NAME:-$DISPLAY}"
          UMBRELLA_BUNDLE_ID="${INPUT_UMBRELLA_BUNDLE_ID:-$BUNDLE_ID}"
          UMBRELLA_DOCC_PATH="${INPUT_UMBRELLA_DOCC_PATH:-$DOCC_PATH}"
          EXCLUDE_MODULES="${INPUT_EXCLUDE_MODULES:-$DEFAULT_EXCLUDE}"

          # Skip-by-design (Bucket B): a catalog-less stub/leaf package with no
          # explicit umbrella-docc-path override has nothing to document.
          # Signal the downstream build/convert steps (gated on env.SKIP_DOCS)
          # to skip, and exit this step green.
          if [ -z "$UMBRELLA_DOCC_PATH" ]; then
            echo "No DocC catalog found under Sources/*/*.docc for $REPO_NAME and no umbrella-docc-path override supplied — skipping DocC build (catalog-less stub/leaf package)."
            echo "SKIP_DOCS=true" >> "$GITHUB_ENV"
            exit 0
          fi

          {
            echo "UMBRELLA_MODULE=$UMBRELLA_MODULE"
            echo "UMBRELLA_DISPLAY_NAME=$UMBRELLA_DISPLAY_NAME"
            echo "UMBRELLA_BUNDLE_ID=$UMBRELLA_BUNDLE_ID"
            echo "UMBRELLA_DOCC_PATH=$UMBRELLA_DOCC_PATH"
            echo "EXCLUDE_MODULES=$EXCLUDE_MODULES"
          } >> "$GITHUB_ENV"

          echo "Discovered umbrella metadata for $REPO_NAME:"
          echo "  module       = $UMBRELLA_MODULE"
          echo "  display name = $UMBRELLA_DISPLAY_NAME"
          echo "  bundle id    = $UMBRELLA_BUNDLE_ID"
          echo "  docc path    = $UMBRELLA_DOCC_PATH"
          echo "  exclude      = $EXCLUDE_MODULES"

      - name: Print Swift version
        run: swift --version

      - name: swift build — emit per-module symbol graphs
        if: ${{ success() && env.SKIP_DOCS != 'true' }}
        env:
          DOCS_WORK: ${{ runner.temp }}/docs-work
        run: |
          echo "DOCS_WORK=${DOCS_WORK}" >> $GITHUB_ENV
          rm -rf "${DOCS_WORK}"
          mkdir -p "${DOCS_WORK}/symbol-graphs-raw"
          swift build -c release \
            -Xswiftc -emit-symbol-graph \
            -Xswiftc -emit-symbol-graph-dir -Xswiftc "${DOCS_WORK}/symbol-graphs-raw"
          echo "Raw symbol graphs:"
          ls "${DOCS_WORK}/symbol-graphs-raw/"

      - name: Pool distribution symbol graphs
        if: ${{ success() && env.SKIP_DOCS != 'true' }}
        run: |
          mkdir -p "${DOCS_WORK}/symbol-graphs"
          cp "${DOCS_WORK}/symbol-graphs-raw"/*.symbols.json "${DOCS_WORK}/symbol-graphs/"
          for excluded in $EXCLUDE_MODULES; do
            rm -f "${DOCS_WORK}/symbol-graphs/${excluded}.symbols.json"
            rm -f "${DOCS_WORK}/symbol-graphs/${excluded}@"*.symbols.json
          done
          echo "Distribution symbol graphs:"
          ls "${DOCS_WORK}/symbol-graphs/"

      - name: Fetch the umbrella symbol-graph tool
        if: ${{ success() && env.SKIP_DOCS != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          ref: ${{ job.workflow_sha }}
          path: .swift-institute-github
          sparse-checkout: Tools/institute-ci
          sparse-checkout-cone-mode: false

      - name: Isolate umbrella symbol graph
        if: ${{ success() && env.SKIP_DOCS != 'true' }}
        run: |
          swift run -c release \
            --package-path .swift-institute-github/Tools/institute-ci institute-ci \
            symbol-graph-umbrella \
            --symbol-graph-dir "${DOCS_WORK}/symbol-graphs" \
            --umbrella-module "$UMBRELLA_MODULE" \
            --output-dir "${DOCS_WORK}/umbrella-symbol-graph"
          echo "Isolated umbrella graph(s):"
          ls "${DOCS_WORK}/umbrella-symbol-graph/"

      - name: Build distribution archive (docc convert)
        if: ${{ success() && env.SKIP_DOCS != 'true' }}
        run: |
          mkdir -p "${DOCS_WORK}/archives"
          rm -rf "${DOCS_WORK}/archives/$UMBRELLA_DISPLAY_NAME.doccarchive"
          # Linux Swift toolchain ships docc directly (no xcrun front-end).
          docc convert "$UMBRELLA_DOCC_PATH" \
            --additional-symbol-graph-dir "${DOCS_WORK}/umbrella-symbol-graph" \
            --fallback-display-name "$UMBRELLA_DISPLAY_NAME" \
            --fallback-bundle-identifier "$UMBRELLA_BUNDLE_ID" \
            --output-path "${DOCS_WORK}/archives/$UMBRELLA_DISPLAY_NAME.doccarchive" \
            2>&1 | tail -20
          echo "Top-level documentation routes:"
          ls "${DOCS_WORK}/archives/$UMBRELLA_DISPLAY_NAME.doccarchive/data/documentation/" | sort
