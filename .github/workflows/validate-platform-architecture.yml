# validate-platform-architecture.yml — verify platform-stack invariants.
#
# Wave 2b finalization (2026-05-10); Wave 2 consolidation (2026-05-11)
# moved PATTERN-005 / PATTERN-006 to validate-package-shape.yml.
# Thin caller of validate-base.yml (Phase B-2 of
# CI-REVIEW-PHASE-B-DESIGN-2026-05-14). single-target mode for the
# push/pull_request self-test and manual single-repo dispatch;
# per-package-org-sweep mode (Task 0B-01, swift-institute/.github#280) for
# the weekly cross-org orchestrator dispatch.
#
# Rules checked: [PLAT-ARCH-007], [PLAT-ARCH-008c], [PLAT-ARCH-008i],
# [PLAT-ARCH-008j], [PLAT-ARCH-023]. See companion script.

name: validate-platform-architecture

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/validate-platform-architecture.py'
      - '.github/workflows/validate-platform-architecture.yml'
  pull_request:
    paths:
      - '.github/scripts/validate-platform-architecture.py'
      - '.github/workflows/validate-platform-architecture.yml'
  workflow_call:
    inputs:
      repo:
        description: 'Owner/name of a single repo to validate (default: this repo). Takes precedence over org.'
        type: string
        required: false
        default: ''
      org:
        description: 'Org to sweep via paginated repo enumeration (ignored if repo is set). Task 0B-01: replaces the orchestrator''s repository-wide resolve-targets matrix.'
        type: string
        required: false
        default: ''
      dry-run:
        description: 'Run checks but do not fail the job on findings.'
        type: boolean
        required: false
        default: false
      visibility:
        description: 'Repo visibility filter when org is set (public | private | internal | all).'
        type: string
        required: false
        default: 'public'
    outputs:
      total-violations:
        description: 'Total count of individual violations.'
        value: ${{ jobs.scan.outputs.total-violations }}
  workflow_dispatch:
    inputs:
      repo:
        description: 'Owner/name of a single repo to validate (optional). Takes precedence over org.'
        type: string
        required: false
      org:
        description: 'Org to sweep via paginated repo enumeration (optional; ignored if repo is set).'
        type: string
        required: false
      dry-run:
        description: 'Run checks but do not fail the job on findings.'
        type: boolean
        required: false
        default: false
      visibility:
        description: 'Repo visibility filter when org is set (public | private | internal | all).'
        type: string
        required: false
        default: 'public'

jobs:
  scan:
    uses: ./.github/workflows/validate-base.yml
    with:
      validator-script: .github/scripts/validate-platform-architecture.py
      rule-id-regex: '^PLAT-ARCH-'
      # single-target when repo is explicitly set (manual dispatch, or the
      # push/pull_request self-test triggers above where inputs.repo/org are
      # both empty and this falls through to single-target's own default-to-
      # caller-repo behavior); per-package-org-sweep when org is set instead.
      # Task 0B-01 (swift-institute/.github#280): replaces this validator's
      # dependency on the orchestrator's repository-wide 2D (organization,
      # repository) resolve-targets matrix.
      discovery-mode: ${{ inputs.org != '' && inputs.repo == '' && 'per-package-org-sweep' || 'single-target' }}
      target-repo: ${{ inputs.repo }}
      target-org: ${{ inputs.org }}
      visibility: ${{ inputs.visibility || 'public' }}
      # This validator's script returns 1 (via sys.exit(main(argv))) to mean
      # "findings present" and 2 for a usage error — not the "always 0
      # unless a real crash" convention validate-base.yml originally assumed
      # for every caller. Without this, every real finding from the org
      # sweep would also be misfiled as validator-crashed.
      crash-exit-min: 2
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit
