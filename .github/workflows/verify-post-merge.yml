# verify-post-merge.yml — mandatory post-merge full-tier verification for a
# wave-mode (waveMechanical) drained repository (swift-institute/.github#211).
#
# The wave-mode profile in review-pr-transaction.yml deliberately admits no
# full-tier requirement at PR-tier time — that is the entire point of the
# mechanical-remediation fast lane. This workflow is the deferred gate: after
# a repository's wave-mode PRs have merged (batchable — one dispatch per
# repository after its drain completes, not per PR), dispatch invokes the
# drained repository's own full-tier CI (the `workflow_dispatch` run of its
# `ci.yml` thin caller — the same run the Swift verification in
# PullRequest.Transaction+Verification.swift synthesizes as a `full-tier` check for
# the `package` profile) against the exact expected main head, waits for its
# conclusion, and reports on the outcome.
#
# A LOST WATCH IS NOT-GREEN (swift-institute/.github#213): the dispatch step
# can end without ever reaching a confirmed conclusion — the job's own
# 360-minute ceiling expiring while the awaited run is still queued (the
# comment on `timeout-minutes` below records queueing up to 7h41m under
# fleet-wide saturation), a transient `gh` read error, or the awaited run
# never being discovered. Every one of those is treated as a `lost` outcome,
# never as silence: the report step runs on `always()`, is driven by the
# dispatch step's own built-in `outcome` plus whatever partial signal it
# recorded before an early exit, and files a Bug on every outcome but a
# confirmed green — naming the specific lost class, not just "something went
# wrong". The 340-iteration poll bound below is deliberately short of the
# 360-minute job ceiling so this classification happens because the script
# decided the watch was lost, not because GitHub killed the job out from
# under it.
#
# SCOPE-DOWN (first landing, swift-institute/.github#211): outcome item 4
# asks for a revert PR of the drained commits in addition to the Bug. Full
# auto-revert-PR generation is NOT implemented here — see the PR body for
# the open question (this workflow's two inputs, repository + expected head,
# carry no baseline/pre-wave commit coordinate, so there is no input from
# which to compute "the drained commits" without inventing a third input
# the outcome text does not specify). This first landing files the Bug and
# reports a clear manual-revert instruction instead of silently dropping the
# auto-revert requirement; a follow-up Task extends it once the baseline
# coordinate question is resolved.
#
# DESIGN NOTE — classification lives in Swift, dispatch stays bash glue
# (swift-institute/.github#213): red/green/lost classification and the Bug
# title/body are PullRequest.Transaction.PostMerge (swift-institute/institute-pull-request-transaction), tested with
# fixtures per the deny-by-default discipline — the same engine the
# wave-mode admission predicate lives in. The dispatch-and-poll machinery
# around it (workflow_dispatch, discovery, status polling) has no decision
# logic of its own and stays gh/jq, per the existing thin-caller pattern
# (e.g. notify-linter-republish.yml's cross-repo dispatch, and
# apply-rulesets-fleet.yml's per-leg conclusion aggregation) — but unlike a
# fire-and-forget dispatch, this workflow awaits a cross-repository run, and
# every way that await can end without an answer must still reach the
# classifier.
#
# Credential: swift-institute-bot App, minted twice per job and downscoped to
# the single drained repository — once at the start (actions:write to
# dispatch/read the full-tier run, contents:read to read its default-branch
# head) for the dispatch-and-poll step, and again, freshly, immediately
# before the report step (issues:write only). App installation tokens expire
# in about an hour; a watch can run for hours, so the report step — which
# must still be able to file the Bug after a multi-hour wait — cannot reuse
# the token the dispatch step started with. Same App used by
# review-pr-transaction.yml and notify-linter-republish.yml.

name: verify-post-merge

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Exact drained Institute repository in owner/name form.'
        required: true
        type: string
      expected-head:
        description: 'Exact 40-hex commit the drained repository''s default branch must be at before dispatching its full-tier CI.'
        required: true
        type: string

permissions: {}

jobs:
  verify:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    # A full-tier matrix can queue behind fleet-wide macOS-runner-pool
    # saturation (measured 2026-08-03: up to 7h41m under saturation) before
    # its longest leg even starts; 360 is the GitHub-hosted per-job ceiling
    # and cannot be raised for a job that polls continuously — a watch that
    # would need longer is deliberately abandoned as `lost` well inside this
    # ceiling (see the poll bound below), never silently dropped.
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout transaction engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Never execute PR-controlled source while the App token exists.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Select Swift 6.3
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: '6.3'

      # TX-1 of the reduction census (swift-institute/.github#515): the
      # classifier now lives in its seeded repository,
      # swift-institute/institute-pull-request-transaction, consumed here
      # instead of the retiring Tools/ copy. The seed is private, so the
      # checkout rides a transient App token scoped to exactly that one
      # repository with contents:read (private-verification.yml's
      # narrowed-mint shape); the source is pinned, never PR-controlled.
      - name: Mint read-only token for the seeded transaction package
        id: prt-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: swift-institute
          repositories: institute-pull-request-transaction
          permission-contents: read

      - name: Checkout the seeded transaction package at exact main pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/institute-pull-request-transaction
          # Advance with pin-advance flow; must stay a full SHA (branch-pin
          # guard). Same pin as review-pr-transaction.yml and tools-tests.yml.
          ref: 5528f99b5792c6bd65269b74f19d6e54e8b8316d
          path: .pr-transaction
          token: ${{ steps.prt-token.outputs.token }}
          persist-credentials: false

      - name: Build the post-merge classifier
        id: build
        shell: bash
        run: |
          set -euo pipefail
          swift build --package-path ".pr-transaction" --product pr-transaction
          bin_path=$(swift build --package-path ".pr-transaction" --product pr-transaction --show-bin-path)
          echo "bin-path=${bin_path}" >> "$GITHUB_OUTPUT"

      - name: Resolve exact drained repository
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          EXPECTED_HEAD: ${{ inputs.expected-head }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::'repository' must be one exact owner/name coordinate."
            exit 1
          fi
          if [[ ! "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::'expected-head' must be one exact 40-hex commit."
            exit 1
          fi
          visibility=$(gh api "repos/${TARGET_REPOSITORY}" --jq '.visibility // ""')
          if [[ "$visibility" != "public" ]]; then
            echo "::error::${TARGET_REPOSITORY} is not a public repository (visibility=${visibility:-unknown}); this workflow verifies public Institute repositories only."
            exit 1
          fi
          echo "repository=${TARGET_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "owner=${TARGET_REPOSITORY%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${TARGET_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          echo "expected-head=${EXPECTED_HEAD}" >> "$GITHUB_OUTPUT"

      - name: Mint narrowed drain-verification token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-contents: read
          permission-actions: write

      - name: Dispatch and await the drained repository's full tier
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TARGET_REPOSITORY: ${{ steps.target.outputs.repository }}
          EXPECTED_HEAD: ${{ steps.target.outputs.expected-head }}
        run: |
          set -euo pipefail
          repository="$TARGET_REPOSITORY"
          default_branch=$(gh api "repos/${repository}" --jq '.default_branch')
          current=$(gh api "repos/${repository}/commits/${default_branch}" --jq '.sha')
          if [[ "$current" != "$EXPECTED_HEAD" ]]; then
            echo "::error::${repository}@${default_branch} is ${current}, not the expected drained head ${EXPECTED_HEAD}. Something landed on the default branch since the wave drained; re-dispatch with the exact current head to verify it instead."
            exit 1
          fi

          # The full tier is the workflow_dispatch run of the fleet thin
          # caller, which every package repository names `CI` — the exact
          # same convention PullRequest.Transaction.Snapshot.Source.swift relies on
          # to synthesize the `full-tier` check for the `package` profile.
          dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run ci.yml --repo "$repository" --ref "$default_branch"

          # Discovery tolerates a transient `gh` read error the same way the
          # poll below does — one bad call must not abort the whole watch —
          # and prefers the earliest run created at/after dispatch, to
          # narrow (not fully eliminate) the race against a concurrent
          # dispatch landing at the same commit.
          run_id=""
          for _ in $(seq 1 30); do
            sleep 10
            run_id=$(gh run list --repo "$repository" --workflow ci.yml \
              --commit "$EXPECTED_HEAD" --event workflow_dispatch \
              --json databaseId,createdAt --limit 10 2>/dev/null \
              | jq -er --arg since "$dispatched_at" '
                  [.[] | select(.createdAt >= $since)] | sort_by(.createdAt) | .[0].databaseId
                ' 2>/dev/null || true)
            [[ -n "$run_id" ]] && break
          done
          if [[ -z "$run_id" ]]; then
            echo "lost-reason=run-not-discovered" >> "$GITHUB_OUTPUT"
            echo "::error::No workflow_dispatch run of ${repository}'s ci.yml at ${EXPECTED_HEAD} appeared within the discovery window."
            exit 1
          fi
          run_url="https://github.com/${repository}/actions/runs/${run_id}"
          echo "run-id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "run-url=${run_url}" >> "$GITHUB_OUTPUT"
          echo "Dispatched run: ${run_url}"

          status=""
          # Bounded below the job's own 360-minute timeout — 340 iterations
          # of 60s leaves the setup and report steps headroom, so an expired
          # watch is caught and classified here deliberately rather than by
          # the job being killed out from under the script.
          for _ in $(seq 1 340); do
            # A transient `gh run view` error must not abort a multi-hour
            # watch: log it and retry on the next tick instead of letting
            # `set -e` collapse a single blip into "no result".
            if current_status=$(gh run view "$run_id" --repo "$repository" --json status --jq '.status' 2>&1); then
              status="$current_status"
              [[ "$status" == "completed" ]] && break
            else
              echo "::warning::Transient error reading run ${run_id}'s status, retrying: ${current_status}"
            fi
            sleep 60
          done
          if [[ "$status" != "completed" ]]; then
            echo "lost-reason=poll-timed-out" >> "$GITHUB_OUTPUT"
            echo "::error::Run ${run_id} did not reach a terminal status within this watch's own poll bound."
            exit 1
          fi

          conclusion=$(gh run view "$run_id" --repo "$repository" --json conclusion --jq '.conclusion')
          echo "conclusion=${conclusion}" >> "$GITHUB_OUTPUT"

      - name: Mint narrowed reporting token
        id: report-token
        if: always()
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-issues: write

      - name: Report the post-merge watch outcome
        # A lost watch is not-green: this step must still run — and still
        # file the Bug — on a dispatch-step timeout, cancellation, or any
        # other abnormal termination, not only on a confirmed conclusion.
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ steps.report-token.outputs.token }}
          BIN_PATH: ${{ steps.build.outputs.bin-path }}
          TARGET_REPOSITORY: ${{ steps.target.outputs.repository }}
          EXPECTED_HEAD: ${{ steps.target.outputs.expected-head }}
          STEP_OUTCOME: ${{ steps.dispatch.outcome }}
          CONCLUSION: ${{ steps.dispatch.outputs.conclusion }}
          RUN_URL: ${{ steps.dispatch.outputs.run-url }}
          LOST_REASON: ${{ steps.dispatch.outputs.lost-reason }}
        run: |
          set -euo pipefail
          if [[ -z "$TARGET_REPOSITORY" ]]; then
            echo "::error::verify-post-merge could not resolve which repository to report against — an earlier step failed before establishing the target; see its own log."
            exit 1
          fi

          watch_file=$(mktemp)
          jq -n \
            --arg repository "$TARGET_REPOSITORY" \
            --arg expectedHead "$EXPECTED_HEAD" \
            --arg stepOutcome "$STEP_OUTCOME" \
            --arg conclusion "$CONCLUSION" \
            --arg runURL "$RUN_URL" \
            --arg lostReason "$LOST_REASON" \
            '{
              repository: $repository,
              expectedHead: $expectedHead,
              stepOutcome: $stepOutcome,
              conclusion: (if ($conclusion | length) > 0 then $conclusion else null end),
              runURL: (if ($runURL | length) > 0 then $runURL else null end),
              lostReason: (if ($lostReason | length) > 0 then $lostReason else null end)
            }' > "$watch_file"

          # The classifier is Swift (PullRequest.Transaction.PostMerge, tested with
          # fixtures — swift-institute/.github#213); if it cannot even run,
          # that must still produce a Bug rather than silently aborting this
          # step, so this is the one place a generic fallback report exists.
          # Both branches converge on one `report` JSON value so there is a
          # single extraction point below — title/body are read only once
          # the outcome is known not to be green, since a green report
          # carries neither key at all (an absent Optional, not a JSON
          # `null`) and `jq -e` on a genuinely empty result is itself a
          # failure under `set -e`.
          if [[ -n "${BIN_PATH:-}" && -x "${BIN_PATH}/pr-transaction" ]] \
            && report=$("${BIN_PATH}/pr-transaction" post-merge "$watch_file" 2>/tmp/classifier.err); then
            :
          else
            echo "::error::The post-merge classifier did not run cleanly (bin-path=${BIN_PATH:-<unset>}); see below. Falling back to a generic lost report so the Bug path still fires."
            cat /tmp/classifier.err 2>/dev/null || true
            short="${EXPECTED_HEAD:0:12}"
            fallback_title="Post-merge watch lost (classifier-unavailable) at ${short} (wave-mode drain)"
            fallback_body=$(cat <<EOF
          ### Observed behavior

          The mandatory post-merge full-tier verification watch on \`${TARGET_REPOSITORY}\` at \`${EXPECTED_HEAD}\` could not be classified: verify-post-merge.yml's own Swift classifier (swift-institute/institute-pull-request-transaction) failed to build or run in this job.

          ### Expected behavior

          A wave-mode PR-tier landing (swift-institute/.github#211) requires the mandatory post-merge full tier to be confirmed green at the exact drained head. A lost watch is not-green, so this counts as unconfirmed exactly as a red run would.

          ### Minimal reproduction

          \`\`\`swift
          gh workflow run ci.yml --repo ${TARGET_REPOSITORY} --ref <default-branch-at-${short}>
          \`\`\`

          ### Swift version

          N/A — filed automatically by verify-post-merge.yml.

          ### Platform

          N/A — see verify-post-merge.yml's own run log for the classifier failure.

          ### Additional context

          **Classifier tool unavailable.** Investigate the classifier build/run failure directly in this workflow's log, then manually confirm \`${TARGET_REPOSITORY}\`'s default branch at \`${EXPECTED_HEAD}\`.
          EOF
            )
            report=$(jq -n --arg outcome "lost" --arg title "$fallback_title" --arg body "$fallback_body" \
              '{outcome: $outcome, title: $title, body: $body}')
          fi

          outcome=$(jq -er '.outcome' <<<"$report")

          if [[ "$outcome" == "green" ]]; then
            {
              echo "## verify-post-merge: GREEN"
              echo ""
              echo "- repository: ${TARGET_REPOSITORY}"
              echo "- expected head: ${EXPECTED_HEAD}"
              echo "- run: ${RUN_URL}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          title=$(jq -er '.title' <<<"$report")
          body_source=$(jq -er '.body' <<<"$report")
          body_file=$(mktemp)
          printf '%s' "$body_source" > "$body_file"
          filed="true"
          if ! gh issue create --repo "$TARGET_REPOSITORY" --type Bug --title "$title" --body-file "$body_file"; then
            filed="false"
            echo "::error::Bug filing itself failed for ${TARGET_REPOSITORY} — this run's own red/lost result still stands; file manually."
          fi
          {
            echo "## verify-post-merge: $(tr '[:lower:]' '[:upper:]' <<<"$outcome")"
            echo ""
            echo "- repository: ${TARGET_REPOSITORY}"
            echo "- expected head: ${EXPECTED_HEAD}"
            echo "- run: ${RUN_URL:-<none>}"
            echo "- outcome: ${outcome}"
            if [[ "$filed" == "true" ]]; then
              echo "- Bug filed on ${TARGET_REPOSITORY}: ${title}"
            else
              echo "- Bug filing FAILED on ${TARGET_REPOSITORY} — file manually: ${title}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
