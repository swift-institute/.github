# validate-manifest-binding.yml — enforce [CI-MANIFEST-BINDING] internal-
# consistency binding (checks 2 + 4 + 5).
#
# Phase B-1 of CI-REVIEW-PHASE-B-DESIGN-2026-05-14 §3; check 5 added
# 2026-05-14 (Step 3 post-arc closure).
#
# Phase B-2 (checks 1 + 3 — cross-reference against the Skills/
# ci-cd-workflows skill's bracket citations, and the cross-repo Skills
# checkout + App-token scope that fed them) was retired by principal ruling
# on swift-institute/.github#229 (comment 5166115277, 2026-08-03): the
# 2026-07-28 Skills-corpus rebuild dropped every bracket-form citation the
# corpus carried, so the check had no convention left to enforce. See the
# Swift owner's doc comment (institute-continuous-integration Sources/
# CI.Validation.ManifestBinding.swift) for the full rationale.
#
# Single checkout now (validator host only); no longer needs the
# validate-base.yml dual-checkout accommodation that motivated staying
# standalone. Left standalone-shaped in this change regardless — converting
# to a validate-base.yml thin caller is a separate, unscoped decision.
#
# Per [CI-090] this is a workflow_call reusable so NO top-level `permissions:`
# block — per-job permissions (contents: read) provide the floor; the caller's
# permissions cap the intersection.
#
# What a green asserts (#256): when the run targets the host repository
# itself — pull_request and push events on swift-institute/.github, or any
# invocation from within it with no foreign `repo` input — the scan validates
# the job's own checkout, which actions/checkout resolves to the event
# revision (the PR merge ref on pull_request, the pushed commit on push). A
# PR-leg green therefore asserts that the revision under review satisfies
# checks 2 + 4 + 5. Before this, the PR leg cloned the target's default
# branch, so it could never catch an orphan introduced by the PR under
# review (#256; instances #226, #242). Cross-repo sweeps — workflow_call or
# workflow_dispatch naming a different repository in `repo` — still clone
# that target's default branch; a sweep green asserts only default-branch
# state, as before.

name: validate-manifest-binding

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/validators-manifest.yaml'
      - '.github/scripts/validate-*.py'
      - '.github/workflows/validate-manifest-binding.yml'

  pull_request:
    paths:
      - '.github/scripts/validators-manifest.yaml'
      - '.github/scripts/validate-*.py'
      - '.github/workflows/validate-manifest-binding.yml'

  workflow_call:
    inputs:
      repo:
        description: 'Owner/name of the target repo to validate (default: this repo).'
        type: string
        required: false
        default: ''
      dry-run:
        description: 'Run checks but do not fail the job on findings.'
        type: boolean
        required: false
        default: false
    outputs:
      total-violations:
        description: 'Total count of CI-MANIFEST-BINDING violations.'
        value: ${{ jobs.scan.outputs.total-violations }}

  workflow_dispatch:
    inputs:
      repo:
        description: 'Owner/name of the target repo to validate (optional).'
        type: string
        required: false
      dry-run:
        description: 'Run checks but do not fail the job on findings.'
        type: boolean
        required: false
        default: false

jobs:
  scan:
    if: ${{ !github.event.repository.private }}  # [CI-032]
    runs-on: ubuntu-latest
    # 60, up from 5: the F12 cold bootstrap (a Workspace source build of
    # institute-ci) runs in this job on a cache miss and takes ~30 minutes;
    # warm-cache runs restore in seconds. Same allowance
    # validate-gitignore.yml already carries.
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      total-violations: ${{ steps.aggregate.outputs.total-violations }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Mint installation token (swift-institute-bot)
        id: mint-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            .github

      - name: Checkout swift-institute/.github (validator host)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          path: institute-github
          token: ${{ steps.mint-token.outputs.token }}
          ref: ${{ job.workflow_sha }}

      - name: Provision the Institute CI binary
        id: institute-ci
        uses: ./institute-github/.github/actions/institute-ci

      - name: Resolve target repo
        id: targets
        env:
          INPUT_REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_REPO" ]; then
            echo "$INPUT_REPO" > /tmp/target.txt
          else
            echo "${GITHUB_REPOSITORY:-swift-institute/.github}" > /tmp/target.txt
          fi

      - name: Run validate-manifest-binding (checks 2 + 4 + 5)
        id: check
        env:
          GH_TOKEN: ${{ steps.mint-token.outputs.token }}
          INSTITUTE_CI: ${{ steps.institute-ci.outputs.binary }}
          HOST_CHECKOUT: ${{ github.workspace }}/institute-github
          INPUT_REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          : > /tmp/findings.tsv
          repo="$(cat /tmp/target.txt)"
          # The Swift owner is CI.Validation.ManifestBinding; the --script
          # value is its registry IDENTITY (the retired script's path), not
          # a file on disk. Ported contract: findings ride the TSV, never
          # the exit code — a nonzero rc means the validator could not
          # answer, and `set -e` fails the step rather than reporting a
          # false zero (the retired `|| true` swallowed exactly that).
          if [ -z "$INPUT_REPO" ] && [ "${GITHUB_REPOSITORY:-}" = "swift-institute/.github" ]; then
            # Self-validation: no foreign target requested and the run is
            # hosted by the repo the checkout contains, so the checkout is at
            # the event revision — validate it directly. Cloning here would
            # validate the default branch and miss the revision under review
            # (#256).
            "$INSTITUTE_CI" validate --script .github/scripts/validate-manifest-binding.py \
              --repository "$repo" --root "$HOST_CHECKOUT" >> /tmp/findings.tsv
          else
            # Cross-repo sweep: clone the requested target's default branch.
            workdir=$(mktemp -d)
            if ! gh repo clone "$repo" "$workdir" -- --depth 1 --quiet 2>/dev/null; then
              echo "$repo	clone-failed	-" >> /tmp/findings.tsv
            else
              "$INSTITUTE_CI" validate --script .github/scripts/validate-manifest-binding.py \
                --repository "$repo" --root "$workdir" >> /tmp/findings.tsv
            fi
            rm -rf "$workdir"
          fi

      - name: Aggregate findings
        id: aggregate
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          violations=$(grep -cE "	CI-MANIFEST-BINDING" /tmp/findings.tsv) || violations=0
          echo "total-violations=$violations" >> "$GITHUB_OUTPUT"
          {
            echo "## validate-manifest-binding findings"
            echo "Total violations: $violations"
            echo
            if [ "$violations" -gt 0 ]; then
              echo "| Repo | Rule | Message |"
              echo "|---|---|---|"
              awk -F'\t' '$2 == "CI-MANIFEST-BINDING"{
                gsub(/\|/, "\\|", $3);
                printf("| `%s` | `%s` | %s |\n", $1, $2, $3)
              }' /tmp/findings.tsv
            fi
          } > "$GITHUB_STEP_SUMMARY"
          # Also to stdout — $GITHUB_STEP_SUMMARY is unreachable from the run
          # list and the API (output.summary is null on the check run), so the
          # log is the only place a red is classifiable through the API.
          # Mirrors validate-branch-pins.yml / validate-gitignore.yml.
          echo "validate-manifest-binding: ${violations} violation(s)"
          if [ "$violations" -gt 0 ]; then
            awk -F'\t' '$2 == "CI-MANIFEST-BINDING" { printf("  %s\t%s\t%s\n", $1, $2, $3) }' /tmp/findings.tsv
          fi
          if [ "$violations" -gt 0 ] && [ "$DRY_RUN" != "true" ]; then
            exit 1
          fi
