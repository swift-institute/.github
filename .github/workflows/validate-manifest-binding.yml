# validate-manifest-binding.yml — enforce [CI-MANIFEST-BINDING] internal-
# consistency binding (checks 2 + 4 + 5).
#
# Phase B-1 of CI-REVIEW-PHASE-B-DESIGN-2026-05-14 §3; check 5 added
# 2026-05-14 (Step 3 post-arc closure).
#
# Phase B-2 (checks 1 + 3 — cross-reference against the Skills/
# ci-cd-workflows skill's bracket citations, and the cross-repo Skills
# checkout + App-token scope that fed them) was retired by principal ruling
# on swift-institute/.github#229 (comment 5166115277, 2026-08-03): the
# 2026-07-28 Skills-corpus rebuild dropped every bracket-form citation the
# corpus carried, so the check had no convention left to enforce. See
# validate-manifest-binding.py's module docstring for the full rationale.
#
# Single checkout now (validator host only); no longer needs the
# validate-base.yml dual-checkout accommodation that motivated staying
# standalone. Left standalone-shaped in this change regardless — converting
# to a validate-base.yml thin caller is a separate, unscoped decision.
#
# Per [CI-090] this is a workflow_call reusable so NO top-level `permissions:`
# block — per-job permissions (contents: read) provide the floor; the caller's
# permissions cap the intersection.

name: validate-manifest-binding

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/validators-manifest.yaml'
      - '.github/scripts/validate-manifest-binding.py'
      - '.github/scripts/validate-*.py'
      - '.github/workflows/validate-manifest-binding.yml'

  pull_request:
    paths:
      - '.github/scripts/validators-manifest.yaml'
      - '.github/scripts/validate-manifest-binding.py'
      - '.github/scripts/validate-*.py'
      - '.github/workflows/validate-manifest-binding.yml'

  workflow_call:
    inputs:
      repo:
        description: 'Owner/name of the target repo to validate (default: this repo).'
        type: string
        required: false
        default: ''
      dry-run:
        description: 'Run checks but do not fail the job on findings.'
        type: boolean
        required: false
        default: false
    outputs:
      total-violations:
        description: 'Total count of CI-MANIFEST-BINDING violations.'
        value: ${{ jobs.scan.outputs.total-violations }}

  workflow_dispatch:
    inputs:
      repo:
        description: 'Owner/name of the target repo to validate (optional).'
        type: string
        required: false
      dry-run:
        description: 'Run checks but do not fail the job on findings.'
        type: boolean
        required: false
        default: false

jobs:
  scan:
    if: ${{ !github.event.repository.private }}  # [CI-032]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      total-violations: ${{ steps.aggregate.outputs.total-violations }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Mint installation token (swift-institute-bot)
        id: mint-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            .github

      - name: Checkout swift-institute/.github (validator host)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          path: institute-github
          token: ${{ steps.mint-token.outputs.token }}
          ref: ${{ job.workflow_sha }}

      - name: Resolve target repo
        id: targets
        env:
          INPUT_REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_REPO" ]; then
            echo "$INPUT_REPO" > /tmp/target.txt
          else
            echo "${GITHUB_REPOSITORY:-swift-institute/.github}" > /tmp/target.txt
          fi

      - name: Run validate-manifest-binding (checks 2 + 4 + 5)
        id: check
        env:
          GH_TOKEN: ${{ steps.mint-token.outputs.token }}
          VALIDATOR: ${{ github.workspace }}/institute-github/.github/scripts/validate-manifest-binding.py
        run: |
          set -euo pipefail
          : > /tmp/findings.tsv
          repo="$(cat /tmp/target.txt)"
          workdir=$(mktemp -d)
          (
            cd "$workdir"
            if ! gh repo clone "$repo" . -- --depth 1 --quiet 2>/dev/null; then
              echo "$repo	clone-failed	-" >> /tmp/findings.tsv
              exit 0
            fi
            python3 "$VALIDATOR" "$repo" "$workdir" >> /tmp/findings.tsv || true
          )
          rm -rf "$workdir"

      - name: Aggregate findings
        id: aggregate
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          violations=$(grep -cE "	CI-MANIFEST-BINDING" /tmp/findings.tsv) || violations=0
          echo "total-violations=$violations" >> "$GITHUB_OUTPUT"
          {
            echo "## validate-manifest-binding findings"
            echo "Total violations: $violations"
            echo
            if [ "$violations" -gt 0 ]; then
              echo "| Repo | Rule | Message |"
              echo "|---|---|---|"
              awk -F'\t' '$2 == "CI-MANIFEST-BINDING"{
                gsub(/\|/, "\\|", $3);
                printf("| `%s` | `%s` | %s |\n", $1, $2, $3)
              }' /tmp/findings.tsv
            fi
          } > "$GITHUB_STEP_SUMMARY"
          # Also to stdout — $GITHUB_STEP_SUMMARY is unreachable from the run
          # list and the API (output.summary is null on the check run), so the
          # log is the only place a red is classifiable through the API.
          # Mirrors validate-branch-pins.yml / validate-gitignore.yml.
          echo "validate-manifest-binding: ${violations} violation(s)"
          if [ "$violations" -gt 0 ]; then
            awk -F'\t' '$2 == "CI-MANIFEST-BINDING" { printf("  %s\t%s\t%s\n", $1, $2, $3) }' /tmp/findings.tsv
          fi
          if [ "$violations" -gt 0 ] && [ "$DRY_RUN" != "true" ]; then
            exit 1
          fi
