# validate-package-structure.yml — verify shape-neutral SwiftPM graph and
# exports-only aggregate integrity.
#
# Reusable workflow. For the given `org` (or single `repo`), enumerates
# non-archived repos, clones each (shallow), runs
# `swift package describe --type json`, and feeds the output to
# `.github/scripts/validate-package-structure.py` for rule checking.
#
# Wave 2b reference reusable per [SKILL-LIFE-026] — covers the highest-leverage
# Category-E rules from the inventory (HANDOFF-skill-to-ci-cd-extraction-inventory.md
# §C.3). Subsequent reusables (validate-docc-structure.yml, validate-platform-
# architecture.yml) follow this same shape as separate handoffs.
#
# Checks:
#   - targets and product target references have unique, resolvable identities;
#   - the intra-package target graph is acyclic;
#   - targets whose only Swift source is exports.swift contain only deliberate
#     exported imports.
#
# The validator does not require any particular root, product, target count,
# Test Support surface, naming family, or aggregate. Those are independent
# modularization decisions.
#
# Pattern mirrors lint-readme-structure.yml and lint-test-support-spine.yml.
# Authentication uses the swift-institute-bot GitHub App.
#
# Semantic boundary: Skills/modularization/SKILL.md [MOD-VERIFY].

name: validate-package-structure

on:
  workflow_call:
    inputs:
      repo:
        description: 'Owner/name of a single repo to scan.'
        type: string
        required: false
        default: ''
      org:
        description: 'Org to sweep (ignored if repo is set).'
        type: string
        required: false
        default: ''
      dry-run:
        description: 'Run checks but skip aggregated reporting.'
        type: boolean
        required: false
        default: false
      visibility:
        description: 'Filter targets by visibility (public | private | internal | all).'
        type: string
        required: false
        default: 'public'
    outputs:
      repos-scanned:
        description: 'Number of repos scanned.'
        value: ${{ jobs.scan.outputs.repos-scanned }}
      repos-with-violations:
        description: 'Number of repos with at least one violation.'
        value: ${{ jobs.scan.outputs.repos-with-violations }}
      total-violations:
        description: 'Total count of individual violations across all repos.'
        value: ${{ jobs.scan.outputs.total-violations }}

  workflow_dispatch:
    inputs:
      repo:
        description: 'Owner/name of a single repo (optional).'
        type: string
        required: false
      org:
        description: 'Org to sweep (optional; ignored if repo is set).'
        type: string
        required: false
      dry-run:
        description: 'Run checks but skip aggregated reporting.'
        type: boolean
        required: false
        default: false
      visibility:
        description: 'Filter targets by visibility (public | private | internal | all).'
        type: string
        required: false
        default: 'public'

# The fleet's manifests declare `// swift-tools-version: 6.3.3`, and
# `swift package describe` refuses any manifest whose tools-version exceeds
# the installed toolchain. The runner image's default toolchain sat below
# that floor (6.3.2), which left 81% of targets unscanned (#61). Pin the
# toolchain to the fleet manifest floor; when the ecosystem moves to 6.4,
# bump this deliberately and re-measure rather than letting it drift.
env:
  SWIFT_TOOLCHAIN_VERSION: '6.3.3'

jobs:
  scan:
    if: ${{ !github.event.repository.private }}
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      repos-scanned: ${{ steps.aggregate.outputs.repos-scanned }}
      repos-with-violations: ${{ steps.aggregate.outputs.repos-with-violations }}
      total-violations: ${{ steps.aggregate.outputs.total-violations }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Mint installation token (swift-institute-bot)
        id: mint-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ inputs.org || github.repository_owner }}

      - name: Checkout swift-institute/.github (for the validation script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          path: .github-shared
          ref: ${{ job.workflow_sha }}

      - name: Resolve target repos
        id: targets
        env:
          GH_TOKEN: ${{ steps.mint-token.outputs.token }}
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_ORG: ${{ inputs.org }}
          INPUT_VISIBILITY: ${{ inputs.visibility }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_REPO" ]; then
            echo "$INPUT_REPO" > /tmp/targets.txt
          else
            : "${INPUT_ORG:?org or repo input required}"
            visibility_filter="$INPUT_VISIBILITY"
            if [ "$visibility_filter" = "all" ]; then
              gh api graphql -f org="$INPUT_ORG" -f query='
                query($org: String!, $cursor: String) {
                  organization(login: $org) {
                    repositories(first: 100, after: $cursor, isArchived: false) {
                      nodes { name nameWithOwner }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }' --paginate --jq '.data.organization.repositories.nodes[].nameWithOwner' \
                > /tmp/targets.txt
            else
              gh repo list "$INPUT_ORG" --no-archived --limit 1000 --visibility "$visibility_filter" \
                --json nameWithOwner --jq '.[].nameWithOwner' > /tmp/targets.txt
            fi
          fi
          n=$(wc -l < /tmp/targets.txt | tr -d ' ')
          echo "Resolved $n target repo(s)."
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - name: Set up Swift toolchain
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9  # v1.14.0
        with:
          swift-version: ${{ env.SWIFT_TOOLCHAIN_VERSION }}

      - name: Record toolchain identity
        run: swift --version

      - name: Run package-structure checks
        id: check
        env:
          GH_TOKEN: ${{ steps.mint-token.outputs.token }}
          VALIDATOR_SCRIPT: ${{ github.workspace }}/.github-shared/.github/scripts/validate-package-structure.py
        run: |
          set -euo pipefail
          mkdir -p /tmp/findings
          : > /tmp/findings/all.tsv

          while IFS= read -r repo; do
            [ -z "$repo" ] && continue

            workdir=$(mktemp -d)
            (
              cd "$workdir"
              if ! gh repo clone "$repo" . -- --depth 1 --quiet 2>/dev/null; then
                echo "$repo	clone-failed	-" >> /tmp/findings/all.tsv
                exit 0
              fi

              if [ ! -f Package.swift ]; then
                exit 0
              fi

              if ! swift package --skip-update describe --type json > /tmp/pkg.json 2>/tmp/pkg.err; then
                err_summary=$(tr '\n' ' ' < /tmp/pkg.err | head -c 200)
                echo "$repo	package-describe-failed	$err_summary" >> /tmp/findings/all.tsv
                exit 0
              fi

              # The validator exits 1 to mean "found violations", so only
              # rc >= 2 is a crash worth a sentinel.
              rc=0
              python3 "$VALIDATOR_SCRIPT" "$repo" /tmp/pkg.json >> /tmp/findings/all.tsv || rc=$?
              if [ "$rc" -gt 1 ]; then
                echo "$repo	validator-crashed	-" >> /tmp/findings/all.tsv
              fi
            )
            rm -rf "$workdir"
          done < /tmp/targets.txt

      - name: Aggregate findings
        id: aggregate
        run: |
          set -euo pipefail
          total_repos=$(wc -l < /tmp/targets.txt | tr -d ' ')
          violations=$(awk -F'\t' '$2 ~ /^PACKAGE-/' /tmp/findings/all.tsv | wc -l | tr -d ' ')
          repos_with_violations=$(awk -F'\t' '$2 ~ /^PACKAGE-/{print $1}' /tmp/findings/all.tsv | sort -u | wc -l | tr -d ' ')
          # The check step has always written clone-failed and
          # package-describe-failed sentinel rows, and nothing has ever read
          # them: neither matches /^PACKAGE-/, so a repo that could not be
          # cloned or whose manifest would not resolve counted as clean. A
          # target the validator never saw must not be reportable as a target
          # with no findings.
          clone_failures=$(awk -F'\t' '$2 == "clone-failed"' /tmp/findings/all.tsv | wc -l | tr -d ' ')
          not_scanned=$(awk -F'\t' '$2 == "package-describe-failed" || $2 == "validator-crashed"' /tmp/findings/all.tsv | wc -l | tr -d ' ')

          echo "repos-scanned=$total_repos" >> "$GITHUB_OUTPUT"
          echo "repos-with-violations=$repos_with_violations" >> "$GITHUB_OUTPUT"
          echo "total-violations=$violations" >> "$GITHUB_OUTPUT"

          {
            echo "## validate-package-structure findings"
            echo
            echo "Repos scanned: $total_repos"
            echo "Repos with violations: $repos_with_violations"
            echo "Total violations: $violations"
            echo
            if [ "$clone_failures" -gt 0 ] || [ "$not_scanned" -gt 0 ]; then
              echo "> [!CAUTION]"
              echo "> ${clone_failures} target(s) failed to clone and ${not_scanned} could not be described or crashed the validator — those repos were NOT scanned, so the counts above are a floor, not a total. Treat this run as failed."
              echo
              awk -F'\t' '$2 == "clone-failed" || $2 == "package-describe-failed" || $2 == "validator-crashed" { printf("- %s: `%s` %s\n", $2, $1, $3) }' /tmp/findings/all.tsv
              echo
            fi
            if [ "$violations" -gt 0 ]; then
              echo "### Per-repo findings"
              echo
              echo "| Repo | Rule | Message |"
              echo "|---|---|---|"
              awk -F'\t' '$2 ~ /^PACKAGE-/{
                gsub(/\|/, "\\|", $3);
                printf("| `%s` | `%s` | %s |\n", $1, $2, $3)
              }' /tmp/findings/all.tsv
            fi
          } > "$GITHUB_STEP_SUMMARY"
          # Also to stdout — see the note in validate-thin-callers.yml.
          echo "validate-package-structure: ${violations} violation(s) in ${repos_with_violations}/${total_repos} repo(s), ${clone_failures} clone failure(s), ${not_scanned} not-scanned"
          if [ "$clone_failures" -gt 0 ] || [ "$not_scanned" -gt 0 ]; then
            # The reason each target went unscanned belongs in the LOG, not only
            # in the step summary. The first run with these gates live reported
            # 44 of 54 targets never scanned across the small orgs, and
            # diagnosing why meant it had to be readable somewhere reachable.
            # This is the same string the step summary already publishes, so it
            # adds no exposure the workflow did not already have.
            echo "--- targets that were NOT scanned ---"
            awk -F'\t' '$2 == "clone-failed" || $2 == "package-describe-failed" || $2 == "validator-crashed" {
              printf("  %s\t%s\t%s\n", $2, $1, substr($3, 1, 200))
            }' /tmp/findings/all.tsv
            echo "::error::${clone_failures} clone failure(s) and ${not_scanned} target(s) that could not be described or crashed the validator — those targets were never scanned, so a green result here would be false."
          fi

          if { [ "$violations" -gt 0 ] || [ "$clone_failures" -gt 0 ] || [ "$not_scanned" -gt 0 ]; } \
             && [ "${{ inputs.dry-run }}" != "true" ]; then
            exit 1
          fi
