# cron-audit-base.yml — reusable orchestrator skeleton for cross-org cron
# audits.
#
# Encodes the shared shape of the lint-license-header-weekly,
# lint-test-support-spine-weekly, and lint-mechanical-hygiene-weekly
# orchestrators (~80% structurally identical).
#
# (The lint-foundation-family-import-weekly orchestrator was a fourth
# consumer until 2026-05-05; it was retired when γ-1a migrated to a
# Tier 2 SwiftLint custom rule — see swift-institute/Research/
# rollout-phase-1-results.md.)
#
# Phase C of the 2026-05-14 CI review (Q2=B sealed) refactored the
# free-form `audit-step:` shell-string contract into the structured-
# input contract below. The `institute-ci-control cron-audit` driver
# (swift-institute/institute-continuous-integration-control, `Fleet.Audit`;
# extracted from the Tools/ copy by TX-3, swift-institute/.github#515) is
# the only entry point; callers MUST NOT supply shell snippets. This closes the
# HIGH-CONDITIONAL template-injection finding from
# CI-REVIEW-security-2026-05-14.md (the prior `audit-step:` interpolated
# caller-supplied bash into a job that holds a cross-org App-installation
# token at the matrix-org scope).
#
# Each caller provides:
#
#   - audit: the audit to run over each clone. A registered name
#     ('mechanical-hygiene') selects a Swift audit; any other value is
#     read as a path within swift-institute/.github to a Python audit
#     script, which is how the two swift-linter-owned audits
#     (audit-license-header.py, audit-test-support-spine.py) keep
#     running until the CW cross-programme hold lifts. Setup for a
#     registered audit is the runner's own (`audit-setup`); a script
#     audit needs none.
#   - audit-runner-args: JSON-encoded config dict consumed by the
#     runner (json_totals_path, count_keys, extra_template,
#     extra_when_keys, summary_label). Decoded into
#     `Fleet.Audit.Configuration`; see that type for the full schema.
#   - matrix-orgs: JSON array of org names to sweep.
#   - container: optional swift:* image for audits that need
#     `swift package dump-package`.
#   - issue-title-prefix / issue-label / issue-body-template: report
#     scaffolding (unchanged from pre-Phase-C).
#
# Substitutions in issue-body-template (envsubst with ${...} syntax):
#   ${TODAY}            UTC date YYYY-MM-DD
#   ${COUNT_<LABEL>}    Total across orgs for each label in count-labels
#                       (uppercased; e.g. count-labels=errors,warnings →
#                       ${COUNT_ERRORS}, ${COUNT_WARNINGS}).
#   ${PER_ORG_LIST}     Multi-line per-org breakdown built from
#                       /tmp/<ORG>-counts.txt files.
#   ${EXTRA}            Concatenated content of all /tmp/<ORG>-extra.txt
#                       artifact files (empty when no caller writes them).
#
# Per-org artifact convention: the runner writes /tmp/<ORG>-counts.txt
# (comma-separated, in count-labels order) and (when extras configured)
# /tmp/<ORG>-extra.txt (newline-separated per-package lines).
#
# Out of scope: submit-dep-graph-weekly's per-target POST-to-API pattern
# is structurally different and remains inline. link-check-weekly is also
# outside this template (different shape — matrix delegating to
# link-check.yml).
#
# Provenance: extracts the cron orchestrator skeleton repeated across 4
# weekly orchestrators. Per [CI-030] callers reference @main during
# active dev. Per [README-167] tracking-issue pattern preserved.
# Phase C refactor: Audits/Outcome-CI-REVIEW-Phase-C-2026-05-14.md.

name: cron-audit-base

# [CI-082] sha256sum -c pin for the gh CLI apt-keyring fetched from
# cli.github.com. The keyring is the trust root for downstream `apt-get
# install gh`; its integrity MUST be verified before placement in
# /etc/apt/keyrings/. Re-lock if/when GitHub rotates the keyring digest.
env:
  GH_KEYRING_SHA256: "6084d5d7bd8e288441e0e94fc6275570895da18e6751f70f057485dc2d1a811b"

on:
  workflow_call:
    inputs:
      matrix-orgs:
        type: string
        required: true
        description: >
          JSON array of org names to sweep (e.g. '["swift-primitives"]'
          or '["swift-primitives","swift-standards"]'). Parsed by
          fromJSON() at runtime.
      container:
        type: string
        required: false
        default: ''
        description: >
          Optional container image for the sweep job (e.g. swift:6.3
          when the audit invokes `swift package dump-package`). Default
          empty means run on bare ubuntu-latest. Accepts literal image
          names; env.* and matrix.* are unavailable at the container
          field per Actions context-availability rules.
      audit:
        type: string
        required: true
        description: >
          The audit to run over each clone. A registered name
          ('mechanical-hygiene') selects a Swift audit owned by
          `Fleet.Audit`. Any other value is read as a path within
          swift-institute/.github to a Python audit script, invoked as
          `python3 <path> --package-dir <clone> --json <tmp>` — the
          shape the two swift-linter-owned audits still have while the
          CW cross-programme hold stands. Its JSON output is read via
          json_totals_path + count_keys, exactly as before.
      audit-runner-args:
        type: string
        required: true
        description: >
          JSON-encoded config object passed to the runner via
          --args-json. Required keys: count_keys (list[str]). Optional:
          json_totals_path (dotted, default 'totals'), extra_template
          (names: pkg + count_keys), extra_when_keys
          (list[str], subset of count_keys; default = count_keys),
          summary_label (str). See `Fleet.Audit.Configuration`.
          Trust contract: the value is JSON-decoded inside the runner;
          NO shell expansion ever sees this content.
      count-labels:
        type: string
        required: true
        description: >
          Comma-separated list of count names (e.g. errors,warnings).
          Each label generates a ${COUNT_<LABEL>} substitution
          (uppercased) summed across orgs. The number of labels must
          match the column count in each /tmp/<ORG>-counts.txt file
          (which the runner writes in count_keys order; callers MUST
          keep count-labels and audit-runner-args.count_keys aligned).
      issue-title-prefix:
        type: string
        required: true
        description: >
          Title prefix for the tracking issue. Final title appends
          ' <YYYY-MM-DD>' (e.g. 'Foundation-import sweep 2026-05-12').
          Also used to search for an existing open issue to update
          (rather than creating a duplicate) — searched as
          '<prefix> in:title'.
      issue-label:
        type: string
        required: true
        description: >
          Label applied on issue creation (e.g. 'foundation-audit').
          When the label does not exist on swift-institute/.github,
          the reusable falls back to creating the issue without a
          label (matching the link-check.yml + sync-metadata-nightly
          fallback pattern).
      issue-body-template:
        type: string
        required: true
        description: >
          Markdown template body. Pre-substitution: may reference
          ${TODAY}, ${COUNT_<LABEL>} for each count-labels entry,
          ${PER_ORG_LIST}, and ${EXTRA}. Post-substitution: rendered
          via envsubst with explicit variable list.
      dry-run:
        type: boolean
        required: false
        default: false
        description: >
          When true, the reusable still runs the audit and aggregation,
          but skips the gh issue create/update. Used for canary runs
          to verify the audit logic without filing tracking issues.

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(inputs.matrix-orgs) }}
    if: ${{ !github.event.repository.private }}     # [CI-032]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ${{ inputs.container }}
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Install dependencies
        if: ${{ inputs.container != '' }}
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          # uuid-dev: swift-linux-standard's CLinuxKernelShim `#include`s
          # <uuid/uuid.h>, which `institute-ci-control` reaches transitively
          # through swift-github. `.linkedLibrary` affects only the LINK
          # step, so without the header the C module fails to build and the
          # sweep never starts (canary runs 31175005924 / 31175007454). Same
          # typed provisioning input as `.github/actions/institute-ci`; that
          # action installs it explicitly for the same reason this does —
          # `install-system-deps` derives from the workspace root, and this
          # package lives under `.institute-ci-control/`, where the
          # derivation cannot see it.
          apt-get install -qq -y curl python3 git uuid-dev
          # gh CLI install on swift:* container (not in base; required for `gh repo list`)
          type -p curl >/dev/null
          mkdir -p -m 755 /etc/apt/keyrings
          # [CI-082] fetch to file, sha256sum -c against pinned digest,
          # only then place in /etc/apt/keyrings/. Restructured from the
          # prior `curl | tee` pipe to enable verification (the keyring
          # is the trust root for subsequent apt-get install gh).
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /tmp/gh-keyring.gpg
          echo "${GH_KEYRING_SHA256}  /tmp/gh-keyring.gpg" | sha256sum -c -
          mv /tmp/gh-keyring.gpg /etc/apt/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt-get update -qq
          apt-get install -qq -y gh

      - name: Mint installation token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}
          repositories: ''

      - name: Set up Swift (bare runner)
        if: ${{ inputs.container == '' }}
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: '6.3'

      - name: Install C-shim system headers (bare runner)
        if: ${{ inputs.container == '' }}
        shell: bash
        run: |
          set -euo pipefail
          # uuid-dev: swift-linux-standard's CLinuxKernelShim `#include`s
          # <uuid/uuid.h>, which `institute-ci-control` reaches transitively
          # through swift-github. `.linkedLibrary` affects only the LINK
          # step, so without the header the C module fails to build and the
          # sweep never starts (canary runs 31175005924 / 31175007454). Same
          # typed provisioning input as `.github/actions/institute-ci`; that
          # action installs it explicitly for the same reason this does —
          # `install-system-deps` derives from the workspace root, and this
          # package lives under `.institute-ci-control/`, where the
          # derivation cannot see it.
          sudo apt-get update -qq
          sudo apt-get install -qq -y uuid-dev

      - name: Fetch any script audit (sparse-checkout from swift-institute/.github)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          ref: ${{ job.workflow_sha }}
          path: .swift-institute-github
          sparse-checkout: |
            ${{ inputs.audit }}
          sparse-checkout-cone-mode: false

      # TX-3 of the reduction census (swift-institute/.github#515): the
      # control tool now lives in its seeded repository,
      # swift-institute/institute-continuous-integration-control, and
      # this workflow consumes it from there instead of the retiring
      # Tools/ copy. The seed is private, so the checkout rides a
      # transient App token scoped to exactly that one repository with
      # contents:read (the same narrowed-mint shape
      # review-pr-transaction.yml uses), separate
      # from the per-org sweep token minted above.
      - name: Mint read-only token for the seeded institute-ci-control package
        id: cicontrol-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: swift-institute
          repositories: institute-continuous-integration-control
          permission-contents: read

      - name: Checkout the seeded institute-ci-control package at exact main pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/institute-continuous-integration-control
          # Advance with pin-advance flow; must stay a full SHA (branch-pin
          # guard). Same pin as
          # submit-dep-graph-weekly.yml.
          ref: f9832144acacc43cbe6fb8d86b50435f68dd41c5
          path: .institute-ci-control
          token: ${{ steps.cicontrol-token.outputs.token }}
          persist-credentials: false

      - name: Build the sweep runner
        shell: bash
        run: |
          set -euo pipefail
          # Built at the pinned seed commit's own sources, once per
          # matrix job, before the org sweep credential is used.
          swift build -c release \
            --package-path .institute-ci-control \
            --product institute-ci-control
          bin_path="$(swift build -c release \
            --package-path .institute-ci-control \
            --show-bin-path)"
          echo "${bin_path}" >> "$GITHUB_PATH"

      - name: Run audit
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ matrix.org }}
          AUDIT: ${{ inputs.audit }}
          AUDIT_RUNNER_ARGS: ${{ inputs.audit-runner-args }}
        run: |
          set -euo pipefail
          # [CI-081] structured-input contract — no caller-supplied
          # shell. AUDIT_RUNNER_ARGS rides an env channel and is decoded
          # inside the runner; a script audit is invoked by argument
          # vector, never through a shell.
          audit="${AUDIT}"
          case "${audit}" in
            mechanical-hygiene) ;;
            *) audit=".swift-institute-github/${AUDIT}" ;;
          esac
          institute-ci-control audit-setup --audit "${audit}"
          institute-ci-control cron-audit \
            --org "${ORG}" \
            --audit "${audit}" \
            --artefact-dir /tmp

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cron-audit-counts-${{ matrix.org }}
          path: |
            /tmp/${{ matrix.org }}-counts.txt
            /tmp/${{ matrix.org }}-extra.txt
          if-no-files-found: ignore

  report:
    needs: sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !github.event.repository.private && always() && needs.sweep.result != 'skipped' }}     # [CI-032]
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Mint installation token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: swift-institute
          repositories: .github
          permission-issues: write

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/counts

      - name: Aggregate + render
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          DRY_RUN: ${{ inputs.dry-run }}
          COUNT_LABELS: ${{ inputs.count-labels }}
          ISSUE_TITLE_PREFIX: ${{ inputs.issue-title-prefix }}
          ISSUE_LABEL: ${{ inputs.issue-label }}
          ISSUE_BODY_TEMPLATE: ${{ inputs.issue-body-template }}
        shell: bash
        run: |
          set -euo pipefail

          today=$(date -u '+%Y-%m-%d')

          # Parse count-labels into an array; uppercase-form for env-var names.
          IFS=',' read -ra labels <<< "${COUNT_LABELS}"
          declare -A totals
          for label in "${labels[@]}"; do
            totals["$label"]=0
          done

          # Aggregate counts across orgs. Layout-agnostic per Path A:
          # download-artifact@v8 flattens to /tmp/counts/<file> when only
          # one artifact matches and nests to /tmp/counts/<artifact>/<file>
          # otherwise. `find` walks at any depth; org is recovered from
          # the filename's <org>-counts.txt suffix-strip rather than from
          # the artifact-directory name. See Research/download-artifact-ladder-migration.md.
          per_org_lines=()
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            org=$(basename "$f" | sed 's/-counts\.txt$//')
            IFS=',' read -ra values < "$f"
            line="- \`${org}\`:"
            for i in "${!labels[@]}"; do
              label="${labels[$i]}"
              value="${values[$i]:-0}"
              totals["$label"]=$((totals["$label"] + value))
              line="${line} ${value} ${label}"
              [[ $i -lt $((${#labels[@]} - 1)) ]] && line="${line},"
            done
            per_org_lines+=("$line")
          done < <(find /tmp/counts -type f -name '*-counts.txt' 2>/dev/null)
          per_org_list=$(printf '%s\n' "${per_org_lines[@]}")

          # Concatenate any *-extra.txt files into ${EXTRA}.
          extra=""
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            [[ -s "$f" ]] && extra="${extra}$(cat "$f")"$'\n'
          done < <(find /tmp/counts -type f -name '*-extra.txt' 2>/dev/null)

          # Decide whether anything is non-zero.
          any_nonzero=0
          for label in "${labels[@]}"; do
            if [[ "${totals[$label]}" -gt 0 ]]; then
              any_nonzero=1
              break
            fi
          done
          if [[ "$any_nonzero" -eq 0 ]]; then
            echo "All counts zero across orgs — no tracking issue needed."
            echo "FILE_ISSUE=false" >> "$GITHUB_ENV"
            # Convergence self-closure (#159): a clean, non-dry-run sweep
            # closes its own open tracking issue in the same run.
            if [[ "${DRY_RUN}" != "true" ]]; then
              echo "CLOSE_ISSUE=true" >> "$GITHUB_ENV"
            fi
            exit 0
          fi

          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "(dry-run; would have opened/updated issue)"
            echo "FILE_ISSUE=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # Build envsubst variable list + export the values.
          export TODAY="$today"
          export PER_ORG_LIST="$per_org_list"
          export EXTRA="$extra"
          envsubst_vars='${TODAY} ${PER_ORG_LIST} ${EXTRA}'
          for label in "${labels[@]}"; do
            upper=$(echo "$label" | tr '[:lower:]' '[:upper:]')
            varname="COUNT_${upper}"
            export "${varname}=${totals[$label]}"
            envsubst_vars="${envsubst_vars} \${${varname}}"
          done

          # Render the body via envsubst, write to file for upsert composite.
          echo "${ISSUE_BODY_TEMPLATE}" | envsubst "${envsubst_vars}" > "${RUNNER_TEMP}/issue-body.md"
          {
            echo "ISSUE_TITLE=${ISSUE_TITLE_PREFIX} ${today}"
            echo "FILE_ISSUE=true"
          } >> "$GITHUB_ENV"

      - name: Upsert tracking issue
        if: env.FILE_ISSUE == 'true'
        uses: swift-institute/.github/.github/actions/upsert-tracking-issue@6f73c2ebff00e4f05375794905926bdd7a0ca14b  # main 2026-08-04, identity-pin to main HEAD (swift-institute/.github#286); no functional change to this action in range
        with:
          repo: swift-institute/.github
          title: ${{ env.ISSUE_TITLE }}
          title-prefix: ${{ inputs.issue-title-prefix }}
          body-file: ${{ runner.temp }}/issue-body.md
          label: ${{ inputs.issue-label }}
          gh-token: ${{ steps.token.outputs.token }}

      # Convergence self-closure (swift-institute/.github#159): a clean sweep
      # closes its own open tracking issue, per the bot-issue contract (the
      # owning workflow closes its report when the reported state converges).
      # Title-matched, never label-keyed — a minted label that was never
      # created would silently disable this close path (recorded precedent in
      # the github skill; same defect class as lint-validators-weekly's
      # pre-fix close step). Mirrors the upsert composite's own title-prefix
      # lookup so the upsert and close paths always refer to the same issue.
      - name: Close tracking issue on clean convergence
        if: env.CLOSE_ISSUE == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TITLE_PREFIX: ${{ inputs.issue-title-prefix }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh issue list \
            --repo swift-institute/.github \
            --state open \
            --search "\"${TITLE_PREFIX}\" in:title" \
            --json number \
            --jq '.[].number' || echo "")
          if [[ -z "$existing" ]]; then
            echo "Sweep clean and no open tracking issue to close."
            exit 0
          fi
          for n in $existing; do
            gh issue close "$n" \
              --repo swift-institute/.github \
              --reason completed \
              --comment "Clean sweep: zero findings across all swept orgs — ${RUN_URL}. An issue stays open only if the perfect end-state contains its fix; convergence proven by the cited clean run closes it. Auto-closed as completed by the owning workflow."
            echo "closed #${n}"
          done
