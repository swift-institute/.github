          if [ "$ACTUAL" != "$SUBJECT_SHA" ]; then
            echo "::error::checked-out HEAD '$ACTUAL' does not match Plan's resolved CI subject SHA '$SUBJECT_SHA'. Refusing to proceed against an unverified checkout."
            exit 1
          fi

      - uses: swift-institute/.github/.github/actions/configure-private-repos@d1af72d05bf8262fb3918a2f1607b82fafcafdf9  # main 2026-08-03, pin normalized to the deliberately advanced full SHA (TX7, swift-institute/.github#276); action blobs identical at both commits
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          app-client-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
          app-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_ID }}
          app-private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          enabled: ${{ inputs.enable-private-repos }}

      - name: Print Swift version
        run: swift --version

      # NO `.build` CACHE HERE, EVER (swift-institute/.github#161, [CI-040]).
      # Cold build is the only honest one under gitignored `Package.resolved`
      # + branch-pinned dependencies; see the wrapper's original comment
      # (preserved in git history) for the measured cache-poisoning incident.

      - name: Build (Embedded)
        id: build
        if: ${{ inputs.embedded-target == '' }}
        run: swift build -Xswiftc -enable-experimental-feature -Xswiftc Embedded

      # The Swift main nightly container is intentionally minimal and does
      # not include jq. The selected-target manifest classification below is
      # the only consumer in this job, so provision it here rather than
      # widening another job or action's dependency surface.
      - name: Install jq for manifest classification
        if: ${{ inputs.embedded-target != '' }}
        shell: bash
        run: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 || {
            apt-get update -qq
            apt-get install -qq -y jq
          }

      - name: Build target (Embedded)
        id: build-target
        if: ${{ inputs.embedded-target != '' }}
        shell: bash
        env:
          EMBEDDED_TARGET: ${{ inputs.embedded-target }}
        run: |
          set -euo pipefail
          MANIFEST_JSON="$(swift package dump-package)"
          DEFAULT_TRAIT_COUNT="$(
            jq -er '[.traits[]? | select(.name == "default")] | length' <<< "$MANIFEST_JSON"
          )"
          if [[ "$DEFAULT_TRAIT_COUNT" == "1" ]]; then
            swift build --target "$EMBEDDED_TARGET" --disable-default-traits -Xswiftc -enable-experimental-feature -Xswiftc Embedded
          elif [[ "$DEFAULT_TRAIT_COUNT" == "0" ]]; then
            swift build --target "$EMBEDDED_TARGET" -Xswiftc -enable-experimental-feature -Xswiftc Embedded
          else
            echo "::error::evaluated package manifest declares $DEFAULT_TRAIT_COUNT traits named 'default'; refusing an ambiguous Embedded build."
            exit 1
          fi

