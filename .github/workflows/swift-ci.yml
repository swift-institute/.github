name: Swift CI (reusable)

# Universal reusable for Institute packages. Matrix: macOS 6.4 debug,
# Ubuntu 6.4 release, Windows 6.4 debug; Swift main nightly is a
# time-bounded advisory exception.
#
# Third-party consumers: unintended but permitted. No compatibility
# guarantee — pin `@<sha>`, not `@main`.
#
# TIERS (R1/R2 ruling 2026-07-20). Matrix SHAPE is the platform contract
# ([CI-010]/[CI-091]); only its SCHEDULING is tiered. `plan` classifies each
# run: build (format+lint+swift-linter + the caller's primary release leg;
# default) or full (everything). Tags, '[ci full]', consumer
# workflow_dispatch, and ci-sweep.yml force full. Binding budget is macOS
# runner CONCURRENCY (5/org), not minutes — the build tier schedules no
# macOS job.
#
# `lint` tier RETIRED 2026-07-28; the plan now rejects it. It selected no
# build leg and ci-ok scored the skipped gating leg as a pass, so it greened
# the required check having compiled nothing (588 of 998 runs build-free
# over 288 repos; hid a Signal 4 trap for six days —
# swift-primitives/swift-array-primitives#3). Its premise (a docs-only diff
# cannot change the build outcome) is false here: deps float on `main` with
# no Package.resolved, so the tree a push builds is not the tree the last
# run verified. REMOVAL CONDITION for the `build` floor: a fast path that
# keys on the resolved graph rather than the diff.
#
# Caller shape: one `uses:` job, `secrets: inherit`. Generated — edit the
# generator, never a caller.
#
# `enable-private-repos` defaults true: most consumers have private
# intra-Institute deps needing credentialed URL rewrites for `swift package
# resolve`. Credential order (see configure-private-repos): per-job App
# installation tokens (contents:read) from the org APP_CLIENT_ID/APP_ID +
# _APP_PRIVATE_KEY; PRIVATE_REPO_TOKEN is a legacy fallback.
#
# Inputs are deliberately minimal — toolchains, images, and matrix shape are
# hard-coded ecosystem-wide; a package needing a different shape forks this
# workflow. `target-repo`/`job`/`ref` (dispatch, for ci-dispatch.yml) and
# `platform-support` are the sanctioned exceptions, admissible only because
# they are DEFAULT-INERT: empty on every push/PR call, behaviour bit-identical
# to before each existed. See their `description:` fields below for semantics;
# `platform-support` is a platform-IDENTITY declaration, never a cost knob
# ([CI-096]) and never derived from Package.swift `platforms:` ([CI-091]) —
# a platform-blind matrix manufactures violations by forcing POSIX emulation
# into POSIX spec packages to green a Windows leg.
#
# CACHING: `.build/` is never cached — every run resolves and compiles fresh.
# `Package.resolved` is gitignored ecosystem-wide, so no key can represent the
# resolved graph, and `restore-keys` prefix matching silently serves stale
# branch-pinned checkouts. See
# `swift-institute/Research/ci-cache-strategy-branch-pinned-dependencies.md`.
#
# swift-institute owns the universal floor only; layer-specific invariants
# are not defined here.

on:
  workflow_call:
    inputs:
      swift-version:
        type: string
        default: "6.4"
        description: "Required Swift release floor for the macOS, Ubuntu release, and Windows jobs. The main-nightly advisory job is separately digest-pinned and must pass the typed exception check in plan."
      enable-private-repos:
        type: boolean
        default: true
        description: "If true, configure credentialed git url rewrites (App-token primary, PRIVATE_REPO_TOKEN fallback) for github.com clones. Default true: most consumers in the swift-primitives ecosystem have private deps and need the credentials; public-only consumers may pass false explicitly."
      macos-runner:
        type: string
        default: "xcode-27"
        description: "macOS runner image. Bump annually when GitHub adds a new image version. env.* is invalid in runs-on: per Actions context-availability rules — input is the working centralization mechanism."
      test-filter:
        type: string
        default: ""
        description: "If non-empty, append `--filter <value>` to every `swift test` invocation in this workflow. Hyphens in the value are converted to underscores so the regex matches Swift module identifiers (SwiftPM converts hyphenated target names to underscored module names). Used by per-issue consumer matrices (e.g., swift-institute/Issues calling this reusable per swift-issue-*). Empty default preserves existing consumer behavior."
      platform-support:
        type: string
        default: ""
        description: "Per-package CI platform-support declaration. Empty default preserves pre-input behavior: the build tier selects Linux and the full tier keeps every platform leg eligible. Non-empty = comma-separated subset of `apple,linux,windows` (lowercase, no spaces); unknown, duplicate, or empty family tokens fail the plan. Each platform leg runs only when its family token is present (apple → macos-release + apple-simulator-build; linux → linux-release + linux-nightly + linux-6-4; windows → windows-release). On the ordinary build tier, the same declaration selects exactly one supported release leg in deterministic priority order: Linux, then Windows, then macOS. Quality gates (format, lint, swift-linter, advisory linters) are platform-neutral and never consult this input. The plan applies this filter to `legs` itself, so `legs` is the single expected-execution list and ci-ok can require every gating leg named there to have SUCCEEDED (a gating leg that is skipped without the plan having excluded it now fails the run). Declare ONLY platform-identity exclusions — a package whose specification or identity excludes a platform (POSIX/ISO-9945 spec packages, per-platform roots like swift-linux / swift-windows). This is NOT a cost knob ([CI-096]) and is NOT derived from Package.swift `platforms:` ([CI-091] — that block is a SwiftPM deployment-target declaration, not a CI-coverage signal). Rationale: a platform-blind matrix forces platform emulation into L2 spec packages to green an illegitimate leg; the platform seam is L3 per [PLAT-ARCH-001]. ci-dispatch.yml passes nothing, so single-job dispatch can still force any leg on any package (debug surface preserved)."
      lint-bundle:
        type: string
        default: "institute"
        description: "Rule bundle the `swift-linter` job lints a consumer that carries NO root `Lint.swift` with. Consumers that DO carry one are unaffected — their file selects their rules and this input is never read. One of `primitives` | `standards` | `institute`; anything else fails the job in seconds, before any binary is provisioned. Set by the LAYER WRAPPER, not by the package: the wrapper is the layer, so the value is a literal there (swift-primitives → `primitives`, swift-standards → `standards`, swift-foundations → `institute`) and a package cannot elect a weaker rule set for itself. The default `institute` is the organization-wide bundle a direct caller (one that skips its layer wrapper, e.g. swift-institute/Issues) gets. The three bundles are a lattice — `universal ⊂ institute ⊂ primitives`, `standards = institute` minus two naming rules — so a single global default would measure primitives-layer packages against a LOOSER set than their configured peers, which is why the choice is per-layer. Mirrors Workspace's `Workspace.Lint.Bundle`, byte-for-byte the same tokens on the same `SWIFT_LINTER_BUNDLE` channel; keep the two in step. Non-empty default because the prebuilt runner falls back to `primitives` when the channel is UNSET (measured 2026-07-29) — an empty default would silently mismeasure every foundations package."
      tier:
        type: string
        default: ""
        description: "Verification-tier override (sanctioned default-inert input; R1/R2 principal ruling 2026-07-20). Empty default — existing push/PR/wrapper calls pass nothing — routes tier selection to the plan job's classifier: tag refs, workflow_dispatch, and '[ci full]' → full; everything else → build. Non-empty forces 'build' | 'full' (ci-sweep.yml passes 'full' for the nightly rotation sweep). 'lint' was RETIRED 2026-07-28 and now fails the plan with a pointed error rather than being silently honoured: it selected no build leg, and ci-ok counted the resulting skips as passes, so it produced a green required check over a run that compiled nothing. The tier gates SCHEDULING only — the matrix SHAPE ([CI-010]/[CI-091]) is untouched: every leg stays defined in this file and the full tier runs all of them; tags and sweeps always get the complete platform contract."
      target-repo:
        type: string
        default: ""
        description: "Dispatch-only target selector (set by ci-dispatch.yml). When non-empty, every build/test/lint job checks out this `owner/name` repo instead of the caller's own. Empty default — every push/PR/wrapper call passes nothing — so each checkout's repository field falls back to github.repository (the `|| github.repository` tail of the expression), bit-identical to the pre-dispatch implicit-default checkout. See ci-dispatch.yml."
      job:
        type: string
        default: ""
        description: "Dispatch-only single-job selector (set by ci-dispatch.yml). When non-empty, only the job whose id equals this value runs; every other selectable job skips via the composed `inputs.job == '' || inputs.job == '<id>'` guard. Empty default — every push/PR/wrapper call passes nothing — so the `inputs.job == ''` disjunct is true for every job and all jobs run exactly as before. The dispatch enum is fixed to the 13 dispatch-meaningful jobs; see ci-dispatch.yml for the list and the ci-ok / lint-api-breakage / lint-pr-title exclusions."
      ref:
        type: string
        default: ""
        description: "Dispatch-only target ref (set by ci-dispatch.yml). Selects the branch/tag/SHA of `target-repo` to build. Threaded into the `ref:` field of the target checkouts only. It never reaches the swift-linter engine, which is no longer checked out or built here at all: the `swift-linter` job installs the published, checksum-verified `ci-binaries` release (#137). Empty default — every push/PR/wrapper call passes nothing — so `actions/checkout` resolves the TRIGGERING ref (github.ref/SHA, i.e. the pushed branch), bit-identical to the pre-dispatch implicit-default checkout. See ci-dispatch.yml."
      embedded-target:
        type: string
        default: ""
        description: "Optional target to build for Embedded, consulted only by the `embedded` job (`lint-bundle == 'primitives'`). Empty preserves the full-package Embedded build. For a selected target, the job evaluates the package manifest and disables default traits only when a `default` trait is declared; packages that declare no traits build without the inapplicable flag (swift-institute/.github#476). Relocated from the Primitives layer wrapper (swift-institute/.github#276 Task 1-03) so an existing consumer's `with: { embedded-target: ... }` keeps meaning the same thing after the wrapper forwards it here; every other layer/consumer never sets it and is unaffected."
      docs-umbrella-module:
        type: string
        default: ""
        description: "Pass-through override forwarded to the nested swift-docs.yml call's `umbrella-module` input (TX10: integrated docs are unconditional). See swift-docs.yml for the discovery default this overrides."
      docs-umbrella-display-name:
        type: string
        default: ""
        description: "Pass-through override forwarded to the nested swift-docs.yml call's `umbrella-display-name` input (TX10: integrated docs are unconditional)."
      docs-umbrella-bundle-id:
        type: string
        default: ""
        description: "Pass-through override forwarded to the nested swift-docs.yml call's `umbrella-bundle-id` input (TX10: integrated docs are unconditional)."
      docs-umbrella-docc-path:
        type: string
        default: ""
        description: "Pass-through override forwarded to the nested swift-docs.yml call's `umbrella-docc-path` input (TX10: integrated docs are unconditional)."
      docs-exclude-modules:
        type: string
        default: ""
        description: "Pass-through override forwarded to the nested swift-docs.yml call's `exclude-modules` input (TX10: integrated docs are unconditional)."
      docs-swift-version:
        type: string
        default: "6.4"
        description: "Swift toolchain version for the nested swift-docs.yml call's DocC build container (TX10: integrated docs are unconditional). Independent of this workflow's own `swift-version` input (a Linux-container axis for the release/nightly legs) — mirrors swift-docs.yml's own default so an integrated caller that never overrides either stays in lockstep with the standalone wrapper path."
    secrets:
      PRIVATE_REPO_TOKEN:
        required: false
        description: |
          Legacy github.com-wide fallback credential for private-dep
          clones. Superseded by the App-token path; retained for orgs
          not yet provisioned with the App secrets.
      SWIFT_INSTITUTE_BOT_APP_CLIENT_ID:
        required: false
        description: |
          swift-institute-bot App client ID (org-level secret). With the
          private key, lets configure-private-repos mint per-job
          contents:read installation tokens for the layer orgs so
          `swift package resolve` can clone private intra-Institute deps.
      SWIFT_INSTITUTE_BOT_APP_ID:
        required: false
        description: |
          Legacy-era App ID secret name carried by some orgs (e.g.
          swift-primitives; numeric App ID value class). Accepted as
          fallback when _APP_CLIENT_ID is absent; configure-private-repos
          routes it into create-github-app-token's `client-id` input,
          never the deprecated `app-id` input (#139).
      SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY:
        required: false
        description: |
          swift-institute-bot App private key (org-level secret).
          Counterpart of SWIFT_INSTITUTE_BOT_APP_CLIENT_ID.

# Tool-version pins. Centralized so a bump is one edit; these MUST track each
# tool's latest stable release.
env:
  # Sole main-nightly exception. `plan` validates all three values before
  # emitting legs; expiry is inclusive and re-ratification is a new ruling.
  # Expiry is CLASS-AWARE (ruled 2026-08-10, #488): this classifies an ADVISORY
  # leg, so past recheck the plan DESCHEDULES linux-nightly fleet-wide with a
  # typed `descheduled` record (ci-ok audits it as accounted-for) rather than
  # failing every consumer's required check. Localized forcing function: on
  # THIS repository (the exception's owner) an expired exception still fails
  # the plan closed. Malformed fields fail closed everywhere. The gating-class
  # ReleaseFloorException below keeps UNCONDITIONAL fail-closed expiry.
  SWIFT_MAIN_NIGHTLY_IMAGE: "swiftlang/swift@sha256:f577f95edfb85cf3bdc45eb0badaab09239de5c86c69b3b6d594cc62916c0a7d"
  SWIFT_MAIN_NIGHTLY_UPSTREAM_ISSUE: "https://github.com/swiftlang/swift/issues/90275"
  SWIFT_MAIN_NIGHTLY_RECHECK: "2026-09-14"
  # Sole release-floor exception (#491). `swift:6.4` does not exist — Docker
  # Hub 404s `swift:6.4` and `swift:6.4.0` (2026-08-09, `swift:6.3` -> 200 as
  # positive control), so every caller's Linux legs died at 'Initialize
  # containers' before checkout. Until upstream publishes it, those legs run
  # the 6.4.x NIGHTLY image, digest-pinned, never a mutable tag.
  #
  # Must stay on `-noble` (Ubuntu 24.04, glibc 2.39), not `-jammy` (22.04,
  # glibc 2.35): the pinned SwiftLint 0.63.3 / swift-linter binaries need
  # GLIBC_2.38/GLIBCXX_3.4.32 and died at `--version` under jammy while the
  # build leg stayed green (#494).
  #
  # `plan` validates all three (CI.Contract.ReleaseFloorException) and emits
  # `needs.plan.outputs.linux-image`; every containerized leg binds THAT, never
  # a literal — `env.*` is unavailable at `container:` regardless ([CI-103]).
  #
  # REMOVAL: when `swift:6.4` exists, delete these three values and the four
  # `--release-floor-*`/`--swift-version` plan arguments; no `container:`, job,
  # or validator changes. Recheck may not outlive the RC/stable boundary —
  # 2026-09-09 is typed, and a later date is refused, not warned about.
  SWIFT_RELEASE_FLOOR_IMAGE: "swiftlang/swift@sha256:8d614165059587ce9dcf6727a76aeff4cbf1cde41fde9a9281a43803be736224"
  SWIFT_RELEASE_FLOOR_UPSTREAM_RELEASE: "https://github.com/swiftlang/swift/releases/tag/swift-6.4-RELEASE"
  SWIFT_RELEASE_FLOOR_RECHECK: "2026-09-09"
  SWIFTLINT_VERSION: "0.63.3"
  # [CI-082] sha256sum -c pin for swiftlint_linux_amd64.zip at SWIFTLINT_VERSION.
  # Re-lock on every version bump.
  SWIFTLINT_SHA256: "26db741d43f2f2dc26c0cf16911100a3e186c3d1dbb59e55ad3ac87b0de4538f"
  # THE fleet-wide Xcode pin — the only one. Layer wrappers MUST NOT declare
  # their own: a caller's workflow-level `env:` does not cross into a called
  # reusable, so a wrapper-side pin is inert and merely contradicts this one.
  # This pin and `macos-runner` move together, or the macOS check name
  # overstates its toolchain.
  #
  # Measured 2026-07-28, not inferred. `macos-26` tops out at Xcode 26.6
  # (= 17F113), which ships Swift 6.3.3, NOT 6.4 — so the macOS gating leg
  # cannot reach 6.4 at any pin on that image. The only hosted runner with 6.4
  # is the `xcode-27` PREVIEW label (actions/runner-images#14404), Xcode 27.0
  # BETA, probed and confirmed schedulable for this org:
  #   Apple Swift version 6.4 (swiftlang-6.4.0.25.4), Target arm64-apple-macosx26.0
  # Two traps that a local machine hides: the runner's 6.4 build (6.4.0.25.4)
  # differs from a dev seat's (6.4.0.27.1) — "Swift 6.4" is not one toolchain
  # during beta, so local-reproduces-CI is unsafe; and the target stays
  # macosx26.0 — Xcode 27 does not imply a 27 SDK deployment target.
  #
  # Do not move a fleet-wide GATE onto a beta toolchain (the failure already
  # rejected for linux-6-4: churn reddens it, and a red gate stops being read).
  # Second reason: 6.4 crashes under release + CMO (`swift-frontend` signal 6)
  # and 6.5-dev crashes identically, so it is not merely awaiting GA. That
  # class needs `-O` + whole-module, so it cannot reach these debug macOS legs,
  # but it does block the release Linux legs independently of the missing
  # `swift:6.4` container.
  #
  # BUMP: tracks the highest Xcode on `macos-runner`'s image, only that.
  # Reaches 6.4 when Xcode 27 GAs onto a stable image — the same event that
  # graduates linux-6-4 to a gating `swift:6.4` leg and retires the
  # `compiler(<6.4)` gates. Re-read the image Readme first; a version absent
  # from that table fails `xcode-select` at job start.
  #
  # TRAP: the macOS legs (macos-release, apple-simulator-build) take their
  # Swift version from THIS pin's Xcode and ignore the `swift-version` input,
  # which reaches them only through their `name:`. Raising `swift-version`'s
  # default relabels them "macOS (Swift 6.4, debug)" while they keep compiling
  # with whatever Xcode ships. The leg does not fail — it lies in the checks
  # list, visible only in its log. Move both axes together.
  XCODE_VERSION: "27.0"

jobs:
  # Tier plan (R1/R2 ruling 2026-07-20). Selects the run's tier and runs the
  # identity-conflict fast-check ONCE. Tiers:
  #   build — format + lint + swift-linter + the primary supported release leg
  #           (default; Linux unless platform-support says otherwise)
  #   full  — the complete [CI-010]/[CI-091] contract incl. advisory legs;
  #           unconditional on tags; forced by ci-sweep.yml and '[ci full]'
  # Both tiers compile. That is what `gating` carries: the subset of `legs`
  # ci-ok requires to have SUCCEEDED, and the plan refuses to emit one with no
  # build leg.
  #
  # `legs` is platform-filtered HERE, not only at each job guard, so exactly
  # one list states what is expected to run and ci-ok can compare against it —
  # two lists that must agree with nothing holding them together is this
  # repository's cheapest silent drop. Each leg's own platform clause is a
  # redundant belt: it can only remove what this filter already removed.
  #
  # ci-ok needs: plan, so a plan failure fails the run even though every leg
  # skips. Single-job dispatch bypasses plan (inputs.job != '' → plan skips;
  # each leg's job-selector disjunct still fires), preserving ci-dispatch's
  # exactly-one-job property. Every leg guard composes `!cancelled()` so a
  # SKIPPED plan doesn't auto-skip the selected leg, while a FAILED plan yields
  # empty legs → every leg skips → ci-ok red via plan in needs.
  plan:
    name: Plan (tier + identity fast-check)
    # Runs on every non-private event, dispatch included, so the CI subject is
    # resolved exactly once. Only the heavier identity-conflict/branch-pin
    # steps stay gated on `inputs.job == ''`.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    # 60: the F12 cold bootstrap (Workspace source build of institute-ci) runs
    # here on a cache miss (~30 min); warm-cache runs stay seconds.
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      legs: ${{ steps.classify.outputs.legs }}
      gating: ${{ steps.classify.outputs.gating }}
      # `leg=reason` records for legs the plan removed with a typed reason
      # (currently only linux-nightly on an expired NightlyException); empty on
      # a current-date run. ci-ok audits each named leg as accounted-for: it
      # must have skipped and can never be gating (#488).
      descheduled: ${{ steps.classify.outputs.descheduled }}
      # THE single container-image contract for the Linux legs. Every
      # containerized job here, and every nested reusable it calls with a
      # container, binds this and never an image literal — so the release-floor
      # exception has one place to live and one place to be removed (#491).
      linux-image: ${{ steps.classify.outputs.linux-image }}
      subject-repository: ${{ steps.resolve-subject.outputs.subject-repository }}
      subject-ref: ${{ steps.resolve-subject.outputs.subject-ref }}
      subject-sha: ${{ steps.resolve-subject.outputs.subject-sha }}
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # THE single subject-resolution contract (#179 regression class). Every
      # checkout in this file consumes `needs.plan.outputs.subject-repository`/
      # `subject-ref`/`subject-sha`; none may re-derive them. Previously ten
      # sites each copied a three-way fallback, and the copy here resolved
      # `target-repo` independently of `ref` — so a dispatch supplying
      # `target-repo` without `ref` checked out the TARGET repo at the
      # TRIGGERING repo's SHA, a commit that does not exist there.
      #
      # Order:
      #   target-repo set (ci-sweep/ci-dispatch; needs a live API resolution
      #     because its ref may be a name or absent):
      #       ref set   -> resolve to that repo's exact SHA; unresolvable
      #                    fails closed, never defaults.
      #       ref empty -> that repo's live default branch head. NEVER the
      #                    triggering repo's SHA.
      #   pull_request -> the exact PR head repo/SHA (fork-safe: every job
      #                   stays read-only against exactly that head).
      #   otherwise    -> triggering repo and event SHA.
      #
      # Runs unconditionally (dispatch included) so every consumer has one
      # resolved subject. `subject-ref` and `subject-sha` hold the identical
      # 40-char SHA; two names so a `ref:` field and an identity comparison
      # each read it under the name matching their role.
      - name: Resolve CI subject
        id: resolve-subject
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET_REPOSITORY: ${{ inputs.target-repo }}
          INPUT_REF: ${{ inputs.ref }}
          PULL_REQUEST_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRIGGER_REPOSITORY: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TARGET_REPOSITORY" ]; then
            SUBJECT_REPOSITORY="$INPUT_TARGET_REPOSITORY"
            if [ -n "$INPUT_REF" ]; then
              RESOLVE_REF="$INPUT_REF"
            else
              RESOLVE_REF="$(gh api "repos/${SUBJECT_REPOSITORY}" --jq '.default_branch' 2>/dev/null || true)"
              if [ -z "$RESOLVE_REF" ]; then
                echo "::error::could not read the default branch of target repository '${SUBJECT_REPOSITORY}'; refusing to attest an unspecified revision."
                exit 1
              fi
            fi
            SUBJECT_SHA="$(gh api "repos/${SUBJECT_REPOSITORY}/commits/${RESOLVE_REF}" --jq '.sha' 2>/dev/null || true)"
            if [ -z "$SUBJECT_SHA" ]; then
              echo "::error::could not resolve ref '${RESOLVE_REF}' of target repository '${SUBJECT_REPOSITORY}' to a commit SHA; refusing to attest an unspecified revision."
              exit 1
            fi
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            SUBJECT_REPOSITORY="$PULL_REQUEST_HEAD_REPOSITORY"
            SUBJECT_SHA="$PULL_REQUEST_HEAD_SHA"
          else
            SUBJECT_REPOSITORY="$TRIGGER_REPOSITORY"
            SUBJECT_SHA="$TRIGGER_SHA"
          fi
          if [ -z "$SUBJECT_REPOSITORY" ] || [ -z "$SUBJECT_SHA" ]; then
            echo "::error::CI subject repository/SHA is empty; refusing to attest an unspecified revision."
            exit 1
          fi
          if ! [[ "$SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::resolved CI subject SHA '${SUBJECT_SHA}' for '${SUBJECT_REPOSITORY}' is not a 40-character commit SHA; refusing to attest an unspecified revision."
            exit 1
          fi
          echo "subject-repository=$SUBJECT_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "subject-ref=$SUBJECT_SHA" >> "$GITHUB_OUTPUT"
          echo "subject-sha=$SUBJECT_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved CI subject: ${SUBJECT_REPOSITORY}@${SUBJECT_SHA}"

      # The remaining Plan steps feed only the identity-conflict and branch-pin
      # guards. Dispatch deliberately bypasses both — a debug repro of one
      # already-broken leg must not be newly blocked by an unrelated finding in
      # the same target — hence `inputs.job == ''`.
      - name: Checkout subject
        if: ${{ inputs.job == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.resolve-subject.outputs.subject-repository }}
          ref: ${{ steps.resolve-subject.outputs.subject-ref }}
          persist-credentials: false

      - name: Verify checked-out subject HEAD
        if: ${{ inputs.job == '' }}
        shell: bash
        env:
          SUBJECT_SHA: ${{ steps.resolve-subject.outputs.subject-sha }}
        run: |
          set -euo pipefail
          # Job-level `container:` steps execute via a fresh `docker exec`
          # per step, so a bare shell `git` call sees the checkout owned by
          # the runner's host UID and refuses it as dubious ownership
          # (2.35.2+) — unlike actions/checkout's own internal git calls two
          # steps up, which already registered the path for themselves. A
          # no-op on bare macOS/Windows runners; trusts nothing beyond what
          # actions/checkout just placed in this same job.
          git config --global --add safe.directory '*'
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$SUBJECT_SHA" ]; then
            echo "::error::checked-out HEAD '$ACTUAL' does not match Plan's resolved CI subject SHA '$SUBJECT_SHA'. Refusing to proceed against an unverified checkout."
            exit 1
          fi

      # Identity-conflict fast-check ([PKG-DEP-009]): fails in <1s naming the
      # exact edge when this repo's manifests spell one identity two ways — the
      # org-drift class that otherwise hangs SwiftPM 6.2/6.3 until
      # timeout-minutes fires. Runs ONCE for the whole run; plan sits in
      # ci-ok's needs so a conflict still fails it.
      #
      # Vendored via checkout, not curl, so the executed script rides the same
      # trust anchor as every other `uses:` into this repo — no unpinned
      # run-time code fetch. `ref: job.workflow_sha` anchors it to the exact
      # commit of THIS workflow (the called reusable, not the caller), so the
      # script cannot differ from the revision that invoked it.
      #
      # This checkout and the F12 chains below are UNGATED (#506): the
      # "Classify tier" step consuming the institute-ci binary runs on every
      # event, dispatch included, whose Linux legs bind
      # `needs.plan.outputs.linux-image`. Gating the bootstrap while Classify
      # stayed ungated failed every dispatch with exit 127. The fast-check,
      # branch-pin guard, and subject checkout keep their dispatch bypasses —
      # those are checks a debug repro skips; the planner binary is not.
      - name: Checkout CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          ref: ${{ job.workflow_sha }}
          path: .ci-scripts
      # The fast-check below drops .ci-scripts before scanning, so stash the
      # Institute CI sources first — same trust anchor, no extra checkout. The
      # identity is the git tree OID of Tools/institute-ci: exact content
      # identity that does not churn on unrelated commits. A non-40-hex OID
      # refuses fail-closed rather than minting a malformed cache key.
      - name: Institute CI source identity
        id: institute-ci-identity
        shell: bash
        run: |
          set -euo pipefail
          SOURCES_TREE="$(git -C "${GITHUB_WORKSPACE}/.ci-scripts" rev-parse "HEAD:Tools/institute-ci")"
          [[ "$SOURCES_TREE" =~ ^[0-9a-f]{40}$ ]] || { echo "refusing malformed Institute CI tree OID: '$SOURCES_TREE'" >&2; exit 1; }
          cp -R "${GITHUB_WORKSPACE}/.ci-scripts/Tools/institute-ci" "${RUNNER_TEMP}/institute-ci-sources"
          echo "sources-tree=$SOURCES_TREE" >> "$GITHUB_OUTPUT"
      - name: Identity-conflict fast-check
        if: ${{ inputs.job == '' }}
        shell: bash
        run: |
          command -v python3 >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -qq -y python3; }
          # Move the scripts out and drop the checkout BEFORE scanning, so the
          # scripts repo's own files (incl. test fixtures) are never scanned.
          # The branch-pin guard's assets ride the same trust anchor.
          cp "${GITHUB_WORKSPACE}/.ci-scripts/.github/scripts/ci-identity-conflict-fastcheck.py" "${RUNNER_TEMP}/fastcheck.py"
          cp "${GITHUB_WORKSPACE}/.ci-scripts/.github/scripts/validate-branch-pins.py" "${RUNNER_TEMP}/branch-pins.py"
          cp "${GITHUB_WORKSPACE}/.ci-scripts/.github/scripts/.branch-pin-baseline" "${RUNNER_TEMP}/branch-pin-baseline"
          cp "${GITHUB_WORKSPACE}/.ci-scripts/.github/actions/read-orgs/orgs.yaml" "${RUNNER_TEMP}/orgs.yaml"
          rm -rf "${GITHUB_WORKSPACE}/.ci-scripts"
          python3 "${RUNNER_TEMP}/fastcheck.py" "${GITHUB_WORKSPACE}"

      # Branch-pin guard ([BRANCH-PIN-001], #75): rejects NEWLY introduced
      # branch-pinned Institute dependencies fleet-wide with zero caller edits.
      # Existing pins live in the shrink-only baseline vendored above; a
      # declaration absent from it fails the run in <1s, before any toolchain
      # is installed. Same vendored trust anchor as the fast-check. Failing
      # controls: `CI.Validation.BranchPins Tests` plus the branch-pin-001
      # fixture ladder.
      #
      # TYPED, PERMANENT Swift-purity exception (#358, home #404). The Swift
      # owner `CI.Validation.BranchPins` serves every OTHER call site; this one
      # keeps vendored Python by measurement, not preference — guard <1s vs.
      # cache restore 1-3s + provenance verification 9-10s, so serving it from
      # the binary costs 11-13s warm (minutes cold) before it can refuse
      # anything. Sub-second refusal before any toolchain install IS the point
      # of the step, and the F12 bootstrap deliberately sits after it; buying
      # uniformity here would spend the property the guard exists for.
      - name: Branch-pin guard
        if: ${{ inputs.job == '' }}
        shell: bash
        env:
          # Consumes the single resolved subject; never re-derive it.
          TARGET_REPO: ${{ steps.resolve-subject.outputs.subject-repository }}
        run: |
          python3 -c 'import yaml' 2>/dev/null \
            || { sudo apt-get update -qq && sudo apt-get install -qq -y python3-yaml; }
          python3 "${RUNNER_TEMP}/branch-pins.py" "$TARGET_REPO" "${GITHUB_WORKSPACE}" \
            --orgs-file "${RUNNER_TEMP}/orgs.yaml" \
            --baseline "${RUNNER_TEMP}/branch-pin-baseline"

      # F12 Institute CI bootstrap (#358). Plan and ci-ok decisions execute in
      # the Swift owner (institute-ci), built at exact sources through the
      # sanctioned Workspace coordinate. The cache is ACCELERATION ONLY: every
      # restored entry is provenance-verified by `bootstrap-verify` before any
      # trust, and corrupt or wrong-identity entries refuse fail-closed.
      # Cache-key transport is the raw identity tuple (each component an exact
      # 40-hex revision or frozen literal) because the witness digest is
      # computed by institute-ci itself and cannot exist before the binary does
      # on a cold consumer; that digest is still minted into and verified
      # against the entry manifest. Typed deviation on #390.
      - name: Restore Institute CI (exact key, acceleration only)
        id: institute-ci-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .institute-ci-entry
          key: institute-ci-${{ steps.institute-ci-identity.outputs.sources-tree }}-72d4b2ae1e5b6a2b49fc22e0240dad0a34a9618f-linux-x86_64-swift-6.3-static
      - name: Swift toolchain (cold bootstrap only)
        if: ${{ steps.institute-ci-restore.outputs.cache-hit != 'true' }}
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9  # v1.14.0
        with:
          swift-version: "6.3"
      - name: Checkout Workspace at exact main pin (cold bootstrap only)
        if: ${{ steps.institute-ci-restore.outputs.cache-hit != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/institute-application
          # Advance with pin-advance flow; must stay a full SHA (branch-pin guard).
          ref: 72d4b2ae1e5b6a2b49fc22e0240dad0a34a9618f
          path: .workspace
          persist-credentials: false
      - name: Cold bootstrap through the sanctioned Workspace coordinate
        if: ${{ steps.institute-ci-restore.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          SOURCES_TREE: ${{ steps.institute-ci-identity.outputs.sources-tree }}
        run: |
          set -euo pipefail
          # uuid-dev: the typed F2/F10 provisioning input (swift-linux-standard's
          # CLinuxKernelShim includes uuid/uuid.h); absent on the bare runner.
          sudo apt-get update -qq && sudo apt-get install -qq -y uuid-dev
          # TX-APP1Z: institute-application's Swift package moved from Application/ to
          # the repository root. This checkout is pinned to a caller-supplied or
          # hard-pinned revision, so it must build either layout. The probe retires
          # once every pin in the fleet is post-flatten.


          workspace_package_path=.workspace
          if [ -f .workspace/Application/Package.swift ]; then
            workspace_package_path=.workspace/Application
          fi
          swift run --package-path "$workspace_package_path" institute package build --package-path "${RUNNER_TEMP}/institute-ci-sources" --argument=--static-swift-stdlib
          mkdir -p .institute-ci-entry/bin
          cp "$(find "${RUNNER_TEMP}/institute-ci-sources/.build" -name institute-ci -type f -perm /111 | head -1)" .institute-ci-entry/bin/institute-ci
          .institute-ci-entry/bin/institute-ci bootstrap-manifest --workspace-revision 72d4b2ae1e5b6a2b49fc22e0240dad0a34a9618f --sources-revision "$SOURCES_TREE" --toolchain swift-6.3 --os linux --arch x86_64 --provisioning uuid-dev,static-swift-stdlib --root .institute-ci-entry --executables bin/institute-ci --producer-run "$GITHUB_RUN_ID" > .institute-ci-entry/manifest.json
      - name: Save Institute CI cache entry (cold bootstrap only)
        if: ${{ steps.institute-ci-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .institute-ci-entry
          key: institute-ci-${{ steps.institute-ci-identity.outputs.sources-tree }}-72d4b2ae1e5b6a2b49fc22e0240dad0a34a9618f-linux-x86_64-swift-6.3-static
      - name: Verify Institute CI provenance before trust (fail closed)
        shell: bash
        env:
          SOURCES_TREE: ${{ steps.institute-ci-identity.outputs.sources-tree }}
        run: |
          set -euo pipefail
          .institute-ci-entry/bin/institute-ci bootstrap-verify --workspace-revision 72d4b2ae1e5b6a2b49fc22e0240dad0a34a9618f --sources-revision "$SOURCES_TREE" --toolchain swift-6.3 --os linux --arch x86_64 --provisioning uuid-dev,static-swift-stdlib --root .institute-ci-entry --manifest .institute-ci-entry/manifest.json
      # tier/leg/gating selection is CI.Contract.Plan in institute-ci,
      # differentially proven against the retired shell (SWIFT-NATIVE-PROGRAMME/
      # shadow-parity.json at 2c74d326). One deliberate tightening: an unknown
      # forced tier refuses up front even on refs/heads/main, where the shell
      # rewrote it to `full` before validating. The jq below is typed output
      # mapping, not policy.
      - name: Classify tier
        id: classify
        shell: bash
        env:
          FORCED_TIER: ${{ inputs.tier }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          PLATFORM_SUPPORT: ${{ inputs.platform-support }}
          LINT_BUNDLE: ${{ inputs.lint-bundle }}
          SWIFT_VERSION: ${{ inputs.swift-version }}
          SUBJECT_REPOSITORY: ${{ steps.resolve-subject.outputs.subject-repository }}
        run: |
          set -euo pipefail
          PLAN_JSON="$(.institute-ci-entry/bin/institute-ci plan --tier "$FORCED_TIER" --ref "$GITHUB_REF" --head-message "$HEAD_MSG" --event "$EVENT_NAME" --platform-support "$PLATFORM_SUPPORT" --lint-bundle "$LINT_BUNDLE" --subject-repository "$SUBJECT_REPOSITORY" --nightly-main-image "$SWIFT_MAIN_NIGHTLY_IMAGE" --nightly-main-upstream-issue "$SWIFT_MAIN_NIGHTLY_UPSTREAM_ISSUE" --nightly-main-recheck "$SWIFT_MAIN_NIGHTLY_RECHECK" --swift-version "$SWIFT_VERSION" --release-floor-image "$SWIFT_RELEASE_FLOOR_IMAGE" --release-floor-upstream-release "$SWIFT_RELEASE_FLOOR_UPSTREAM_RELEASE" --release-floor-recheck "$SWIFT_RELEASE_FLOOR_RECHECK" --today "$(date -u +%F)")"
          TIER="$(jq -r '.tier' <<< "$PLAN_JSON")"
          LEGS="$(jq -r '.legs' <<< "$PLAN_JSON")"
          GATING="$(jq -r '.gating' <<< "$PLAN_JSON")"
          LINUX_IMAGE="$(jq -r '."linux-image"' <<< "$PLAN_JSON")"
          DESCHEDULED="$(jq -r '.descheduled' <<< "$PLAN_JSON")"
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
          echo "legs=$LEGS" >> "$GITHUB_OUTPUT"
          echo "gating=$GATING" >> "$GITHUB_OUTPUT"
          echo "linux-image=$LINUX_IMAGE" >> "$GITHUB_OUTPUT"
          echo "descheduled=$DESCHEDULED" >> "$GITHUB_OUTPUT"
          echo "Selected tier: $TIER"
          echo "legs: $LEGS"
          echo "gating: $GATING"
          echo "linux image: $LINUX_IMAGE"
          echo "descheduled: ${DESCHEDULED:-none}"
          {
            echo "## CI tier: \`$TIER\` (planned by institute-ci)"
            echo ""
            echo "Selected legs: \`$LEGS\`"
            echo ""
            echo "Gating: \`$GATING\`. \`ci-ok\` attests the SELECTED tier and names it — a gating leg that is skipped without appearing here fails the run (2026-07-28)."
            if [ -n "$DESCHEDULED" ]; then
              echo ""
              echo "> [!WARNING]"
              echo "> Descheduled with reason: \`$DESCHEDULED\` — an advisory-leg exception has EXPIRED (#488 semantics). The leg is not running fleet-wide until the exception is re-ratified in swift-institute/.github, whose own plan is failing closed on this expiry."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  macos-release:
    name: macOS (Swift ${{ inputs.swift-version }}, debug)
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'macos-release' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',macos-release,'))) && (inputs.platform-support == '' || contains(format(',{0},', inputs.platform-support), ',apple,')) }}
    runs-on: ${{ inputs.macos-runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          ref: ${{ needs.plan.outputs.subject-ref }}
          persist-credentials: false

      - name: Verify checked-out subject HEAD
        shell: bash
        env:
          SUBJECT_SHA: ${{ needs.plan.outputs.subject-sha }}
        run: |
          set -euo pipefail
          # Job-level `container:` steps execute via a fresh `docker exec`
          # per step, so a bare shell `git` call sees the checkout owned by
          # the runner's host UID and refuses it as dubious ownership
          # (2.35.2+) — unlike actions/checkout's own internal git calls two
          # steps up, which already registered the path for themselves. A
          # no-op on bare macOS/Windows runners; trusts nothing beyond what
          # actions/checkout just placed in this same job.
          git config --global --add safe.directory '*'
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$SUBJECT_SHA" ]; then
            echo "::error::checked-out HEAD '$ACTUAL' does not match Plan's resolved CI subject SHA '$SUBJECT_SHA'. Refusing to proceed against an unverified checkout."
            exit 1
          fi

      - uses: swift-institute/.github/.github/actions/configure-private-repos@d1af72d05bf8262fb3918a2f1607b82fafcafdf9  # main 2026-08-03 (pin-advance)
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          app-client-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
          app-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_ID }}
          app-private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          enabled: ${{ inputs.enable-private-repos }}

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Print toolchain info
        run: |
          swift --version
          echo "Runner image: ${{ runner.os }} on ${{ inputs.macos-runner }}"
          echo "Xcode: $(xcode-select -p)"

      - name: Test
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          # [swift-institute/.github#165] A root-shape `swift test` over the
          # sanctioned nested-test-package layout (Tests/Package.swift, which
          # reaches the parent via `.package(path: "..")`) finds zero tests at
          # the root and exits green without ever running them. Detect the
          # nested layout and run the nested package's tests instead so the
          # gate is non-vacuous. (POSIX sh — no bash arrays: some legs run
          # inside a container image where `sh` is the default step shell.)
          if [ -f Tests/Package.swift ]; then
            echo "Nested test package detected (Tests/Package.swift); running tests from Tests/"
            cd Tests
          fi
          if [ -n "$TEST_FILTER" ]; then
            FILTER=$(echo "$TEST_FILTER" | tr '-' '_')
            swift test -c debug --filter "$FILTER"
          else
            swift test -c debug
          fi

