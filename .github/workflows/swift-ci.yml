  # needs, listed in advisory-summary. continue-on-error is valid at job level
  # here because this is a runs-on job, not a `uses:` job ([CI-105]). At 6.4 GA
  # (~Sept 2026) this graduates to a gating `swift:6.4` stable leg, retiring the
  # `compiler(<6.4)` §A9 gates (swift-xml / swift-w3c-xml / swift-graph / swift-plist).
  #
  # ON THE BUILD TIER SINCE 2026-07-28, AND DELIBERATELY STILL ADVISORY.
  # It runs on every ordinary push so 6.4 breakage shows up continuously
  # rather than once a week in the sweep — but it must not gate, because the
  # container is a NIGHTLY: a repository can go green→red with no commit
  # between the two. That is accepted, not broken. Do not go hunting for the
  # change that caused such a red; there may not be one. Anyone tempted to
  # drop `continue-on-error` here should read the cost first — see below.
