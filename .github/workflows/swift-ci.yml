      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          ref: ${{ needs.plan.outputs.subject-ref }}
          persist-credentials: false

      - name: Verify checked-out subject HEAD
        shell: bash
        env:
          SUBJECT_SHA: ${{ needs.plan.outputs.subject-sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$SUBJECT_SHA" ]; then
            echo "::error::checked-out HEAD '$ACTUAL' does not match Plan's resolved CI subject SHA '$SUBJECT_SHA'. Refusing to proceed against an unverified checkout."
            exit 1
          fi

      - uses: swift-institute/.github/.github/actions/configure-private-repos@d1af72d05bf8262fb3918a2f1607b82fafcafdf9  # main 2026-08-03, pin normalized to the deliberately advanced full SHA (TX7, swift-institute/.github#276); action blobs identical at both commits
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          app-client-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
          app-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_ID }}
          app-private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          enabled: ${{ inputs.enable-private-repos }}

      - name: Print Swift version
        run: swift --version

      - name: Install Android SDK matching container Swift
        id: install
        uses: swift-institute/.github/.github/actions/install-swift-sdk@b4246ad5ee6ff39e6ad413a852c86d8311a83be8  # TX7 self-referential pin advance (swift-institute/.github#497 landing 1, PR #500, merged to main): merge SHA on main declares `skip-on-missing-release` input + `installed` output (verified)
        with:
          platform: android-sdk
          bundle-suffix: android
          sdk-id: ${TAG}_android
          output-env-var: ANDROID_SDK_ID
          # #497: the floor's Linux legs may run a pre-release nightly
          # (ReleaseFloorException) and swift.org publishes no SDK bundles for
          # nightlies — skip cleanly rather than red when no release matches.
          skip-on-missing-release: 'true'

      - name: Build (Android)
        id: build
        if: steps.install.outputs.installed == 'true'
        run: swift build --swift-sdk "${ANDROID_SDK_ID}"

  static-linux-musl-build:
    name: Ubuntu (Swift 6.3, Static Linux musl build)
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'static-linux-musl-build' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',static-linux-musl-build,'))) }}
    runs-on: ubuntu-latest
    container: ${{ needs.plan.outputs.linux-image }}
    continue-on-error: true     # γ-3b advisory; may remain permanently.
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      result: ${{ steps.build.outcome }}
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          ref: ${{ needs.plan.outputs.subject-ref }}
          persist-credentials: false

      - name: Verify checked-out subject HEAD
        shell: bash
        env:
          SUBJECT_SHA: ${{ needs.plan.outputs.subject-sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$SUBJECT_SHA" ]; then
            echo "::error::checked-out HEAD '$ACTUAL' does not match Plan's resolved CI subject SHA '$SUBJECT_SHA'. Refusing to proceed against an unverified checkout."
            exit 1
          fi

      - uses: swift-institute/.github/.github/actions/configure-private-repos@d1af72d05bf8262fb3918a2f1607b82fafcafdf9  # main 2026-08-03, pin normalized to the deliberately advanced full SHA (TX7, swift-institute/.github#276); action blobs identical at both commits
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          app-client-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
          app-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_ID }}
          app-private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          enabled: ${{ inputs.enable-private-repos }}

      - name: Print Swift version
        run: swift --version

      - name: Install Static Linux SDK matching container Swift
        id: install
        uses: swift-institute/.github/.github/actions/install-swift-sdk@b4246ad5ee6ff39e6ad413a852c86d8311a83be8  # TX7 self-referential pin advance (swift-institute/.github#497 landing 1, PR #500, merged to main): merge SHA on main declares `skip-on-missing-release` input + `installed` output (verified)
        with:
          platform: static-sdk
          bundle-suffix: static-linux
          use-platform-version: 'true'
          sdk-id: x86_64-swift-linux-musl
          # #497: the floor's Linux legs may run a pre-release nightly
          # (ReleaseFloorException) and swift.org publishes no SDK bundles for
          # nightlies — skip cleanly rather than red when no release matches.
          skip-on-missing-release: 'true'

      - name: Build (Static Linux musl, x86_64)
        id: build
        if: steps.install.outputs.installed == 'true'
        run: swift build --swift-sdk x86_64-swift-linux-musl

  # Ecosystem-wide quality gates. `format` and `lint` run on every consumer in
  # parallel with the matrix, reading that consumer's own `.swift-format` /
  # `.swiftlint.yml` (found by walking up from the working directory), so
  # per-package customization is preserved. Per-repo `swift-format.yml` /
  # `swiftlint.yml` workflow files are forbidden ([CI-031]).
  #
  # Developer contract: CI runs `swift-format lint --strict`, NOT
  # `format --in-place` + auto-commit. Format locally before pushing.

  format:
    name: swift-format lint
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'format' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',format,'))) }}
    runs-on: ubuntu-latest
    container: ${{ needs.plan.outputs.linux-image }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          ref: ${{ needs.plan.outputs.subject-ref }}
          persist-credentials: false

      - name: Verify checked-out subject HEAD
        shell: bash
        env:
          SUBJECT_SHA: ${{ needs.plan.outputs.subject-sha }}
        run: |
          set -euo pipefail
          # Job-level `container:` steps execute via a fresh `docker exec`
          # per step, so a bare shell `git` call sees the checkout owned by
          # the runner's host UID and refuses it as dubious ownership
          # (2.35.2+) — unlike actions/checkout's own internal git calls two
          # steps up, which already registered the path for themselves. A
          # no-op on bare macOS/Windows runners; trusts nothing beyond what
          # actions/checkout just placed in this same job.
          git config --global --add safe.directory '*'
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$SUBJECT_SHA" ]; then
            echo "::error::checked-out HEAD '$ACTUAL' does not match Plan's resolved CI subject SHA '$SUBJECT_SHA'. Refusing to proceed against an unverified checkout."
            exit 1
          fi

      - name: Print swift-format version
        run: swift-format --version

      - name: Lint formatting (--strict)
        # Path exclusions ([Phase 1.5] 2026-05-05):
        #   *.docc/Resources/  — DocC tutorial code samples (didactic fixtures)
        #   Tests/Support/     — Test_Support fixture modules
        #   Tests/Tutorial/    — Tutorial verification tests (same didactic
        #                        code as DocC tutorials, just under Tests/)
        # Other Tests/** paths are still linted — rules like NeverForceUnwrap,
        # NeverUseForceTry, ValidateDocumentationComments remain valuable on
        # actual test code outside fixture/tutorial modules.
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find Sources Tests -name '*.swift' \
            -not -path '*/*.docc/Resources/*' \
            -not -path 'Tests/Support/*' \
            -not -path 'Tests/Tutorial/*' \
            -print0 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Swift files to lint."
            exit 0
          fi
          swift-format lint --strict --ignore-unparsable-files "${files[@]}"

  lint:
    name: SwiftLint
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'lint' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',lint,'))) }}
    runs-on: ubuntu-latest
    container: ${{ needs.plan.outputs.linux-image }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          ref: ${{ needs.plan.outputs.subject-ref }}
          persist-credentials: false

      - name: Verify checked-out subject HEAD
        shell: bash
        env:
          SUBJECT_SHA: ${{ needs.plan.outputs.subject-sha }}
        run: |
          set -euo pipefail
          # Job-level `container:` steps execute via a fresh `docker exec`
          # per step, so a bare shell `git` call sees the checkout owned by
          # the runner's host UID and refuses it as dubious ownership
          # (2.35.2+) — unlike actions/checkout's own internal git calls two
          # steps up, which already registered the path for themselves. A
          # no-op on bare macOS/Windows runners; trusts nothing beyond what
          # actions/checkout just placed in this same job.
          git config --global --add safe.directory '*'
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$SUBJECT_SHA" ]; then
            echo "::error::checked-out HEAD '$ACTUAL' does not match Plan's resolved CI subject SHA '$SUBJECT_SHA'. Refusing to proceed against an unverified checkout."
            exit 1
          fi

      # Pin swiftlint config resolution to this workflow revision (#269).
      # Consumers declare `parent_config:` as a raw.githubusercontent URL on
      # the mutable `main` ref, re-fetched every run — so two runs of the SAME
      # consumer commit can lint under different Tier 1 rule sets purely by
      # WHEN they fetched, silently reclassifying pre-existing code with the
      # SwiftLint binary pinned throughout. Because pushes and dispatches
      # straddle a central-config merge, it presented as a push-vs-dispatch
      # scope skew though nothing here conditions scope on `github.event_name`.
      #
      # Fix: vendor this workflow's OWN revision of the central `.swiftlint.yml`
      # (the `job.workflow_sha` trust anchor) and rewrite the consumer's
      # `parent_config` to that local copy before swiftlint runs, so a given
      # workflow revision always resolves one rule set.
      - name: Checkout pinned Tier 1 SwiftLint config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          ref: ${{ job.workflow_sha }}
          path: .ci-central-swiftlint-config
          sparse-checkout: |
            .swiftlint.yml
          sparse-checkout-cone-mode: false

      # Pin parent_config resolution (#269, corrected per review
      # 4850700583): the deployed chain is TWO-HOP, not one. A consumer
      # points at its ORG's Tier 2 canonical (e.g.
      # swift-standards/.github's own main .swiftlint.yml), and that Tier 2
      # file is the one that points at this Tier 1 file — the consumer
      # never references swift-institute/.github directly. Pinning only the
      # consumer's own hop (the original version of this fix) left the Tier
      # 2 hop floating, so it zero-rewrote in every repo that goes through
      # an org canonical and both hops stayed unpinned.
      #
      # This step pins BOTH hops it can identify:
      #   1. If the consumer's own parent_config already points directly at
      #      swift-institute/.github (a direct Tier 1 reference, no org
      #      canonical in between), rewrite it straight to the local pinned
      #      copy checked out above.
      #   2. Otherwise, if it points at some other org's own `.github`
      #      canonical (the Tier 2 shape), fetch that Tier 2 file ONCE via
      #      git (#509: the release-floor container ships no curl, so the
      #      former curl fetch failed as `command not found` and every
      #      Tier 2 hop floated with a warning; git is already proven
      #      present in this container by the checkout steps above, and a
      #      shallow clone makes the fetch and the resolved-commit record
      #      atomic), record the resolved org/ref/commit it actually served in
      #      the run log as an explicit, honest residual (this hop is
      #      pinned to "whatever main served at lint time", not to a fixed
      #      SHA — a real limitation, logged rather than hidden), rewrite
      #      THAT materialized copy's OWN parent_config (if it is the
      #      expected direct reference to swift-institute/.github) to the
      #      local Tier 1 pin, and repoint the consumer's parent_config at
      #      the local, rewritten Tier 2 copy.
      #   3. Any parent_config line this step cannot positively identify and
      #      pin — an unrecognized host/org shape, or a Tier 2 file whose
      #      own parent_config isn't the expected direct swift-institute/
      #      .github reference — is left untouched AND reported with a loud
      #      ::warning::, never silently left to a floating fetch without
      #      comment. A run with such a warning is evidence that a hop in
      #      that repo's chain is still time-dependent.
      - name: Pin parent_config chain to this workflow revision
        shell: bash
        run: |
          set -euo pipefail
          pinned_tier1_src="${GITHUB_WORKSPACE}/.ci-central-swiftlint-config/.swiftlint.yml"
          [ -f "$pinned_tier1_src" ] || { echo "::error::pinned Tier 1 .swiftlint.yml did not check out"; exit 1; }
          # #505: SwiftLint resolves a parent config's `included:`/`excluded:`
          # paths relative to the FILE THAT DECLARES THEM, not the child
          # config or the invocation cwd. Rewriting parent_config to a file
          # outside the consumer root (the sparse-checkout sibling dir, or
          # RUNNER_TEMP) therefore made the Tier 1 `included: [Sources,
          # Tests]` resolve against directories that don't exist, emptying
          # the include set ("No lintable files found at paths: ''").
          # Materialize every pinned config IN the consumer root so
          # Sources/ and Tests/ stay consumer-relative — same reasoning the
          # rootless branch of the Lint step already documents. The pinned
          # filenames deliberately do not match the `.swiftlint.yml` find
          # below, so they are never themselves treated as consumer configs.
          pinned_tier1="${GITHUB_WORKSPACE}/.ci-pinned-tier1.swiftlint.yml"
          cp "$pinned_tier1_src" "$pinned_tier1"
          tier1_re='^[[:space:]]*parent_config:[[:space:]]*https://raw\.githubusercontent\.com/swift-institute/\.github/([^/]+)/\.swiftlint\.yml[[:space:]]*$'
          tier2_re='^[[:space:]]*parent_config:[[:space:]]*https://raw\.githubusercontent\.com/([^/]+)/\.github/([^/]+)/\.swiftlint\.yml[[:space:]]*$'
          mapfile -d '' configs < <(find . -name '.swiftlint.yml' -not -path './.ci-central-swiftlint-config/*' -print0)
          for config in "${configs[@]}"; do
            line=$(grep -E '^[[:space:]]*parent_config:' "$config" || true)
            [ -z "$line" ] && continue
            if [[ "$line" =~ $tier1_re ]]; then
              sed -i -E "s#^([[:space:]]*parent_config:[[:space:]]*)https://raw\.githubusercontent\.com/swift-institute/\.github/[^/]+/\.swiftlint\.yml[[:space:]]*\$#\1${pinned_tier1}#" "$config"
              echo "Pinned $config: direct Tier 1 hop -> $pinned_tier1 (workflow revision ${{ job.workflow_sha }})"
            elif [[ "$line" =~ $tier2_re ]]; then
              org="${BASH_REMATCH[1]}"
              ref="${BASH_REMATCH[2]}"
              if [ "$org" = "swift-institute" ]; then
                echo "::warning::$config: parent_config org 'swift-institute' matched the Tier 2 pattern, not the Tier 1 pattern — investigate, left unpinned: $line"
                continue
              fi
              tier2_url="https://raw.githubusercontent.com/${org}/.github/${ref}/.swiftlint.yml"
              # In the consumer root, not RUNNER_TEMP — same #505 relative-
              # resolution class: a Tier 2 config declaring `included:` would
              # otherwise resolve it against RUNNER_TEMP.
              tier2_local="${GITHUB_WORKSPACE}/.ci-pinned-tier2-${org}.swiftlint.yml"
              # #509: fetch via git, not curl — the release-floor container
              # ships no curl (curl is only apt-installed later, and only on
              # a SwiftLint cache miss), so a curl fetch here failed with
              # `command not found` and floated every Tier 2 hop. git is
              # already exercised in this container by the checkout steps
              # above; a shallow clone also yields the resolved commit from
              # the same fetch instead of a second, separately-timed
              # ls-remote.
              tier2_src_dir="$(mktemp -d)"
              if ! git clone --quiet --depth 1 --branch "$ref" --no-tags "https://github.com/${org}/.github" "$tier2_src_dir"; then
                echo "::warning::$config: could not fetch Tier 2 config source ${org}/.github@${ref} (git clone failed; expected file $tier2_url) — left unpinned (floating): $line"
                rm -rf "$tier2_src_dir"
                continue
              fi
              if [ ! -f "${tier2_src_dir}/.swiftlint.yml" ]; then
                echo "::warning::$config: ${org}/.github@${ref} serves no .swiftlint.yml ($tier2_url) — left unpinned (floating): $line"
                rm -rf "$tier2_src_dir"
                continue
              fi
              cp "${tier2_src_dir}/.swiftlint.yml" "$tier2_local"
              # Record the residual honestly: this hop is fetched fresh at
              # lint time from $org/.github@$ref, resolved to whatever
              # commit that ref names right now. That commit, not a fixed
              # SHA, is what's actually pinned for the remainder of THIS
              # run (both hops rewritten below stay stable within the run);
              # a re-run later can still resolve $ref to a different commit.
              resolved_sha="$(git -C "$tier2_src_dir" rev-parse HEAD)"
              rm -rf "$tier2_src_dir"
              echo "Materialized Tier 2 config for $config: ${org}/.github@${ref} (resolved ${resolved_sha:-unknown at fetch time}) -> $tier2_local — RESIDUAL: this hop is fetched live each run, not pinned to a fixed commit."
              tier2_line=$(grep -E '^[[:space:]]*parent_config:' "$tier2_local" || true)
              if [[ "$tier2_line" =~ $tier1_re ]]; then
                sed -i -E "s#^([[:space:]]*parent_config:[[:space:]]*)https://raw\.githubusercontent\.com/swift-institute/\.github/[^/]+/\.swiftlint\.yml[[:space:]]*\$#\1${pinned_tier1}#" "$tier2_local"
                echo "Pinned $tier2_local: Tier 1 hop -> $pinned_tier1 (workflow revision ${{ job.workflow_sha }})"
              elif [ -n "$tier2_line" ]; then
                echo "::warning::$tier2_local (Tier 2 config for $org, materialized from $tier2_url): its own parent_config did not match the expected direct swift-institute/.github shape — left unpinned (floating): $tier2_line"
              fi
              sed -i -E "s#^([[:space:]]*parent_config:[[:space:]]*)https://raw\.githubusercontent\.com/${org}/\.github/[^/]+/\.swiftlint\.yml[[:space:]]*\$#\1${tier2_local}#" "$config"
              echo "Pinned $config: Tier 2 hop -> $tier2_local (materialized, see residual note above)"
            else
              echo "::warning::$config: parent_config did not match a recognized Tier 1 or Tier 2 shape — left unpinned (floating): $line"
            fi
          done
          rm -rf .ci-central-swiftlint-config/.git

      - name: Cache SwiftLint binary
        id: cache-swiftlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/swiftlint
          key: ${{ runner.os }}-swiftlint-${{ env.SWIFTLINT_VERSION }}

      - name: Install SwiftLint ${{ env.SWIFTLINT_VERSION }}
        if: steps.cache-swiftlint.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -qq -y curl unzip
          curl -fsSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${{ env.SWIFTLINT_VERSION }}/swiftlint_linux_amd64.zip"
          # [CI-082] verify against pinned SHA-256 before unpack/install. Fails
          # closed on digest mismatch (no `|| true` swallow).
          echo "${SWIFTLINT_SHA256}  /tmp/swiftlint.zip" | sha256sum -c -
          unzip -q /tmp/swiftlint.zip -d /tmp/swiftlint_extracted
          mv /tmp/swiftlint_extracted/swiftlint /usr/local/bin/
          chmod +x /usr/local/bin/swiftlint
          rm -rf /tmp/swiftlint.zip /tmp/swiftlint_extracted

      - name: Print SwiftLint version
        run: swiftlint --version

      - name: Lint
        shell: bash
        run: |
          if [ -f .swiftlint.yml ]; then
            swiftlint lint --strict --reporter github-actions-logging
          else
            # SwiftLint resolves `included:` relative to the configuration
            # file itself. Materialize the pinned policy in the consumer
            # root so Sources/ and Tests/ remain consumer-relative.
            cp "${GITHUB_WORKSPACE}/.ci-central-swiftlint-config/.swiftlint.yml" .swiftlint.yml
            mapfile -d '' files < <(find Sources Tests -type f -name '*.swift' -print0 2>/dev/null || true)
            if [ "${#files[@]}" -eq 0 ]; then
              echo '::error::rootless consumer has no Swift files under Sources/ or Tests/ to lint.'
              exit 1
            fi
            swiftlint lint "${files[@]}" \
              --strict --reporter github-actions-logging
          fi

  # swift-linter — SwiftSyntax AST linter at swift-foundations/swift-linter.
  # Architecture and phasing in
  # Research/swiftsyntax-based-custom-linter-investigation.md.
  #
  # GATING (ruling 2026-07-19): in ci-ok's needs; `--exit-policy strict` exits
  # non-zero exactly when a finding has severity `.error` — warnings are
  # emitted but never fail the run.
  #
  # PROVISIONING (#137): the linter is INSTALLED, never compiled here — the
  # checksum-sealed `ci-binaries` release, with no source-build path and no
  # per-repo tool cache. The retired from-source build let one break in the
  # tool's own dependency graph redden this leg fleet-wide. See the install
  # step for the verify-and-seal shape and the track-don't-pin decision.

  swift-linter:
    name: swift-linter
    # EVERY PACKAGE IS LINTED, `Lint.swift` or not (principal ruling). This job
    # was FILE-GATED until 2026-07-29: a consumer without a root `Lint.swift`
    # short-circuited, every lint step skipped, and the JOB still reported
    # `success`, counting as a pass in ci-ok — a vacuous green, so lint coverage
    # was a property of the Workspace CLI, not of the fleet.
    #
    # The two paths differ in ONE thing, where the rule set comes from, and must
    # not be collapsed:
    #   configured (root `Lint.swift`) → the DISPATCHER, `swift-linter <root>
    #     --exit-policy strict`.
    #   unconfigured (no `Lint.swift`) → the prebuilt STANDARD RUNNER, which
    #     bakes the published bundles and picks one from SWIFT_LINTER_BUNDLE.
    #
    # Pointing the DISPATCHER at an unconfigured package does NOT lint it: with
    # no consumer manifest it falls through to zero rules and exits 0 silently.
    # So deleting the file gate alone would swap a job that admits it skipped
    # for one that looks like it linted and did not — strictly worse. Hence the
    # runner, and hence the summary-line adjudication in the unconfigured step:
    # the runner reports `N active rules · 0 files linted · 0 violations`, rc=0,
    # on an empty directory, so "ran clean" and "measured nothing" are
    # indistinguishable from exit status alone. A run that loaded no rules or
    # linted no files fails here, loudly.
    #
    # Private-dep auth comes from the same configure-private-repos step the
    # matrix jobs use, and is still required because a consumer `Lint.swift`
    # with inline or custom rules compiles its own rule closure on the eval path.
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'swift-linter' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',swift-linter,'))) }}
    runs-on: ubuntu-latest
    container: ${{ needs.plan.outputs.linux-image }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          ref: ${{ needs.plan.outputs.subject-ref }}
          persist-credentials: false
          path: consumer

      - name: Verify checked-out subject HEAD
        shell: bash
        env:
          SUBJECT_SHA: ${{ needs.plan.outputs.subject-sha }}
        run: |
          set -euo pipefail
          # Job-level `container:` steps execute via a fresh `docker exec`
          # per step, so a bare shell `git` call sees the checkout owned by
          # the runner's host UID and refuses it as dubious ownership
          # (2.35.2+) — unlike actions/checkout's own internal git calls two
          # steps up, which already registered the path for themselves. A
          # no-op on bare macOS/Windows runners; trusts nothing beyond what
          # actions/checkout just placed in this same job.
          git config --global --add safe.directory '*'
          ACTUAL="$(git -C consumer rev-parse HEAD)"
          if [ "$ACTUAL" != "$SUBJECT_SHA" ]; then
            echo "::error::checked-out HEAD '$ACTUAL' does not match Plan's resolved CI subject SHA '$SUBJECT_SHA'. Refusing to proceed against an unverified checkout."
            exit 1
          fi

      # Classifies WHICH lint path runs, never WHETHER one does — both branches
      # lint. `lint-bundle` is validated here, before provisioning, so a bad
      # wrapper value costs seconds not a full provision. The runner rejects an
      # unknown token too: this is the fast half of a fail-closed pair.
      - name: Classify consumer configuration
        id: detect
        shell: bash
        working-directory: consumer
        run: |
          set -euo pipefail
          case "$LINT_BUNDLE" in
            primitives|standards|institute) ;;
            *)
              echo "::error::lint-bundle '$LINT_BUNDLE' is not one of primitives|standards|institute. This selects the rule set an unconfigured package is measured against; refusing to guess one."
              exit 1
              ;;
          esac
          if [ -f Lint.swift ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Found Lint.swift — linting through the dispatcher against the consumer's own rule closure."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Lint.swift at repo root — linting through the standard runner against the '$LINT_BUNDLE' bundle, the one this package's configured peers in the same layer activate."
          fi
        env:
          LINT_BUNDLE: ${{ inputs.lint-bundle }}

      # Install the published linter binaries (#137). Dispatcher + standard
      # runner from swift-linter's rolling `ci-binaries` release (built inside
      # swift:6.3, this job's image). The ONLY provisioning path — the tool is
      # never compiled in consumer repos. Verify-and-seal matches
      # activation-baseline-sweep.yml: download SHA256SUMS + MANIFEST.txt + both
      # binaries, `sha256sum --check`, require every authority entry; trust
      # anchor is GitHub TLS + release write-control ([CI-082]-class).
      #
      # The per-repo source build is gone for two measured reasons.
      # Correctness: it made every consumer compile the linter's own dependency
      # graph, so ONE upstream break reddened ~559 repositories within an hour —
      # a lint verdict must depend on consumer source and published rules, never
      # on whether an unrelated transitive dep compiles today. Cost: Actions
      # caches are REPOSITORY-scoped, so no key could amortize it across
      # consumers. Building the tool is the linter repo's own CI concern.
      #
      # TRACK, DO NOT PIN — a deliberate split from activation-baseline-sweep,
      # which pins `digest=` because its output is evidence-grade and a moved
      # release silently changes what its receipt means. THIS leg is fast-lane
      # feedback about the rules in force NOW; pinning would make every rule-pack
      # republish need a workflow commit here before ~559 repos saw it, and a pin
      # is the same failure in costume — the retired `manifest engine == engine
      # main HEAD` check was a pin to a MOVING coordinate, and it is what turned
      # a stale release into a fleet-wide fallback-to-source outage. So install
      # what the release currently publishes and refuse only CORRUPT (checksum
      # mismatch) or INCOMPLETE (missing asset, or a manifest not naming all six
      # rule authorities). A moved digest is the point, not a defect; the
      # manifest is echoed to the step summary so each verdict still states the
      # coordinate it was measured against.
      #
      # FAIL-CLOSED: no fallback, so any download or verification failure exits
      # non-zero. An unverifiable linter cannot produce a verdict, and a leg
      # that proceeded without one would be a vacuous green.
      - name: Install published linter binaries
        shell: bash
        env:
          LINTER_RELEASE: https://github.com/swift-foundations/swift-linter/releases/download/ci-binaries
        run: |
          set -euo pipefail
          command -v curl >/dev/null 2>&1 || { apt-get update -qq && apt-get install -qq -y curl ca-certificates; }
          work="$(mktemp -d)"
          for asset in SHA256SUMS MANIFEST.txt swift-linter swift-linter-runner; do
            curl --fail --silent --show-error --location --retry 2 --output "$work/$asset" "$LINTER_RELEASE/$asset"
          done
          (cd "$work" && sha256sum --check SHA256SUMS)
          # Completeness, not currency. A release whose manifest omits an
          # authority is one whose rule provenance cannot be stated, and an
          # unstateable coordinate is refused even though it might lint fine.
          for authority in engine swift-primitives-linter-rules swift-standards-linter-rules swift-institute-linter-rules swift-linter-rules swift-linter-primitives; do
            grep --quiet "^${authority}=[0-9a-f]\{40\}$" "$work/MANIFEST.txt" || {
              echo "::error::The ci-binaries manifest omits '$authority'. Refusing to lint with a linter whose rule provenance cannot be stated."
              exit 1
            }
          done
          install -m 0755 "$work/swift-linter" /usr/local/bin/swift-linter
          install -m 0755 "$work/swift-linter-runner" /usr/local/bin/swift-linter-runner
          {
            echo "### swift-linter provisioning"
            echo ""
            echo "Installed the verified \`ci-binaries\` release (checksum-checked; no source build)."
            echo ""
            echo '```'
            cat "$work/MANIFEST.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Published binaries installed. Build manifest:"
          cat "$work/MANIFEST.txt"
          # Read by "Advise on ci-binaries staleness" below (#138). The step
          # runs in its own shell, so the path travels via GITHUB_ENV rather
          # than a bash variable.
          echo "CI_BINARIES_MANIFEST=$work/MANIFEST.txt" >> "$GITHUB_ENV"

      # Advise on ci-binaries staleness (#138, non-gating). Install verifies the
      # release is CORRECT (checksum, completeness) but says nothing about
      # CURRENCY, and #137 retired the identity check that used to catch it.
      # This restores staleness visibility WITHOUT that failure mode: every exit
      # path is 0 and `continue-on-error` backstops the step, so nothing here
      # can affect ci-ok or any leg's verdict.
      #
      # Threshold ruled 2026-07-31 (#138): AGE-based, 72h — fires when
      # engine-main HEAD's commit timestamp exceeds the manifest `engine=`
      # commit's by more than that. Commit-distance was rejected: more API
      # calls, more volatile, no added signal (a burst of small commits is not
      # "more stale" than one large one), while age tolerates weekend republish
      # gaps and still catches publishes silently failing for days.
      #
      # ONE engine-repo API read: `compare` returns both endpoints' metadata in
      # one response — manifest `engine=` as `base_commit`, engine-main HEAD as
      # the last of `commits` (empty = zero staleness). Authenticated with this
      # job's GITHUB_TOKEN so ~559 consumers pushing don't share the 60 req/hr
      # unauthenticated cap.
      - name: Advise on ci-binaries staleness (non-gating)
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENGINE_REPO: swift-foundations/swift-linter
          STALENESS_THRESHOLD_HOURS: "72"
        run: |
          set -uo pipefail

          skip() {
            echo "::warning::ci-binaries staleness advisory skipped: $1"
            exit 0
          }

          [ -n "${CI_BINARIES_MANIFEST:-}" ] && [ -f "$CI_BINARIES_MANIFEST" ] \
            || skip "no manifest path recorded by the install step."

          ENGINE_SHA="$(grep '^engine=' "$CI_BINARIES_MANIFEST" | cut -d= -f2)"
          [ -n "$ENGINE_SHA" ] || skip "manifest has no 'engine=' entry."

          command -v jq >/dev/null 2>&1 \
            || { apt-get update -qq && apt-get install -qq -y jq; } >/dev/null 2>&1 \
            || true
          command -v jq >/dev/null 2>&1 || skip "jq unavailable and could not be installed."

          RESP="$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${ENGINE_REPO}/compare/${ENGINE_SHA}...main")" \
            || skip "the engine-repo compare API read failed."

          ENGINE_DATE="$(jq -r '.base_commit.commit.committer.date // empty' <<<"$RESP")"
          HEAD_DATE="$(jq -r '.commits[-1].commit.committer.date // .base_commit.commit.committer.date // empty' <<<"$RESP")"
          [ -n "$ENGINE_DATE" ] && [ -n "$HEAD_DATE" ] \
            || skip "the compare response is missing commit timestamps."

          ENGINE_EPOCH="$(date -u -d "$ENGINE_DATE" +%s 2>/dev/null || true)"
          HEAD_EPOCH="$(date -u -d "$HEAD_DATE" +%s 2>/dev/null || true)"
          [[ "$ENGINE_EPOCH" =~ ^[0-9]+$ ]] && [[ "$HEAD_EPOCH" =~ ^[0-9]+$ ]] \
            || skip "could not parse commit timestamps ('$ENGINE_DATE', '$HEAD_DATE')."

          AGE_HOURS=$(( (HEAD_EPOCH - ENGINE_EPOCH) / 3600 ))
          {
            echo "### ci-binaries staleness advisory (non-gating, #138)"
            echo ""
            echo "- Installed manifest \`engine=\` commit: \`${ENGINE_SHA}\` (${ENGINE_DATE})"
            echo "- \`${ENGINE_REPO}\`@main HEAD commit timestamp: ${HEAD_DATE}"
            echo "- Age: ${AGE_HOURS}h (threshold: ${STALENESS_THRESHOLD_HOURS}h, ruled on #138)"
            echo ""
            if [ "$AGE_HOURS" -gt "$STALENESS_THRESHOLD_HOURS" ]; then
              echo "**Advisory: the installed \`ci-binaries\` release is more than ${STALENESS_THRESHOLD_HOURS}h behind engine main.** This does not affect the leg's verdict — it only makes staleness observable."
            else
              echo "Within threshold — no staleness advisory."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$AGE_HOURS" -gt "$STALENESS_THRESHOLD_HOURS" ]; then
            echo "::warning::ci-binaries release is ${AGE_HOURS}h behind ${ENGINE_REPO}@main (threshold ${STALENESS_THRESHOLD_HOURS}h, non-gating, #138)."
          fi

      - name: Configure private-dep access
        uses: swift-institute/.github/.github/actions/configure-private-repos@d1af72d05bf8262fb3918a2f1607b82fafcafdf9  # main 2026-08-03 (pin-advance)
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          app-client-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
          app-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_ID }}
          app-private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          enabled: ${{ inputs.enable-private-repos }}

      # swift-linter's dependency graph pulls swift-linux-standard, whose
      # CLinuxKernelShim #includes <uuid/uuid.h> — absent from the minimal
      # swift:N image ([CI-092]). Still required after #137 retired the
      # per-repo tool build: the Lint.swift eval-project build compiles that
      # graph whenever a consumer declares inline or custom rules.
      - name: Install system libraries (libuuid)
        run: apt-get update -qq && apt-get install -qq -y uuid-dev

      - name: Run swift-linter (consumer Lint.swift)
        if: ${{ steps.detect.outputs.present == 'true' }}
        # The dispatcher binary references the engine by branch:"main" (Phase 0)
        # — NO SWIFT_LINTER_PATH — so it dispatches without an engine source tree.
        # SWIFT_LINTER_RUNNER provisions the fast path: a bare-`Bundle.primitives`
        # consumer is linted by the prebuilt runner (~0.65s warm); any inline/
        # custom-rule consumer falls through to the eval path, which compiles the
        # consumer's declared rule packs + the engine `Linter` library exactly as
        # before (private-dep auth configured above; libuuid present).
        #
        # ADJUDICATION. A strict exit status only reports findings; it does not
        # prove the configured rule set loaded or matched source. Apply the same
        # no-summary / zero-rules / zero-files rejection as the layer-default
        # runner, so a configured `Lint.swift` cannot green over no measurement.
        shell: bash   # PIPESTATUS + the swift:N container's default shell is dash
        env:
          SWIFT_LINTER_RUNNER: /usr/local/bin/swift-linter-runner
        run: |
          set -uo pipefail
          OUT="$(mktemp)"
          swift-linter "$GITHUB_WORKSPACE/consumer" --exit-policy strict 2>&1 | tee "$OUT"
          RC=${PIPESTATUS[0]}

          SUMMARY="$(grep -E '[0-9]+ active rules' "$OUT" | tail -1)"
          if [ -z "$SUMMARY" ]; then
            echo "::error::swift-linter emitted no run summary. Nothing was measured, so this run establishes nothing — it is not a pass. (Lint.swift, exit status: $RC)"
            exit 1
          fi
          RULES="$(sed -n 's/^[^0-9]*\([0-9][0-9]*\) active rules.*/\1/p' <<< "$SUMMARY")"
          FILES="$(sed -n 's/.*[^0-9]\([0-9][0-9]*\) files linted.*/\1/p' <<< "$SUMMARY")"
          if [ "${RULES:-0}" -eq 0 ]; then
            echo "::error::swift-linter loaded 0 rules from Lint.swift. Nothing could have been found, so a clean result here would be a lie."
            exit 1
          fi
          if [ "${FILES:-0}" -eq 0 ]; then
            echo "::error::swift-linter linted 0 files. The rule set loaded but matched no source — a clean verdict would be reporting on an empty population."
            exit 1
          fi
          {
            echo "### swift-linter (Lint.swift)"
            echo ""
            echo "Linted using this package's configured rule set."
            echo ""
            echo "\`\`\`"
            echo "$SUMMARY"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

      # The unconfigured path. Straight to the prebuilt standard runner — the
      # dispatcher cannot lint this package (see the job header: no consumer
      # manifest → zero rules → silent rc=0).
      #
      # The runner's argument vector is lint targets and NOTHING else, so a
      # `--exit-policy` flag there would be read as a path. Both the bundle and
      # the policy therefore ride environment channels. This is the same pair
      # Workspace drives, so a package's CI verdict and its `institute lint`
      # verdict come from one mechanism rather than two that can drift.
      #
      # SWIFT_LINTER_BUNDLE must be set explicitly on every invocation: the
      # runner falls back to `primitives` when the channel is UNSET (measured
      # 2026-07-29 — an unset channel lints a foundations package against 96
      # rules instead of 93, silently). `inputs.lint-bundle` has a non-empty
      # default and is validated in the classify step, so the channel is never
      # empty here; the runner rejects an invalid value even if it were.
      #
      # ADJUDICATION. The exit status alone cannot distinguish "ran clean" from
      # "measured nothing": handed an empty directory the runner prints
      # `93 active rules · 0 files linted · 0 violations` and exits 0. So the
      # summary line is parsed and three conditions fail the job — no summary
      # at all (never configured), zero active rules (nothing could have been
      # found), zero files linted (a clean verdict over an empty population).
      # These are the three UNMEASURED conditions Workspace's adjudicator
      # applies; a ruleless run must be loud here exactly as it is there.
      - name: Run swift-linter (layer default bundle)
        if: ${{ steps.detect.outputs.present != 'true' }}
        shell: bash   # PIPESTATUS + the swift:N container's default shell is dash
        env:
          SWIFT_LINTER_BUNDLE: ${{ inputs.lint-bundle }}
          SWIFT_LINTER_EXIT_POLICY: strict
        run: |
          set -uo pipefail
          OUT="$(mktemp)"
          swift-linter-runner "$GITHUB_WORKSPACE/consumer" 2>&1 | tee "$OUT"
          RC=${PIPESTATUS[0]}

          SUMMARY="$(grep -E '[0-9]+ active rules' "$OUT" | tail -1)"
          if [ -z "$SUMMARY" ]; then
            echo "::error::swift-linter emitted no run summary. Nothing was measured, so this run establishes nothing — it is not a pass. (bundle: $SWIFT_LINTER_BUNDLE, exit status: $RC)"
            exit 1
          fi
          RULES="$(sed -n 's/^[^0-9]*\([0-9][0-9]*\) active rules.*/\1/p' <<< "$SUMMARY")"
          FILES="$(sed -n 's/.*[^0-9]\([0-9][0-9]*\) files linted.*/\1/p' <<< "$SUMMARY")"
          if [ "${RULES:-0}" -eq 0 ]; then
            echo "::error::swift-linter loaded 0 rules from bundle '$SWIFT_LINTER_BUNDLE'. Nothing could have been found, so a clean result here would be a lie."
            exit 1
          fi
          if [ "${FILES:-0}" -eq 0 ]; then
            echo "::error::swift-linter linted 0 files. The rule set loaded but matched no source — a clean verdict would be reporting on an empty population."
            exit 1
          fi
          {
            echo "### swift-linter (no \`Lint.swift\`)"
            echo ""
            echo "Linted against the \`$SWIFT_LINTER_BUNDLE\` bundle — the one this package's configured peers in the same layer activate."
            echo ""
            echo "\`\`\`"
            echo "$SUMMARY"
            echo "\`\`\`"
            echo ""
            echo "Findings of \`error\` severity fail this job under \`--exit-policy strict\`, exactly as they do for a package carrying a \`Lint.swift\`. Warning-severity findings are reported and do not."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

  # ADVISORY CI GATES. Each takes an `advisory: bool` input; FLIP TO GATING by
  # dropping the `with:` block at the call site (default false = gating). Job
  # declaration order here drives the consumer's CI sidebar order.

  # Mechanical hygiene — workflow YAML + filesystem checks; cheap, no container.
  # Flip after 2 clean weekly cron sweeps.

  lint-yaml:
    name: yamllint (γ-2, advisory)
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'lint-yaml' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',lint-yaml,'))) }}
    uses: ./.github/workflows/lint-yaml.yml
    with:
      advisory: true

  lint-broken-symlink:
    name: Broken symlinks (γ-2, advisory)
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'lint-broken-symlink' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',lint-broken-symlink,'))) }}
    uses: ./.github/workflows/lint-broken-symlink.yml
    with:
      advisory: true

  # L1 identity invariants + Test Support dependency integrity. Per-package
  # source-content audits, each with its own flip schedule. License-header is
  # pure Python (no container); Test Support Spine needs swift:6.3 for
  # `swift package dump-package`. Foundation-import is NOT here — it is the
  # Tier 2 SwiftLint rule pair `no_foundation_import_*`.

  lint-license-header:
    name: License header (γ-1b Stage 1, advisory)
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'lint-license-header' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',lint-license-header,'))) }}
    uses: ./.github/workflows/lint-license-header.yml
    with:
      advisory: true
      subject-repository: ${{ needs.plan.outputs.subject-repository }}
      subject-sha: ${{ needs.plan.outputs.subject-sha }}

  lint-test-support-spine:
    name: Test Support dependency integrity (advisory)
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'lint-test-support-spine' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',lint-test-support-spine,'))) }}
    uses: ./.github/workflows/lint-test-support-spine.yml
    with:
      advisory: true     # Phase β. Drop in Phase γ.
      swift-version: ${{ inputs.swift-version }}
      swift-image: ${{ needs.plan.outputs.linux-image }}
      subject-repository: ${{ needs.plan.outputs.subject-repository }}
      subject-sha: ${{ needs.plan.outputs.subject-sha }}

  # PR-only conventions: fire on pull_request, skipped on push/dispatch.

  lint-api-breakage:
    name: API breakage (γ-1c, advisory pilot)
    # `needs: plan` is the container-image contract, not scheduling: this leg
    # runs in a Swift container and must take its image from the single
    # resolved plan output, like every containerized leg (#491).
    needs: plan
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    uses: ./.github/workflows/lint-api-breakage.yml
    with:
      advisory: true
      swift-version: ${{ inputs.swift-version }}
      swift-image: ${{ needs.plan.outputs.linux-image }}
    secrets: inherit

  lint-pr-title:
    name: PR title format (γ-4, advisory)
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    uses: ./.github/workflows/lint-pr-title.yml
    with:
      advisory: true

  # Dep-graph submission is centralized in submit-dep-graph-weekly.yml, never a
  # per-PR caller here: the transitive caller chain cannot grant
  # `contents: write` cleanly under the [CI-031] minimum.

  # Integrated DocC validation (#276 Task 4-01). Calls this repository's
  # swift-docs.yml by FULL COORDINATE, never a relative `./` ref, so a package
  # gets DocC validation inside this chain instead of its own `docs:` job.
  # Depth: package ci.yml (1) -> layer wrapper (2) -> here (3) ->
  # swift-docs.yml (4) — the workflow_call nesting ceiling. NO HEADROOM for a
  # further hop on this path.
  #
  # Gate: the same scheduling predicate swift-docs.yml's own `docs` job
  # enforces (tag ref, workflow_dispatch, schedule, or '[ci docs]'). Stated
  # explicitly rather than inferred from `target-repo != ''`, because this job
  # ALWAYS passes a resolved target-repo/ref for subject-pinning, so that
  # presence would run docs on every push. The two guards are deliberately
  # redundant — workflow_call inherits the triggering event unchanged, so
  # swift-docs.yml re-evaluates the same disjuncts and never disagrees.
  #
  # ADVISORY: excluded from `ci-ok`'s needs, included in `advisory-summary`'s,
  # like lint-api-breakage / lint-pr-title. A job with a job-level `uses:`
  # cannot carry `continue-on-error:`, so advisory here means "excluded from
  # ci-ok", NOT "failure is caught" — a real DocC break still shows red on this
  # job's own check.
  #
  # Subject: needs.plan.outputs.subject-repository/subject-sha, never
  # re-derived (#179 class). subject-sha is a validated 40-char SHA, satisfying
  # swift-docs.yml's `ref:` input.
  docs:
    name: DocC archive (integrated)
    needs: plan
    if: >-
      ${{ !cancelled() && !github.event.repository.private
          && (inputs.job == 'docs' || (inputs.job == '' && (
                startsWith(github.ref, 'refs/tags/')
                || github.event_name == 'workflow_dispatch'
                || github.event_name == 'schedule'
                || contains(github.event.head_commit.message, '[ci docs]')
              ))) }}
    uses: swift-institute/.github/.github/workflows/swift-docs.yml@main
    # Explicit call-site ceiling (house convention for every non-local
    # `uses:` job in this file — see test-verdict-inventory.py's
    # TokenBoundaryTests): grants exactly the read-only floor
    # swift-docs.yml's own jobs need, no more. A local (`./`) reusable
    # call is the only class exempt from declaring this.
    permissions:
      contents: read
    with:
      umbrella-module: ${{ inputs.docs-umbrella-module }}
      umbrella-display-name: ${{ inputs.docs-umbrella-display-name }}
      umbrella-bundle-id: ${{ inputs.docs-umbrella-bundle-id }}
      umbrella-docc-path: ${{ inputs.docs-umbrella-docc-path }}
      exclude-modules: ${{ inputs.docs-exclude-modules }}
      enable-private-repos: ${{ inputs.enable-private-repos }}
      swift-version: ${{ inputs.docs-swift-version }}
      # The release-floor exception applies to the docs container ONLY while
      # docs sits on the same floor as the build legs — which is the default,
      # and the case that #491 broke. A caller that deliberately moves
      # `docs-swift-version` off the floor keeps its own `swift:<version>`
      # rather than silently inheriting the floor's substitute image.
      swift-image: ${{ inputs.docs-swift-version == inputs.swift-version && needs.plan.outputs.linux-image || '' }}
      # Full coordinate stays same-repo (swift-institute/.github calling
      # its own swift-docs.yml); target-repo/ref bind the DOCUMENTED
      # package's checkout, not this hop's own identity.
      target-repo: ${{ needs.plan.outputs.subject-repository }}
      ref: ${{ needs.plan.outputs.subject-sha }}
    secrets:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      SWIFT_INSTITUTE_BOT_APP_CLIENT_ID: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
      SWIFT_INSTITUTE_BOT_APP_ID: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_ID }}
      SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}

  # Advisory results surface: one row per advisory leg in the run summary, so
  # advisory red is legible in ONE place. Informational ONLY — excluded from
  # ci-ok's needs and `continue-on-error: true`, so a rendering hiccup can never
  # fail the run. Keyed on always() + not-private + `inputs.job == ''` exactly
  # like ci-ok, so it skips on single-job dispatch and runs only on push/PR; it
  # has no job selector and is absent from ci-dispatch.yml's `job` enum.
  # `needs:` enumerates every advisory leg per [CI-002]. swift-linter is NOT
  # here — it is GATING, in ci-ok's needs.
  advisory-summary:
    name: Advisory results (informational)
    # Tier-gated (R2 ruling 2026-07-20): the advisory legs it renders run only
    # in the full tier, so the summary is meaningful only there. On lint/build
    # tiers it skips with the legs.
    if: ${{ !cancelled() && !github.event.repository.private && inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',advisory-summary,') }}
    continue-on-error: true
    needs:
      - plan
      - linux-nightly
      - linux-6-4
      - apple-simulator-build
      - lint-yaml
      - lint-broken-symlink
      - lint-license-header
      - lint-test-support-spine
      - lint-api-breakage
      - lint-pr-title
      # Primitives-layer legs, listed unconditionally: on a non-Primitives run
      # Plan never selects them, so they report `skipped` like any unselected
      # advisory leg.
      - embedded
      - embedded-wasm-sdk
      - android-build
      - static-linux-musl-build
      # `docs` has its OWN scheduling guard (tag/dispatch/schedule/token, not
      # the tier/legs system), so it reports `skipped` whenever that gate
      # doesn't select it.
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Render advisory leg results to the run summary
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          PLANNED_DESCHEDULED: ${{ needs.plan.outputs.descheduled }}
        run: |
          set -euo pipefail
          # Informational only — this job is excluded from ci-ok's needs and
          # never gates the merge. One row per advisory leg (name + result).
          # ubuntu-latest pre-installs jq.
          {
            echo "## Advisory leg results"
            echo ""
            echo "Informational only — advisory legs never gate the merge (see \`ci-ok\`)."
            echo ""
            echo "| Advisory leg | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries | sort_by(.key)[] | "| \(.key) | \(.value.result) |"' <<< "$NEEDS_JSON"
            if [ -n "$PLANNED_DESCHEDULED" ]; then
              echo ""
              echo "> [!WARNING]"
              echo "> Descheduled with reason: \`$PLANNED_DESCHEDULED\` — an advisory-leg exception has EXPIRED (#488 semantics); re-ratify it in swift-institute/.github."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # CONCLUSION AGGREGATOR — the single required-status-check name consumer
  # branch protection requires, so adding or removing a job here is a local
  # `needs:` edit with no per-repo ruleset update. ci-ok's name interpolates
  # nothing (the M6 drift class). It succeeds iff the plan succeeded, every
  # gating job the plan SELECTED succeeded, every gating job it did NOT select
  # skipped, and at least one build leg actually compiled the package.
  #
  # A plain `all(success or skipped)` cannot distinguish the three ways a needed
  # job reports `skipped`:
  #   (a) the plan did not select it for this tier — legitimate
  #   (b) its `if:` drifted, its id was renamed, or it left the matrix — an
  #       inert gate
  #   (c) no build leg was selected at all — a green over nothing
  # So (a) is PROVED against `needs.plan.outputs.gating`, not assumed; (b)
  # fails; (c) is refused in the plan and again here. Scanned nothing must never
  # be reportable as found nothing.
  #
  # Excluded from needs: by design — linux-nightly (nightly instability is not
  # the consumer's defect to fix) and every `advisory: true` linter.
  ci-ok:
    # plan sits in needs: a plan failure (identity conflict, classifier error)
    # fails ci-ok even though every leg skips. ci-ok attests "the SELECTED tier
    # passed and built the package"; the full PLATFORM contract comes from tag
    # refs and the nightly ci-sweep rotation.
    if: ${{ always() && !github.event.repository.private && inputs.job == '' }}
    needs:
      - plan
      - macos-release
      - linux-release
      - windows-release
      - format
      - lint
      - swift-linter
    runs-on: ubuntu-latest
    # 60: same cold-bootstrap allowance as plan (F12).
    timeout-minutes: 60
    permissions:
      contents: read
      # TX7 receipt contract (swift-institute/.github#276 §8.9): this
      # aggregate alone reads its OWN run object and paginated jobs
      # collection to produce the preterminal effective runtime receipt.
      actions: read
    steps:
      # The body of this step is executed verbatim, against synthetic
      # NEEDS_JSON / PLANNED_GATING pairs, by
      # .github/scripts/tests/test-ci-ok-aggregate.py — which extracts it from
      # THIS file so the bytes under test are the bytes that ship. Keep the
      # step name stable; the extractor keys on it and fails if it is gone.
      - name: Checkout swift-institute/.github (receipt helper at this workflow's own ref)
        if: ${{ always() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          ref: ${{ job.workflow_sha }}
          path: institute-receipt

      # F12 bootstrap (see plan job). Plan ran first in this run, so the
      # exact-key entry is normally warm; the cold path is identical to plan's.
      - name: Institute CI source identity
        id: institute-ci-identity
        shell: bash
        run: |
          set -euo pipefail
          echo "sources-tree=$(git -C institute-receipt rev-parse "HEAD:Tools/institute-ci")" >> "$GITHUB_OUTPUT"
      - name: Restore Institute CI (exact key, acceleration only)
        id: institute-ci-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .institute-ci-entry
          key: institute-ci-${{ steps.institute-ci-identity.outputs.sources-tree }}-72d4b2ae1e5b6a2b49fc22e0240dad0a34a9618f-linux-x86_64-swift-6.3-static
      - name: Swift toolchain (cold bootstrap only)
        if: ${{ steps.institute-ci-restore.outputs.cache-hit != 'true' }}
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9  # v1.14.0
        with:
          swift-version: "6.3"
      - name: Checkout Workspace at exact main pin (cold bootstrap only)
        if: ${{ steps.institute-ci-restore.outputs.cache-hit != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/institute-application
          ref: 72d4b2ae1e5b6a2b49fc22e0240dad0a34a9618f
          path: .workspace
          persist-credentials: false
      - name: Cold bootstrap through the sanctioned Workspace coordinate
        if: ${{ steps.institute-ci-restore.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          SOURCES_TREE: ${{ steps.institute-ci-identity.outputs.sources-tree }}
        run: |
          set -euo pipefail
          # uuid-dev: the typed F2/F10 provisioning input (swift-linux-standard's
          # CLinuxKernelShim includes uuid/uuid.h); absent on the bare runner.
          sudo apt-get update -qq && sudo apt-get install -qq -y uuid-dev
          # TX-APP1Z: institute-application's Swift package moved from Application/ to
          # the repository root. This checkout is pinned to a caller-supplied or
          # hard-pinned revision, so it must build either layout. The probe retires
          # once every pin in the fleet is post-flatten.


          workspace_package_path=.workspace
          if [ -f .workspace/Application/Package.swift ]; then
            workspace_package_path=.workspace/Application
          fi
          swift run --package-path "$workspace_package_path" institute package build --package-path "$GITHUB_WORKSPACE/institute-receipt/Tools/institute-ci" --argument=--static-swift-stdlib
          mkdir -p .institute-ci-entry/bin
          cp "$(find institute-receipt/Tools/institute-ci/.build -name institute-ci -type f -perm /111 | head -1)" .institute-ci-entry/bin/institute-ci
          .institute-ci-entry/bin/institute-ci bootstrap-manifest --workspace-revision 72d4b2ae1e5b6a2b49fc22e0240dad0a34a9618f --sources-revision "$SOURCES_TREE" --toolchain swift-6.3 --os linux --arch x86_64 --provisioning uuid-dev,static-swift-stdlib --root .institute-ci-entry --executables bin/institute-ci --producer-run "$GITHUB_RUN_ID" > .institute-ci-entry/manifest.json
      - name: Verify Institute CI provenance before trust (fail closed)
        shell: bash
        env:
          SOURCES_TREE: ${{ steps.institute-ci-identity.outputs.sources-tree }}
        run: |
          set -euo pipefail
          .institute-ci-entry/bin/institute-ci bootstrap-verify --workspace-revision 72d4b2ae1e5b6a2b49fc22e0240dad0a34a9618f --sources-revision "$SOURCES_TREE" --toolchain swift-6.3 --os linux --arch x86_64 --provisioning uuid-dev,static-swift-stdlib --root .institute-ci-entry --manifest .institute-ci-entry/manifest.json
      # CI.Contract.AggregateVerdict in institute-ci, differentially proven
      # against the retired shell (exit-status equality across all 20 aggregate
      # shapes). Its exit status IS the verdict; findings go to stderr and the
      # summary below.
      - name: Aggregate required-job results
        shell: bash
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          PLANNED_GATING: ${{ needs.plan.outputs.gating }}
          PLANNED_TIER: ${{ needs.plan.outputs.tier }}
          PLANNED_SUBJECT_REPOSITORY: ${{ needs.plan.outputs.subject-repository }}
          PLANNED_SUBJECT_SHA: ${{ needs.plan.outputs.subject-sha }}
          PLANNED_DESCHEDULED: ${{ needs.plan.outputs.descheduled }}
          REQUIRE_FULL_TIER: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [ "$REQUIRE_FULL_TIER" = "true" ]; then
            FLAGS+=(--require-full-tier)
          fi
          RC=0
          VERDICT="$(.institute-ci-entry/bin/institute-ci aggregate --needs-json "$NEEDS_JSON" --gating "$PLANNED_GATING" --subject-repository "$PLANNED_SUBJECT_REPOSITORY" --subject-sha "$PLANNED_SUBJECT_SHA" --tier "$PLANNED_TIER" --descheduled "$PLANNED_DESCHEDULED" "${FLAGS[@]}" 2> >(tee /tmp/aggregate-findings.txt >&2))" || RC=$?
          {
            if [ "$RC" -eq 0 ]; then
              echo "## ci-ok: pass (tier \`${PLANNED_TIER:-unknown}\`, aggregated by institute-ci)"
            else
              echo "## ci-ok: FAIL (tier \`${PLANNED_TIER:-unknown}\`, aggregated by institute-ci)"
            fi
            echo ""
            echo "Gating legs selected by the plan: \`${PLANNED_GATING:-none}\`. Verdict: \`${VERDICT:-none}\`."
            if [ -s /tmp/aggregate-findings.txt ]; then
              echo ""
              echo '```'
              cat /tmp/aggregate-findings.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

      # Effective runtime receipt (TX7, #276 §8.9). Produced even when the
      # aggregate failed — a failure receipt is a retained control, never
      # evidence. The helper is a pure canonicalizer at THIS workflow's ref: it
      # never calls GitHub and never asserts a terminal conclusion while the run
      # is in progress. The post-completion collector (`institute-ci
      # runtime-receipt-augment`) runs after status=completed, never from here.
      - name: Produce preterminal effective runtime receipt
        id: receipt
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLANNED_GATING: ${{ needs.plan.outputs.gating }}
          SUBJECT_REPOSITORY: ${{ needs.plan.outputs.subject-repository }}
          SUBJECT_SHA: ${{ needs.plan.outputs.subject-sha }}
        run: |
          set -euo pipefail
          # A sweep run carries one ci-ok — and so one receipt — PER swept
          # subject inside the same run; the artifact name must be unique
          # per subject or the collector's exactly-one lookup fails
          # (observed live: run 31009088381 produced two same-named
          # artifacts).
          echo "subject-slug=${SUBJECT_REPOSITORY//\//__}" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "$RUNNER_TEMP/run.json"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[]' | jq -s '{jobs: .}' > "$RUNNER_TEMP/jobs.json"
          mkdir -p "$RUNNER_TEMP/receipt"
          # F16: the receipt canonicalizer is `Institute.Receipt.Capture` +
          # `.Canonical` (C6). The binary is the one provisioned by this
          # job's own F12 bootstrap block above — no second channel, and
          # the same tree OID the plan decision was made with.
          .institute-ci-entry/bin/institute-ci runtime-receipt \
            --run-json "$RUNNER_TEMP/run.json" \
            --jobs-json "$RUNNER_TEMP/jobs.json" \
            --planned-gating "${PLANNED_GATING:-}" \
            --subject-repository "$SUBJECT_REPOSITORY" \
            --subject-sha "$SUBJECT_SHA" \
            --subject-visibility public \
            --output "$RUNNER_TEMP/receipt/effective-runtime-receipt.v1.base.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload effective runtime receipt artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: effective-runtime-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.receipt.outputs.subject-slug }}
          path: ${{ runner.temp }}/receipt/
          if-no-files-found: warn
          retention-days: 90
