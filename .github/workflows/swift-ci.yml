  # ─── Ecosystem-wide quality gates ─────────────────────────────────────
  # `format` and `lint` run on every consumer CI in parallel with the
  # matrix. They read each consumer's own `.swift-format` and
  # `.swiftlint.yml` configs (per-package customization preserved); the
  # tools find their config by walking up from the working directory.
  # Per-repo `swift-format.yml` / `swiftlint.yml` workflow files are
  # forbidden once these absorbed jobs land — see [CI-031].
  #
  # Developer contract: CI runs `swift-format lint --strict` (NOT
  # `format --in-place + auto-commit`). Run `swift-format format
  # --in-place Sources Tests` locally before pushing.

  format:
    name: swift-format lint
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'format' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',format,'))) }}
    runs-on: ubuntu-latest
    container: swift:${{ inputs.swift-version }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          ref: ${{ needs.plan.outputs.subject-ref }}
          persist-credentials: false

      - name: Verify checked-out subject HEAD
        shell: bash
        env:
          SUBJECT_SHA: ${{ needs.plan.outputs.subject-sha }}
        run: |
          set -euo pipefail
          # Job-level `container:` steps execute via a fresh `docker exec`
          # per step, so a bare shell `git` call sees the checkout owned by
          # the runner's host UID and refuses it as dubious ownership
          # (2.35.2+) — unlike actions/checkout's own internal git calls two
          # steps up, which already registered the path for themselves. A
          # no-op on bare macOS/Windows runners; trusts nothing beyond what
          # actions/checkout just placed in this same job.
          git config --global --add safe.directory '*'
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$SUBJECT_SHA" ]; then
            echo "::error::checked-out HEAD '$ACTUAL' does not match Plan's resolved CI subject SHA '$SUBJECT_SHA'. Refusing to proceed against an unverified checkout."
            exit 1
          fi

      - name: Print swift-format version
        run: swift-format --version

      - name: Lint formatting (--strict)
        # Path exclusions ([Phase 1.5] 2026-05-05):
        #   *.docc/Resources/  — DocC tutorial code samples (didactic fixtures)
        #   Tests/Support/     — Test_Support fixture modules
        #   Tests/Tutorial/    — Tutorial verification tests (same didactic
        #                        code as DocC tutorials, just under Tests/)
        # Other Tests/** paths are still linted — rules like NeverForceUnwrap,
        # NeverUseForceTry, ValidateDocumentationComments remain valuable on
        # actual test code outside fixture/tutorial modules.
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find Sources Tests -name '*.swift' \
            -not -path '*/*.docc/Resources/*' \
            -not -path 'Tests/Support/*' \
            -not -path 'Tests/Tutorial/*' \
            -print0 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Swift files to lint."
            exit 0
          fi
          swift-format lint --strict --ignore-unparsable-files "${files[@]}"

  lint:
    name: SwiftLint
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'lint' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',lint,'))) }}
    runs-on: ubuntu-latest
    container: swift:${{ inputs.swift-version }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          ref: ${{ needs.plan.outputs.subject-ref }}
          persist-credentials: false

      - name: Verify checked-out subject HEAD
        shell: bash
        env:
          SUBJECT_SHA: ${{ needs.plan.outputs.subject-sha }}
        run: |
          set -euo pipefail
          # Job-level `container:` steps execute via a fresh `docker exec`
          # per step, so a bare shell `git` call sees the checkout owned by
          # the runner's host UID and refuses it as dubious ownership
          # (2.35.2+) — unlike actions/checkout's own internal git calls two
          # steps up, which already registered the path for themselves. A
          # no-op on bare macOS/Windows runners; trusts nothing beyond what
          # actions/checkout just placed in this same job.
          git config --global --add safe.directory '*'
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$SUBJECT_SHA" ]; then
            echo "::error::checked-out HEAD '$ACTUAL' does not match Plan's resolved CI subject SHA '$SUBJECT_SHA'. Refusing to proceed against an unverified checkout."
            exit 1
          fi

      # Pin swiftlint config resolution to this workflow revision (#269).
      # Root cause: every consumer's `.swiftlint.yml` declares
      # `parent_config: https://raw.githubusercontent.com/swift-institute/
      # .github/main/.swiftlint.yml` — a LIVE fetch of the mutable `main`
      # ref, re-resolved at every run. Two runs against the identical
      # consumer commit can therefore lint under two different Tier 1 rule
      # sets purely because of WHEN each run happened to fetch `main` — a
      # central-config change landing between them silently reclassifies
      # pre-existing code from clean to violating (or vice versa), with the
      # SwiftLint binary version pinned and identical throughout. Because
      # `push` and `workflow_dispatch`/`pull_request` runs are typically
      # staggered in time relative to a central-config PR merge, this
      # manifested AS an apparent push-vs-dispatch scope skew (swift-
      # domain-standard: run 30854289704 green, run 30865610398 red, same
      # consumer commit) even though no branch in this file actually
      # conditions lint scope on `github.event_name`.
      #
      # Fix: vendor this workflow's OWN revision of the central
      # `.swiftlint.yml` (same `job.workflow_sha` trust anchor already used
      # for the vendored `plan`-job scripts) and rewrite the checked-out
      # consumer's `parent_config` line, if any, to point at that local,
      # pinned copy instead of the floating URL — before swiftlint ever
      # runs. Every event now resolves the identical Tier 1 rule set for a
      # given workflow revision, uniformly: not narrower on push, not wider
      # on dispatch, never a function of wall-clock fetch time.
      - name: Checkout pinned Tier 1 SwiftLint config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          ref: ${{ job.workflow_sha }}
          path: .ci-central-swiftlint-config
          sparse-checkout: |
            .swiftlint.yml
          sparse-checkout-cone-mode: false

      # Pin parent_config resolution (#269, corrected per review
      # 4850700583): the deployed chain is TWO-HOP, not one. A consumer
      # points at its ORG's Tier 2 canonical (e.g.
      # swift-standards/.github's own main .swiftlint.yml), and that Tier 2
      # file is the one that points at this Tier 1 file — the consumer
      # never references swift-institute/.github directly. Pinning only the
      # consumer's own hop (the original version of this fix) left the Tier
      # 2 hop floating, so it zero-rewrote in every repo that goes through
      # an org canonical and both hops stayed unpinned.
      #
      # This step pins BOTH hops it can identify:
      #   1. If the consumer's own parent_config already points directly at
      #      swift-institute/.github (a direct Tier 1 reference, no org
      #      canonical in between), rewrite it straight to the local pinned
      #      copy checked out above.
      #   2. Otherwise, if it points at some other org's own `.github`
      #      canonical (the Tier 2 shape), fetch that Tier 2 file ONCE over
      #      HTTPS, record the resolved org/ref/commit it actually served in
      #      the run log as an explicit, honest residual (this hop is
      #      pinned to "whatever main served at lint time", not to a fixed
      #      SHA — a real limitation, logged rather than hidden), rewrite
      #      THAT materialized copy's OWN parent_config (if it is the
      #      expected direct reference to swift-institute/.github) to the
      #      local Tier 1 pin, and repoint the consumer's parent_config at
      #      the local, rewritten Tier 2 copy.
      #   3. Any parent_config line this step cannot positively identify and
      #      pin — an unrecognized host/org shape, or a Tier 2 file whose
      #      own parent_config isn't the expected direct swift-institute/
      #      .github reference — is left untouched AND reported with a loud
      #      ::warning::, never silently left to a floating fetch without
      #      comment. A run with such a warning is evidence that a hop in
      #      that repo's chain is still time-dependent.
      - name: Pin parent_config chain to this workflow revision
        shell: bash
        run: |
          set -euo pipefail
          pinned_tier1="${GITHUB_WORKSPACE}/.ci-central-swiftlint-config/.swiftlint.yml"
          [ -f "$pinned_tier1" ] || { echo "::error::pinned Tier 1 .swiftlint.yml did not check out"; exit 1; }
          tier1_re='^[[:space:]]*parent_config:[[:space:]]*https://raw\.githubusercontent\.com/swift-institute/\.github/([^/]+)/\.swiftlint\.yml[[:space:]]*$'
          tier2_re='^[[:space:]]*parent_config:[[:space:]]*https://raw\.githubusercontent\.com/([^/]+)/\.github/([^/]+)/\.swiftlint\.yml[[:space:]]*$'
          mapfile -d '' configs < <(find . -name '.swiftlint.yml' -not -path './.ci-central-swiftlint-config/*' -print0)
          for config in "${configs[@]}"; do
            line=$(grep -E '^[[:space:]]*parent_config:' "$config" || true)
            [ -z "$line" ] && continue
            if [[ "$line" =~ $tier1_re ]]; then
              sed -i -E "s#^([[:space:]]*parent_config:[[:space:]]*)https://raw\.githubusercontent\.com/swift-institute/\.github/[^/]+/\.swiftlint\.yml[[:space:]]*\$#\1${pinned_tier1}#" "$config"
              echo "Pinned $config: direct Tier 1 hop -> $pinned_tier1 (workflow revision ${{ job.workflow_sha }})"
            elif [[ "$line" =~ $tier2_re ]]; then
              org="${BASH_REMATCH[1]}"
              ref="${BASH_REMATCH[2]}"
              if [ "$org" = "swift-institute" ]; then
                echo "::warning::$config: parent_config org 'swift-institute' matched the Tier 2 pattern, not the Tier 1 pattern — investigate, left unpinned: $line"
                continue
              fi
              tier2_url="https://raw.githubusercontent.com/${org}/.github/${ref}/.swiftlint.yml"
              tier2_local="${RUNNER_TEMP}/tier2-${org}.swiftlint.yml"
              if ! curl -fsSL -o "$tier2_local" "$tier2_url"; then
                echo "::warning::$config: could not fetch Tier 2 config from $tier2_url — left unpinned (floating): $line"
                continue
              fi
              # Record the residual honestly: this hop is fetched fresh at
              # lint time from $org/.github@$ref, resolved to whatever
              # commit that ref names right now. That commit, not a fixed
              # SHA, is what's actually pinned for the remainder of THIS
              # run (both hops rewritten below stay stable within the run);
              # a re-run later can still resolve $ref to a different commit.
              resolved_sha=$(git ls-remote "https://github.com/${org}/.github" "$ref" | cut -f1)
              echo "Materialized Tier 2 config for $config: ${org}/.github@${ref} (resolved ${resolved_sha:-unknown at fetch time}) -> $tier2_local — RESIDUAL: this hop is fetched live each run, not pinned to a fixed commit."
              tier2_line=$(grep -E '^[[:space:]]*parent_config:' "$tier2_local" || true)
              if [[ "$tier2_line" =~ $tier1_re ]]; then
                sed -i -E "s#^([[:space:]]*parent_config:[[:space:]]*)https://raw\.githubusercontent\.com/swift-institute/\.github/[^/]+/\.swiftlint\.yml[[:space:]]*\$#\1${pinned_tier1}#" "$tier2_local"
                echo "Pinned $tier2_local: Tier 1 hop -> $pinned_tier1 (workflow revision ${{ job.workflow_sha }})"
              elif [ -n "$tier2_line" ]; then
                echo "::warning::$tier2_local (Tier 2 config for $org, materialized from $tier2_url): its own parent_config did not match the expected direct swift-institute/.github shape — left unpinned (floating): $tier2_line"
              fi
              sed -i -E "s#^([[:space:]]*parent_config:[[:space:]]*)https://raw\.githubusercontent\.com/${org}/\.github/[^/]+/\.swiftlint\.yml[[:space:]]*\$#\1${tier2_local}#" "$config"
              echo "Pinned $config: Tier 2 hop -> $tier2_local (materialized, see residual note above)"
            else
              echo "::warning::$config: parent_config did not match a recognized Tier 1 or Tier 2 shape — left unpinned (floating): $line"
            fi
          done
          rm -rf .ci-central-swiftlint-config/.git

      - name: Cache SwiftLint binary
        id: cache-swiftlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/swiftlint
          key: ${{ runner.os }}-swiftlint-${{ env.SWIFTLINT_VERSION }}

      - name: Install SwiftLint ${{ env.SWIFTLINT_VERSION }}
        if: steps.cache-swiftlint.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -qq -y curl unzip
          curl -fsSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${{ env.SWIFTLINT_VERSION }}/swiftlint_linux_amd64.zip"
          # [CI-082] verify against pinned SHA-256 before unpack/install. Fails
          # closed on digest mismatch (no `|| true` swallow).
          echo "${SWIFTLINT_SHA256}  /tmp/swiftlint.zip" | sha256sum -c -
          unzip -q /tmp/swiftlint.zip -d /tmp/swiftlint_extracted
          mv /tmp/swiftlint_extracted/swiftlint /usr/local/bin/
          chmod +x /usr/local/bin/swiftlint
          rm -rf /tmp/swiftlint.zip /tmp/swiftlint_extracted

      - name: Print SwiftLint version
        run: swiftlint --version

      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  # ─── swift-linter (gating; swiftsyntax-based AST linter) ─────────────────
  # SwiftSyntax-based AST linter at swift-foundations/swift-linter. Phase 1
  # ships R5 (`unchecked_call_site`): flags `__unchecked:` argument labels
  # at call sites only — distinguishing call-site uses (anti-pattern per
  # [CONV-016] tier 5) from declaration-site uses (legitimate extension-init
  # machinery per [CONV-001]). The structural distinction is invisible to
  # regex but trivial on the AST.
  #
  # See swift-institute/Research/swiftsyntax-based-custom-linter-investigation.md
  # for the architecture (Option C standalone CLI, Option F symbol-graph
  # extension) and 6-phase phasing.
  #
  # GATING (principal ruling 2026-07-19; the Phase-1 "advisory" label is
  # retired): the job is in ci-ok's needs, and `--exit-policy strict` exits
  # non-zero exactly when any finding has severity `.error` — warning-severity
  # findings are emitted but never fail the run.
  #
  # PROVISIONING (#137, 2026-07-30): the linter is INSTALLED, never compiled
  # here. The job downloads the checksum-sealed `ci-binaries` release of
  # swift-foundations/swift-linter and verifies it; there is no source-build
  # path and no per-repo tool cache. The retired from-source build is what
  # let a single break in the tool's own dependency graph redden this leg
  # across the fleet. See the install step for the verify-and-seal shape and
  # the recorded track-don't-pin currency decision. The prebuilt standard
  # runner still lints pure-bundle consumers warm in ~0.65s (Phase 3 of
  # near-instant-lint-with-external-rule-loading.md) — it now arrives from
  # the release instead of a composite-keyed per-repo cache.

  swift-linter:
    name: swift-linter
    # EVERY PACKAGE IS LINTED (principal ruling: "swift-linter should run even
    # if no Lint.swift is present"; shipped in the Workspace CLI at
    # swift-institute/Workspace@5145f24, shipped HERE 2026-07-29).
    #
    # This job was FILE-GATED until 2026-07-29: a consumer without a root
    # `Lint.swift` short-circuited at the detect step, every lint step skipped,
    # and the JOB still reported `success` — so it counted as a pass in ci-ok's
    # aggregate. That is a vacuous green, and it was measurable: on
    # swift-foundations/swift-splat run 30384695291 the job is `success` with
    # all eleven lint steps `skipped`. Lint coverage was therefore a property of
    # the Workspace CLI and not of the fleet.
    #
    # The two paths differ in ONE thing — where the rule set comes from — and
    # they must not be collapsed:
    #
    #   configured (root `Lint.swift`)  → the DISPATCHER, `swift-linter <root>
    #                                     --exit-policy strict`. Unchanged.
    #   unconfigured (no `Lint.swift`)  → the prebuilt STANDARD RUNNER, which
    #                                     bakes the published bundles and picks
    #                                     one from SWIFT_LINTER_BUNDLE.
    #
    # Pointing the DISPATCHER at an unconfigured package does not lint it: with
    # no consumer manifest to classify it falls through to a zero-rules
    # configuration and exits 0 in total silence (measured 2026-07-29 against
    # swift-splat with the ci-binaries dispatcher: no output, rc=0). Simply
    # deleting the file gate would therefore have replaced a job that admits it
    # skipped with one that looks like it linted and did not — strictly worse.
    # Hence the runner, and hence the summary-line adjudication in the
    # unconfigured step: the runner reports `93 active rules · 0 files linted ·
    # 0 violations`, rc=0, when handed an empty directory, so "ran clean" and
    # "measured nothing" are indistinguishable from the exit status alone.
    # A run that loaded no rules or linted no files fails here, loudly.
    #
    # Blast radius when this shipped (2026-07-29, public repos with a root
    # Package.swift across the layer orgs and materialized sub-orgs): 16 of 460
    # carried no `Lint.swift`; 6 archived, 1 with no `ci.yml`, leaving 9 live.
    # Of those 9, 7 exit 0 under `--exit-policy strict`; the 2 that do not
    # (swift-foundations/swift-certificate-verification, 71 findings, and
    # swift-institute/Issues, 1 — all of one rule, PATTERN-052) were ALREADY
    # red on every recent run for unrelated reasons. Zero repositories went
    # green → red. See swift-institute/Workspace#54 for the full census.
    #
    # Re-enabled 2026-06-24 after swift-foundations/swift-linter went public
    # (was DISABLED 2026-05-08 while the linter repo was private). The tool
    # itself is installed from the published release; private-dep auth comes
    # from the same configure-private-repos step the build/test matrix jobs
    # use, and is still required because a consumer `Lint.swift` that declares
    # inline or custom rules compiles its own rule closure on the eval path.
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'swift-linter' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',swift-linter,'))) }}
    runs-on: ubuntu-latest
    container: swift:${{ inputs.swift-version }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          ref: ${{ needs.plan.outputs.subject-ref }}
          persist-credentials: false
          path: consumer

      - name: Verify checked-out subject HEAD
        shell: bash
        env:
          SUBJECT_SHA: ${{ needs.plan.outputs.subject-sha }}
        run: |
          set -euo pipefail
          # Job-level `container:` steps execute via a fresh `docker exec`
          # per step, so a bare shell `git` call sees the checkout owned by
          # the runner's host UID and refuses it as dubious ownership
          # (2.35.2+) — unlike actions/checkout's own internal git calls two
          # steps up, which already registered the path for themselves. A
          # no-op on bare macOS/Windows runners; trusts nothing beyond what
          # actions/checkout just placed in this same job.
          git config --global --add safe.directory '*'
          ACTUAL="$(git -C consumer rev-parse HEAD)"
          if [ "$ACTUAL" != "$SUBJECT_SHA" ]; then
            echo "::error::checked-out HEAD '$ACTUAL' does not match Plan's resolved CI subject SHA '$SUBJECT_SHA'. Refusing to proceed against an unverified checkout."
            exit 1
          fi

      # Classifies WHICH lint path runs. It no longer decides WHETHER one does
      # — both branches lint. `lint-bundle` is validated here, before the
      # binary provisioning below, so a bad wrapper value costs seconds rather
      # than a full provision. The runner itself also rejects an unknown token
      # (measured: `bogus`, `''` and `INSTITUTE` all exit 1 with `bundle
      # channel: invalid`), so this is the fast half of a fail-closed pair, not
      # the only guard.
      - name: Classify consumer configuration
        id: detect
        shell: bash
        working-directory: consumer
        run: |
          set -euo pipefail
          case "$LINT_BUNDLE" in
            primitives|standards|institute) ;;
            *)
              echo "::error::lint-bundle '$LINT_BUNDLE' is not one of primitives|standards|institute. This selects the rule set an unconfigured package is measured against; refusing to guess one."
              exit 1
              ;;
          esac
          if [ -f Lint.swift ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Found Lint.swift — linting through the dispatcher against the consumer's own rule closure."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Lint.swift at repo root — linting through the standard runner against the '$LINT_BUNDLE' bundle, the one this package's configured peers in the same layer activate."
          fi
        env:
          LINT_BUNDLE: ${{ inputs.lint-bundle }}

      # ── Install the published linter binaries (#137, 2026-07-30) ──
      # The dispatcher + standard runner published by
      # swift-foundations/swift-linter's publish-ci-binaries.yml (rolling
      # non-semver `ci-binaries` release; built inside swift:6.3, the same
      # image this job runs in). This is the ONLY provisioning path: the tool
      # is not compiled in consumer repositories at all. Verify-and-seal is
      # the same shape as activation-baseline-sweep.yml (06844bd, #131) —
      # download SHA256SUMS + MANIFEST.txt + both binaries, `sha256sum
      # --check`, require every authority entry in the manifest — and the
      # trust anchor is GitHub TLS + release write-control ([CI-082]-class).
      #
      # WHY THE PER-REPO SOURCE BUILD IS GONE (#137). Two independent
      # failures, both measured 2026-07-30:
      #   1. Correctness. The fallback made every consumer repo compile the
      #      linter's own dependency graph, so ONE upstream compile break in
      #      that graph (swift-foundations/swift-kernel#4, `Kernel Thread`
      #      missing-`try`) reddened this leg across ~559 repositories inside
      #      an hour. A consumer's lint verdict must depend on the consumer's
      #      source and the linter's published rules — never on whether an
      #      unrelated transitive dependency happens to compile today.
      #   2. Cost. The build multiplied Actions minutes fleet-wide and
      #      lengthened every run (measured 2026-07-20: 18 of 28 runs cold,
      #      393–1450s; median job 502s). Actions caches are REPOSITORY-
      #      scoped, so no cache key could amortize it across consumers.
      # Building the tool is the linter repository's own CI concern.
      #
      # TRACK, DO NOT PIN — and this is a deliberate split from the sweep.
      # activation-baseline-sweep.yml pins `digest=` to a sealed activation
      # receipt because its output is an evidence-grade measurement whose
      # coordinate has to be stated and reproducible; a moved release there
      # silently changes what the receipt means, so it must refuse.
      # THIS leg is fast-lane development feedback: its job is to tell a
      # contributor whether their diff violates the rules that are in force
      # NOW. Pinning a digest here would make every rule-pack republish
      # require a workflow commit in swift-institute/.github before ~559
      # repositories could see it, and — worse — a pin is exactly the failure
      # this issue is fixing in a different costume: the retired identity
      # check below demanded `manifest engine == engine main HEAD`, which is
      # a pin to a moving coordinate, and it is what converted a stale
      # release into a fleet-wide fallback-to-source outage (measured
      # 2026-07-30: manifest engine 59f51c3 vs main HEAD 11ff4a7).
      # So: install whatever the release currently publishes, and refuse only
      # a release that is CORRUPT (checksum mismatch) or INCOMPLETE (missing
      # asset, or a manifest that does not name all six rule authorities).
      # A moved digest is not a defect here, it is the point. The manifest is
      # echoed into the step summary on every run, so each verdict still
      # states the exact coordinate it was measured against — currency
      # without anonymity.
      #
      # FAIL-CLOSED. There is no fallback, so this step exits non-zero on any
      # download or verification failure. That is the correct posture: an
      # unverifiable linter cannot produce a lint verdict, and a leg that
      # quietly proceeded without one would be a vacuous green.
      - name: Install published linter binaries
        shell: bash
        env:
          LINTER_RELEASE: https://github.com/swift-foundations/swift-linter/releases/download/ci-binaries
        run: |
          set -euo pipefail
          command -v curl >/dev/null 2>&1 || { apt-get update -qq && apt-get install -qq -y curl ca-certificates; }
          work="$(mktemp -d)"
          for asset in SHA256SUMS MANIFEST.txt swift-linter swift-linter-runner; do
            curl --fail --silent --show-error --location --retry 2 --output "$work/$asset" "$LINTER_RELEASE/$asset"
          done
          (cd "$work" && sha256sum --check SHA256SUMS)
          # Completeness, not currency. A release whose manifest omits an
          # authority is one whose rule provenance cannot be stated, and an
          # unstateable coordinate is refused even though it might lint fine.
          for authority in engine swift-primitives-linter-rules swift-standards-linter-rules swift-institute-linter-rules swift-linter-rules swift-linter-primitives; do
            grep --quiet "^${authority}=[0-9a-f]\{40\}$" "$work/MANIFEST.txt" || {
              echo "::error::The ci-binaries manifest omits '$authority'. Refusing to lint with a linter whose rule provenance cannot be stated."
              exit 1
            }
          done
          install -m 0755 "$work/swift-linter" /usr/local/bin/swift-linter
          install -m 0755 "$work/swift-linter-runner" /usr/local/bin/swift-linter-runner
          {
            echo "### swift-linter provisioning"
            echo ""
            echo "Installed the verified \`ci-binaries\` release (checksum-checked; no source build)."
            echo ""
            echo '```'
            cat "$work/MANIFEST.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Published binaries installed. Build manifest:"
          cat "$work/MANIFEST.txt"
          # Read by "Advise on ci-binaries staleness" below (#138). The step
          # runs in its own shell, so the path travels via GITHUB_ENV rather
          # than a bash variable.
          echo "CI_BINARIES_MANIFEST=$work/MANIFEST.txt" >> "$GITHUB_ENV"

      # ── Advise on ci-binaries staleness (#138; non-gating) ──
      # The install step above verifies the release is CORRECT (checksum,
      # completeness) but says nothing about CURRENCY: a release can be
      # valid and stale for days without failing anything, and #137
      # deliberately retired the identity check that used to catch this
      # (`manifest engine == engine main HEAD`) because that check pinned
      # the leg to a moving coordinate and turned one stale republish into
      # a fleet-wide fallback-to-source outage. This step restores
      # visibility into staleness WITHOUT reintroducing that failure mode:
      # every exit path is 0 and `continue-on-error` backstops the step, so
      # nothing here can affect ci-ok or any other leg's verdict.
      #
      # Threshold ruled 2026-07-31 (coordinator, issue #138, comment
      # 5140090863): AGE-based, 72 hours — fires when the engine-main HEAD
      # commit timestamp exceeds the installed manifest's `engine=` commit
      # timestamp by more than 72h. Commit-distance was considered and
      # rejected in that ruling: it costs more API calls and is more
      # volatile without adding signal (a burst of small commits is not
      # "more stale" than one large one), whereas age tolerates ordinary
      # weekend republish gaps and still catches the observed failure mode
      # (publish attempts silently failing for days at a time).
      #
      # ONE engine-repo API read at consume time, per the ruling: GitHub's
      # `compare` endpoint returns both endpoints' commit metadata in a
      # single response — the manifest's `engine=` SHA as `base_commit`,
      # and engine-main's current HEAD as the last entry of `commits`
      # (empty when the manifest SHA already IS main HEAD, i.e. exactly
      # zero staleness). Authenticated with this job's own GITHUB_TOKEN
      # so ~559 consumer repos hitting this on every push don't share the
      # 60 req/hr UNauthenticated cap on a public cross-repo read.
      - name: Advise on ci-binaries staleness (non-gating)
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENGINE_REPO: swift-foundations/swift-linter
          STALENESS_THRESHOLD_HOURS: "72"
        run: |
          set -uo pipefail

          skip() {
            echo "::warning::ci-binaries staleness advisory skipped: $1"
            exit 0
          }

          [ -n "${CI_BINARIES_MANIFEST:-}" ] && [ -f "$CI_BINARIES_MANIFEST" ] \
            || skip "no manifest path recorded by the install step."

          ENGINE_SHA="$(grep '^engine=' "$CI_BINARIES_MANIFEST" | cut -d= -f2)"
          [ -n "$ENGINE_SHA" ] || skip "manifest has no 'engine=' entry."

          command -v jq >/dev/null 2>&1 \
            || { apt-get update -qq && apt-get install -qq -y jq; } >/dev/null 2>&1 \
            || true
          command -v jq >/dev/null 2>&1 || skip "jq unavailable and could not be installed."

          RESP="$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${ENGINE_REPO}/compare/${ENGINE_SHA}...main")" \
            || skip "the engine-repo compare API read failed."

          ENGINE_DATE="$(jq -r '.base_commit.commit.committer.date // empty' <<<"$RESP")"
          HEAD_DATE="$(jq -r '.commits[-1].commit.committer.date // .base_commit.commit.committer.date // empty' <<<"$RESP")"
          [ -n "$ENGINE_DATE" ] && [ -n "$HEAD_DATE" ] \
            || skip "the compare response is missing commit timestamps."

          ENGINE_EPOCH="$(date -u -d "$ENGINE_DATE" +%s 2>/dev/null || true)"
          HEAD_EPOCH="$(date -u -d "$HEAD_DATE" +%s 2>/dev/null || true)"
          [[ "$ENGINE_EPOCH" =~ ^[0-9]+$ ]] && [[ "$HEAD_EPOCH" =~ ^[0-9]+$ ]] \
            || skip "could not parse commit timestamps ('$ENGINE_DATE', '$HEAD_DATE')."

          AGE_HOURS=$(( (HEAD_EPOCH - ENGINE_EPOCH) / 3600 ))
          {
            echo "### ci-binaries staleness advisory (non-gating, #138)"
            echo ""
            echo "- Installed manifest \`engine=\` commit: \`${ENGINE_SHA}\` (${ENGINE_DATE})"
            echo "- \`${ENGINE_REPO}\`@main HEAD commit timestamp: ${HEAD_DATE}"
            echo "- Age: ${AGE_HOURS}h (threshold: ${STALENESS_THRESHOLD_HOURS}h, ruled on #138)"
            echo ""
            if [ "$AGE_HOURS" -gt "$STALENESS_THRESHOLD_HOURS" ]; then
              echo "**Advisory: the installed \`ci-binaries\` release is more than ${STALENESS_THRESHOLD_HOURS}h behind engine main.** This does not affect the leg's verdict — it only makes staleness observable."
            else
              echo "Within threshold — no staleness advisory."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$AGE_HOURS" -gt "$STALENESS_THRESHOLD_HOURS" ]; then
            echo "::warning::ci-binaries release is ${AGE_HOURS}h behind ${ENGINE_REPO}@main (threshold ${STALENESS_THRESHOLD_HOURS}h, non-gating, #138)."
          fi

      - name: Configure private-dep access
        uses: swift-institute/.github/.github/actions/configure-private-repos@d1af72d05bf8262fb3918a2f1607b82fafcafdf9  # main 2026-08-03, pin-advance to main HEAD (dependabot #224 via #232); no functional change to this action in range
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          app-client-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
          app-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_ID }}
          app-private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          enabled: ${{ inputs.enable-private-repos }}

      # swift-linter's dependency graph pulls swift-linux-standard, whose
      # CLinuxKernelShim #includes <uuid/uuid.h> — absent from the minimal
      # swift:N image ([CI-092]). Still required after #137 retired the
      # per-repo tool build: the Lint.swift eval-project build compiles that
      # graph whenever a consumer declares inline or custom rules.
      - name: Install system libraries (libuuid)
        run: apt-get update -qq && apt-get install -qq -y uuid-dev

      - name: Run swift-linter (consumer Lint.swift)
        if: ${{ steps.detect.outputs.present == 'true' }}
        # The dispatcher binary references the engine by branch:"main" (Phase 0)
        # — NO SWIFT_LINTER_PATH — so it dispatches without an engine source tree.
        # SWIFT_LINTER_RUNNER provisions the fast path: a bare-`Bundle.primitives`
        # consumer is linted by the prebuilt runner (~0.65s warm); any inline/
        # custom-rule consumer falls through to the eval path, which compiles the
        # consumer's declared rule packs + the engine `Linter` library exactly as
        # before (private-dep auth configured above; libuuid present).
        #
        # ADJUDICATION. A strict exit status only reports findings; it does not
        # prove the configured rule set loaded or matched source. Apply the same
        # no-summary / zero-rules / zero-files rejection as the layer-default
        # runner, so a configured `Lint.swift` cannot green over no measurement.
        shell: bash   # PIPESTATUS + the swift:N container's default shell is dash
        env:
          SWIFT_LINTER_RUNNER: /usr/local/bin/swift-linter-runner
        run: |
          set -uo pipefail
          OUT="$(mktemp)"
          swift-linter "$GITHUB_WORKSPACE/consumer" --exit-policy strict 2>&1 | tee "$OUT"
          RC=${PIPESTATUS[0]}

          SUMMARY="$(grep -E '[0-9]+ active rules' "$OUT" | tail -1)"
          if [ -z "$SUMMARY" ]; then
            echo "::error::swift-linter emitted no run summary. Nothing was measured, so this run establishes nothing — it is not a pass. (Lint.swift, exit status: $RC)"
            exit 1
          fi
          RULES="$(sed -n 's/^[^0-9]*\([0-9][0-9]*\) active rules.*/\1/p' <<< "$SUMMARY")"
          FILES="$(sed -n 's/.*[^0-9]\([0-9][0-9]*\) files linted.*/\1/p' <<< "$SUMMARY")"
          if [ "${RULES:-0}" -eq 0 ]; then
            echo "::error::swift-linter loaded 0 rules from Lint.swift. Nothing could have been found, so a clean result here would be a lie."
            exit 1
          fi
          if [ "${FILES:-0}" -eq 0 ]; then
            echo "::error::swift-linter linted 0 files. The rule set loaded but matched no source — a clean verdict would be reporting on an empty population."
            exit 1
          fi
          {
            echo "### swift-linter (Lint.swift)"
            echo ""
            echo "Linted using this package's configured rule set."
            echo ""
            echo "\`\`\`"
            echo "$SUMMARY"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

      # The unconfigured path. Straight to the prebuilt standard runner — the
      # dispatcher cannot lint this package (see the job header: no consumer
      # manifest → zero rules → silent rc=0).
      #
      # The runner's argument vector is lint targets and NOTHING else, so a
      # `--exit-policy` flag there would be read as a path. Both the bundle and
      # the policy therefore ride environment channels. This is the same pair
      # Workspace drives, so a package's CI verdict and its `workspace lint`
      # verdict come from one mechanism rather than two that can drift.
      #
      # SWIFT_LINTER_BUNDLE must be set explicitly on every invocation: the
      # runner falls back to `primitives` when the channel is UNSET (measured
      # 2026-07-29 — an unset channel lints a foundations package against 96
      # rules instead of 93, silently). `inputs.lint-bundle` has a non-empty
      # default and is validated in the classify step, so the channel is never
      # empty here; the runner rejects an invalid value even if it were.
      #
      # ADJUDICATION. The exit status alone cannot distinguish "ran clean" from
      # "measured nothing": handed an empty directory the runner prints
      # `93 active rules · 0 files linted · 0 violations` and exits 0. So the
      # summary line is parsed and three conditions fail the job — no summary
      # at all (never configured), zero active rules (nothing could have been
      # found), zero files linted (a clean verdict over an empty population).
      # These are the three UNMEASURED conditions Workspace's adjudicator
      # applies; a ruleless run must be loud here exactly as it is there.
      - name: Run swift-linter (layer default bundle)
        if: ${{ steps.detect.outputs.present != 'true' }}
        shell: bash   # PIPESTATUS + the swift:N container's default shell is dash
        env:
          SWIFT_LINTER_BUNDLE: ${{ inputs.lint-bundle }}
          SWIFT_LINTER_EXIT_POLICY: strict
        run: |
          set -uo pipefail
          OUT="$(mktemp)"
          swift-linter-runner "$GITHUB_WORKSPACE/consumer" 2>&1 | tee "$OUT"
          RC=${PIPESTATUS[0]}

          SUMMARY="$(grep -E '[0-9]+ active rules' "$OUT" | tail -1)"
          if [ -z "$SUMMARY" ]; then
            echo "::error::swift-linter emitted no run summary. Nothing was measured, so this run establishes nothing — it is not a pass. (bundle: $SWIFT_LINTER_BUNDLE, exit status: $RC)"
            exit 1
          fi
          RULES="$(sed -n 's/^[^0-9]*\([0-9][0-9]*\) active rules.*/\1/p' <<< "$SUMMARY")"
          FILES="$(sed -n 's/.*[^0-9]\([0-9][0-9]*\) files linted.*/\1/p' <<< "$SUMMARY")"
          if [ "${RULES:-0}" -eq 0 ]; then
            echo "::error::swift-linter loaded 0 rules from bundle '$SWIFT_LINTER_BUNDLE'. Nothing could have been found, so a clean result here would be a lie."
            exit 1
          fi
          if [ "${FILES:-0}" -eq 0 ]; then
            echo "::error::swift-linter linted 0 files. The rule set loaded but matched no source — a clean verdict would be reporting on an empty population."
            exit 1
          fi
          {
            echo "### swift-linter (no \`Lint.swift\`)"
            echo ""
            echo "Linted against the \`$SWIFT_LINTER_BUNDLE\` bundle — the one this package's configured peers in the same layer activate."
            echo ""
            echo "\`\`\`"
            echo "$SUMMARY"
            echo "\`\`\`"
            echo ""
            echo "Findings of \`error\` severity fail this job under \`--exit-policy strict\`, exactly as they do for a package carrying a \`Lint.swift\`. Warning-severity findings are reported and do not."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

  # ════════════════════════════════════════════════════════════════════════
  # Advisory CI gates — grouped by category for UI clarity.
  # Each gate takes an `advisory: bool` input; γ flip = drop the `with:`
  # block at the calling site (default false = gating). Job declaration
  # order here drives the order in the consumer's CI sidebar.
  # ════════════════════════════════════════════════════════════════════════

  # ─── γ-2 Mechanical hygiene ──────────────────────────────────────────────
  # Workflow YAML + filesystem checks. Cheap, run on ubuntu-latest no-container.
  # γ-2 flip after 2 clean weekly cron sweeps (consolidated tracking issue).

  lint-yaml:
    name: yamllint (γ-2, advisory)
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'lint-yaml' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',lint-yaml,'))) }}
    uses: ./.github/workflows/lint-yaml.yml
    with:
      advisory: true

  lint-broken-symlink:
    name: Broken symlinks (γ-2, advisory)
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'lint-broken-symlink' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',lint-broken-symlink,'))) }}
    uses: ./.github/workflows/lint-broken-symlink.yml
    with:
      advisory: true

  # ─── L1 identity invariants + Test Support dependency integrity ──────────
  # Per-package source-content audits. License-header runs on ubuntu-latest
  # no-container (pure Python). Test Support Spine uses swift:6.3 because
  # it invokes `swift package dump-package`. Each has its own flip schedule
  # per research §3.4.
  #
  # Foundation-import (γ-1a) was migrated 2026-05-05 from this advisory
  # workflow to the Tier 2 SwiftLint custom rule pair (no_foundation_import_*)
  # at swift-primitives/.github/.swiftlint.yml — see swift-institute/Research/
  # rollout-phase-1-results.md.

  lint-license-header:
    name: License header (γ-1b Stage 1, advisory)
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'lint-license-header' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',lint-license-header,'))) }}
    uses: ./.github/workflows/lint-license-header.yml
    with:
      advisory: true
      subject-repository: ${{ needs.plan.outputs.subject-repository }}
      subject-sha: ${{ needs.plan.outputs.subject-sha }}

  lint-test-support-spine:
    name: Test Support dependency integrity (advisory)
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'lint-test-support-spine' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',lint-test-support-spine,'))) }}
    uses: ./.github/workflows/lint-test-support-spine.yml
    with:
      advisory: true     # Phase β. Drop in Phase γ.
      swift-version: ${{ inputs.swift-version }}
      subject-repository: ${{ needs.plan.outputs.subject-repository }}
      subject-sha: ${{ needs.plan.outputs.subject-sha }}

  # ─── PR-only conventions ─────────────────────────────────────────────────
  # Fire on pull_request events only; skipped on push/dispatch.

  lint-api-breakage:
    name: API breakage (γ-1c, advisory pilot)
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    uses: ./.github/workflows/lint-api-breakage.yml
    with:
      advisory: true
      swift-version: ${{ inputs.swift-version }}
    secrets: inherit

  lint-pr-title:
    name: PR title format (γ-4, advisory)
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    uses: ./.github/workflows/lint-pr-title.yml
    with:
      advisory: true

  # γ-2b dep-graph submission lives in submit-dep-graph-weekly.yml (a
  # centralized per-org cron orchestrator), not as a per-PR caller here.
  # The transitive consumer-→layer-→universal call chain can't grant
  # `contents: write` cleanly under [CI-031] minimum (v1.3.0 §3.5.4),
  # so the architecture is centralized: one workflow at swift-institute/
  # .github fires Monday 06:50 UTC and submits dep-graphs for all public
  # consumer repos via `gh api -X POST /repos/<target>/dependency-graph/snapshots`.

  # ─── Integrated DocC validation (TEMPORARY compatibility) ─────────────────
  # CI/CD refactor programme Task 4-01 (swift-institute/.github#276, #284).
  # Invokes THIS repository's own swift-docs.yml through the FULL COORDINATE
  # (never a relative `./` ref, per the task's Change item 1) so a package
  # migrated onto the terminal caller gets DocC validation once inside
  # this chain instead of through its own separate `docs:` job. Depth
  # arithmetic: package ci.yml (1) -> layer swift-ci.yml wrapper (2) ->
  # this workflow (3) -> swift-docs.yml (4) — exactly the workflow_call
  # nesting ceiling the layer's own swift-docs.yml wrapper already
  # documents ("within the workflow_call 4-level limit"); there is no
  # remaining headroom for a further hop in this path.
  #
  # Gate (TX10: input deleted; docs unconditional):
  # the identical scheduling predicate swift-docs.yml's own `docs` job
  # enforces (see that file's SCHEDULING header comment for the measurement
  # and the ruling this reproduces) — tag ref, workflow_dispatch, schedule,
  # or the '[ci docs]' commit token. Reproduced here rather than inferred
  # from `target-repo != ''`, because this job ALWAYS passes a resolved
  # target-repo/ref for subject-pinning (below); using that presence as the
  # schedule signal here would run docs on every push, weakening the exact
  # cadence Change item 2 requires preserving. The two guards are
  # deliberately redundant once this job's gate is satisfied — swift-docs.yml
  # re-evaluates the same four disjuncts against the same inherited event
  # context (workflow_call inherits the triggering event unchanged through
  # the chain) and finds one of them true either way; they never disagree.
  #
  # Advisory posture (Change item 5 — preserve the characterized contract:
  # verified live 2026-08-04, no consumer repository's branch-protection
  # ruleset requires the standalone `docs` check today, e.g.
  # swift-primitives/swift-percent-primitives's ruleset requires only
  # `ci / ci-ok`): excluded from `ci-ok`'s needs, included in
  # `advisory-summary`'s needs below — exactly like lint-api-breakage /
  # lint-pr-title, event-gated jobs already carried there despite their own
  # `if:` being independent of the tier/legs system. A job with a job-level
  # `uses:` cannot itself carry `continue-on-error:` ([CI-cd] reusable-job
  # trap) — advisory posture here means "excluded from ci-ok", not "failure
  # is caught": a real DocC break still shows red on this job's own check,
  # matching the current standalone docs job's failure visibility.
  #
  # Subject: needs.plan.outputs.subject-repository/subject-sha, never
  # re-derived (swift-institute/.github#179 regression class / R7) — the
  # same single subject-resolution contract every build/test/lint/docs
  # checkout in this file already consumes. subject-sha is a validated
  # 40-character commit SHA (Plan's "Resolve CI subject" step refuses to
  # emit anything else), satisfying swift-docs.yml's `ref:` checkout input.
  docs:
    name: DocC archive (integrated)
    needs: plan
    if: >-
      ${{ !cancelled() && !github.event.repository.private
          && (inputs.job == 'docs' || (inputs.job == '' && (
                startsWith(github.ref, 'refs/tags/')
                || github.event_name == 'workflow_dispatch'
                || github.event_name == 'schedule'
                || contains(github.event.head_commit.message, '[ci docs]')
              ))) }}
    uses: swift-institute/.github/.github/workflows/swift-docs.yml@main
    # Explicit call-site ceiling (house convention for every non-local
    # `uses:` job in this file — see test-verdict-inventory.py's
    # TokenBoundaryTests): grants exactly the read-only floor
    # swift-docs.yml's own jobs need, no more. A local (`./`) reusable
    # call is the only class exempt from declaring this.
    permissions:
      contents: read
    with:
      umbrella-module: ${{ inputs.docs-umbrella-module }}
      umbrella-display-name: ${{ inputs.docs-umbrella-display-name }}
      umbrella-bundle-id: ${{ inputs.docs-umbrella-bundle-id }}
      umbrella-docc-path: ${{ inputs.docs-umbrella-docc-path }}
      exclude-modules: ${{ inputs.docs-exclude-modules }}
      enable-private-repos: ${{ inputs.enable-private-repos }}
      swift-version: ${{ inputs.docs-swift-version }}
      # Full coordinate stays same-repo (swift-institute/.github calling
      # its own swift-docs.yml); target-repo/ref bind the DOCUMENTED
      # package's checkout, not this hop's own identity.
      target-repo: ${{ needs.plan.outputs.subject-repository }}
      ref: ${{ needs.plan.outputs.subject-sha }}
    secrets:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      SWIFT_INSTITUTE_BOT_APP_CLIENT_ID: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
      SWIFT_INSTITUTE_BOT_APP_ID: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_ID }}
      SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}

  # ─── Advisory results surface (informational, non-gating) ─────────────────
  # Renders one row per advisory leg (leg name + result) to the run summary so
  # advisory red is legible in ONE place, instead of scattered across the job
  # sidebar. Informational ONLY: it is excluded from ci-ok's needs (never a
  # merge gate) and carries `continue-on-error: true` so a rendering hiccup can
  # never fail the run. Keyed on always() + not-private + `inputs.job == ''`
  # EXACTLY like ci-ok, so it SKIPS on any single-job dispatch (preserving
  # ci-dispatch's exactly-one-job property) and runs only on push/PR. It carries
  # no `inputs.job == '<id>'` selector and is absent from ci-dispatch.yml's `job`
  # enum. `needs:` enumerates every advisory
  # leg per [CI-002] (the continue-on-error legs linux-nightly / linux-6-4 /
  # apple-simulator-build + the six nested advisory:true linters; swift-linter
  # is GATING — it sits in ci-ok's needs, not here).
  advisory-summary:
    name: Advisory results (informational)
    # Tier-gated (R2 ruling 2026-07-20): the advisory legs it renders run only
    # in the full tier, so the summary is meaningful only there. On lint/build
    # tiers it skips with the legs.
    if: ${{ !cancelled() && !github.event.repository.private && inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',advisory-summary,') }}
    continue-on-error: true
    needs:
      - plan
      - linux-nightly
      - linux-6-4
      - apple-simulator-build
      - lint-yaml
      - lint-broken-symlink
      - lint-license-header
      - lint-test-support-spine
      - lint-api-breakage
      - lint-pr-title
      # swift-institute/.github#276 Task 1-03: relocated Primitives-layer
      # advisory legs. Present here unconditionally (like every other
      # entry); on a non-Primitives run (lint-bundle != 'primitives') Plan
      # never selects them, so they report `skipped` — same shape as any
      # other advisory leg a given run doesn't select.
      - embedded
      - embedded-wasm-sdk
      - android-build
      - static-linux-musl-build
      # Task 4-01 (swift-institute/.github#276, #284): `docs` has its OWN
      # independent scheduling guard (tag/dispatch/schedule/token — not the
      # tier/legs system), so this entry reports `skipped` on every run
      # this job's own gate doesn't select, same shape as any other
      # advisory leg a given run doesn't select. Deleted alongside `docs`
      # at TX10.
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Render advisory leg results to the run summary
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          # Informational only — this job is excluded from ci-ok's needs and
          # never gates the merge. One row per advisory leg (name + result).
          # ubuntu-latest pre-installs jq.
          {
            echo "## Advisory leg results"
            echo ""
            echo "Informational only — advisory legs never gate the merge (see \`ci-ok\`)."
            echo ""
            echo "| Advisory leg | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries | sort_by(.key)[] | "| \(.key) | \(.value.result) |"' <<< "$NEEDS_JSON"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── Conclusion aggregator ────────────────────────────────────────────────
  # Single required-status-check name for branch protection. needs: lists
  # every job that should gate the merge. ci-ok succeeds iff the plan
  # succeeded, every gating job the plan SELECTED succeeded, every gating job
  # it did NOT select skipped, and at least one build leg actually compiled
  # the package.
  #
  # It used to be `all(.result == "success" or .result == "skipped")`, which
  # cannot distinguish the three ways a needed job reports `skipped`:
  #   (a) the plan did not select it for this tier   — legitimate
  #   (b) its `if:` guard drifted, its job id was renamed, or it was dropped
  #       from the matrix                            — an inert gate
  #   (c) no build leg was selected at all           — a green over nothing
  # (a) is now proved against `needs.plan.outputs.gating` rather than assumed;
  # (b) fails; (c) is refused in the plan AND again here. This is the
  # "fail closed on did-not-run" rule from §3 of VALIDATOR-DISCIPLINE.md in
  # swift-institute/Internal: scanned nothing must never be reportable as
  # found nothing.
  #
  # Rationale: branch protection on consumer repos requires only `ci-ok`
  # rather than every individual job name. Adding/removing jobs in this
  # workflow is a local edit (update needs:); branch-protection rules don't
  # need per-repo updates. Closes the M6 "required-check names interpolate
  # ${{ inputs.swift-version }}" drift class — ci-ok's name doesn't
  # interpolate anything.
  #
  # Excluded from needs: by design:
  #   - linux-nightly (continue-on-error: true; nightly toolchain
  #     instability is not the consumer's defect to fix)
  #   - All advisory linters (lint-yaml, lint-broken-symlink,
  #     lint-foundation-family-import [retired], lint-license-header,
  #     lint-test-support-spine, lint-api-breakage, lint-pr-title) — they
  #     pass with `with: { advisory: true }` and aren't gating until their
  #     respective γ-flips land
  ci-ok:
    # plan sits in needs (R1 ruling 2026-07-20): a plan failure (identity
    # conflict / classifier error) fails ci-ok even though every leg skips.
    # ci-ok attests "the SELECTED tier passed, and the selected tier built
    # the package"; the full PLATFORM contract still comes from tag refs and
    # the nightly ci-sweep rotation.
    if: ${{ always() && !github.event.repository.private && inputs.job == '' }}
    needs:
      - plan
      - macos-release
      - linux-release
      - windows-release
      - format
      - lint
      - swift-linter
    runs-on: ubuntu-latest
    # 60: same cold-bootstrap allowance as plan (F12).
    timeout-minutes: 60
    permissions:
      contents: read
      # TX7 receipt contract (swift-institute/.github#276 §8.9): this
      # aggregate alone reads its OWN run object and paginated jobs
      # collection to produce the preterminal effective runtime receipt.
      actions: read
    steps:
      # The body of this step is executed verbatim, against synthetic
      # NEEDS_JSON / PLANNED_GATING pairs, by
      # .github/scripts/tests/test-ci-ok-aggregate.py — which extracts it from
      # THIS file so the bytes under test are the bytes that ship. Keep the
      # step name stable; the extractor keys on it and fails if it is gone.
      - name: Checkout swift-institute/.github (receipt helper at this workflow's own ref)
        if: ${{ always() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          ref: ${{ job.workflow_sha }}
          path: institute-receipt

      # ─── F12: Institute CI bootstrap (see plan job comment; #358/#390).
      # Plan ran first in this same workflow run, so the exact-key entry is
      # normally warm; the cold path is byte-identical to plan's.
      - name: Institute CI source identity
        id: institute-ci-identity
        shell: bash
        run: |
          set -euo pipefail
          echo "sources-tree=$(git -C institute-receipt rev-parse "HEAD:Tools/institute-ci")" >> "$GITHUB_OUTPUT"
      - name: Restore Institute CI (exact key, acceleration only)
        id: institute-ci-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .institute-ci-entry
          key: institute-ci-${{ steps.institute-ci-identity.outputs.sources-tree }}-6e3861935041c9a92d873f0e444da1dd5b666fdb-linux-x86_64-swift-6.3-static
      - name: Swift toolchain (cold bootstrap only)
        if: ${{ steps.institute-ci-restore.outputs.cache-hit != 'true' }}
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9  # v1.14.0
        with:
          swift-version: "6.3"
      - name: Checkout Workspace at exact main pin (cold bootstrap only)
        if: ${{ steps.institute-ci-restore.outputs.cache-hit != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/Workspace
          ref: 6e3861935041c9a92d873f0e444da1dd5b666fdb
          path: .workspace
          persist-credentials: false
      - name: Cold bootstrap through the sanctioned Workspace coordinate
        if: ${{ steps.institute-ci-restore.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          SOURCES_TREE: ${{ steps.institute-ci-identity.outputs.sources-tree }}
        run: |
          set -euo pipefail
          # uuid-dev: the typed F2/F10 provisioning input (swift-linux-standard's
          # CLinuxKernelShim includes uuid/uuid.h); absent on the bare runner.
          sudo apt-get update -qq && sudo apt-get install -qq -y uuid-dev
          swift run --package-path .workspace/Application workspace package build --package-path "$GITHUB_WORKSPACE/institute-receipt/Tools/institute-ci" --argument=--static-swift-stdlib
          mkdir -p .institute-ci-entry/bin
          cp "$(find institute-receipt/Tools/institute-ci/.build -name institute-ci -type f -perm /111 | head -1)" .institute-ci-entry/bin/institute-ci
          .institute-ci-entry/bin/institute-ci bootstrap-manifest --workspace-revision 6e3861935041c9a92d873f0e444da1dd5b666fdb --sources-revision "$SOURCES_TREE" --toolchain swift-6.3 --os linux --arch x86_64 --provisioning uuid-dev,static-swift-stdlib --root .institute-ci-entry --executables bin/institute-ci --producer-run "$GITHUB_RUN_ID" > .institute-ci-entry/manifest.json
      - name: Verify Institute CI provenance before trust (fail closed)
        shell: bash
        env:
          SOURCES_TREE: ${{ steps.institute-ci-identity.outputs.sources-tree }}
        run: |
          set -euo pipefail
          .institute-ci-entry/bin/institute-ci bootstrap-verify --workspace-revision 6e3861935041c9a92d873f0e444da1dd5b666fdb --sources-revision "$SOURCES_TREE" --toolchain swift-6.3 --os linux --arch x86_64 --provisioning uuid-dev,static-swift-stdlib --root .institute-ci-entry --manifest .institute-ci-entry/manifest.json
      # Body executed by the Swift owner since F12 (#358/#390):
      # CI.Contract.AggregateVerdict in institute-ci, differentially proven
      # against the retired shell (F4/F11, exit-status equality across all
      # 20 aggregate shapes). Its exit status is the verdict; findings go
      # to stderr and the summary below.
      - name: Aggregate required-job results
        shell: bash
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          PLANNED_GATING: ${{ needs.plan.outputs.gating }}
          PLANNED_TIER: ${{ needs.plan.outputs.tier }}
          PLANNED_SUBJECT_REPOSITORY: ${{ needs.plan.outputs.subject-repository }}
          PLANNED_SUBJECT_SHA: ${{ needs.plan.outputs.subject-sha }}
          REQUIRE_FULL_TIER: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [ "$REQUIRE_FULL_TIER" = "true" ]; then
            FLAGS+=(--require-full-tier)
          fi
          RC=0
          VERDICT="$(.institute-ci-entry/bin/institute-ci aggregate --needs-json "$NEEDS_JSON" --gating "$PLANNED_GATING" --subject-repository "$PLANNED_SUBJECT_REPOSITORY" --subject-sha "$PLANNED_SUBJECT_SHA" --tier "$PLANNED_TIER" "${FLAGS[@]}" 2> >(tee /tmp/aggregate-findings.txt >&2))" || RC=$?
          {
            if [ "$RC" -eq 0 ]; then
              echo "## ci-ok: pass (tier \`${PLANNED_TIER:-unknown}\`, aggregated by institute-ci)"
            else
              echo "## ci-ok: FAIL (tier \`${PLANNED_TIER:-unknown}\`, aggregated by institute-ci)"
            fi
            echo ""
            echo "Gating legs selected by the plan: \`${PLANNED_GATING:-none}\`. Verdict: \`${VERDICT:-none}\`."
            if [ -s /tmp/aggregate-findings.txt ]; then
              echo ""
              echo '```'
              cat /tmp/aggregate-findings.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

      # ─── Effective runtime receipt (TX7, swift-institute/.github#276 §8.9) ──
      # Produced even when the aggregate above failed (a failure receipt is
      # a retained control, never P19 evidence). The helper is a pure base
      # canonicalizer resolved from THIS workflow's own ref; it never calls
      # GitHub itself and never asserts a terminal conclusion while this
      # run is in progress. The post-completion collector
      # (`institute-ci runtime-receipt-augment`, the F16 class C6 port of the
      # retired augment-effective-runtime-receipt.py) is invoked from
      # repository root after status=completed, never from this job.
      - name: Produce preterminal effective runtime receipt
        id: receipt
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLANNED_GATING: ${{ needs.plan.outputs.gating }}
          SUBJECT_REPOSITORY: ${{ needs.plan.outputs.subject-repository }}
          SUBJECT_SHA: ${{ needs.plan.outputs.subject-sha }}
        run: |
          set -euo pipefail
          # A sweep run carries one ci-ok — and so one receipt — PER swept
          # subject inside the same run; the artifact name must be unique
          # per subject or the collector's exactly-one lookup fails
          # (observed live: run 31009088381 produced two same-named
          # artifacts).
          echo "subject-slug=${SUBJECT_REPOSITORY//\//__}" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "$RUNNER_TEMP/run.json"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[]' | jq -s '{jobs: .}' > "$RUNNER_TEMP/jobs.json"
          mkdir -p "$RUNNER_TEMP/receipt"
          # F16: the receipt canonicalizer is `Institute.Receipt.Capture` +
          # `.Canonical` (C6). The binary is the one provisioned by this
          # job's own F12 bootstrap block above — no second channel, and
          # the same tree OID the plan decision was made with.
          .institute-ci-entry/bin/institute-ci runtime-receipt \
            --run-json "$RUNNER_TEMP/run.json" \
            --jobs-json "$RUNNER_TEMP/jobs.json" \
            --planned-gating "${PLANNED_GATING:-}" \
            --subject-repository "$SUBJECT_REPOSITORY" \
            --subject-sha "$SUBJECT_SHA" \
            --subject-visibility public \
            --output "$RUNNER_TEMP/receipt/effective-runtime-receipt.v1.base.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload effective runtime receipt artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: effective-runtime-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.receipt.outputs.subject-slug }}
          path: ${{ runner.temp }}/receipt/
          if-no-files-found: warn
          retention-days: 90
