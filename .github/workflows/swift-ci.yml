name: Swift CI (reusable)

# The universal reusable. Every package repository in the fleet calls it
# directly, in one hop, with no caller-selected behavior.
#
# Toolchain versions, runner images and the matrix shape are fixed here
# for the whole ecosystem. A package that needs a different shape forks
# this file; it does not parameterise it. Repository identity exceptions are
# authored in the central fleet policy and resolved by the Swift planner.
#
# Scheduling is decided by `institute-continuous-integration`, not here:
# `plan` emits the leg list and every job binds it. There is exactly one
# list of what is expected to run, which is what lets `ci-ok` fail a
# gating leg that skipped without the plan having excluded it.

on:
  workflow_call:

env:
  SWIFT_VERSION: "6.4"
  SWIFTLINT_VERSION: "0.63.3"
  SWIFTLINT_SHA256: "26db741d43f2f2dc26c0cf16911100a3e186c3d1dbb59e55ad3ac87b0de4538f"
  SWIFTLINT_BINARY_SHA256: "eb52b0b602f51dccc8be5e09a9bdd1d0b04147cfa782f5a3e1ee407b4b793d0b"

  # The sole main-nightly exception. Advisory class: past the recheck date
  # the planner deschedules the leg fleet-wide with a typed record rather
  # than failing every consumer's required check, and only this repository
  # fails closed. Malformed fields fail closed everywhere.
  SWIFT_MAIN_NIGHTLY_IMAGE: "swiftlang/swift@sha256:f577f95edfb85cf3bdc45eb0badaab09239de5c86c69b3b6d594cc62916c0a7d"
  SWIFT_MAIN_NIGHTLY_UPSTREAM_ISSUE: "https://github.com/swiftlang/swift/issues/90275"
  SWIFT_MAIN_NIGHTLY_RECHECK: "2026-09-14"

  # The sole release-floor exception. `swift:6.4` does not exist on Docker
  # Hub, so the containerised Linux legs would die at container init before
  # checkout. Until upstream publishes it they run the 6.4.x nightly by
  # exact digest — noble, not jammy, because the pinned SwiftLint and
  # swift-linter binaries need GLIBC_2.38+ and jammy dies at `--version`.
  #
  # Retiring this is a deletion, not a rewrite: remove these three values
  # and the planner resolves `swift:6.4` with no other edit anywhere.
  SWIFT_RELEASE_FLOOR_IMAGE: "swiftlang/swift@sha256:8d614165059587ce9dcf6727a76aeff4cbf1cde41fde9a9281a43803be736224"
  SWIFT_RELEASE_FLOOR_UPSTREAM_RELEASE: "https://github.com/swiftlang/swift/releases/tag/swift-6.4-RELEASE"
  SWIFT_RELEASE_FLOOR_RECHECK: "2026-09-09"

  # The fleet's only Xcode pin. A caller's workflow-level `env:` does not
  # cross into a called reusable, so a layer-side pin would be inert.
  XCODE_VERSION: "27.0"

jobs:
# Top-level job names are intentionally static. GitHub may render
# unresolved input or matrix expressions literally when a job is skipped
# before those contexts are expanded; dynamic detail belongs in steps
# and summaries instead.
  plan:
    name: Plan
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    # No longer builds anything: the binary is downloaded and verified.
    timeout-minutes: 10
    # The generated caller grants `actions: read` and `contents: read`, and a
    # called workflow cannot exceed that intersection — asking for anything
    # more fails the run at startup, before a single job is scheduled. The
    # plan reads the event's changed files and the run's resolved reusable
    # workflow identity through `gh`; the caller grants both `actions: read`
    # and `contents: read` for those public-repository reads.
    permissions:
      actions: read
      contents: read
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      legs: ${{ steps.classify.outputs.legs }}
      gating: ${{ steps.classify.outputs.gating }}
      descheduled: ${{ steps.classify.outputs.descheduled }}
      package-content-changed: ${{ steps.classify.outputs.package-content-changed }}
      linux-image: ${{ steps.classify.outputs.linux-image }}
      lint-bundle: ${{ steps.classify.outputs.lint-bundle }}
      embedded-target: ${{ steps.classify.outputs.embedded-target }}
      subject-repository: ${{ steps.subject.outputs.repository }}
      subject-sha: ${{ steps.subject.outputs.sha }}
      workflow-sha: ${{ steps.workflow.outputs.sha }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # Resolved once, here, and consumed by every other job. Ten sites
      # once carried their own copy of this fallback and one of them
      # resolved the target repository independently of the ref, so a
      # dispatch checked out one repository at another's SHA.
      - name: Resolve CI subject
        id: subject
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
          TRIGGER_REPOSITORY: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            REPOSITORY="$PR_REPOSITORY"; SHA="$PR_SHA"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            # The subject of a merge-group run is the candidate merge
            # result the queue asks about — the event's own head_sha,
            # named explicitly rather than inherited from the trigger
            # context, for the same reason the pull_request branch names
            # its head rather than trusting a fallback.
            REPOSITORY="$TRIGGER_REPOSITORY"; SHA="$MERGE_GROUP_SHA"
          else
            REPOSITORY="$TRIGGER_REPOSITORY"; SHA="$TRIGGER_SHA"
          fi
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::resolved subject SHA '$SHA' is not a commit SHA; refusing to attest an unspecified revision."
            exit 1
          }
          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve exact reusable workflow revision
        id: workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          TRIGGER_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          matches="$(gh api "repos/${TRIGGER_REPOSITORY}/actions/runs/${RUN_ID}" | jq -c '
            [
              .referenced_workflows[]?
              | select(.path | startswith("swift-institute/.github/.github/workflows/swift-ci.yml@"))
            ]
          ')"
          if [ "$(jq 'length' <<< "$matches")" -ne 1 ]; then
            echo "::error::expected one resolved swift-ci.yml reference, found $(jq 'length' <<< "$matches")."
            exit 1
          fi
          SHA="$(jq -er '.[0].sha | select(test("^[0-9a-f]{40}$"))' <<< "$matches")"
          REQUESTED="$(jq -er '.[0].path' <<< "$matches")"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "requested=$REQUESTED" >> "$GITHUB_OUTPUT"
          echo "Resolved reusable workflow: ${REQUESTED} -> ${SHA}"

      - uses: swift-institute/.github/.github/actions/ci-subject@158ced2c7bef660e3c663e0989a8529ad1d65ad7
        with:
          repository: ${{ steps.subject.outputs.repository }}
          sha: ${{ steps.subject.outputs.sha }}

      - id: institute-ci
        uses: swift-institute/.github/.github/actions/institute-ci@158ced2c7bef660e3c663e0989a8529ad1d65ad7

      - name: Materialize fleet policy at the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          ref: ${{ steps.workflow.outputs.sha }}
          path: .ci-policy
          sparse-checkout: .github/policy/fleet.json
          persist-credentials: false

      - name: Validate package
        shell: bash
        env:
          BINARY: ${{ steps.institute-ci.outputs.binary }}
        run: |
          "$BINARY" package validate \
            --repository "${{ steps.subject.outputs.repository }}" \
            --root "$GITHUB_WORKSPACE" \
            --policy "$GITHUB_WORKSPACE/.ci-policy/.github/policy/fleet.json"

      - name: Classify
        id: classify
        shell: bash
        env:
          BINARY: ${{ steps.institute-ci.outputs.binary }}
          # The package-content predicate reads the event's file list
          # through `gh`, which authenticates from the environment only.
          GH_TOKEN: ${{ github.token }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          PLAN="$("$BINARY" package plan \
            --ref "$GITHUB_REF" \
            --head-message "$HEAD_MESSAGE" \
            --event "${{ github.event_name }}" --event-path "$GITHUB_EVENT_PATH" \
            --workflow-repository "${{ github.repository }}" --workspace "$GITHUB_WORKSPACE" \
            --policy "$GITHUB_WORKSPACE/.ci-policy/.github/policy/fleet.json" \
            --subject-repository "${{ steps.subject.outputs.repository }}" \
            --swift-version "$SWIFT_VERSION" \
            --nightly-main-image "$SWIFT_MAIN_NIGHTLY_IMAGE" \
            --nightly-main-upstream-issue "$SWIFT_MAIN_NIGHTLY_UPSTREAM_ISSUE" \
            --nightly-main-recheck "$SWIFT_MAIN_NIGHTLY_RECHECK" \
            --release-floor-image "$SWIFT_RELEASE_FLOOR_IMAGE" \
            --release-floor-upstream-release "$SWIFT_RELEASE_FLOOR_UPSTREAM_RELEASE" \
            --release-floor-recheck "$SWIFT_RELEASE_FLOOR_RECHECK" \
            --today "$(date -u +%F)")"
          for key in tier legs gating linux-image lint-bundle embedded-target descheduled package-content-changed; do
            echo "$key=$(jq -r --arg k "$key" '.[$k]' <<< "$PLAN")" >> "$GITHUB_OUTPUT"
          done
          {
            echo "## Tier \`$(jq -r .tier <<< "$PLAN")\`"
            echo "Legs: \`$(jq -r .legs <<< "$PLAN")\`"
            echo "Gating: \`$(jq -r .gating <<< "$PLAN")\`"
            D="$(jq -r .descheduled <<< "$PLAN")"
            # An `if`, not `[ -n "$D" ] && …`: the test is the last command in
            # this group, so on the ordinary empty case the && chain returns 1,
            # the group returns 1, and `set -e` fails the step after every
            # output has already been written — a silent failure with a clean
            # log above it.
            if [ -n "$D" ]; then
              echo "> [!WARNING]"
              echo "> Descheduled: \`$D\` — an exception has expired."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
  linux-release:
    name: Build · Linux · release
    needs: plan
    if: ${{ !github.event.repository.private && !cancelled() && contains(format(',{0},', needs.plan.outputs.legs), ',linux-release,') }}
    runs-on: ubuntu-latest
    container: ${{ needs.plan.outputs.linux-image }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: swift-institute/.github/.github/actions/ci-subject@158ced2c7bef660e3c663e0989a8529ad1d65ad7
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          sha: ${{ needs.plan.outputs.subject-sha }}
      - uses: swift-institute/.github/.github/actions/install-system-deps@158ced2c7bef660e3c663e0989a8529ad1d65ad7
      - name: Build or test
        env:
          CI_TIER: ${{ needs.plan.outputs.tier }}
        run: |
          swift --version
          if [ "$CI_TIER" = "build" ]; then swift build -c release; exit 0; fi
          test_package() {
            swift test -c release
          }
          test_package
          if [ -f Tests/Package.swift ]; then (cd Tests && test_package); fi
  linux-6-4:
    name: Build · Linux · 6.4
    needs: plan
    if: ${{ !github.event.repository.private && !cancelled() && contains(format(',{0},', needs.plan.outputs.legs), ',linux-6-4,') }}
    runs-on: ubuntu-latest
    container: ${{ needs.plan.outputs.linux-image }}
    continue-on-error: true
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: swift-institute/.github/.github/actions/ci-subject@158ced2c7bef660e3c663e0989a8529ad1d65ad7
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          sha: ${{ needs.plan.outputs.subject-sha }}
      - uses: swift-institute/.github/.github/actions/install-system-deps@158ced2c7bef660e3c663e0989a8529ad1d65ad7
      - name: Build
        run: |
          swift --version
          swift build -c release
  linux-nightly:
    name: Build · Linux · nightly
    needs: plan
    if: ${{ !github.event.repository.private && !cancelled() && contains(format(',{0},', needs.plan.outputs.legs), ',linux-nightly,') }}
    runs-on: ubuntu-latest
    container: swiftlang/swift@sha256:f577f95edfb85cf3bdc45eb0badaab09239de5c86c69b3b6d594cc62916c0a7d
    continue-on-error: true
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: swift-institute/.github/.github/actions/ci-subject@158ced2c7bef660e3c663e0989a8529ad1d65ad7
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          sha: ${{ needs.plan.outputs.subject-sha }}
      - uses: swift-institute/.github/.github/actions/install-system-deps@158ced2c7bef660e3c663e0989a8529ad1d65ad7
      - name: Build
        run: |
          swift --version
          swift build -c release
  windows-release:
    name: Build · Windows · release
    needs: plan
    if: ${{ !github.event.repository.private && !cancelled() && contains(format(',{0},', needs.plan.outputs.legs), ',windows-release,') }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: swift-institute/.github/.github/actions/ci-subject@158ced2c7bef660e3c663e0989a8529ad1d65ad7
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          sha: ${{ needs.plan.outputs.subject-sha }}
      - uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
          # setup-swift does not support snapshot caching for current Swift
          # on Windows. Reusing the restored 1.7 GB installation produced
          # process-level crashes during dependency resolution across
          # unrelated repositories (segmentation fault and illegal
          # instruction). Install and verify the exact assertions snapshot
          # afresh instead of trusting that unsupported cache path.
          cache-snapshot: false
      # Never relaxed and never continue-on-error: this is the fleet's only
      # assertions-enabled compiler, and therefore its only SIL-validity gate.
      - name: Test
        shell: bash
        run: |
          swift --version
          test_package() {
            scratch="$1"
            swift test -c debug --build-system native --scratch-path "$scratch"
          }
          # [swift-institute/.github#498] Swift Build expands every linked module
          # into a separate response-file argument and can exceed Windows'
          # process command-length boundary.
          # The native build system preserves the assertions compiler and complete
          # test surface without that whole-closure Libtool invocation. The short
          # absolute build prefix independently bounds intermediate paths.
          test_package C:/b
          if [ -f Tests/Package.swift ]; then (cd Tests && test_package C:/t); fi
  macos-release:
    name: Build · Apple · macOS
    needs: plan
    if: ${{ !github.event.repository.private && !cancelled() && contains(format(',{0},', needs.plan.outputs.legs), ',macos-release,') }}
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: swift-institute/.github/.github/actions/ci-subject@158ced2c7bef660e3c663e0989a8529ad1d65ad7
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          sha: ${{ needs.plan.outputs.subject-sha }}
      # This leg's Swift version comes from the Xcode pin, not from
      # SWIFT_VERSION — which reaches it only through the job name. Move
      # the two together or the name overstates the toolchain.
      - run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Test
        run: |
          swift --version
          test_package() {
            swift test -c debug
          }
          test_package
          if [ -f Tests/Package.swift ]; then (cd Tests && test_package); fi
  embedded:
    name: Extended · Embedded
    needs: plan
    if: ${{ !github.event.repository.private && !cancelled() && contains(format(',{0},', needs.plan.outputs.legs), ',embedded,') }}
    runs-on: ubuntu-latest
    container: swiftlang/swift@sha256:f577f95edfb85cf3bdc45eb0badaab09239de5c86c69b3b6d594cc62916c0a7d
    continue-on-error: true
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: swift-institute/.github/.github/actions/ci-subject@158ced2c7bef660e3c663e0989a8529ad1d65ad7
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          sha: ${{ needs.plan.outputs.subject-sha }}
      # No `.build` cache here, ever. The key can only hash manifests, so
      # it is blind to the nightly toolchain and to branch-pinned
      # dependency contents; a restored entry once turned this leg green
      # in ten seconds with zero compilation, fleet-wide.
      - name: Build (Embedded)
        env:
          TARGET: ${{ needs.plan.outputs.embedded-target }}
        run: |
          swift --version
          if [ -n "$TARGET" ]; then
            swift build --target "$TARGET" \
              -Xswiftc -enable-experimental-feature -Xswiftc Embedded
          else
            swift build -Xswiftc -enable-experimental-feature -Xswiftc Embedded
          fi
  embedded-wasm-sdk:
    name: Extended · Wasm
    needs: plan
    if: ${{ !github.event.repository.private && !cancelled() && contains(format(',{0},', needs.plan.outputs.legs), ',embedded-wasm-sdk,') }}
    runs-on: ubuntu-latest
    container: ${{ needs.plan.outputs.linux-image }}
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: swift-institute/.github/.github/actions/ci-subject@158ced2c7bef660e3c663e0989a8529ad1d65ad7
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          sha: ${{ needs.plan.outputs.subject-sha }}
      - uses: swift-institute/.github/.github/actions/install-swift-sdk@158ced2c7bef660e3c663e0989a8529ad1d65ad7
        with:
          platform: wasm-sdk
          bundle-suffix: wasm
          sdk-id: ${TAG}_wasm-embedded
          output-env-var: WASM_SDK_ID
      - run: swift build --swift-sdk "${WASM_SDK_ID}"
  android-build:
    name: Extended · Android
    needs: plan
    if: ${{ !github.event.repository.private && !cancelled() && contains(format(',{0},', needs.plan.outputs.legs), ',android-build,') }}
    runs-on: ubuntu-latest
    container: ${{ needs.plan.outputs.linux-image }}
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: swift-institute/.github/.github/actions/ci-subject@158ced2c7bef660e3c663e0989a8529ad1d65ad7
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          sha: ${{ needs.plan.outputs.subject-sha }}
      - uses: swift-institute/.github/.github/actions/install-swift-sdk@158ced2c7bef660e3c663e0989a8529ad1d65ad7
        with:
          platform: android-sdk
          bundle-suffix: android
          sdk-id: ${TAG}_android
          output-env-var: ANDROID_SDK_ID
      - run: swift build --swift-sdk "${ANDROID_SDK_ID}"
  static-linux-musl-build:
    name: Extended · static musl
    needs: plan
    if: ${{ !github.event.repository.private && !cancelled() && contains(format(',{0},', needs.plan.outputs.legs), ',static-linux-musl-build,') }}
    runs-on: ubuntu-latest
    container: ${{ needs.plan.outputs.linux-image }}
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: swift-institute/.github/.github/actions/ci-subject@158ced2c7bef660e3c663e0989a8529ad1d65ad7
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          sha: ${{ needs.plan.outputs.subject-sha }}
      - uses: swift-institute/.github/.github/actions/install-swift-sdk@158ced2c7bef660e3c663e0989a8529ad1d65ad7
        with:
          platform: static-sdk
          bundle-suffix: static-linux
          use-platform-version: 'true'
          sdk-id: x86_64-swift-linux-musl
      - run: swift build --swift-sdk x86_64-swift-linux-musl
  apple-simulator-build:
    # Deliberately free of `matrix.platform`. A skipped matrix job never
    # expands, so a name referring to the matrix has nothing to substitute
    # and GitHub renders the template literally. This leg is exhaustive-tier
    # only and therefore skipped in almost every run, so the unexpanded
    # state is the one that is actually read.
    name: Extended · Apple Simulator
    needs: plan
    if: ${{ !github.event.repository.private && !cancelled() && contains(format(',{0},', needs.plan.outputs.legs), ',apple-simulator-build,') }}
    runs-on: xcode-27
    continue-on-error: true
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, watchOS, visionOS]
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: swift-institute/.github/.github/actions/ci-subject@158ced2c7bef660e3c663e0989a8529ad1d65ad7
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          sha: ${{ needs.plan.outputs.subject-sha }}
      - run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Build (${{ matrix.platform }} Simulator)
        run: |
          swift --version
          xcodebuild build -scheme "$(xcodebuild -list -json | jq -r '.workspace.schemes[0] // .project.targets[0]')" \
            -destination "generic/platform=${{ matrix.platform }} Simulator"
  format:
    name: Quality · swift-format
    needs: plan
    if: ${{ !github.event.repository.private && !cancelled() && contains(format(',{0},', needs.plan.outputs.legs), ',format,') }}
    runs-on: ubuntu-latest
    container: ${{ needs.plan.outputs.linux-image }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: swift-institute/.github/.github/actions/ci-subject@158ced2c7bef660e3c663e0989a8529ad1d65ad7
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          sha: ${{ needs.plan.outputs.subject-sha }}
      - uses: swift-institute/.github/.github/actions/central-style@158ced2c7bef660e3c663e0989a8529ad1d65ad7
        with:
          ref: ${{ needs.plan.outputs.workflow-sha }}
      - name: Lint formatting
        shell: bash
        run: |
          set -euo pipefail
          swift-format --version
          # Excluded: DocC tutorial samples and test fixture/tutorial
          # modules are didactic code, held to different rules than the
          # sources they teach.
          mapfile -d '' files < <(find Sources Tests -name '*.swift' \
            -not -path '*/*.docc/Resources/*' \
            -not -path 'Tests/Support/*' \
            -not -path 'Tests/Tutorial/*' \
            -not -path '*/Fixtures/*' \
            -print0 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then echo "No Swift files to lint."; exit 0; fi
          swift-format lint --strict --ignore-unparsable-files "${files[@]}"
  lint:
    name: Quality · SwiftLint
    needs: plan
    if: ${{ !github.event.repository.private && !cancelled() && contains(format(',{0},', needs.plan.outputs.legs), ',lint,') }}
    runs-on: ubuntu-latest
    container: ${{ needs.plan.outputs.linux-image }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: swift-institute/.github/.github/actions/ci-subject@158ced2c7bef660e3c663e0989a8529ad1d65ad7
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          sha: ${{ needs.plan.outputs.subject-sha }}
      - uses: swift-institute/.github/.github/actions/central-style@158ced2c7bef660e3c663e0989a8529ad1d65ad7
        with:
          ref: ${{ needs.plan.outputs.workflow-sha }}
      - name: Cache SwiftLint binary
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/swiftlint
          key: ${{ runner.os }}-swiftlint-${{ env.SWIFTLINT_VERSION }}-${{ env.SWIFTLINT_BINARY_SHA256 }}
      - name: Install SwiftLint
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq && apt-get install -qq -y curl unzip
          curl -fsSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          echo "${SWIFTLINT_SHA256}  /tmp/swiftlint.zip" | sha256sum -c -
          unzip -q /tmp/swiftlint.zip -d /tmp/swiftlint_extracted
          mv /tmp/swiftlint_extracted/swiftlint /usr/local/bin/
          chmod +x /usr/local/bin/swiftlint
      - name: Verify installed SwiftLint binary
        shell: bash
        run: |
          set -euo pipefail
          echo "${SWIFTLINT_BINARY_SHA256}  /usr/local/bin/swiftlint" | sha256sum -c -
      - name: Lint
        run: |
          swiftlint --version
          swiftlint lint --strict --reporter github-actions-logging
  swift-linter:
    name: Quality · swift-linter
    needs: plan
    if: ${{ !github.event.repository.private && !cancelled() && contains(format(',{0},', needs.plan.outputs.legs), ',swift-linter,') }}
    runs-on: ubuntu-latest
    container: ${{ needs.plan.outputs.linux-image }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: swift-institute/.github/.github/actions/ci-subject@158ced2c7bef660e3c663e0989a8529ad1d65ad7
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          sha: ${{ needs.plan.outputs.subject-sha }}
      # Installed, never compiled. A from-source build let one break in
      # the tool's own dependency graph redden this leg across the fleet.
      - name: Install published linter binaries
        shell: bash
        env:
          RELEASE: https://github.com/swift-foundations/swift-linter/releases/download/ci-binaries
        run: |
          set -euo pipefail
          apt-get update -qq && apt-get install -qq -y curl uuid-dev
          work="$(mktemp -d)"
          # MANIFEST.txt is checksummed alongside the binaries by the
          # publisher, so `--check` fails on its absence rather than
          # skipping it. Downloading it is what makes the check complete.
          for asset in SHA256SUMS swift-linter swift-linter-runner MANIFEST.txt; do
            curl --fail --silent --show-error --location --retry 2 \
              --output "$work/$asset" "$RELEASE/$asset"
          done
          (cd "$work" && sha256sum --check SHA256SUMS)
          install -m 0755 "$work/swift-linter" "$work/swift-linter-runner" /usr/local/bin/
      # A clean verdict over nothing is not a pass: the runner refuses
      # when it loads zero rules or matches zero files.
      - name: Run swift-linter
        env:
          SWIFT_LINTER_BUNDLE: ${{ needs.plan.outputs.lint-bundle }}
        run: |
          if [ -f Lint.swift ]; then
            swift-linter "$GITHUB_WORKSPACE" --exit-policy strict
          else
            swift-linter-runner "$GITHUB_WORKSPACE" --exit-policy strict
          fi
  advisory-summary:
    name: Advisory results
    needs:
      - plan
      - linux-6-4
      - linux-nightly
      - apple-simulator-build
      - embedded
      - embedded-wasm-sdk
      - android-build
      - static-linux-musl-build
    if: ${{ !github.event.repository.private && !cancelled() && contains(format(',{0},', needs.plan.outputs.legs), ',advisory-summary,') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Render advisory results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          DESCHEDULED: ${{ needs.plan.outputs.descheduled }}
        run: |
          set -euo pipefail
          {
            echo "## Advisory legs"
            echo "Informational only — these never gate the merge."
            echo ""
            echo "| Leg | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries | sort_by(.key)[] | select(.key != "plan") | "| \(.key) | \(.value.result) |"' <<< "$NEEDS_JSON"
            # `if`, not `&&`: this is the group's last command and the group
            # is the script's last, so on the ordinary empty case the chain's
            # status becomes the step's and set -e fails it. The two other
            # `&&` chains in this file are safe — one is followed by further
            # commands, the other by an explicit `exit`.
            if [ -n "$DESCHEDULED" ]; then
              echo ""
              echo "> [!WARNING]"
              echo "> Descheduled: \`$DESCHEDULED\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The single required status check. It attests that the SELECTED tier
  # passed and that the selected tier compiled the package — a gating leg
  # that skipped without the plan excluding it fails the run, because
  # scanned-nothing must never be reportable as found-nothing.
  ci-ok:
    name: ci-ok
    needs:
      - plan
      - linux-release
      - macos-release
      - windows-release
      - format
      - lint
      - swift-linter
    if: ${{ always() && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          ref: ${{ needs.plan.outputs.workflow-sha }}
      - id: institute-ci
        uses: swift-institute/.github/.github/actions/institute-ci@158ced2c7bef660e3c663e0989a8529ad1d65ad7
      # Runs on always(), so it must reach a verdict when plan itself
      # failed — which is exactly when its outputs are empty.
      - name: Aggregate
        shell: bash
        env:
          BINARY: ${{ steps.institute-ci.outputs.binary }}
          NEEDS_JSON: ${{ toJson(needs) }}
          # The integration ref and the merge group are both merge
          # verification: the aggregate refuses any plan that classified
          # below the full tier there.
          REQUIRE_FULL_TIER: ${{ github.ref == 'refs/heads/main' || github.event_name == 'merge_group' }}
        run: |
          set -euo pipefail
          FLAGS=()
          [ "$REQUIRE_FULL_TIER" = "true" ] && FLAGS+=(--require-full-tier)
          RC=0
          VERDICT="$("$BINARY" package aggregate \
            --needs-json "$NEEDS_JSON" \
            --gating "${{ needs.plan.outputs.gating }}" \
            --subject-repository "${{ needs.plan.outputs.subject-repository }}" \
            --subject-sha "${{ needs.plan.outputs.subject-sha }}" \
            --tier "${{ needs.plan.outputs.tier }}" \
            --package-content-changed "${{ needs.plan.outputs.package-content-changed }}" \
            --descheduled "${{ needs.plan.outputs.descheduled }}" \
            "${FLAGS[@]}" 2> >(tee /tmp/findings >&2))" || RC=$?
          {
            echo "## ci-ok: ${VERDICT:-fail}"
            echo "Tier \`${{ needs.plan.outputs.tier }}\`, gating \`${{ needs.plan.outputs.gating }}\`."
            [ -s /tmp/findings ] && { echo '```'; cat /tmp/findings; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"
