  # every push so 6.4 breakage surfaces continuously, but must not gate,
  # because a NIGHTLY container can turn a repository green→red with no commit
  # in between. That is accepted, not broken — do not hunt for the causing
  # change; there may not be one.
  #
  # COST OF GATING, measured 2026-07-28 over the 454 repos of a full 7-night
  # rotation: 158 (35%) failed, but 96 already fail the 6.3 gating leg, so 62
  # would go NEWLY red and 296 passed. FORTY-TWO of the 62 are one cause —
  # swift-linux-standard's io_uring sources reference IORING_POLL_ADD_LEVEL /
  # IORING_TIMEOUT_MULTISHOT, out of scope in this container and reached
  # transitively — so fixing one package clears two thirds. Rest: 7 compile
  # errors, 5 the Issues#58 upstream compiler-abort class (unfixable here), 8
  # mixed incl. a Docker pull failure — gating on a nightly makes a registry
  # hiccup a red. Re-measure before flipping; these numbers move.
  linux-6-4:
    name: Ubuntu (Swift 6.4.x nightly, release)
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'linux-6-4' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',linux-6-4,'))) && (inputs.platform-support == '' || contains(format(',{0},', inputs.platform-support), ',linux,')) }}
    runs-on: ubuntu-latest
    container: swiftlang/swift:nightly-6.4.x-jammy
    continue-on-error: true
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          ref: ${{ needs.plan.outputs.subject-ref }}
          persist-credentials: false

      - name: Verify checked-out subject HEAD
        shell: bash
        env:
          SUBJECT_SHA: ${{ needs.plan.outputs.subject-sha }}
        run: |
          set -euo pipefail
          # Job-level `container:` steps execute via a fresh `docker exec`
          # per step, so a bare shell `git` call sees the checkout owned by
          # the runner's host UID and refuses it as dubious ownership
          # (2.35.2+) — unlike actions/checkout's own internal git calls two
          # steps up, which already registered the path for themselves. A
          # no-op on bare macOS/Windows runners; trusts nothing beyond what
          # actions/checkout just placed in this same job.
          git config --global --add safe.directory '*'
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$SUBJECT_SHA" ]; then
            echo "::error::checked-out HEAD '$ACTUAL' does not match Plan's resolved CI subject SHA '$SUBJECT_SHA'. Refusing to proceed against an unverified checkout."
            exit 1
          fi

      - uses: swift-institute/.github/.github/actions/configure-private-repos@d1af72d05bf8262fb3918a2f1607b82fafcafdf9  # main 2026-08-03 (pin-advance)
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          app-client-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
          app-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_ID }}
          app-private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          enabled: ${{ inputs.enable-private-repos }}

      - uses: swift-institute/.github/.github/actions/install-system-deps@d1af72d05bf8262fb3918a2f1607b82fafcafdf9  # main 2026-08-03 (pin-advance); pin does not cover apt-fetched packages

      - name: Print toolchain info
        run: |
          swift --version
          echo "Container image: ${{ job.container.image }}"
          echo "Container hostname: $(hostname)"
          echo "OS release:"
          cat /etc/os-release 2>/dev/null || true

      - name: Build or test (release)
        env:
          CI_TIER: ${{ needs.plan.outputs.tier }}
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          # The 6.4 nightly is advisory on the fast build tier, but it must
          # still compile the same release configuration. Full qualification
          # and single-job dispatch retain the release test corpus below.
          if [ "$CI_TIER" = "build" ]; then
            swift build -c release
            exit 0
          fi
          # [swift-institute/.github#165] Detect the sanctioned nested-test-package
          # layout (Tests/Package.swift) and run its tests instead of a root
          # `swift test` that silently discovers zero tests and exits green.
          # (POSIX sh — no bash arrays: some legs run inside a container image
          # where `sh` is the default step shell.)
          if [ -f Tests/Package.swift ]; then
            echo "Nested test package detected (Tests/Package.swift); running tests from Tests/"
            cd Tests
          fi
          if [ -n "$TEST_FILTER" ]; then
            FILTER=$(echo "$TEST_FILTER" | tr '-' '_')
            swift test -c release --filter "$FILTER"
          else
            swift test -c release
          fi

  windows-release:
    name: Windows (Swift ${{ inputs.swift-version }}, debug)
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'windows-release' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',windows-release,'))) && (inputs.platform-support == '' || contains(format(',{0},', inputs.platform-support), ',windows,')) }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          ref: ${{ needs.plan.outputs.subject-ref }}
          persist-credentials: false

      - name: Verify checked-out subject HEAD
        shell: bash
        env:
          SUBJECT_SHA: ${{ needs.plan.outputs.subject-sha }}
        run: |
          set -euo pipefail
          # Job-level `container:` steps execute via a fresh `docker exec`
          # per step, so a bare shell `git` call sees the checkout owned by
          # the runner's host UID and refuses it as dubious ownership
          # (2.35.2+) — unlike actions/checkout's own internal git calls two
          # steps up, which already registered the path for themselves. A
          # no-op on bare macOS/Windows runners; trusts nothing beyond what
          # actions/checkout just placed in this same job.
          git config --global --add safe.directory '*'
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$SUBJECT_SHA" ]; then
            echo "::error::checked-out HEAD '$ACTUAL' does not match Plan's resolved CI subject SHA '$SUBJECT_SHA'. Refusing to proceed against an unverified checkout."
            exit 1
          fi

      - uses: swift-institute/.github/.github/actions/configure-private-repos@d1af72d05bf8262fb3918a2f1607b82fafcafdf9  # main 2026-08-03 (pin-advance)
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          app-client-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
          app-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_ID }}
          app-private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          enabled: ${{ inputs.enable-private-repos }}

      - name: Install Swift
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9  # v1.14.0
        with:
          swift-version: ${{ inputs.swift-version }}

      - name: Print toolchain info
        run: |
          swift --version
          echo "Runner: ${{ runner.os }}"
          echo "Hostname: $(hostname)"

      - name: Test
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          if ("$env:TEST_FILTER") {
            $filter = $env:TEST_FILTER -replace '-', '_'
            $filterArgs = @('--filter', $filter)
          } else {
            $filterArgs = @()
          }
          # [swift-institute/.github#498] `--build-system native`.
          #
          # Swift Build is SwiftPM's DEFAULT build system on Windows only (since
          # 6.2); the macOS and Linux legs above already run the native build
          # system. On a large dependency closure Swift Build emits a per-product
          # `Libtool` task whose command line names ONE `@<module>.objlib/args.resp`
          # response file PER MODULE in the transitive closure, and that list of
          # `@` paths is itself passed as argv. Past ~250 modules the argv exceeds
          # the Windows CreateProcess 32,767-character ceiling and llvm-lib.exe
          # cannot be spawned at all:
          #   error: unable to spawn process '...\llvm-lib.exe'
          #          (The filename or extension is too long.)
          # Measured on the six fleet repositories this gated (2026-08-09):
          # swift-machine-primitives 883 entries / 125,991 argv bytes;
          # swift-{spm,rss,mailgun,github,email}-standard 349-363 entries /
          # 45.4-50.0 KB. Shortening the build path (`--scratch-path C:\b`) is
          # arithmetically INSUFFICIENT, not merely marginal: it takes
          # swift-machine-primitives to 75,660 bytes, and even a zero-length
          # directory prefix leaves 41,223 bytes of bare module names — still over
          # the ceiling. The one-response-file-per-module shape, not the path
          # length, is the defect, and consolidating it is a swift-build fix we do
          # not own.
          #
          # The native build system has no whole-closure product `Libtool` step —
          # it archives per target and links the test executable directly — so the
          # class does not arise. Selecting it here costs no coverage: same
          # compiler, same +Asserts toolchain, so the Windows leg remains the
          # fleet's SIL-validity gate. This is NOT platform narrowing and NOT a
          # cost knob; remove the flag when swift-build consolidates the Libtool
          # response files upstream.
          $buildSystemArgs = @('--build-system', 'native')
          # [swift-institute/.github#165] Detect the sanctioned nested-test-package
          # layout (Tests/Package.swift) and run its tests instead of a root
          # `swift test` that silently discovers zero tests and exits green.
          if (Test-Path "Tests/Package.swift") {
            Write-Host "Nested test package detected (Tests/Package.swift); running tests from Tests/"
            Push-Location Tests
            swift test -c debug @buildSystemArgs @filterArgs
            $exitCode = $LASTEXITCODE
            Pop-Location
            if ($exitCode -ne 0) { exit $exitCode }
          } else {
            swift test -c debug @buildSystemArgs @filterArgs
          }

  # Apple-simulator build — the resource-bundle CodeSign gate. `swift build`/
  # `swift test` never run that phase; `xcodebuild` against a simulator
  # destination does, making this the only leg that catches bundles failing iOS
  # codesign. Known trigger: a resource bundle with a top-level `Resources`
  # directory (from `.copy("Resources")`) collides with the reserved bundle
  # layout — "bundle format unrecognized, invalid, or unsuitable" — invisible
  # to `swift test`; fix by renaming the copied dir. Per [CI-091] all four
  # Apple simulator platforms are covered and never collapsed.
  apple-simulator-build:
    name: ${{ matrix.platform }} Simulator (Swift ${{ inputs.swift-version }}, debug)
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'apple-simulator-build' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',apple-simulator-build,'))) && (inputs.platform-support == '' || contains(format(',{0},', inputs.platform-support), ',apple,')) }}
    runs-on: ${{ inputs.macos-runner }}
    # [CI-021]/[CI-091] advisory during the apple-simulator soak window:
    # non-gating (out of ci-ok needs) while the ecosystem absorbs the new
    # coverage. Valid at job level only because this is a runs-on job —
    # [CI-105] forbids the combo on workflow_call jobs. PROMOTE by dropping
    # this line and adding to ci-ok needs, once green ecosystem-wide.
    continue-on-error: true
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # [CI-091] uniform-platform-matrix doctrine: the four Apple simulator
        # platforms are the platform contract, never collapsed to a
        # representative subset (M4 REJECT 2026-05-06).
        platform: [iOS, tvOS, watchOS, visionOS]
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          ref: ${{ needs.plan.outputs.subject-ref }}
          persist-credentials: false

      - name: Verify checked-out subject HEAD
        shell: bash
        env:
          SUBJECT_SHA: ${{ needs.plan.outputs.subject-sha }}
        run: |
          set -euo pipefail
          # Job-level `container:` steps execute via a fresh `docker exec`
          # per step, so a bare shell `git` call sees the checkout owned by
          # the runner's host UID and refuses it as dubious ownership
          # (2.35.2+) — unlike actions/checkout's own internal git calls two
          # steps up, which already registered the path for themselves. A
          # no-op on bare macOS/Windows runners; trusts nothing beyond what
          # actions/checkout just placed in this same job.
          git config --global --add safe.directory '*'
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$SUBJECT_SHA" ]; then
            echo "::error::checked-out HEAD '$ACTUAL' does not match Plan's resolved CI subject SHA '$SUBJECT_SHA'. Refusing to proceed against an unverified checkout."
            exit 1
          fi

      - uses: swift-institute/.github/.github/actions/configure-private-repos@d1af72d05bf8262fb3918a2f1607b82fafcafdf9  # main 2026-08-03 (pin-advance)
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          app-client-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
          app-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_ID }}
          app-private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          enabled: ${{ inputs.enable-private-repos }}

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Print toolchain info
        run: |
          swift --version
          echo "Runner image: ${{ runner.os }} on ${{ inputs.macos-runner }}"
          echo "Xcode: $(xcode-select -p)"
          echo "Platform: ${{ matrix.platform }} Simulator"

      - name: Discover SwiftPM-generated scheme
        # The scheme name is NOT always the package name — a package may
        # rename its product/namespace (a [MOD-TARGET] decision), so deriving the
        # scheme from the manifest name alone breaks. Probe
        # `xcodebuild -list -json`; fall back to `swift package describe`.
        # (Matches the proven L1-wrapper discovery shape.)
        shell: bash
        run: |
          set -euo pipefail
          SCHEME=$(xcodebuild -list -json 2>/dev/null | jq -r '.project.schemes[0] // .workspace.schemes[0] // ""')
          if [ -z "$SCHEME" ]; then
            SCHEME=$(swift package describe --type json | jq -r '.name')
          fi
          if [ -z "$SCHEME" ]; then
            echo "Could not determine scheme name" >&2
            exit 1
          fi
          echo "Discovered scheme: ${SCHEME}"
          echo "SCHEME=${SCHEME}" >> "$GITHUB_ENV"

      - name: Build for ${{ matrix.platform }} Simulator
        # A generic simulator destination is sufficient — no booted simulator
        # is needed and it reproduces the same resource-bundle CodeSign failure
        # as a concrete device id. No `.build` cache per [CI-040]. This is the
        # only leg that runs the resource-bundle CodeSign phase.
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -scheme "${SCHEME}" \
            -destination "generic/platform=${{ matrix.platform }} Simulator" \
            -skipPackagePluginValidation \
            -skipMacroValidation

  # Primitives-layer advisory legs (#276 Task 1-03). RELOCATION, NOT
  # PROMOTION: each keeps its exact prior `continue-on-error: true` posture,
  # container, timeout, and build steps; only the checkout/subject/private-repo
  # scaffolding matches the other universal jobs, plus an explicit
  # `outputs.result`. Selected via `lint-bundle == 'primitives'` in Classify
  # tier; none is in ci-ok's needs.
  #
  # None of the four is mandatory by the layer's own criteria:
  #   embedded — continue-on-error permanent by design (nightly instability).
  #   embedded-wasm-sdk / android-build — soak exit criterion is "no
  #     package-actionable failures for 2 consecutive weekly sweeps"
  #     (Research/wasm-ci-strategy-and-sdk-toolchain-coupling.md); fleet data
  #     does not meet it.
  #   static-linux-musl-build — no flip criterion was ever defined.

  embedded:
    # NAME (swift-institute/.github#161, 2026-07-31): this leg was called
    # "Ubuntu (Swift main nightly, Embedded build)", which read as an
    # embedded-target build. It is not one — `swift build` here targets the
    # host triple x86_64-unknown-linux-gnu with the Embedded feature flag on.
    name: Ubuntu (Swift main nightly, Embedded mode on host triple)
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'embedded' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',embedded,'))) }}
    runs-on: ubuntu-latest
    container: swiftlang/swift:nightly-main-jammy
    continue-on-error: true
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      # Exactly one of the two build steps below runs (mutually exclusive
      # `if:`); the skipped one's `.outcome` is empty, and GitHub Actions
      # expressions treat an empty/undefined operand as falsy for `||`, so
      # this resolves to whichever step actually ran.
      result: ${{ steps.build.outcome || steps.build-target.outcome }}
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          ref: ${{ needs.plan.outputs.subject-ref }}
          persist-credentials: false

      - name: Verify checked-out subject HEAD
        shell: bash
        env:
          SUBJECT_SHA: ${{ needs.plan.outputs.subject-sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
