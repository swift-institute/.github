name: Swift CI (reusable)

# ─── Third-party consumer notice ────────────────────────────────────────
# These reusable workflows are designed for swift-institute ecosystem
# packages. Outside callers consume at their own risk and should pin to
# an immutable SHA (`@<sha>`) rather than `@main`. The input/output
# surface and behavior may change without notice; the swift-institute/
# .github repo offers no compatibility guarantee to outside consumers.
# Per swift-institute/Research/ci-cd-cross-ecosystem-reuse.md v1.1.1 §Q4
# (third-party consumers are unintended-but-permitted).
# ────────────────────────────────────────────────────────────────────────

# Reusable CI workflow for Swift Institute packages. Provides the universal
# test matrix that applies across all five layers: macOS 26 (Swift 6.3 debug)
# + Ubuntu (Swift 6.3 release) + Ubuntu (Swift main nightly,
# continue-on-error) + Windows (Swift 6.3).
#
# TIERED SCHEDULING (R1/R2 principal ruling 2026-07-20): the matrix SHAPE
# above remains the ecosystem platform contract ([CI-010]/[CI-091] unchanged),
# but its full execution is scheduled, not per-push. A `plan` job classifies
# each run into a tier — build (format+lint+swift-linter + the caller's
# primary supported release leg; the default) or full (everything, incl.
# advisory legs).
# Tags, '[ci full]', consumer workflow_dispatch, and ci-sweep.yml always get
# full. The nightly ci-sweep.yml rotation re-verifies the full contract
# fleet-wide. Rationale: free-tier runner CONCURRENCY (5 macOS/org) — not
# minutes — is the binding budget; per-push full matrices spent it on advisory
# legs and produced multi-hour queue tails (measured 2026-07-20). The build
# tier schedules no macOS job, so it costs nothing on that binding constraint.
#
# THE `lint` TIER WAS RETIRED 2026-07-28. It selected format+lint+swift-linter
# and no build leg at all, and ci-ok's aggregator counted a SKIPPED gating leg
# as passing — so a lint-tier run compiled nothing and reported `success` on
# the one required status check. Measured over the 476 public non-archived
# repos of the 17 orgs in the manifest, 2026-07-20 (when tiers landed) through
# 2026-07-28: 588 of 998 green runs of the universal reusable were build-free,
# across 288 repositories. One of them hid a Signal 4 trap in
# swift-array-primitives for six days (swift-primitives/swift-array-primitives#3).
#
# Its premise — "a docs-only diff cannot change the build outcome" — is false
# on this fleet, because packages float their dependencies on `main` with no
# Package.resolved. The tree that a mechanical push builds is not the tree the
# last build-tier run verified. A sound fast path would have to key on the
# resolved graph, not on the diff; until something does, `build` is the floor.
#
# Consume from a caller package's .github/workflows/ci.yml via:
#
#   jobs:
#     ci:
#       uses: swift-institute/.github/.github/workflows/swift-ci.yml@main
#       secrets: inherit
#
# Default `enable-private-repos: true` covers the canonical case (the
# vast majority of consumers depend on private intra-Institute siblings
# and need credentialed github.com URL rewrites for `swift package
# resolve`); pass `with: { enable-private-repos: false }` only for the
# rare public-deps-only consumer that wants to suppress the
# configure-git step. Credential resolution order (see the
# configure-private-repos composite): per-job swift-institute-bot App
# installation tokens (contents:read, auto-expiring) minted from the
# org-level SWIFT_INSTITUTE_BOT_APP_CLIENT_ID (or legacy-era
# SWIFT_INSTITUTE_BOT_APP_ID) + _APP_PRIVATE_KEY secrets; legacy
# PRIVATE_REPO_TOKEN as github.com-wide fallback. `secrets:
# inherit` is uniform across all consumers per
# [CI-031]/[CI-058]/[CI-059] post-uniformity-sweep, so the org-level
# secrets flow through without per-package ci.yml edits.
#
# Inputs are deliberately minimal. Toolchain versions, runner images, and
# the matrix shape are hard-coded ecosystem-wide; if a package needs a
# different shape, fork the workflow rather than parameterizing this one.
# The three dispatch-only inputs (target-repo, job, ref) are the sanctioned
# exception to that doctrine: they are DEFAULT-INERT — all empty on every
# push/PR/wrapper call, so a push builds the caller's own repo at the
# triggering ref, running every job, exactly as before — and change NOTHING
# for consumers. They exist solely so ci-dispatch.yml can retarget one job of
# this universal at another package on demand (a debug surface). Default-
# inertness is precisely what the fork-doctrine protects, so parameterizing
# for dispatch does not violate it. Seat-ruled 2026-07-03: this expands the
# ratified D3 spec from two dispatch inputs to three (target-repo + job + ref).
#
# `platform-support` is the second sanctioned exception (CI platform-support
# arc, 2026-07-14): a DEFAULT-INERT platform-identity declaration. Empty
# (every existing caller) = the full hard-coded matrix, bit-identical to
# before the input existed. Non-empty = the caller declares which platform
# families its package targets, and each platform leg consults the
# declaration in its `if:` guard. This does NOT re-open matrix derivation —
# the matrix is still never derived from Package.swift `platforms:` and
# cost-based collapse is still rejected ([CI-091]/[CI-096]). It exists
# because a platform-blind matrix MANUFACTURES architectural violations:
# the only way a POSIX specification package (ISO/IEC 9945 IS POSIX) can
# green a Windows leg is to emulate POSIX inside the POSIX spec package
# (swift-iso-9945 06fc4b2 — the manufactured violation this input exists
# to reverse), corrupting the exact package the leg claims to verify. The platform seam lives at the designated L3 boundary
# per [PLAT-ARCH-001], never inside an L2 spec package — so the honest fix
# is a CI-level identity declaration, not source-level platform emulation.
# Rule promotion tracked in the ci-cd-workflows skill.
#
# Caching policy: this workflow does NOT cache `.build/`. Every run does
# a fresh `swift package resolve` + clone + compile. This matches Apple's
# canonical `swiftlang/github-workflows/swift_package_test.yml` (995 lines,
# zero `actions/cache` uses) and is the right answer for our constraint
# set: `Package.resolved` is gitignored ecosystem-wide as a permanent
# library convention, so cache invalidation cannot key on resolved-graph
# state, and `restore-keys` partial-prefix matching silently serves stale
# branch-pinned dep checkouts. See
# `swift-institute/Research/ci-cache-strategy-branch-pinned-dependencies.md`.
#
# Layer-specific verification jobs (e.g. embedded-build verification for L1
# primitives) live in per-layer wrapper workflows under
# `<layer>/.github/.github/workflows/`, not here. swift-institute owns the
# universal floor; layers own their own invariants.

on:
  workflow_call:
    inputs:
      swift-version:
        type: string
        default: "6.3"
        description: "Swift version for the macOS, Ubuntu release, and Windows jobs. The nightly job is always Swift main (currently tracks 6.5-dev; floats as main moves)."
      enable-private-repos:
        type: boolean
        default: true
        description: "If true, configure credentialed git url rewrites (App-token primary, PRIVATE_REPO_TOKEN fallback) for github.com clones. Default true: most consumers in the swift-primitives ecosystem have private deps and need the credentials; public-only consumers may pass false explicitly."
      macos-runner:
        type: string
        default: "macos-26"
        description: "macOS runner image. Bump annually when GitHub adds a new image version. env.* is invalid in runs-on: per Actions context-availability rules — input is the working centralization mechanism."
      test-filter:
        type: string
        default: ""
        description: "If non-empty, append `--filter <value>` to every `swift test` invocation in this workflow. Hyphens in the value are converted to underscores so the regex matches Swift module identifiers (SwiftPM converts hyphenated target names to underscored module names). Used by per-issue consumer matrices (e.g., swift-institute/Issues calling this reusable per swift-issue-*). Empty default preserves existing consumer behavior."
      platform-support:
        type: string
        default: ""
        description: "Per-package CI platform-support declaration. Empty default preserves pre-input behavior: the build tier selects Linux and the full tier keeps every platform leg eligible. Non-empty = comma-separated subset of `apple,linux,windows` (lowercase, no spaces); unknown, duplicate, or empty family tokens fail the plan. Each platform leg runs only when its family token is present (apple → macos-release + apple-simulator-build; linux → linux-release + linux-nightly + linux-6-4; windows → windows-release). On the ordinary build tier, the same declaration selects exactly one supported release leg in deterministic priority order: Linux, then Windows, then macOS. Quality gates (format, lint, swift-linter, advisory linters) are platform-neutral and never consult this input. The plan applies this filter to `legs` itself, so `legs` is the single expected-execution list and ci-ok can require every gating leg named there to have SUCCEEDED (a gating leg that is skipped without the plan having excluded it now fails the run). Declare ONLY platform-identity exclusions — a package whose specification or identity excludes a platform (POSIX/ISO-9945 spec packages, per-platform roots like swift-linux / swift-windows). This is NOT a cost knob ([CI-096]) and is NOT derived from Package.swift `platforms:` ([CI-091] — that block is a SwiftPM deployment-target declaration, not a CI-coverage signal). Rationale: a platform-blind matrix forces platform emulation into L2 spec packages to green an illegitimate leg; the platform seam is L3 per [PLAT-ARCH-001]. ci-dispatch.yml passes nothing, so single-job dispatch can still force any leg on any package (debug surface preserved)."
      lint-bundle:
        type: string
        default: "institute"
        description: "Rule bundle the `swift-linter` job lints a consumer that carries NO root `Lint.swift` with. Consumers that DO carry one are unaffected — their file selects their rules and this input is never read. One of `primitives` | `standards` | `institute`; anything else fails the job in seconds, before any binary is provisioned. Set by the LAYER WRAPPER, not by the package: the wrapper is the layer, so the value is a literal there (swift-primitives → `primitives`, swift-standards → `standards`, swift-foundations → `institute`) and a package cannot elect a weaker rule set for itself. The default `institute` is the organization-wide bundle a direct caller (one that skips its layer wrapper, e.g. swift-institute/Issues) gets. The three bundles are a lattice — `universal ⊂ institute ⊂ primitives`, `standards = institute` minus two naming rules — so a single global default would measure primitives-layer packages against a LOOSER set than their configured peers, which is why the choice is per-layer. Mirrors Workspace's `Workspace.Lint.Bundle`, byte-for-byte the same tokens on the same `SWIFT_LINTER_BUNDLE` channel; keep the two in step. Non-empty default because the prebuilt runner falls back to `primitives` when the channel is UNSET (measured 2026-07-29) — an empty default would silently mismeasure every foundations package."
      tier:
        type: string
        default: ""
        description: "Verification-tier override (sanctioned default-inert input; R1/R2 principal ruling 2026-07-20). Empty default — existing push/PR/wrapper calls pass nothing — routes tier selection to the plan job's classifier: tag refs, workflow_dispatch, and '[ci full]' → full; everything else → build. Non-empty forces 'build' | 'full' (ci-sweep.yml passes 'full' for the nightly rotation sweep). 'lint' was RETIRED 2026-07-28 and now fails the plan with a pointed error rather than being silently honoured: it selected no build leg, and ci-ok counted the resulting skips as passes, so it produced a green required check over a run that compiled nothing. The tier gates SCHEDULING only — the matrix SHAPE ([CI-010]/[CI-091]) is untouched: every leg stays defined in this file and the full tier runs all of them; tags and sweeps always get the complete platform contract."
      target-repo:
        type: string
        default: ""
        description: "Dispatch-only target selector (set by ci-dispatch.yml). When non-empty, every build/test/lint job checks out this `owner/name` repo instead of the caller's own. Empty default — every push/PR/wrapper call passes nothing — so each checkout's repository field falls back to github.repository (the `|| github.repository` tail of the expression), bit-identical to the pre-dispatch implicit-default checkout. See ci-dispatch.yml."
      job:
        type: string
        default: ""
        description: "Dispatch-only single-job selector (set by ci-dispatch.yml). When non-empty, only the job whose id equals this value runs; every other selectable job skips via the composed `inputs.job == '' || inputs.job == '<id>'` guard. Empty default — every push/PR/wrapper call passes nothing — so the `inputs.job == ''` disjunct is true for every job and all jobs run exactly as before. The dispatch enum is fixed to the 13 dispatch-meaningful jobs; see ci-dispatch.yml for the list and the ci-ok / lint-api-breakage / lint-pr-title exclusions."
      ref:
        type: string
        default: ""
        description: "Dispatch-only target ref (set by ci-dispatch.yml). Selects the branch/tag/SHA of `target-repo` to build. Threaded into the `ref:` field of the target checkouts only. It never reaches the swift-linter engine, which is no longer checked out or built here at all: the `swift-linter` job installs the published, checksum-verified `ci-binaries` release (#137). Empty default — every push/PR/wrapper call passes nothing — so `actions/checkout` resolves the TRIGGERING ref (github.ref/SHA, i.e. the pushed branch), bit-identical to the pre-dispatch implicit-default checkout. See ci-dispatch.yml."
      embedded-target:
        type: string
        default: ""
        description: "Optional target to build for Embedded with default traits disabled, consulted only by the `embedded` job (`lint-bundle == 'primitives'`). Empty preserves the full-package Embedded build. Relocated verbatim from the Primitives layer wrapper (swift-institute/.github#276 Task 1-03) so an existing consumer's `with: { embedded-target: ... }` keeps meaning the same thing after the wrapper forwards it here; every other layer/consumer never sets it and is unaffected."
      docs-umbrella-module:
        type: string
        default: ""
        description: "Pass-through override forwarded to the nested swift-docs.yml call's `umbrella-module` input (TX10: integrated docs are unconditional). See swift-docs.yml for the discovery default this overrides."
      docs-umbrella-display-name:
        type: string
        default: ""
        description: "Pass-through override forwarded to the nested swift-docs.yml call's `umbrella-display-name` input (TX10: integrated docs are unconditional)."
      docs-umbrella-bundle-id:
        type: string
        default: ""
        description: "Pass-through override forwarded to the nested swift-docs.yml call's `umbrella-bundle-id` input (TX10: integrated docs are unconditional)."
      docs-umbrella-docc-path:
        type: string
        default: ""
        description: "Pass-through override forwarded to the nested swift-docs.yml call's `umbrella-docc-path` input (TX10: integrated docs are unconditional)."
      docs-exclude-modules:
        type: string
        default: ""
        description: "Pass-through override forwarded to the nested swift-docs.yml call's `exclude-modules` input (TX10: integrated docs are unconditional)."
      docs-swift-version:
        type: string
        default: "6.3"
        description: "Swift toolchain version for the nested swift-docs.yml call's DocC build container (TX10: integrated docs are unconditional). Independent of this workflow's own `swift-version` input (a Linux-container axis for the release/nightly legs) — mirrors swift-docs.yml's own default so an integrated caller that never overrides either stays in lockstep with the standalone wrapper path."
    secrets:
      PRIVATE_REPO_TOKEN:
        required: false
        description: |
          Legacy github.com-wide fallback credential for private-dep
          clones. Superseded by the App-token path; retained for orgs
          not yet provisioned with the App secrets.
      SWIFT_INSTITUTE_BOT_APP_CLIENT_ID:
        required: false
        description: |
          swift-institute-bot App client ID (org-level secret). With the
          private key, lets configure-private-repos mint per-job
          contents:read installation tokens for the layer orgs so
          `swift package resolve` can clone private intra-Institute deps.
      SWIFT_INSTITUTE_BOT_APP_ID:
        required: false
        description: |
          Legacy-era App ID secret name carried by some orgs (e.g.
          swift-primitives; numeric App ID value class). Accepted as
          fallback when _APP_CLIENT_ID is absent; configure-private-repos
          routes it into create-github-app-token's `client-id` input,
          never the deprecated `app-id` input (#139).
      SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY:
        required: false
        description: |
          swift-institute-bot App private key (org-level secret).
          Counterpart of SWIFT_INSTITUTE_BOT_APP_CLIENT_ID.

# ─── Tool-version pins ──────────────────────────────────────────────────
# Workflow-level env vars centralize tool versions so each release bump
# is a single edit instead of N grep-and-replace sites. Per
# feedback_latest_versions_only.md these MUST track the latest stable
# release of each tool; bump on every workflow touch where a newer
# release exists.
env:
  SWIFTLINT_VERSION: "0.63.3"
  # [CI-082] sha256sum -c pin for swiftlint_linux_amd64.zip at SWIFTLINT_VERSION.
  # Re-lock on every version bump per the rule body's bump protocol.
  SWIFTLINT_SHA256: "26db741d43f2f2dc26c0cf16911100a3e186c3d1dbb59e55ad3ac87b0de4538f"
  # THE fleet-wide Xcode pin — the only one. Layer wrappers
  # (swift-primitives / swift-foundations / swift-standards `.github`) MUST NOT
  # declare their own: a caller's workflow-level `env:` does not cross into a
  # called reusable workflow, so a wrapper-side pin is inert and merely
  # contradicts this one. swift-primitives carried a stale inert "26.4" until
  # 2026-07-28; removed there, rationale recorded in that file.
  #
  # 26.6 is the CEILING on `macos-26`, not a conservative choice. Determined
  # 2026-07-28 against actions/runner-images@main:
  #   - macos-26-arm64 (`macos-latest`, `macos-26`) installs 26.0.1 … 26.6
  #     (26.6 = 17F113); 26.6 became the image default 2026.07.21. There is no
  #     26.7+ and no Xcode 27 on this image.
  #   - Xcode 26.6 ships Swift 6.3.3 (swiftlang-6.3.3.1.3), NOT 6.4 —
  #     observed, not inferred: swift-foundations/swift-ascii job 86507198283
  #     and swift-primitives/swift-array-primitives job 86475550287 both print
  #     `Apple Swift version 6.3.3` under `/Applications/Xcode_26.6.app`.
  #
  # So the macOS gating leg CANNOT reach Swift 6.4 today, at any pin. The only
  # hosted runner carrying 6.4 is the `xcode-27` / `xcode-27-xlarge` public
  # PREVIEW label (actions/runner-images#14404), whose sole Xcode is 27.0 BETA.
  # That label was probed on a throwaway branch 2026-07-28 rather than assumed;
  # it IS schedulable for this org, and it does ship 6.4:
  #
  #     Runner image: macOS on xcode-27
  #     Xcode:  /Applications/Xcode_27.0.app  (-> Xcode_27_beta_3.app)
  #     Apple Swift version 6.4 (swiftlang-6.4.0.25.4 clang-2100.3.25.1)
  #     Target: arm64-apple-macosx26.0
  #
  # Two things in that output that a local machine will mislead you about, and
  # which are the reason this was measured instead of inferred:
  #   - The runner's 6.4 is build 6.4.0.25.4. A dev machine on Xcode 27.0 may
  #     carry a DIFFERENT 6.4 (this seat: 6.4.0.27.1). "Swift 6.4" is not one
  #     toolchain during the beta; local-reproduces-CI is not a safe assumption.
  #   - Target stays arm64-apple-macosx26.0, NOT macosx27.0 — the image is a
  #     macOS 26 host with Xcode 27 on it. Xcode 27 does not imply a 27 SDK
  #     deployment target here.
  #
  # Moving a fleet-wide gate onto a beta toolchain is the failure mode already
  # rejected for linux-6-4 — churn turns it red, and a red gate stops being
  # read. Do not do it here either. As of 2026-07-28 there is a second, harder
  # reason: 6.4 is a CRASHING toolchain under release + CMO (`swift-frontend`
  # signal 6), and 6.5-dev crashes identically, so the defect is not merely
  # awaiting GA. That crash class needs `-O` + whole-module and so cannot
  # reach these debug macOS legs — but it does block the release Linux legs
  # independently of the missing `swift:6.4` stable container.
  #
  # Bump protocol: this pin tracks the highest Xcode on `macos-runner`'s image,
  # and only that. It reaches 6.4 when Xcode 27 GAs onto a stable macOS image —
  # the same event that graduates linux-6-4 to a gating `swift:6.4` leg and
  # retires the `compiler(<6.4)` gates. Re-read the image Readme before bumping;
  # a version absent from that table fails `xcode-select` at job start.
  #
  # TRAP when the fleet toolchain moves. The macOS legs (macos-release,
  # apple-simulator-build) take their Swift version from THIS pin's Xcode.
  # They ignore the `swift-version` input entirely — it reaches them only
  # through their `name:`. So raising `swift-version`'s default (a Linux-
  # container axis, and the eventual one-line fleet bump) relabels the macOS
  # legs "macOS (Swift 6.4, debug)" while they keep compiling with whatever
  # Xcode ships. The leg does not fail; it lies in the checks list, and its
  # log is the only place the contradiction is visible. Move the two axes
  # together, or accept that the macOS leg's name is aspirational until the
  # Xcode pin catches up.
  XCODE_VERSION: "26.6"

jobs:
  # ─── Tier plan (R1/R2 principal ruling 2026-07-20) ───────────────────────
  # Selects the verification tier for this run and runs the identity-conflict
  # fast-check ONCE (previously duplicated into every leg). Tier semantics:
  #   build — format + lint + swift-linter + the primary supported release leg
  #           (default for ordinary pushes and pull requests: Linux unless
  #           platform-support declares a platform-specific package)
  #   full  — the complete [CI-010]/[CI-091] platform contract including the
  #           advisory legs; unconditional on tag refs; forced by ci-sweep.yml
  #           and the '[ci full]' commit token.
  # Both tiers compile the package. That is the invariant `gating` exists to
  # carry: it is the subset of `legs` that ci-ok requires to have SUCCEEDED,
  # and the plan refuses to emit one that contains no build leg. See the
  # retired-lint-tier note in the header for what a build-free green cost.
  #
  # `legs` is platform-filtered here rather than only at each job's guard, so
  # there is exactly ONE list of what is expected to run and ci-ok can compare
  # against it. (Two lists in two places that must agree, with nothing holding
  # them together, is this repository's cheapest silent-drop — see
  # swift-institute/Internal's VALIDATOR-DISCIPLINE.md §3.) Each leg keeps its
  # own platform clause as a redundant belt: it can only remove a leg this
  # filter already removed.
  #
  # ci-ok includes plan in its needs:, so a plan failure (e.g. an identity
  # conflict) fails the run even though every leg skips. Single-job dispatch
  # bypasses the plan entirely (inputs.job != '' → plan skips; each leg's
  # job-selector disjunct still fires), preserving ci-dispatch's
  # exactly-one-job property. Every leg guard composes `!cancelled()` so a
  # SKIPPED plan (dispatch) doesn't auto-skip the selected leg, while a
  # FAILED plan yields empty legs output → every leg skips → ci-ok red via
  # plan in needs.
  plan:
    name: Plan (tier + identity fast-check)
    # Runs on EVERY non-private event, including single-job ci-dispatch.yml
    # (previously `inputs.job == ''` skipped this job entirely on dispatch).
    # The job now always resolves the CI subject exactly once (see "Resolve
    # CI subject" below); only the heavier identity-conflict/branch-pin steps
    # stay gated on `inputs.job == ''`, preserving the pre-existing dispatch
    # bypass for those two checks specifically.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    # 60: the F12 cold bootstrap (Workspace source build of institute-ci)
    # runs here on a cache miss (~30 min); warm-cache runs stay seconds.
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      legs: ${{ steps.classify.outputs.legs }}
      gating: ${{ steps.classify.outputs.gating }}
      subject-repository: ${{ steps.resolve-subject.outputs.subject-repository }}
      subject-ref: ${{ steps.resolve-subject.outputs.subject-ref }}
      subject-sha: ${{ steps.resolve-subject.outputs.subject-sha }}
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # THE single subject-resolution contract (swift-institute/.github#179
      # regression class). Every build/test/lint/docs checkout in this file
      # consumes `needs.plan.outputs.subject-repository` / `subject-ref` /
      # `subject-sha` directly — none may re-derive them. Before this step,
      # ten sites each carried their own copy of a three-way fallback
      # expression; the copy at the very first Plan checkout resolved
      # `target-repo` (repository) independently of `ref`, so a dispatch that
      # supplied `target-repo` without `ref` (ci-sweep.yml's nightly rotation)
      # checked out the TARGET repository at the TRIGGERING repository's own
      # SHA — a commit that does not exist there ("not our ref", PR #179
      # merge 5685c9e3, run 30875153360, Plan failure 57/57).
      #
      # Resolution order:
      #   target-repo supplied (ci-sweep.yml / ci-dispatch.yml; the only
      #     caller-controlled override, and the only case needing a live API
      #     resolution because its ref may be a branch/tag name or absent):
      #       ref supplied -> resolve it to that repository's exact commit
      #                        SHA (branch, tag, or SHA all accepted); an
      #                        unresolvable ref fails closed, no defaulting.
      #       ref empty    -> resolve the TARGET repository's live default
      #                        branch and its exact head SHA. NEVER
      #                        substitute the triggering repository's SHA.
      #   pull_request event -> the exact PR head repository/SHA (fork-safe:
      #                        forks are untrusted, so every job stays
      #                        read-only against exactly that head).
      #   anything else       -> the triggering repository and exact event
      #                        SHA.
      #
      # Runs unconditionally (including single-job ci-dispatch.yml, where the
      # rest of this job is skipped below) so every consumer — including a
      # dispatched leg — has one resolved subject to check out. `subject-ref`
      # and `subject-sha` hold the identical resolved 40-character SHA; two
      # names exist so a checkout's `ref:` field and a post-checkout identity
      # comparison each read the value under the name matching their role.
      - name: Resolve CI subject
        id: resolve-subject
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET_REPOSITORY: ${{ inputs.target-repo }}
          INPUT_REF: ${{ inputs.ref }}
          PULL_REQUEST_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRIGGER_REPOSITORY: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TARGET_REPOSITORY" ]; then
            SUBJECT_REPOSITORY="$INPUT_TARGET_REPOSITORY"
            if [ -n "$INPUT_REF" ]; then
              RESOLVE_REF="$INPUT_REF"
            else
              RESOLVE_REF="$(gh api "repos/${SUBJECT_REPOSITORY}" --jq '.default_branch' 2>/dev/null || true)"
              if [ -z "$RESOLVE_REF" ]; then
                echo "::error::could not read the default branch of target repository '${SUBJECT_REPOSITORY}'; refusing to attest an unspecified revision."
                exit 1
              fi
            fi
            SUBJECT_SHA="$(gh api "repos/${SUBJECT_REPOSITORY}/commits/${RESOLVE_REF}" --jq '.sha' 2>/dev/null || true)"
            if [ -z "$SUBJECT_SHA" ]; then
              echo "::error::could not resolve ref '${RESOLVE_REF}' of target repository '${SUBJECT_REPOSITORY}' to a commit SHA; refusing to attest an unspecified revision."
              exit 1
            fi
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            SUBJECT_REPOSITORY="$PULL_REQUEST_HEAD_REPOSITORY"
            SUBJECT_SHA="$PULL_REQUEST_HEAD_SHA"
          else
            SUBJECT_REPOSITORY="$TRIGGER_REPOSITORY"
            SUBJECT_SHA="$TRIGGER_SHA"
          fi
          if [ -z "$SUBJECT_REPOSITORY" ] || [ -z "$SUBJECT_SHA" ]; then
            echo "::error::CI subject repository/SHA is empty; refusing to attest an unspecified revision."
            exit 1
          fi
          if ! [[ "$SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::resolved CI subject SHA '${SUBJECT_SHA}' for '${SUBJECT_REPOSITORY}' is not a 40-character commit SHA; refusing to attest an unspecified revision."
            exit 1
          fi
          echo "subject-repository=$SUBJECT_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "subject-ref=$SUBJECT_SHA" >> "$GITHUB_OUTPUT"
          echo "subject-sha=$SUBJECT_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved CI subject: ${SUBJECT_REPOSITORY}@${SUBJECT_SHA}"

      # The remaining Plan steps (subject checkout through the branch-pin
      # guard) exist only to feed the identity-conflict fast-check and the
      # branch-pin guard. Single-job ci-dispatch.yml deliberately bypasses
      # both — a debug repro of one already-broken leg must not be newly
      # blocked by an unrelated identity or branch-pin finding in the same
      # target — so they stay gated on `inputs.job == ''`, exactly the
      # pre-existing dispatch-bypass semantics, now sitting on top of a
      # correctly resolved subject instead of a second buggy fallback.
      - name: Checkout subject
        if: ${{ inputs.job == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.resolve-subject.outputs.subject-repository }}
          ref: ${{ steps.resolve-subject.outputs.subject-ref }}
          persist-credentials: false

      - name: Verify checked-out subject HEAD
        if: ${{ inputs.job == '' }}
        shell: bash
        env:
          SUBJECT_SHA: ${{ steps.resolve-subject.outputs.subject-sha }}
        run: |
          set -euo pipefail
          # Job-level `container:` steps execute via a fresh `docker exec`
          # per step, so a bare shell `git` call sees the checkout owned by
          # the runner's host UID and refuses it as dubious ownership
          # (2.35.2+) — unlike actions/checkout's own internal git calls two
          # steps up, which already registered the path for themselves. A
          # no-op on bare macOS/Windows runners; trusts nothing beyond what
          # actions/checkout just placed in this same job.
          git config --global --add safe.directory '*'
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$SUBJECT_SHA" ]; then
            echo "::error::checked-out HEAD '$ACTUAL' does not match Plan's resolved CI subject SHA '$SUBJECT_SHA'. Refusing to proceed against an unverified checkout."
            exit 1
          fi

      # Identity-conflict fast-check ([PKG-DEP-009] class): fails in <1s with
      # the exact edge named when this repo's manifests spell one identity two
      # ways — the org-drift class that otherwise hangs SwiftPM 6.2/6.3 until
      # timeout-minutes fires (catalog §A26). Runs ONCE here for the whole run
      # (R1 consolidation 2026-07-20; previously duplicated into all 6 legs);
      # plan sits in ci-ok's needs so a conflict still fails the run.
      # Vendored via checkout (not curl from raw.githubusercontent) so the
      # executed script rides the same trust anchor as every other `uses:`
      # reference into this repo — no unpinned run-time code fetch.
      # `ref: job.workflow_sha` anchors the vendored scripts to the exact
      # commit of THIS workflow file (the called reusable, not the caller),
      # so the executed script cannot differ from the workflow revision
      # that invoked it (#43 item 3).
      - name: Checkout CI scripts
        if: ${{ inputs.job == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          ref: ${{ job.workflow_sha }}
          path: .ci-scripts
      # F12 (Goal swift-institute/.github#358): the fast-check below drops
      # .ci-scripts before scanning, so the Institute CI sources and their
      # exact content identity are stashed here first — same trust anchor
      # (this checkout at job.workflow_sha), no additional checkout.
      # sourcesRevision is the git tree OID of Tools/institute-ci: exact
      # content identity that does not churn on unrelated commits. An OID
      # that is not 40-hex refuses fail-closed rather than minting a
      # malformed cache key.
      - name: Institute CI source identity
        if: ${{ inputs.job == '' }}
        id: institute-ci-identity
        shell: bash
        run: |
          set -euo pipefail
          SOURCES_TREE="$(git -C "${GITHUB_WORKSPACE}/.ci-scripts" rev-parse "HEAD:Tools/institute-ci")"
          [[ "$SOURCES_TREE" =~ ^[0-9a-f]{40}$ ]] || { echo "refusing malformed Institute CI tree OID: '$SOURCES_TREE'" >&2; exit 1; }
          cp -R "${GITHUB_WORKSPACE}/.ci-scripts/Tools/institute-ci" "${RUNNER_TEMP}/institute-ci-sources"
          echo "sources-tree=$SOURCES_TREE" >> "$GITHUB_OUTPUT"
      - name: Identity-conflict fast-check
        if: ${{ inputs.job == '' }}
        shell: bash
        run: |
          command -v python3 >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -qq -y python3; }
          # Move the scripts out and drop the checkout BEFORE scanning, so the
          # scripts repo's own files (incl. test fixtures) are never scanned.
          # The branch-pin guard's assets ride the same trust anchor.
          cp "${GITHUB_WORKSPACE}/.ci-scripts/.github/scripts/ci-identity-conflict-fastcheck.py" "${RUNNER_TEMP}/fastcheck.py"
          cp "${GITHUB_WORKSPACE}/.ci-scripts/.github/scripts/validate-branch-pins.py" "${RUNNER_TEMP}/branch-pins.py"
          cp "${GITHUB_WORKSPACE}/.ci-scripts/.github/scripts/.branch-pin-baseline" "${RUNNER_TEMP}/branch-pin-baseline"
          cp "${GITHUB_WORKSPACE}/.ci-scripts/.github/actions/read-orgs/orgs.yaml" "${RUNNER_TEMP}/orgs.yaml"
          rm -rf "${GITHUB_WORKSPACE}/.ci-scripts"
          python3 "${RUNNER_TEMP}/fastcheck.py" "${GITHUB_WORKSPACE}"

      # Branch-pin guard ([BRANCH-PIN-001], #75): rejects NEWLY introduced
      # branch-pinned Institute dependencies fleet-wide with zero caller
      # edits. Existing pins live in the shrink-only baseline vendored above
      # and are burned down by their package/release records; a declaration
      # absent from the baseline fails the run in <1s, before any toolchain
      # is installed. Same vendored-script trust anchor as the identity
      # fast-check — no new checkout, no run-time code fetch. The guard's
      # own failing controls are `CI.Validation.BranchPins Tests` (the F16
      # class C2 port of test-validate-branch-pins.py) plus the
      # branch-pin-001 fixture ladder in the corpus.
      #
      # ─── F16: a TYPED, PERMANENT exception to the Swift-purity end state
      # (Goal #358; home issue #404; coordinator adjudication at #404
      # comment 5214319296). BRANCH-PIN-001 has a Swift owner
      # (`CI.Validation.BranchPins`, C2) and every other call site is
      # served by it. THIS call site keeps its vendored Python, decided by
      # measurement rather than preference:
      #
      #   the guard, vendored python3            <1 s  (step granularity)
      #   restore of the revision-keyed entry     1-3 s
      #   fail-closed provenance verification     9-10 s
      #
      # measured on this workflow's own plan job in
      # swift-standards/swift-fips-180-4 runs 31098709519 and 31097766486,
      # both warm-cache. Serving the guard from the binary therefore costs
      # 11-13 s before it can refuse anything, and minutes on a cold
      # consumer, against a budget of under a second.
      #
      # The budget is the point of the step. It runs BEFORE any toolchain
      # is installed so a newly introduced branch pin fails the fleet in
      # under a second, and the F12 bootstrap deliberately sits after it.
      # Buying uniformity here would spend the property the guard exists
      # for. One file, one call site, no second copy of the predicate —
      # the Swift owner remains authoritative everywhere else, and this
      # exception belongs in the purity receipt's denominator alongside
      # the fixture stubs.
      - name: Branch-pin guard
        if: ${{ inputs.job == '' }}
        shell: bash
        env:
          # Consumes the single resolved subject (was its own independent
          # `inputs.target-repo || github.repository` fallback, which unlike
          # "Resolve CI subject" never accounted for a pull_request's fork
          # head repository — a second, narrower copy of the same defect
          # class this task closes).
          TARGET_REPO: ${{ steps.resolve-subject.outputs.subject-repository }}
        run: |
          python3 -c 'import yaml' 2>/dev/null \
            || { sudo apt-get update -qq && sudo apt-get install -qq -y python3-yaml; }
          python3 "${RUNNER_TEMP}/branch-pins.py" "$TARGET_REPO" "${GITHUB_WORKSPACE}" \
            --orgs-file "${RUNNER_TEMP}/orgs.yaml" \
            --baseline "${RUNNER_TEMP}/branch-pin-baseline"

      # ─── F12: Institute CI bootstrap (Goal swift-institute/.github#358) ───
      # The plan and ci-ok decisions execute in the Swift owner
      # (institute-ci: CI Contract + Institute Receipt), built at exact
      # sources through the sanctioned Workspace coordinate (F10). The
      # cache is acceleration only: every restored entry is provenance-
      # verified by `bootstrap-verify` before any trust (corrupt or
      # wrong-identity entries refuse fail-closed, run 31080609758).
      # Cache-key transport is the raw identity tuple (each component an
      # exact 40-hex revision or frozen literal) because the witness
      # digest is computed by institute-ci itself and cannot exist before
      # the binary does on a cold consumer; the digest identity is still
      # minted into, and verified against, the entry manifest. Recorded
      # as a typed deviation on #390. The sources and their tree OID were
      # stashed by "Institute CI source identity" above, before the
      # identity-conflict fast-check dropped the scripts checkout.
      - name: Restore Institute CI (exact key, acceleration only)
        if: ${{ inputs.job == '' }}
        id: institute-ci-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .institute-ci-entry
          key: institute-ci-${{ steps.institute-ci-identity.outputs.sources-tree }}-6e3861935041c9a92d873f0e444da1dd5b666fdb-linux-x86_64-swift-6.3-static
      - name: Swift toolchain (cold bootstrap only)
        if: ${{ inputs.job == '' && steps.institute-ci-restore.outputs.cache-hit != 'true' }}
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9  # v1.14.0
        with:
          swift-version: "6.3"
      - name: Checkout Workspace at exact main pin (cold bootstrap only)
        if: ${{ inputs.job == '' && steps.institute-ci-restore.outputs.cache-hit != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/Workspace
          # Advance with pin-advance flow; must stay a full SHA (branch-pin guard).
          ref: 6e3861935041c9a92d873f0e444da1dd5b666fdb
          path: .workspace
          persist-credentials: false
      - name: Cold bootstrap through the sanctioned Workspace coordinate
        if: ${{ inputs.job == '' && steps.institute-ci-restore.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          SOURCES_TREE: ${{ steps.institute-ci-identity.outputs.sources-tree }}
        run: |
          set -euo pipefail
          # uuid-dev: the typed F2/F10 provisioning input (swift-linux-standard's
          # CLinuxKernelShim includes uuid/uuid.h); absent on the bare runner.
          sudo apt-get update -qq && sudo apt-get install -qq -y uuid-dev
          swift run --package-path .workspace/Application workspace package build --package-path "${RUNNER_TEMP}/institute-ci-sources" --argument=--static-swift-stdlib
          mkdir -p .institute-ci-entry/bin
          cp "$(find "${RUNNER_TEMP}/institute-ci-sources/.build" -name institute-ci -type f -perm /111 | head -1)" .institute-ci-entry/bin/institute-ci
          .institute-ci-entry/bin/institute-ci bootstrap-manifest --workspace-revision 6e3861935041c9a92d873f0e444da1dd5b666fdb --sources-revision "$SOURCES_TREE" --toolchain swift-6.3 --os linux --arch x86_64 --provisioning uuid-dev,static-swift-stdlib --root .institute-ci-entry --executables bin/institute-ci --producer-run "$GITHUB_RUN_ID" > .institute-ci-entry/manifest.json
      - name: Save Institute CI cache entry (cold bootstrap only)
        if: ${{ inputs.job == '' && steps.institute-ci-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .institute-ci-entry
          key: institute-ci-${{ steps.institute-ci-identity.outputs.sources-tree }}-6e3861935041c9a92d873f0e444da1dd5b666fdb-linux-x86_64-swift-6.3-static
      - name: Verify Institute CI provenance before trust (fail closed)
        if: ${{ inputs.job == '' }}
        shell: bash
        env:
          SOURCES_TREE: ${{ steps.institute-ci-identity.outputs.sources-tree }}
        run: |
          set -euo pipefail
          .institute-ci-entry/bin/institute-ci bootstrap-verify --workspace-revision 6e3861935041c9a92d873f0e444da1dd5b666fdb --sources-revision "$SOURCES_TREE" --toolchain swift-6.3 --os linux --arch x86_64 --provisioning uuid-dev,static-swift-stdlib --root .institute-ci-entry --manifest .institute-ci-entry/manifest.json
      # Body executed by the Swift owner since F12 (Goal
      # swift-institute/.github#358): tier/leg/gating selection is
      # CI.Contract.Plan in institute-ci, differentially proven against the
      # retired shell (F4 16+11 cases; F11 443+20 cases + 2 live replays,
      # zero unexplained differences, SWIFT-NATIVE-PROGRAMME/
      # shadow-parity.json at 2c74d326). One deliberate tightening: an
      # unknown forced tier now refuses up front even on refs/heads/main,
      # where the shell rewrote it to `full` before validating. The jq
      # calls below are direct typed output mapping (three fields of the
      # plan JSON to step outputs), not policy.
      - name: Classify tier
        id: classify
        shell: bash
        env:
          FORCED_TIER: ${{ inputs.tier }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          PLATFORM_SUPPORT: ${{ inputs.platform-support }}
          LINT_BUNDLE: ${{ inputs.lint-bundle }}
        run: |
          set -euo pipefail
          PLAN_JSON="$(.institute-ci-entry/bin/institute-ci plan --tier "$FORCED_TIER" --ref "$GITHUB_REF" --head-message "$HEAD_MSG" --event "$EVENT_NAME" --platform-support "$PLATFORM_SUPPORT" --lint-bundle "$LINT_BUNDLE")"
          TIER="$(jq -r '.tier' <<< "$PLAN_JSON")"
          LEGS="$(jq -r '.legs' <<< "$PLAN_JSON")"
          GATING="$(jq -r '.gating' <<< "$PLAN_JSON")"
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
          echo "legs=$LEGS" >> "$GITHUB_OUTPUT"
          echo "gating=$GATING" >> "$GITHUB_OUTPUT"
          echo "Selected tier: $TIER"
          echo "legs: $LEGS"
          echo "gating: $GATING"
          {
            echo "## CI tier: \`$TIER\` (planned by institute-ci)"
            echo ""
            echo "Selected legs: \`$LEGS\`"
            echo ""
            echo "Gating: \`$GATING\`. \`ci-ok\` attests the SELECTED tier and names it — a gating leg that is skipped without appearing here fails the run (2026-07-28)."
          } >> "$GITHUB_STEP_SUMMARY"

  macos-release:
    name: macOS (Swift ${{ inputs.swift-version }}, debug)
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'macos-release' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',macos-release,'))) && (inputs.platform-support == '' || contains(format(',{0},', inputs.platform-support), ',apple,')) }}
    runs-on: ${{ inputs.macos-runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          ref: ${{ needs.plan.outputs.subject-ref }}
          persist-credentials: false

      - name: Verify checked-out subject HEAD
        shell: bash
        env:
          SUBJECT_SHA: ${{ needs.plan.outputs.subject-sha }}
        run: |
          set -euo pipefail
          # Job-level `container:` steps execute via a fresh `docker exec`
          # per step, so a bare shell `git` call sees the checkout owned by
          # the runner's host UID and refuses it as dubious ownership
          # (2.35.2+) — unlike actions/checkout's own internal git calls two
          # steps up, which already registered the path for themselves. A
          # no-op on bare macOS/Windows runners; trusts nothing beyond what
          # actions/checkout just placed in this same job.
          git config --global --add safe.directory '*'
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$SUBJECT_SHA" ]; then
            echo "::error::checked-out HEAD '$ACTUAL' does not match Plan's resolved CI subject SHA '$SUBJECT_SHA'. Refusing to proceed against an unverified checkout."
            exit 1
          fi

      - uses: swift-institute/.github/.github/actions/configure-private-repos@d1af72d05bf8262fb3918a2f1607b82fafcafdf9  # main 2026-08-03, pin-advance to main HEAD (dependabot #224 via #232); no functional change to this action in range
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          app-client-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
          app-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_ID }}
          app-private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          enabled: ${{ inputs.enable-private-repos }}

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Print toolchain info
        run: |
          swift --version
          echo "Runner image: ${{ runner.os }} on ${{ inputs.macos-runner }}"
          echo "Xcode: $(xcode-select -p)"

      - name: Test
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          # [swift-institute/.github#165] A root-shape `swift test` over the
          # sanctioned nested-test-package layout (Tests/Package.swift, which
          # reaches the parent via `.package(path: "..")`) finds zero tests at
          # the root and exits green without ever running them. Detect the
          # nested layout and run the nested package's tests instead so the
          # gate is non-vacuous. (POSIX sh — no bash arrays: some legs run
          # inside a container image where `sh` is the default step shell.)
          if [ -f Tests/Package.swift ]; then
            echo "Nested test package detected (Tests/Package.swift); running tests from Tests/"
            cd Tests
          fi
          if [ -n "$TEST_FILTER" ]; then
            FILTER=$(echo "$TEST_FILTER" | tr '-' '_')
            swift test -c debug --filter "$FILTER"
          else
            swift test -c debug
          fi

  linux-release:
    name: Ubuntu (Swift ${{ inputs.swift-version }}, release)
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'linux-release' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',linux-release,'))) && (inputs.platform-support == '' || contains(format(',{0},', inputs.platform-support), ',linux,')) }}
    runs-on: ubuntu-latest
    container: swift:${{ inputs.swift-version }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.plan.outputs.subject-repository }}
          ref: ${{ needs.plan.outputs.subject-ref }}
          persist-credentials: false

      - name: Verify checked-out subject HEAD
        shell: bash
        env:
          SUBJECT_SHA: ${{ needs.plan.outputs.subject-sha }}
        run: |
          set -euo pipefail
          # Job-level `container:` steps execute via a fresh `docker exec`
          # per step, so a bare shell `git` call sees the checkout owned by
          # the runner's host UID and refuses it as dubious ownership
          # (2.35.2+) — unlike actions/checkout's own internal git calls two
          # steps up, which already registered the path for themselves. A
          # no-op on bare macOS/Windows runners; trusts nothing beyond what
          # actions/checkout just placed in this same job.
          git config --global --add safe.directory '*'
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$SUBJECT_SHA" ]; then
            echo "::error::checked-out HEAD '$ACTUAL' does not match Plan's resolved CI subject SHA '$SUBJECT_SHA'. Refusing to proceed against an unverified checkout."
            exit 1
          fi

      - uses: swift-institute/.github/.github/actions/configure-private-repos@d1af72d05bf8262fb3918a2f1607b82fafcafdf9  # main 2026-08-03, pin-advance to main HEAD (dependabot #224 via #232); no functional change to this action in range
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          app-client-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
          app-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_ID }}
          app-private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          enabled: ${{ inputs.enable-private-repos }}

      - uses: swift-institute/.github/.github/actions/install-system-deps@d1af72d05bf8262fb3918a2f1607b82fafcafdf9  # main 2026-08-03, pin-advance to main HEAD (dependabot #224 via #232); no functional change to this action in range; pin does not cover apt-fetched packages

      - name: Print toolchain info
        run: |
          swift --version
          echo "Container image: ${{ job.container.image }}"
          echo "Container hostname: $(hostname)"
          echo "OS release:"
          cat /etc/os-release 2>/dev/null || true

      - name: Build or test (release)
        env:
          CI_TIER: ${{ needs.plan.outputs.tier }}
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          # Ordinary push and pull-request development runs select the build
          # tier. Compile the supported release configuration there; reserve
          # the expensive test corpus for the full tier and single-job
          # ci-dispatch, where plan is skipped and CI_TIER is empty.
          if [ "$CI_TIER" = "build" ]; then
            swift build -c release
            exit 0
          fi
          # [swift-institute/.github#165] Detect the sanctioned nested-test-package
          # layout (Tests/Package.swift) and run its tests instead of a root
          # `swift test` that silently discovers zero tests and exits green.
          # (POSIX sh — no bash arrays: some legs run inside a container image
          # where `sh` is the default step shell.)
          if [ -f Tests/Package.swift ]; then
            echo "Nested test package detected (Tests/Package.swift); running tests from Tests/"
            cd Tests
          fi
          if [ -n "$TEST_FILTER" ]; then
            FILTER=$(echo "$TEST_FILTER" | tr '-' '_')
            swift test -c release --filter "$FILTER"
          else
            swift test -c release
          fi

  linux-nightly:
    name: Ubuntu (Swift main nightly, release)
    needs: plan
    if: ${{ !cancelled() && !github.event.repository.private && (inputs.job == 'linux-nightly' || (inputs.job == '' && contains(format(',{0},', needs.plan.outputs.legs), ',linux-nightly,'))) && (inputs.platform-support == '' || contains(format(',{0},', inputs.platform-support), ',linux,')) }}
    runs-on: ubuntu-latest
    container: swiftlang/swift:nightly-main-jammy
    continue-on-error: true
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
