        uses: swift-institute/.github/.github/actions/install-swift-sdk@b4246ad5ee6ff39e6ad413a852c86d8311a83be8  # TX7 self-referential pin advance (swift-institute/.github#497 landing 1, PR #500, merged to main): merge SHA on main declares `skip-on-missing-release` input + `installed` output (verified)
