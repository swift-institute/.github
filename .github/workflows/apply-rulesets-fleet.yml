# apply-rulesets-fleet.yml — on-demand fleet-wide ruleset convergence wave.
#
# workflow_dispatch ONLY. Fans out one sync-metadata.yml call per active org
# in the orgs manifest with apply-rulesets: true, so a ruleset contract
# revision, a re-convergence after break-glass, or a new organization is one
# dispatch instead of the 17-dispatch ceremony the #177 rollout required.
#
# Deliberately carries NO schedule trigger and NO workflow_call: ruleset
# application is an explicit, deliberate human act, never a side effect of
# an autopilot or another workflow's call chain. Do not add either — #193
# is the exact incident (a 04:00 UTC cron would have applied a
# merge-blocking ruleset fleet-wide with no lawful approval path) that
# `apply-rulesets` defaulting false on sync-metadata.yml, and this
# workflow's dispatch-only trigger, jointly exist to prevent.
#
# Shape: config/sweep/report, mirroring sync-metadata-nightly.yml's
# matrix-per-org fan-out minus the schedule trigger and the nightly's
# tracking-issue side effect — this workflow reports a run summary only.
#
# Provenance: #203 (this workflow); #193 (why the nightly must never carry
# apply-rulesets); #177 (first wave, 17 manual dispatches).

name: apply-rulesets-fleet

# [CI-090] Standalone (workflow_dispatch-only) trigger shape: deny-all
# floor at workflow level; per-job grants below.
permissions: {}

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Preview ruleset convergence without applying.'
        type: boolean
        required: false
        default: false

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      orgs: ${{ steps.read.outputs.orgs }}
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - id: read
        uses: swift-institute/.github/.github/actions/read-orgs@6f73c2ebff00e4f05375794905926bdd7a0ca14b  # main 2026-08-04, identity-pin to main HEAD (swift-institute/.github#286); no functional change to this action in range
        # Default filter `.name` emits all active (non-archived) orgs.

  sweep:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    # [CI-106] Caller must grant equivalent or greater than the called
    # reusable's per-job permissions (sync-metadata.yml `sync` / `rulesets`
    # / `surfaces` jobs each declare: contents: read).
    permissions:
      contents: read
    uses: ./.github/workflows/sync-metadata.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      apply-rulesets: true
    secrets: inherit

  report:
    needs: sweep
    if: always() && needs.sweep.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Aggregate per-org rulesets-job conclusions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Each org leg is a `uses:` call into sync-metadata.yml, so its
          # `rulesets` job appears in THIS run's own job list as
          # "sweep (<org>) / rulesets" — sync/surfaces failures (unrelated
          # to ruleset convergence) are deliberately excluded from this
          # filter so they don't manufacture a false ruleset-wave failure.
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --paginate \
            --jq '.jobs[] | select(.name | endswith("/ rulesets"))' \
            > "${RUNNER_TEMP}/rulesets-jobs.jsonl"

          {
            echo "## apply-rulesets-fleet results"
            echo ""
            echo "| Org leg | rulesets conclusion |"
            echo "| --- | --- |"
            jq -r '"| " + .name + " | " + .conclusion + " |"' "${RUNNER_TEMP}/rulesets-jobs.jsonl"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=$(jq -s '[.[] | select(.conclusion != "success")] | length' "${RUNNER_TEMP}/rulesets-jobs.jsonl")
          if [[ "$failed" != "0" ]]; then
            echo "::error::${failed} org leg(s) failed the rulesets job — see the run summary."
            exit 1
          fi
