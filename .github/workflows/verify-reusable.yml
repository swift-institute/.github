name: verify-reusable

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  embedded-pal:
    name: Embedded PAL · Linux x86-64
    runs-on: ubuntu-latest
    container: swiftlang/swift@sha256:3ae5234721c87bda6ab232a2346fc143ac5688159626c8800e66a5eef2a31a16
    timeout-minutes: 10
    steps:
      - name: Compile, link and run through PAL
        shell: bash
        run: |
          set -euo pipefail
          swift --version
          PACKAGE="$RUNNER_TEMP/PAL"
          mkdir -p "$PACKAGE/Sources/PAL"
          cat > "$PACKAGE/Package.swift" <<'SWIFT'
          // swift-tools-version: 6.4
          import PackageDescription

          let package = Package(
            name: "PAL",
            products: [.executable(name: "PAL", targets: ["PAL"])],
            targets: [.executableTarget(name: "PAL")]
          )
          SWIFT
          cat > "$PACKAGE/Sources/PAL/PAL.swift" <<'SWIFT'
          @main
          struct Main {
            static func main() {
              print("Embedded PAL linked and ran")
            }
          }
          SWIFT
          swift build --package-path "$PACKAGE" -c release \
            -Xswiftc -enable-experimental-feature -Xswiftc Embedded
          "$PACKAGE/.build/release/PAL"

  swift-async:
    name: swift-atoms/swift-async
    uses: ./.github/workflows/swift-ci.yml
    with:
      subject-repository: swift-atoms/swift-async
      subject-sha: 5fc20b1d2b1d1ba854c4070e67ef94b34898e9f9

  swift-algebra:
    name: swift-atoms/swift-algebra
    uses: ./.github/workflows/swift-ci.yml
    with:
      subject-repository: swift-atoms/swift-algebra
      subject-sha: 2f2e999b8126630c941098d232bf924c12e1270a

  swift-calendar:
    name: swift-atoms/swift-calendar
    uses: ./.github/workflows/swift-ci.yml
    with:
      subject-repository: swift-atoms/swift-calendar
      subject-sha: 430a20b16e7185236ca35b482a4dc0e9ab49b5d3

  verify-reusable:
    name: Verify reusable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Planner reuse controls
        shell: bash
        run: bash .github/actions/institute-ci/verify-planner-tests.sh
      - name: Planner pin contract controls
        shell: bash
        run: bash .github/actions/institute-ci/verify-planner-pins-tests.sh
      - name: Planner pin contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/actions/institute-ci/verify-planner-pins.sh .institute-ci-pin .institute-ci-planner
      - name: Compare the reusable's head with the reviewed revision
        shell: bash
        run: |
          set -euo pipefail
          read -r reviewed recorded < .github/reusable-review
          head="$(git log -1 --format=%H -- .github/workflows/swift-ci.yml)"
          age=$(( ($(date -u +%s) - $(date -u -d "$recorded" +%s)) / 86400 ))
          echo "reusable head $head; reviewed $reviewed on $recorded ($age days ago)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$head" != "$reviewed" ] && [ "$age" -gt 7 ]; then
            echo "::error::swift-ci.yml moved to $head but .github/reusable-review still names $reviewed from $recorded; review the change and record the new revision."
            exit 1
          fi
