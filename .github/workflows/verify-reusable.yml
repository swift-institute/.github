name: verify-reusable

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-reusable:
    name: Verify reusable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare the reusable's head with the reviewed revision
        shell: bash
        run: |
          set -euo pipefail
          read -r reviewed recorded < .github/reusable-review
          head="$(git log -1 --format=%H -- .github/workflows/swift-ci.yml)"
          age=$(( ($(date -u +%s) - $(date -u -d "$recorded" +%s)) / 86400 ))
          echo "reusable head $head; reviewed $reviewed on $recorded ($age days ago)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$head" != "$reviewed" ] && [ "$age" -gt 7 ]; then
            echo "::error::swift-ci.yml moved to $head but .github/reusable-review still names $reviewed from $recorded; review the change and record the new revision."
            exit 1
          fi
