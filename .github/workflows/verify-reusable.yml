name: verify-reusable

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-reusable:
    name: Verify reusable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Planner reuse controls
        shell: bash
        run: bash .github/actions/institute-ci/verify-planner-tests.sh
      - name: Planner pin contract controls
        shell: bash
        run: bash .github/actions/institute-ci/verify-planner-pins-tests.sh
      - name: Planner pin contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/actions/institute-ci/verify-planner-pins.sh .institute-ci-pin .institute-ci-planner
