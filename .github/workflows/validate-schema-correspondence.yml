# validate-schema-correspondence.yml — [GH-REPO-063] as a gate rather than a
# detector.
#
# WHAT CHANGED AND WHY
#
# The guard existed before this workflow, but its only caller was
# validate-github-metadata.yml, which has `workflow_call` and
# `workflow_dispatch` triggers and NO push or pull_request — and which checks
# swift-institute/.github out at `ref: main`. Two consequences, both bad:
#
#   1. A pull request adding a schema key with no reader MERGED GREEN. Nothing
#      ran on the pull request, so nothing could stop it.
#   2. The first look was the next weekly sweep, which reads `main` — by then
#      the drift had already landed, and the sweep's own signal was unread for
#      three consecutive weeks.
#
# The manifest recorded this as `self-firing: deferred`. A known gap in a file
# nobody reads is functionally an unknown one.
#
# This workflow triggers on push and pull_request over exactly the files the
# correspondence spans, and checks out the ref under review rather than main.
# validate-github-metadata.yml keeps its embedded check (now its
# `correspondence` job): that one is the sweep's view of `main`, this one is
# the gate on the change.
#
# F16 port: the guard is Swift-owned — `CI.Validation.SchemaCorrespondence`
# in swift-institute/institute-continuous-integration, retiring `validate-schema-workflow-keys.py`. The
# contract changed with the owner: findings travel on stdout as TSV and the
# exit code answers only "did the validator run?" (0 = ran, 2 = could not),
# so both steps below judge findings by the TSV, not the exit code.
#
# THE POSITIVE CONTROL IS THE FIRST STEP, NOT AN AFTERTHOUGHT
#
# Per VALIDATOR-DISCIPLINE.md in swift-institute/Internal, a check is not wired
# until something has been made to fail through the whole path it will
# actually run in. Before this
# workflow, the guard's PASSING direction was confirmed through the real path
# and its FAILING direction never had been.
#
# So the fixture step runs first and gates the live step: every scenario under
# tests/schema-correspondence/fail/ must produce at least one finding and the
# pass/ scenario must produce none, checked here, on every run. If the guard
# ever stops being able to fail, this job goes red before it has a chance to
# report a reassuring green on the live files. A run in which the fixtures did
# not execute is a failure, not a pass.
#
# The fixtures live outside the validator-fixture corpus because that runner
# assumes repository-shaped scenarios, and this guard takes three file paths.
# Registering it there would have meant bending one of the two conventions out
# of shape; the validator's `--schema/--sync-workflow/--readme-validator`
# face names the three files instead.
#
# Standalone workflow with no workflow_call trigger, so per [CI-090] it carries
# a deny-all permissions floor with an explicit per-job grant.

name: validate-schema-correspondence

permissions: {}

on:
  push:
    branches: [main]
    paths:
      - 'metadata-schema.json'
      - '.github/workflows/sync-metadata.yml'
      - '.github/scripts/validate-readme.py'
      - '.github/scripts/tests/schema-correspondence/**'
      - '.github/workflows/validate-schema-correspondence.yml'
  pull_request:
    paths:
      - 'metadata-schema.json'
      - '.github/workflows/sync-metadata.yml'
      - '.github/scripts/validate-readme.py'
      - '.github/scripts/tests/schema-correspondence/**'
      - '.github/workflows/validate-schema-correspondence.yml'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correspondence:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    # 60, up from 10: the F12 cold bootstrap (a Workspace source build of
    # institute-ci) runs in this job on a cache miss and takes ~30 minutes;
    # warm-cache runs restore in seconds (validate-skill-hygiene precedent).
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      # Deliberately NOT `ref: main`. The whole point of this workflow is to
      # inspect the change under review; on pull_request the default checkout
      # is the merge ref, which is what the branch will become.
      - name: Checkout the ref under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Provision the Institute CI binary
        id: institute-ci
        uses: ./.github/actions/institute-ci

      - name: Positive control — the guard must still be able to fail
        id: control
        shell: bash
        env:
          BINARY: ${{ steps.institute-ci.outputs.binary }}
          FIXTURES: .github/scripts/tests/schema-correspondence
        run: |
          set -euo pipefail
          : > /tmp/control.txt
          scenarios=0
          bad=0
          for kind in pass fail; do
            for dir in "${FIXTURES}/${kind}"/*/; do
              [ -d "$dir" ] || continue
              scenarios=$((scenarios + 1))
              rc=0
              "$BINARY" validate --rule GH-REPO-063 \
                --repository swift-institute/.github --root . \
                --schema "${dir}metadata-schema.json" \
                --sync-workflow "${dir}sync-metadata.yml" \
                --readme-validator "${dir}validate-readme.py" \
                > /tmp/scenario.txt 2>&1 || rc=$?
              findings=$(grep -c . /tmp/scenario.txt || true)
              # Contract: exit 0 = ran (findings are the TSV, not the code);
              # any nonzero exit means the question was not asked.
              want_findings=0; [ "$kind" = fail ] && want_findings=1
              if [ "$rc" -eq 0 ] && { { [ "$want_findings" -eq 1 ] && [ "$findings" -ge 1 ]; } \
                  || { [ "$want_findings" -eq 0 ] && [ "$findings" -eq 0 ]; }; }; then
                echo "ok   ${kind}/$(basename "$dir") findings=${findings}" >> /tmp/control.txt
              else
                bad=$((bad + 1))
                {
                  echo "BAD  ${kind}/$(basename "$dir") rc=${rc} findings=${findings} want_findings=${want_findings}"
                  sed 's/^/       /' /tmp/scenario.txt
                } >> /tmp/control.txt
              fi
            done
          done
          cat /tmp/control.txt
          echo "scenarios=${scenarios}" >> "$GITHUB_OUTPUT"
          # "Ran nothing" must never read as "nothing was wrong". The count is
          # derived from the directories actually walked, so a fixture tree that
          # got moved or emptied fails here rather than reporting a clean run
          # over an empty population.
          if [ "$scenarios" -eq 0 ]; then
            echo "::error::No GH-REPO-063 fixture scenarios were found under ${FIXTURES}. The positive control did not run, so a green result below would be meaningless."
            exit 1
          fi
          if [ "$bad" -ne 0 ]; then
            echo "::error::${bad} of ${scenarios} GH-REPO-063 fixture scenarios did not behave as declared. The guard's ability to fail is no longer established; fix that before trusting any result it reports."
            exit 1
          fi
          echo "::notice title=Positive control::${scenarios} GH-REPO-063 fixture scenarios behaved as declared (every fail/ scenario produced a finding)."

      - name: Check the live schema against its consumers
        id: live
        shell: bash
        env:
          BINARY: ${{ steps.institute-ci.outputs.binary }}
        run: |
          set -euo pipefail
          rc=0
          "$BINARY" validate --rule GH-REPO-063 \
            --repository swift-institute/.github --root . \
            > /tmp/live.txt 2>&1 || rc=$?
          cat /tmp/live.txt
          if [ "$rc" -ne 0 ]; then
            echo "::error::GH-REPO-063 could not run (exit ${rc}) — an environment defect, not a verdict."
            exit "$rc"
          fi
          if grep -q . /tmp/live.txt; then
            echo "::error::GH-REPO-063 found schema<->consumer correspondence mismatches (see findings above)."
            exit 1
          fi
          echo "[GH-REPO-063] live schema is consistent with its consumers."

      - name: Step summary
        if: always()
        shell: bash
        env:
          CONTROL_RESULT: ${{ steps.control.outcome }}
          SCENARIOS: ${{ steps.control.outputs.scenarios }}
          LIVE_RESULT: ${{ steps.live.outcome }}
        run: |
          {
            echo "## [GH-REPO-063] schema ↔ consumer correspondence"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Positive control (${SCENARIOS:-0} fixture scenarios) | \`${CONTROL_RESULT:-did-not-run}\` |"
            echo "| Live schema vs consumers | \`${LIVE_RESULT:-did-not-run}\` |"
            echo
            echo "The control runs first and gates the live check: a guard that"
            echo "cannot be made to fail cannot make a green result mean anything."
            echo
            echo '```'
            cat /tmp/control.txt 2>/dev/null || echo "(control did not run)"
            echo '```'
            echo
            echo '```'
            cat /tmp/live.txt 2>/dev/null || echo "(live check did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
