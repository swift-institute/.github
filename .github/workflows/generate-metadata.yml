# generate-metadata.yml — heuristic-seeded YAML drafts for bulk authoring.
#
# Dispatched manually when starting a new wave. For each in-scope repo without
# an existing .github/metadata.yaml, opens a PR with a draft YAML inferred from
# the package class (mechanical from org + repo name) and the spec-titles.yaml
# lookup table.
#
# The decision half — classification and the rendered draft — lives in the
# Swift owner `Repository.Policy.Metadata.Draft` behind the
# `repository-policy draft-metadata` face
# (swift-institute/institute-repository-policy, extracted from the Tools/
# copy by TX-4, swift-institute/.github#515). This
# workflow keeps only the plumbing the Swift owner deliberately excludes:
# target enumeration, the two idempotency skips, the Package.swift
# description fetch, and the clone / commit / pull request that carry the
# draft. That split is what lets the classification be tested without a
# token; see the doc comment on Repository.Policy.Metadata.Draft.
#
# Provenance: Skills/github-repository [GH-REPO-070]; Research/github-metadata-
# harmonization.md § 4.4 / § 3.1.

name: generate-metadata

on:
  workflow_call:
    inputs:
      org:
        description: 'Org to draft metadata for.'
        type: string
        required: true
      repo:
        description: 'Single repo (owner/name) to draft. Optional; omit to scope to entire org.'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      org:
        description: 'Org to draft metadata for (e.g., swift-ietf).'
        type: string
        required: true
      repo:
        description: 'Single repo (owner/name) to draft. Optional.'
        type: string
        required: false

jobs:
  generate:
    if: ${{ !github.event.repository.private }}     # [CI-032]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout swift-institute/.github (for spec-titles.yaml + script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          ref: ${{ job.workflow_sha }}
          path: institute-github

      - name: Select Swift 6.3
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: '6.3'

      # TX-4 of the reduction census (swift-institute/.github#515): the
      # classifier engine now lives in its seeded repository,
      # swift-institute/institute-repository-policy, and this workflow
      # consumes it from there instead of the retiring Tools/ copy. The
      # engine's own Sources/ and Tests/ locate the retained Policy/ data
      # (and, for the test suite, .github/workflows/*.yml and
      # .github/scripts/tests/fixtures/callers/) by walking up a fixed
      # number of #filePath parents that assumes co-location inside
      # institute-github/Tools/repository-policy. actions/checkout
      # unconditionally deletes the contents of its `path:` before cloning
      # (regardless of `clean:`), so checking out directly into that path
      # would delete the Policy/ already checked out above. Check out to a
      # separate directory instead and copy the engine files in, leaving
      # Policy/ untouched. The seed is private, so the checkout rides a
      # transient App token scoped to exactly that one repository with
      # contents:read (the same narrowed-mint shape
      # review-pr-transaction.yml and tools-tests.yml use).
      - name: Mint read-only token for the seeded repository-policy package
        id: repo-policy-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: swift-institute
          repositories: institute-repository-policy
          permission-contents: read

      - name: Checkout the seeded repository-policy package at exact main pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: swift-institute/institute-repository-policy
          # Advance with pin-advance flow; must stay a full SHA (branch-pin
          # guard). Same pin as sync-metadata.yml and tools-tests.yml.
          ref: 85f1e68106d6a30498077cc5ce6cb90b5d271409
          path: .repository-policy-engine
          token: ${{ steps.repo-policy-token.outputs.token }}
          persist-credentials: false

      - name: Copy the seeded engine into institute-github/Tools/repository-policy, beside the retained Policy/
        run: |
          set -euo pipefail
          cp -R .repository-policy-engine/Package.swift .repository-policy-engine/Lint.swift \
            .repository-policy-engine/.gitignore .repository-policy-engine/Sources \
            .repository-policy-engine/Tests institute-github/Tools/repository-policy/

      - name: Build repository-policy (Swift owner of the draft)
        id: policy
        run: |
          set -euo pipefail
          swift build --package-path institute-github/Tools/repository-policy \
            --product repository-policy
          bin=$(swift build --package-path institute-github/Tools/repository-policy \
            --show-bin-path)
          echo "binary=${bin}/repository-policy" >> "$GITHUB_OUTPUT"

      - name: Mint installation token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ inputs.org }}
          permission-metadata: read
          permission-contents: write
          permission-pull-requests: write

      - name: Generate per-repo drafts
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ inputs.org }}
          SINGLE_REPO: ${{ inputs.repo }}
          SPEC_TITLES: institute-github/spec-titles.yaml
          POLICY: ${{ steps.policy.outputs.binary }}
        run: |
          set -euo pipefail
          : "${ORG:?ORG environment variable required}"
          SINGLE_REPO="${SINGLE_REPO:-}"

          # Build target list --------------------------------------------
          if [[ -n "$SINGLE_REPO" ]]; then
            targets=("$SINGLE_REPO")
          else
            mapfile -t targets < <(gh repo list "$ORG" --limit 2000 \
              --json nameWithOwner,isArchived \
              --jq '.[] | select(.isArchived==false) | .nameWithOwner')
          fi
          echo "Targets: ${#targets[@]} repos"

          generate_one() {
            local target="$1"

            # Skip if a metadata.yaml already exists on the default branch —
            # bootstrap only; once the draft lands, the YAML is the source
            # of truth and is never re-generated (Wave 2b Decision 6).
            if gh api "repos/${target}/contents/.github/metadata.yaml" --silent 2>/dev/null; then
              echo "  ${target}: skipped (metadata.yaml already on main)"
              return 0
            fi
            # Skip if an open metadata-draft PR already exists (idempotency
            # on retry).
            local existing_pr
            existing_pr=$(gh api "repos/${target}/pulls?state=open" \
              --jq '[.[] | select(.head.ref | startswith("metadata/draft-"))] | .[0].html_url // ""')
            if [[ -n "$existing_pr" ]]; then
              echo "  ${target}: skipped (open draft PR already exists: $existing_pr)"
              return 0
            fi

            # The `description:` literal from the target's Package.swift.
            # The Swift owner consults it only for an L1-primitive, so it
            # is fetched only for one — same shape the retired script had.
            local pkg_desc=""
            if [[ "${target#*/}" =~ -primitives$ ]]; then
              pkg_desc=$(gh api "repos/${target}/contents/Package.swift" --jq '.content' 2>/dev/null \
                | base64 -d 2>/dev/null \
                | grep -oE 'description:[[:space:]]*"[^"]*"' \
                | head -1 \
                | sed -E 's/.*"([^"]*)".*/\1/' || echo "")
            fi

            # The decision half: classify and render, in Swift. The class
            # token is read back from the draft's own header — the one
            # place it is authoritatively recorded.
            local draft class
            draft=$("$POLICY" draft-metadata \
              --repository "$target" \
              --spec-titles "$SPEC_TITLES" \
              --package-description "$pkg_desc")
            class=$(printf '%s\n' "$draft" | sed -n 's/^# Detected class: //p')

            # Compose commit and open PR ---------------------------------
            local branch
            branch="metadata/draft-$(date -u +%Y%m%d-%H%M%S)"
            local tmpdir
            tmpdir=$(mktemp -d)
            (
              cd "$tmpdir"
              gh repo clone "$target" repo -- --depth 1
              cd repo
              # gh repo clone uses gh's auth for the clone; subsequent git
              # operations need their own auth. Embed the App token in the
              # remote URL.
              git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${target}.git"
              git checkout -b "$branch"
              mkdir -p .github
              printf '%s\n' "$draft" > .github/metadata.yaml
              git add .github/metadata.yaml

              local commit_msg
              commit_msg=$(printf 'metadata: add .github/metadata.yaml draft\n\nGenerated draft for review. Class: %s.\n\nSee Skills/github-repository for the standard; replace any TODO entries\nwith real values before merging.\n' "${class}")
              git -c user.name='swift-institute-bot' \
                  -c user.email='swift-institute-bot@users.noreply.github.com' \
                  commit -m "$commit_msg"
              git push --set-upstream origin "$branch"

              local pr_body
              pr_body=$(printf 'Heuristic-seeded `.github/metadata.yaml` draft for review. Class detected: `%s`.\n\nReplace any `TODO` entries with real values before merging. To preview the proposed sync, dispatch `sync-metadata.yml` with `dry-run=true` and `repo=%s`; the run summary will contain the diff.\n\nSee [Skills/github-repository](https://github.com/swift-institute/Skills/blob/main/github-repository/SKILL.md) for the standard, and [Research/github-metadata-harmonization.md § 3](https://github.com/swift-institute/Research/blob/main/github-metadata-harmonization.md) for the templates.\n' "${class}" "${target}")
              # Use gh api directly so any failure prints a clear error.
              local pr_url
              pr_url=$(gh api "repos/${target}/pulls" \
                --method POST \
                --field title="metadata: add .github/metadata.yaml draft" \
                --field head="$branch" \
                --field base="main" \
                --field body="$pr_body" \
                --jq '.html_url')
              echo "    PR: $pr_url"
            )
            rm -rf "$tmpdir"
            echo "  ${target}: PR opened (class=${class})"
          }

          for target in "${targets[@]}"; do
            generate_one "$target" || echo "  ${target}: ERROR"
          done
