# sync-gitignore.yml — propagate canon/gitignore-package.txt across the fleet.
#
# Reusable workflow. For the given `org` (or single `repo`), enumerates
# non-archived package repos, renders each one's `.gitignore` from canon via
# `.github/scripts/render-gitignore.py`, and commits only where the render
# differs from what is there.
#
# This is the propagation half of the gitignore pair; validate-gitignore.yml is
# the enforcement half. Propagation runs first and makes the fleet conformant;
# the gate then keeps it that way rather than reddening a corpus that was never
# converged. Retires the gitignore leg of the private Scripts repo's seven
# `sync-*` propagators (Workspace#23) — that repo is archived, so until this
# landed nothing propagated `.gitignore` at all.
#
# What canon owns and what it does not: everything up to `END CANONICAL` is
# replaced wholesale; everything after it is the package's own and is preserved
# byte-for-byte. A pre-canonical file with no marker keeps its ENTIRE content as
# local overrides beneath a freshly prepended canonical section — those rules
# were deliberate and this workflow does not get to delete them.
#
# Rendering is deterministic and byte-compared, so a conformant repository
# produces no commit and a re-run is a no-op. Verified idempotent against all
# three fleet shapes (conformant, Workspace#16 header drift, pre-canonical)
# before first run.
#
# Authentication: swift-institute-bot GitHub App, per Skills/github-repository
# [GH-REPO-073]. Metadata and settings convergence runs through the bot, not a
# hand-run sweep, and file convergence follows the same rule.
#
# Inputs:
#   repo:     "owner/name". When set, scope to one repo.
#   org:      org name. When set, scope to one org. Ignored if `repo` set.
#   dry-run:  render and diff, but push nothing. DEFAULT TRUE — this workflow
#             writes to hundreds of repositories, so the safe mode is the one
#             you get by forgetting to think about it.

name: sync-gitignore

on:
  workflow_call:
    inputs:
      repo:
        description: 'Owner/name of a single repo to sync.'
        type: string
        required: false
        default: ''
      org:
        description: 'Org to sweep (ignored if repo is set).'
        type: string
        required: false
        default: ''
      dry-run:
        description: 'Render and diff without pushing.'
        type: boolean
        required: false
        default: true
    outputs:
      repos-changed:
        description: 'Number of repos whose .gitignore diverged from canon.'
        value: ${{ jobs.sync.outputs.repos-changed }}
      commits-pushed:
        description: 'Number of commits actually pushed (0 in dry-run).'
        value: ${{ jobs.sync.outputs.commits-pushed }}

  workflow_dispatch:
    inputs:
      repo:
        description: 'Owner/name of a single repo (optional).'
        type: string
        required: false
      org:
        description: 'Org to sweep (optional; ignored if repo is set).'
        type: string
        required: false
      dry-run:
        description: 'Render and diff without pushing.'
        type: boolean
        required: false
        default: true

jobs:
  sync:
    if: ${{ !github.event.repository.private }}     # [CI-032]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      repos-changed: ${{ steps.propagate.outputs.repos-changed }}
      commits-pushed: ${{ steps.propagate.outputs.commits-pushed }}
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Mint installation token (swift-institute-bot)
        id: mint-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ inputs.org || github.repository_owner }}

      - name: Checkout swift-institute/.github (canon + renderer)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          path: institute-github
          ref: main

      - name: Prove the renderer and the gate agree before writing anything
        # The fixture suite covers the gate; this covers the pair. A renderer
        # that emits something the validator rejects would push a fleet-wide
        # commit and then redden every repository it touched, which is the
        # precise failure this ordering exists to prevent.
        run: |
          set -euo pipefail
          "${{ github.workspace }}/institute-github/.github/scripts/tests/run.sh" gh-ignore-

      - name: Resolve target repos
        id: targets
        env:
          GH_TOKEN: ${{ steps.mint-token.outputs.token }}
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_ORG: ${{ inputs.org }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_REPO" ]; then
            echo "$INPUT_REPO" > /tmp/targets.txt
          else
            : "${INPUT_ORG:?org or repo input required}"
            gh repo list "$INPUT_ORG" --no-archived --limit 1000 \
              --visibility public --json nameWithOwner --jq '.[].nameWithOwner' \
              > /tmp/targets.txt
          fi
          echo "resolved $(wc -l < /tmp/targets.txt) target(s)"

      - name: Render and propagate
        id: propagate
        env:
          GH_TOKEN: ${{ steps.mint-token.outputs.token }}
          CANON: ${{ github.workspace }}/institute-github/canon/gitignore-package.txt
          RENDERER: ${{ github.workspace }}/institute-github/.github/scripts/render-gitignore.py
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          changed=0; pushed=0; skipped=0; failed=0
          : > /tmp/report.tsv
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            workdir=$(mktemp -d)
            if ! gh repo clone "$repo" "$workdir" -- --depth 1 --quiet 2>/dev/null; then
              echo "$repo	clone-failed	-" >> /tmp/report.tsv
              failed=$((failed+1)); rm -rf "$workdir"; continue
            fi
            # Packages only. Canon describes a Swift package layout; applying a
            # package whitelist to a docs or tooling repo would deny its
            # top-level content wholesale, which is the work-loss shape.
            if [ ! -f "$workdir/Package.swift" ]; then
              echo "$repo	not-a-package	-" >> /tmp/report.tsv
              skipped=$((skipped+1)); rm -rf "$workdir"; continue
            fi
            python3 "$RENDERER" "$CANON" "$workdir/.gitignore" > /tmp/rendered
            if cmp -s /tmp/rendered "$workdir/.gitignore"; then
              echo "$repo	conformant	-" >> /tmp/report.tsv
              rm -rf "$workdir"; continue
            fi
            changed=$((changed+1))
            echo "$repo	diverged	-" >> /tmp/report.tsv
            if [ "$DRY_RUN" = "true" ]; then rm -rf "$workdir"; continue; fi
            cp /tmp/rendered "$workdir/.gitignore"
            (
              cd "$workdir"
              git config user.name  "swift-institute-bot[bot]"
              git config user.email "swift-institute-bot[bot]@users.noreply.github.com"
              # `gh repo clone` leaves an unauthenticated https remote, so a raw
              # `git push` gets "could not read Username for https://github.com"
              # — which is what the first fleet run did, 137 times, pushing
              # nothing. Carry the App token on the remote explicitly.
              git remote set-url origin \
                "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git"
              # Explicit pathspec. This workflow has write access to hundreds of
              # repositories and must never stage anything it did not render.
              git add -- .gitignore
              staged=$(git diff --cached --name-only)
              if [ "$staged" != ".gitignore" ]; then
                echo "::error::$repo staged unexpected paths: $staged"
                exit 1
              fi
              # Separate -m paragraphs rather than one embedded multi-line
              # string: unindented continuation lines inside a YAML block
              # scalar terminate the block and break the workflow parse.
              git commit -q \
                -m "Sync .gitignore from canon" \
                -m "Renders canon/gitignore-package.txt in swift-institute/.github. The canonical section is owned by canon; anything after END CANONICAL is this package's own and was preserved byte-for-byte." \
                -m "The canonical package .gitignore is a whitelist: /* denies every top-level entry and !/... re-includes the directories that carry real work, plus a nested rule denying tool-state dot-directories at every depth. Tool output cannot creep in unless canon whitelists it."
              git push -q origin HEAD
            ) && pushed=$((pushed+1)) || { failed=$((failed+1)); echo "$repo	push-failed	-" >> /tmp/report.tsv; }
            rm -rf "$workdir"
          done < /tmp/targets.txt

          echo "repos-changed=$changed" >> "$GITHUB_OUTPUT"
          echo "commits-pushed=$pushed" >> "$GITHUB_OUTPUT"
          {
            echo "## sync-gitignore"
            echo
            echo "| outcome | count |"
            echo "|---|---:|"
            echo "| diverged from canon | $changed |"
            echo "| commits pushed | $pushed |"
            echo "| skipped (not a package) | $skipped |"
            echo "| clone or push failures | $failed |"
            echo
            if [ "$DRY_RUN" = "true" ]; then
              echo "> [!NOTE]"
              echo "> Dry run — nothing was pushed."
              echo
            fi
            if [ "$failed" -gt 0 ]; then
              echo "> [!CAUTION]"
              echo "> ${failed} repo(s) failed to clone or push and were NOT converged. The counts above are a floor."
              echo
              awk -F'\t' '$2 ~ /failed/ { printf("- `%s`: %s\n", $1, $2) }' /tmp/report.tsv
            fi
          } > "$GITHUB_STEP_SUMMARY"
          echo "sync-gitignore: $changed diverged, $pushed pushed, $skipped skipped, $failed failed"
          if [ "$failed" -gt 0 ]; then
            echo "::error::${failed} repo(s) were not converged — a green result here would be false."
            exit 1
          fi
