# ci-sweep.yml — nightly full-matrix rotation sweep (R1/R2 ruling 2026-07-20).
#
# PURPOSE
# Per-push CI runs a fast tier (see swift-ci.yml's plan job); the FULL
# platform contract ([CI-010]/[CI-091]) is re-verified here on a rotating
# nightly slice of the public fleet, plus unconditionally on tag refs.
# This replaces per-push breadth: the advisory legs (apple-simulator-build,
# linux-nightly, linux-6-4) and the cross-platform gating legs run for every
# repo at least once per rotation period instead of on every push.
#
# ROTATION
# The fleet (all public, non-archived, non-fork repos of every active org in
# the orgs manifest) is deterministically partitioned into `slices` buckets
# by a stable hash of the repo name; each night runs bucket
# (day-of-year % slices). Default slices=7 → every repo gets a full-matrix
# verification at least weekly. Dispatch with an explicit `repos` list for
# canary/manual runs.
#
# BUDGET
# Jobs here run under swift-institute/.github's own org concurrency quota, so
# the sweep never competes with consumer-push queues in the layer orgs.
# max-parallel bounds simultaneous swift-ci calls (each spawns 5 macOS jobs
# against the 5-concurrent free-tier macOS pool).
#
# CALL CHAIN (depth 3, under the 4-level workflow_call limit):
#   ci-sweep.yml (1) -> swift-ci.yml (2, tier=full) -> advisory reusables (3)
#
# REPORTING
# The report job aggregates this run's job conclusions per swept repo into
# the step summary and upserts a tracking issue in swift-institute/.github
# ([README-167] shape) listing repos with failing gating legs.
#
# [CI-104]: canary scheduled workflows via `gh workflow run` — e.g.
#   gh workflow run ci-sweep.yml -R swift-institute/.github \
#     -f repos="swift-primitives/swift-bool-algebra-primitives"

name: ci-sweep

# [CI-090] standalone workflow: deny-all floor; per-job grants below.
permissions: {}

on:
  schedule:
    - cron: '11 0 * * *'   # nightly 00:11 UTC — interim measure (#168): 2h earlier than 02:11 to move the observed 05:17-05:44 UTC delayed start to ~03:17 UTC, clear of the 04:00 UTC metadata-sync cron cluster
  workflow_dispatch:
    inputs:
      repos:
        description: "Space/comma-separated owner/name list to sweep (canary or manual re-verify). Empty = tonight's rotation slice."
        type: string
        required: false
        default: ""
      slices:
        description: "Number of rotation buckets the fleet is partitioned into (default 7 → weekly full coverage)."
        type: string
        required: false
        default: "7"
      visibility:
        description: 'Filter fleet enumeration by visibility: public | private | internal | all. Default public — swift-institute''s own fleet is public; a peer institute with a private fleet (#244) supplies its own value.'
        type: string
        required: false
        default: 'public'
      exclude-archived:
        description: 'Exclude archived repos from fleet enumeration. Default true. A peer''s archived-repo posture need not match ours (#244).'
        type: boolean
        required: false
        default: true

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      repos: ${{ steps.slice.outputs.repos }}
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Read orgs manifest
        id: orgs
        uses: swift-institute/.github/.github/actions/read-orgs@main
        with:
          filter: '.name'

      - name: Enumerate fleet and select slice
        id: slice
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ORGS_JSON: ${{ steps.orgs.outputs.orgs }}
          REPOS_OVERRIDE: ${{ inputs.repos }}
          SLICES: ${{ inputs.slices || '7' }}
          INPUT_VISIBILITY: ${{ inputs.visibility || 'public' }}
          INPUT_EXCLUDE_ARCHIVED: ${{ inputs.exclude-archived }}
        run: |
          set -euo pipefail
          if [ -n "$REPOS_OVERRIDE" ]; then
            # Manual/canary list: normalize separators to newlines.
            fleet=$(tr ', ' '\n\n' <<<"$REPOS_OVERRIDE" | sed '/^$/d')
            selected="$fleet"
            echo "Override list: $(wc -l <<<"$selected") repos."
          else
            viz_flag=()
            case "$INPUT_VISIBILITY" in
              public|private|internal) viz_flag=(--visibility "$INPUT_VISIBILITY") ;;
              all|"") ;;
              *) echo "::error::Unknown visibility '${INPUT_VISIBILITY}' (expected: public, private, internal, all)"; exit 1 ;;
            esac
            archive_predicate=".isArchived==false"
            [ "$INPUT_EXCLUDE_ARCHIVED" = "false" ] && archive_predicate="true"
            fleet=""
            zero_orgs=0
            org_count=0
            while IFS= read -r org; do
              org_count=$((org_count+1))
              # Elevated token not needed for public listing; visibility=private
              # or internal relies on github.token's own org read access.
              repos=$(gh repo list "$org" --limit 2000 "${viz_flag[@]}" \
                --json nameWithOwner,isArchived,isFork \
                --jq ".[] | select(${archive_predicate} and .isFork==false) | .nameWithOwner")
              repo_count=$(printf '%s\n' "$repos" | grep -c '^.' || true)
              if [ "$repo_count" -eq 0 ]; then
                zero_orgs=$((zero_orgs+1))
                echo "::warning::ci-sweep enumerated 0 repos from org '${org}' (visibility=${INPUT_VISIBILITY}, exclude-archived=${INPUT_EXCLUDE_ARCHIVED:-true})."
              fi
              fleet="${fleet}${repos}"$'\n'
            done < <(jq -r '.[]' <<<"$ORGS_JSON")
            fleet=$(sed '/^$/d' <<<"$fleet" | sort -u)
            total=$(wc -l <<<"$fleet" | tr -d ' ')
            [ -z "$fleet" ] && total=0
            # Loud-empty-reach (#244): distinguish "every org in the manifest
            # enumerated zero repos" (the manifest's whole sweep target is
            # unreachable — this is the class defect's aggregate case) from a
            # single org legitimately having none. Not a hard failure: this
            # job's own fleet-size guard below already handles the downstream
            # skip when `selected` ends up empty, and a fresh org with no
            # repos yet is a real, non-anomalous state.
            if [ "$org_count" -gt 0 ] && [ "$zero_orgs" -eq "$org_count" ]; then
              echo "::warning::ci-sweep reached 0 repos across all ${org_count} org(s) in the manifest (visibility=${INPUT_VISIBILITY}, exclude-archived=${INPUT_EXCLUDE_ARCHIVED:-true}). A green run tonight converges nothing — verify visibility/exclude-archived scope."
            fi
            bucket=$(( $(date -u +%j | sed 's/^0*//') % SLICES ))
            selected=$(awk -v s="$SLICES" -v b="$bucket" '
              { h=0; for (i=1; i<=length($0); i++) h=(h*31+index("abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_/.", substr($0,i,1)))%1000003 }
              h % s == b' <<<"$fleet")
            echo "Fleet=$total repos; slices=$SLICES; tonight's bucket=$bucket; selected=$(wc -l <<<"$selected" | tr -d ' ')."
          fi
          # Matrix ceiling guard — no silent caps: log what is dropped.
          count=$(sed '/^$/d' <<<"$selected" | wc -l | tr -d ' ')
          if [ "$count" -gt 200 ]; then
            echo "::warning::Slice has $count repos; capping at 200 for this run. Increase 'slices' — the overflow is DROPPED tonight:"
            sed '/^$/d' <<<"$selected" | tail -n +201
            selected=$(sed '/^$/d' <<<"$selected" | head -n 200)
          fi
          json=$(sed '/^$/d' <<<"$selected" | jq -R . | jq -cs .)
          echo "repos=$json" >> "$GITHUB_OUTPUT"

  sweep:
    name: sweep (${{ matrix.repo }})
    needs: select
    if: ${{ needs.select.outputs.repos != '[]' && needs.select.outputs.repos != '' }}
    strategy:
      fail-fast: false
      # Each swift-ci call schedules 5 macOS jobs; the free-tier macOS pool is
      # 5 concurrent. max-parallel 3 keeps the sweep from monopolizing this
      # org's Linux pool while macOS legs serialize naturally.
      max-parallel: 3
      matrix:
        repo: ${{ fromJSON(needs.select.outputs.repos) }}
    # Pure `uses:` routing job ([CI-080] carve-out; [CI-105] no
    # continue-on-error on a `uses:` job). [CI-106]: grant >= the called
    # reusable's per-job needs.
    permissions:
      contents: read
    uses: ./.github/workflows/swift-ci.yml
    secrets: inherit
    with:
      target-repo: ${{ matrix.repo }}
      tier: full

  # ─── DocC rotation (Team Lead ruling 2026-07-29) ─────────────────────────
  # DocC came off per-push in swift-docs.yml — it was 34.2% of a layer org's
  # entire daily CI compute for 244 runner acquisitions a day
  # (swift-institute/Workspace#47). This is where the coverage it used to
  # provide comes back: the same nightly slice, so every public repo gets a
  # DocC validation at least once per rotation period (weekly at slices=7).
  #
  # It rides `select` rather than carrying its own fleet enumeration on
  # purpose. Two copies of "which repos are in the fleet", with nothing
  # holding them together, is this repository's cheapest silent drop
  # (Internal/VALIDATOR-DISCIPLINE.md §3) — the CI rotation and the docs
  # rotation must cover the same repos by construction, not by agreement.
  #
  # Budget: like `sweep`, these jobs run under swift-institute/.github's own
  # 20-slot org quota, so the rotation never competes with consumer-push
  # queues in the layer orgs. max-parallel is higher than `sweep`'s 3 because
  # a docs call schedules ONE Linux job, not five macOS ones; 6 keeps both
  # legs of this workflow inside the shared 20 with room to spare.
  docs-sweep:
    name: docs (${{ matrix.repo }})
    needs: select
    if: ${{ needs.select.outputs.repos != '[]' && needs.select.outputs.repos != '' }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        repo: ${{ fromJSON(needs.select.outputs.repos) }}
    # Pure `uses:` routing job ([CI-080] carve-out; [CI-105] no
    # continue-on-error on a `uses:` job). [CI-106]: grant >= the called
    # reusable's per-job needs.
    permissions:
      contents: read
    uses: ./.github/workflows/swift-docs.yml
    secrets: inherit
    with:
      target-repo: ${{ matrix.repo }}

  report:
    needs: [select, sweep, docs-sweep]
    if: ${{ always() && needs.select.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Aggregate per-repo results
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SWEPT_REPOS: ${{ needs.select.outputs.repos }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --paginate \
            -q '.jobs[] | [.name, .conclusion] | @tsv' > /tmp/jobs.tsv
          {
            echo "## ci-sweep results"
            echo ""
            echo "| Swept repo | Failing jobs |"
            echo "| --- | --- |"
          } > "$RUNNER_TEMP/body.md"
          fail_count=0
          # Job names look like "sweep (owner/name) / <job> ..." for the
          # full-matrix leg and "docs (owner/name) / DocC archive" for the
          # DocC rotation. BOTH prefixes must be matched: docs-sweep was added
          # 2026-07-29 and a report that only knew about `sweep (` would have
          # aggregated every swept repo as green while docs failed silently —
          # the failure mode this report exists to prevent.
          while IFS= read -r repo; do
            fails=$(awk -F'\t' -v ci="sweep ($repo) /" -v dc="docs ($repo) /" \
              '$2=="failure" && (index($1, ci)==1 || index($1, dc)==1) {printf "%s; ", $1}' /tmp/jobs.tsv)
            if [ -n "$fails" ]; then
              echo "| $repo | $fails |" >> "$RUNNER_TEMP/body.md"
              fail_count=$((fail_count+1))
            fi
          done < <(jq -r '.[]' <<<"$SWEPT_REPOS")
          swept_count=$(jq 'length' <<<"$SWEPT_REPOS")
          # Loud-empty-reach (#244): 0 repos swept and 0 failures look
          # identical in the loop above — both leave fail_count at 0. Without
          # this branch a fully empty rotation slice reports "all swept
          # repos green", which is exactly the false-convergence signal the
          # class defect is about. Distinguish "reached and converged
          # nothing to sweep" from "swept N repos and all passed".
          if [ "$swept_count" -eq 0 ]; then
            echo "| _none_ | 0 repos swept this run — not a convergence signal |" >> "$RUNNER_TEMP/body.md"
            echo "::warning::ci-sweep swept 0 repos this run (empty rotation slice or 0-repo fleet). The run reports success, but nothing was verified."
          elif [ "$fail_count" -eq 0 ]; then
            echo "| _none_ | all swept repos green |" >> "$RUNNER_TEMP/body.md"
          fi
          echo "FAIL_COUNT=$fail_count" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert tracking issue
        if: ${{ env.FAIL_COUNT != '0' }}
        uses: swift-institute/.github/.github/actions/upsert-tracking-issue@main
        with:
          repo: ${{ github.repository }}
          title: "ci-sweep: full-matrix failures (nightly rotation)"
          title-prefix: "ci-sweep: full-matrix failures"
          body-file: ${{ runner.temp }}/body.md
          label: ci-sweep
          gh-token: ${{ github.token }}
