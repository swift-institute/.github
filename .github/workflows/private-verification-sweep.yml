# private-verification-sweep.yml — trusted central dispatcher, Stage A of
# Task 2-02's three-stage trusted path (swift-institute/.github#276 Phase 2,
# work object #253). Finds private-repository heads lacking a current
# successful `verification / workspace` check and dispatches
# private-verification.yml (Stages B/C) once per exact (repository, head,
# policy digest) key. Runs entirely on public control-plane minutes; never
# checks out a private subject and never runs subject code.
#
# ENUMERATION. Lists each active organization's private repositories (via
# the same `read-orgs` manifest every other fleet sweep uses) and keeps
# those carrying a root `Package.swift` — an ordinary private package,
# mirroring the `package` repositoryClass the surface policy already uses
# for public repositories. Layer classification here is best-effort (a
# `layer:<name>` repository topic, defaulting to `applications` when absent)
# — this sweep does not yet call Workspace's live private-discovery pass
# (`workspace doctor --institute`, Task 0C-02's mechanism), which resolves
# an authoritative layer per repository but at ~460 requests per invocation.
# Wiring that exact population through a stable CLI-exposed JSON verb is
# flagged as follow-on scope (recorded UNMEASURED in this task's receipt,
# not silently assumed correct) rather than expanded here at Task 2-02's own
# expense.
#
# DEDUPLICATION AND THE NONCE/REQUEST-ID SPLIT. Two different unpredictability
# properties are needed and kept separate:
#   - `requestId` is DETERMINISTIC: sha256(repository|head|policyRevision),
#     truncated. It is the dedup key (point A.5) and the check run's
#     `external_id` — recomputing it lets a later sweep pass recognize
#     "already covered" without keeping external state, and it is opaque
#     (unrecoverable without already knowing the three inputs) without being
#     secret.
#   - `nonce` is CRYPTOGRAPHICALLY RANDOM per dispatch. It is the secret
#     private-verification.yml's publisher job binds the safe envelope to,
#     so replaying an old envelope against a new dispatch of the same
#     (repository, head, policy) fails: the new dispatch has a new nonce.
#
# WRITE SCOPE. This workflow mints exactly one write-capable token action:
# marking the trusted check `in_progress` at the exact head (point A.6),
# narrowly scoped to `checks: write` on the one target repository, before
# any subject code has run. It never mints `checks: write`/`statuses: write`
# for the success/failure transition — that happens only in
# private-verification.yml's `publish` job, after independent verification
# (Task 2-02 point C.4).
#
# BOUNDED CONCURRENCY. Dispatch happens in a single job's bash loop, capped
# at MAX_CONCURRENT concurrent `gh api` dispatch calls via a `wait -n`
# semaphore, and at MAX_TOTAL candidates per sweep pass (well under the
# document's 256 ceiling) — never a GitHub Actions matrix, so there is no
# per-subject job or matrix-value display name for a private coordinate to
# appear in (point A.7 is satisfied structurally, not by redaction).

name: private-verification-sweep

permissions: {}

on:
  schedule:
    # Every 15 minutes — short enough that a freshly pushed private head is
    # picked up promptly, long enough that a normal sweep (dozens of
    # repositories at a handful of API calls each) stays well under a
    # single 5,000/h shared REST identity.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Enumerate and report candidate (repository, head) pairs without dispatching.'
        type: boolean
        required: false
        default: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - id: orgs
        uses: swift-institute/.github/.github/actions/read-orgs@6f73c2ebff00e4f05375794905926bdd7a0ca14b # main 2026-08-04, identity-pin to main HEAD (swift-institute/.github#286)

      - name: Mint a fleet-read installation token (metadata across every active org)
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          # No `owner`/`repositories`: a fleet-read token spans every
          # organization the App installation covers. Read-only, so this is
          # the minimum permission that can list every org's private
          # repositories, their default branches, and open PR heads in one
          # mint instead of one per organization.
          permission-contents: read
          permission-pull-requests: read
          permission-checks: read

      - name: Mint a fleet-scoped, checks-write-only token for the in_progress mark
        id: mark-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          # Deliberately separate from the read-only token above rather
          # than one combined mint: this token carries `checks: write` and
          # nothing else, scoped to the whole fleet only because point A.6
          # ("marks the trusted check in_progress... without running
          # subject code") is the ONE write action this workflow performs,
          # done once per candidate for the duration of this sweep pass —
          # never persisted, never handed to subject code, and never
          # widened to statuses or contents write. The
          # success/failure/cancelled transition is a SEPARATE mint, done
          # only after independent validation, in private-verification.yml's
          # `publish` job (point C.4) — this token can never produce that
          # transition because it is never given to that job.
          permission-checks: write

      - name: Resolve the pinned Workspace revision this sweep will require
        id: workspace
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          # The trusted verifier pins to an exact Workspace commit, never
          # `main` at dispatch time drifting mid-sweep — every subject this
          # pass dispatches gets the SAME Workspace revision, resolved once.
          revision=$(gh api repos/swift-institute/Workspace/commits/main --jq .sha)
          test -n "$revision"
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"

      - name: Enumerate candidates, dedupe, mark in-progress, and dispatch
        id: sweep
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          MARK_TOKEN: ${{ steps.mark-token.outputs.token }}
          ORGS_JSON: ${{ steps.orgs.outputs.orgs }}
          WORKSPACE_REVISION: ${{ steps.workspace.outputs.revision }}
          # Identifies the receipt schema/policy generation this sweep
          # requires — bumping it (a deliberate, reviewed change to this
          # file) invalidates every prior "success" check as not-current,
          # exactly the "current receipt schema/policy digest" test in
          # point A.3.
          POLICY_REVISION: "2026-08-04-1"
          DRY_RUN: ${{ inputs.dry-run || 'false' }}
          MAX_CONCURRENT: 8
          MAX_TOTAL: 200
          CENTRAL_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          set +x

          # Background subshells (the `&` fan-out below) cannot mutate a
          # parent-shell counter variable, so candidate/dispatch counts are
          # tallied as one marker file per event in these directories and
          # counted with `wc -l` after `wait` — the file-based equivalent of
          # an atomic counter, safe under MAX_CONCURRENT-way parallelism.
          candidates_dir="${RUNNER_TEMP}/candidates"
          dispatched_dir="${RUNNER_TEMP}/dispatched"
          mkdir -p "$candidates_dir" "$dispatched_dir"
          running=0

          candidate_count() { find "$candidates_dir" -type f | wc -l | tr -d ' '; }

          dispatch_one() {
            local repository="$1" head="$2" default_branch="$3" visibility="$4" layer="$5"
            local inventory_digest="$6"
            local owner="${repository%%/*}" name="${repository#*/}"

            local policy_id
            policy_id=$(printf '%s|%s|%s' "$repository" "$head" "$POLICY_REVISION" \
              | shasum -a 256 | cut -d' ' -f1 | cut -c1-32)
            local nonce
            nonce=$(head -c32 /dev/urandom | od -An -tx1 | tr -d ' \n')

            # Dedup: a current "success" or a still-"in_progress" check for
            # this exact (repository, head, policy) key means this pass has
            # nothing to do — never launches a duplicate run for the same
            # key (the wave-mode duplicate-dispatch positive control).
            local existing_state
            existing_state=$(POLICY_ID="$policy_id" gh api \
              "repos/${repository}/commits/${head}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "verification / workspace" and .external_id == env.POLICY_ID)]
                    | if length == 0 then "absent"
                      elif .[0].status == "in_progress" then "in_progress"
                      elif .[0].conclusion == "success" then "success"
                      else "stale" end' \
              2>/dev/null || echo "absent")
            if [[ "$existing_state" == "success" || "$existing_state" == "in_progress" ]]; then
              return 0
            fi

            : > "${candidates_dir}/${policy_id}"
            if [[ "$DRY_RUN" == "true" ]]; then
              return 0
            fi

            # Mark the trusted check in_progress BEFORE any subject code
            # runs (point A.6) — using the separate, fleet-scoped,
            # checks-write-ONLY token minted once above (`mark-token`
            # step) — never the sweep-wide read-only GH_TOKEN, and never a
            # token that also carries contents or statuses write. Every
            # `gh api` call in this function defaults to `GH_TOKEN`
            # (`gh`'s standard resolution order), so the write call below
            # passes `GH_TOKEN=$MARK_TOKEN` explicitly for just this one
            # invocation rather than mutating the function's ambient
            # environment.
            GH_TOKEN="$MARK_TOKEN" gh api --method POST "repos/${repository}/check-runs" \
              -f name="verification / workspace" \
              -f head_sha="${head}" \
              -f external_id="${policy_id}" \
              -f status="in_progress" \
              >/dev/null

            # Dispatch Stage B/C. `client_payload` never appears in this
            # run's own log or summary — it is read only from
            # `github.event.client_payload` inside the triggered run, and
            # this step never echoes it either.
            gh api --method POST "repos/${CENTRAL_REPOSITORY}/dispatches" \
              -f event_type="private-verification" \
              -f "client_payload[repository]=${repository}" \
              -f "client_payload[head]=${head}" \
              -f "client_payload[defaultBranch]=${default_branch}" \
              -f "client_payload[visibility]=${visibility}" \
              -f "client_payload[layer]=${layer}" \
              -f "client_payload[inventoryDigest]=${inventory_digest}" \
              -f "client_payload[workspaceRevision]=${WORKSPACE_REVISION}" \
              -f "client_payload[policyRevision]=${POLICY_REVISION}" \
              -f "client_payload[requestId]=${policy_id}" \
              -f "client_payload[nonce]=${nonce}" \
              >/dev/null

            : > "${dispatched_dir}/${policy_id}"
          }
          export -f dispatch_one
          export candidates_dir dispatched_dir POLICY_REVISION DRY_RUN WORKSPACE_REVISION CENTRAL_REPOSITORY

          # Repository/PR enumeration happens in the top-level shell (never
          # inside a piped subshell) precisely so `candidate_count` below —
          # read in THIS shell to enforce MAX_TOTAL — sees every marker file
          # dispatch_one's background subshells have written so far.
          org_list_file="${RUNNER_TEMP}/orgs.jsonl"
          echo "$ORGS_JSON" | jq -c '.[]' > "$org_list_file"

          while IFS= read -r org_raw; do
            org=$(jq -r '.' <<<"$org_raw")
            [[ "$(candidate_count)" -lt "$MAX_TOTAL" ]] || break

            repo_list_file="${RUNNER_TEMP}/repos-${org}.jsonl"
            gh api "orgs/${org}/repos?type=private&per_page=100" --paginate \
              --jq '.[] | select(.archived == false and .disabled == false) | {name: .full_name, default_branch: .default_branch}' \
              > "$repo_list_file" 2>/dev/null || : > "$repo_list_file"

            while IFS= read -r repo_raw; do
              [[ "$(candidate_count)" -lt "$MAX_TOTAL" ]] || break
              repository=$(jq -r '.name' <<<"$repo_raw")
              default_branch=$(jq -r '.default_branch' <<<"$repo_raw")

              has_manifest=$(gh api "repos/${repository}/contents/Package.swift?ref=${default_branch}" \
                --jq '.type == "file"' 2>/dev/null || echo "false")
              [[ "$has_manifest" == "true" ]] || continue

              layer=$(gh api "repos/${repository}/topics" \
                --jq '[.names[] | select(startswith("layer-"))] | first // "layer-applications" | sub("^layer-"; "")' \
                2>/dev/null || echo "applications")

              default_head=$(gh api "repos/${repository}/commits/${default_branch}" --jq '.sha' 2>/dev/null || echo "")
              [[ -n "$default_head" ]] || continue

              open_pr_heads=$(gh api "repos/${repository}/pulls?state=open&per_page=100" \
                --jq '[.[].head.sha]' 2>/dev/null || echo '[]')

              for head in "$default_head" $(jq -r '.[]' <<<"$open_pr_heads"); do
                [[ "$(candidate_count)" -lt "$MAX_TOTAL" ]] || break
                dispatch_one "$repository" "$head" "$default_branch" "private" "$layer" "unmeasured" &
                running=$((running + 1))
                if [[ "$running" -ge "$MAX_CONCURRENT" ]]; then
                  wait -n
                  running=$((running - 1))
                fi
              done
            done < "$repo_list_file"
          done < "$org_list_file"
          wait

          {
            echo "candidates=$(find "$candidates_dir" -type f | wc -l | tr -d ' ')"
            echo "dispatched=$(find "$dispatched_dir" -type f | wc -l | tr -d ' ')"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        shell: bash
        env:
          CANDIDATES: ${{ steps.sweep.outputs.candidates }}
          DISPATCHED: ${{ steps.sweep.outputs.dispatched }}
          DRY_RUN: ${{ inputs.dry-run || 'false' }}
        run: |
          {
            echo "## private-verification-sweep"
            echo ""
            echo "- candidates lacking a current successful check: ${CANDIDATES:-0}"
            echo "- dispatched this pass: ${DISPATCHED:-0}"
            echo "- dry-run: ${DRY_RUN}"
          } >> "$GITHUB_STEP_SUMMARY"
