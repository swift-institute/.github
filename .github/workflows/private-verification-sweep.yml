# private-verification-sweep.yml — trusted central dispatcher, Stage A of
# Task 2-02's three-stage trusted path (swift-institute/.github#276 Phase 2,
# work object #253). Finds private-repository heads lacking a current
# successful `verification / workspace` check and dispatches
# private-verification.yml (Stages B/C) once per exact (repository, head,
# policy digest) key. Runs entirely on public control-plane minutes; never
# checks out a private subject and never runs subject code.
#
# ENUMERATION. Lists each active organization's private repositories (via
# the same `read-orgs` manifest every other fleet sweep uses) and keeps
# those carrying a root `Package.swift` — an ordinary private package,
# mirroring the `package` repositoryClass the surface policy already uses
# for public repositories. Layer classification here is best-effort (a
# `layer:<name>` repository topic, defaulting to `applications` when absent)
# — this sweep does not yet call Workspace's live private-discovery pass
# (`workspace doctor --institute`, Task 0C-02's mechanism), which resolves
# an authoritative layer per repository but at ~460 requests per invocation.
# Wiring that exact population through a stable CLI-exposed JSON verb is
# flagged as follow-on scope (recorded UNMEASURED in this task's receipt,
# not silently assumed correct) rather than expanded here at Task 2-02's own
# expense.
#
# DEDUPLICATION AND THE NONCE/REQUEST-ID SPLIT. Two different unpredictability
# properties are needed and kept separate:
#   - `requestId` is DETERMINISTIC: sha256(repository|head|policyRevision),
#     truncated. It is the dedup key (point A.5) and the check run's
#     `external_id` — recomputing it lets a later sweep pass recognize
#     "already covered" without keeping external state, and it is opaque
#     (unrecoverable without already knowing the three inputs) without being
#     secret.
#   - `nonce` is CRYPTOGRAPHICALLY RANDOM per dispatch. It is the secret
#     private-verification.yml's publisher job binds the safe envelope to,
#     so replaying an old envelope against a new dispatch of the same
#     (repository, head, policy) fails: the new dispatch has a new nonce.
#
# WRITE SCOPE. This workflow mints exactly one write-capable token action:
# marking the trusted check `in_progress` at the exact head (point A.6),
# narrowly scoped to `checks: write` on the one target repository, before
# any subject code has run. It never mints `checks: write`/`statuses: write`
# for the success/failure transition — that happens only in
# private-verification.yml's `publish` job, after independent verification
# (Task 2-02 point C.4).
#
# BOUNDED CONCURRENCY. Dispatch happens in a single job's bash loop, capped
# at MAX_CONCURRENT concurrent `gh api` dispatch calls via a `wait -n`
# semaphore, and at MAX_TOTAL candidates per sweep pass (well under the
# document's 256 ceiling) — never a GitHub Actions matrix, so there is no
# per-subject job or matrix-value display name for a private coordinate to
# appear in (point A.7 is satisfied structurally, not by redaction).

name: private-verification-sweep

permissions: {}

on:
  schedule:
    # Every 15 minutes — short enough that a freshly pushed private head is
    # picked up promptly, long enough that a normal sweep (dozens of
    # repositories at a handful of API calls each) stays well under a
    # single 5,000/h shared REST identity.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Enumerate and report candidate (repository, head) pairs without dispatching.'
        type: boolean
        required: false
        default: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - id: orgs
        uses: swift-institute/.github/.github/actions/read-orgs@6f73c2ebff00e4f05375794905926bdd7a0ca14b # main 2026-08-04, identity-pin to main HEAD (swift-institute/.github#286)

      - name: Mint a fleet-read installation token (metadata across every active org)
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          # No `owner`/`repositories`: a fleet-read token spans every
          # organization the App installation covers. Read-only, so this is
          # the minimum permission that can list every org's private
          # repositories, their default branches, and open PR heads in one
          # mint instead of one per organization.
          permission-contents: read
          permission-pull-requests: read
          permission-checks: read

      # G1 repair: per-org read and checks-write tokens are minted inside
      # the sweep step via the App JWT (create-github-app-token cannot mint
      # cross-org tokens in one call — without `owner:` it scopes to THIS
      # repository). This mint carries only the central-repository
      # contents:write the repository_dispatch POST needs; the checks-write
      # separation from read tokens is preserved per organization inside
      # the step.
      - name: Mint a central-repository dispatch token (contents write, this repo only)
        id: dispatch-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Resolve the pinned Workspace revision this sweep will require
        id: workspace
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          # The trusted verifier pins to an exact Workspace commit, never
          # `main` at dispatch time drifting mid-sweep — every subject this
          # pass dispatches gets the SAME Workspace revision, resolved once.
          revision=$(gh api repos/swift-institute/Workspace/commits/main --jq .sha)
          test -n "$revision"
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"

      # The effective-inventory digest is computed by Workspace itself, at
      # the same pinned revision this sweep dispatches with, from the
      # roster this step enumerates (`Workspace.Inventory.Effective.Roster`
      # — swift-institute/Workspace#147). The build is cached on the
      # revision alone: acceleration only, and a cold pass that cannot
      # finish it records a typed UNMEASURED cause rather than inventing a
      # digest.
      - name: Restore the pinned Workspace build (acceleration only)
        id: workspace-build-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .workspace/Application/.build
          key: workspace-build-${{ steps.workspace.outputs.revision }}-linux-x86_64-swift-6.3

      - name: Swift toolchain
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9  # v1.14.0
        with:
          swift-version: "6.3"

      - name: Check out Workspace at the exact revision this sweep dispatches with
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/Workspace
          ref: ${{ steps.workspace.outputs.revision }}
          path: .workspace
          persist-credentials: false

      - name: Enumerate candidates, dedupe, mark in-progress, and dispatch
        id: sweep
        shell: bash
        env:
          # G1 repair (swift-institute/.github#276): the two step-minted
          # tokens above are scoped to THIS repository only
          # (create-github-app-token without `owner:` scopes to the current
          # repository, not the fleet), so cross-org private enumeration
          # silently returned nothing and every cross-org check-run write
          # would have 403'd. Per-org read and checks-write tokens are now
          # minted inside this step via the App JWT; the repository-scoped
          # GH_TOKEN below remains only for central-repository reads, and
          # CENTRAL_DISPATCH_TOKEN (contents:write on the central
          # repository alone) carries the repository_dispatch POST the
          # read-only token never could.
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CENTRAL_DISPATCH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          APP_CLIENT_ID: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          ORGS_JSON: ${{ steps.orgs.outputs.orgs }}
          WORKSPACE_REVISION: ${{ steps.workspace.outputs.revision }}
          # Identifies the receipt schema/policy generation this sweep
          # requires — bumping it (a deliberate, reviewed change to this
          # file) invalidates every prior "success" check as not-current,
          # exactly the "current receipt schema/policy digest" test in
          # point A.3.
          POLICY_REVISION: "2026-08-04-1"
          DRY_RUN: ${{ inputs.dry-run || 'false' }}
          MAX_CONCURRENT: 8
          MAX_TOTAL: 200
          CENTRAL_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          set +x

          # Background subshells (the `&` fan-out below) cannot mutate a
          # parent-shell counter variable, so candidate/dispatch counts are
          # tallied as one marker file per event in these directories and
          # counted with `wc -l` after `wait` — the file-based equivalent of
          # an atomic counter, safe under MAX_CONCURRENT-way parallelism.
          candidates_dir="${RUNNER_TEMP}/candidates"
          dispatched_dir="${RUNNER_TEMP}/dispatched"
          tokens_dir="${RUNNER_TEMP}/org-tokens"
          mkdir -p "$candidates_dir" "$dispatched_dir"
          (umask 077 && mkdir -p "$tokens_dir")
          running=0

          candidate_count() { find "$candidates_dir" -type f | wc -l | tr -d ' '; }

          # ---- Per-org App installation tokens (G1 repair) ---------------
          key_file="${RUNNER_TEMP}/app-key.pem"
          (umask 077 && printf '%s' "$APP_PRIVATE_KEY" > "$key_file")

          app_jwt() {
            local now header payload unsigned sig
            now=$(date +%s)
            b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
            payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now-60))" "$((now+540))" "$APP_CLIENT_ID" | b64url)
            unsigned="${header}.${payload}"
            sig=$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key_file" -binary | b64url)
            printf '%s.%s' "$unsigned" "$sig"
          }

          # org_token <org> <read|checks> — mints (and caches, 0600) one
          # installation token per (org, class). `read` carries
          # contents+pull_requests read for enumeration; `checks` carries
          # checks:write ONLY, preserving the read/write mint separation
          # per organization. Every value is masked before first use.
          # org_token_ensure mints, masks, and caches; it must be called as a
          # plain statement (NEVER inside command substitution) so its
          # `::add-mask::` line reaches the runner on the step's real stdout
          # instead of being captured into a variable — the exact defect that
          # made every minted token invalid on the first repaired pass.
          org_token_ensure() {
            local org="$1" class="$2" cache="${tokens_dir}/${1}-${2}"
            [[ -s "$cache" ]] && return 0
            local jwt inst perms token
            jwt=$(app_jwt)
            inst=$(curl -sf -H "Authorization: Bearer $jwt" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/${org}/installation" | jq -r '.id // empty')
            [[ -n "$inst" ]] || return 1
            if [[ "$class" == "checks" ]]; then
              perms='{"permissions":{"checks":"write"}}'
            else
              perms='{"permissions":{"contents":"read","pull_requests":"read","checks":"read"}}'
            fi
            token=$(curl -sf -X POST -H "Authorization: Bearer $jwt" \
              -H "Accept: application/vnd.github+json" \
              -d "$perms" \
              "https://api.github.com/app/installations/${inst}/access_tokens" | jq -r '.token // empty')
            [[ -n "$token" ]] || return 1
            echo "::add-mask::${token}"
            (umask 077 && printf '%s' "$token" > "$cache")
          }

          # org_token is substitution-safe: it only reads the cache written by
          # a prior plain-statement org_token_ensure for the same (org, class).
          org_token() {
            local cache="${tokens_dir}/${1}-${2}"
            [[ -s "$cache" ]] || return 1
            cat "$cache"
          }

          dispatch_one() {
            local repository="$1" head="$2" default_branch="$3" visibility="$4" layer="$5"
            local inventory_digest="$6" inventory_digest_cause="${7:-}"
            local org="${repository%%/*}" read_tok mark_tok
            read_tok=$(org_token "$org" read) || return 0
            mark_tok=$(org_token "$org" checks) || return 0

            local policy_id
            policy_id=$(printf '%s|%s|%s' "$repository" "$head" "$POLICY_REVISION" \
              | shasum -a 256 | cut -d' ' -f1 | cut -c1-32)
            local nonce
            nonce=$(head -c32 /dev/urandom | od -An -tx1 | tr -d ' \n')

            # Dedup: a current "success" or a still-"in_progress" check for
            # this exact (repository, head, policy) key means this pass has
            # nothing to do — never launches a duplicate run for the same
            # key (the wave-mode duplicate-dispatch positive control).
            local existing_state
            existing_state=$(POLICY_ID="$policy_id" GH_TOKEN="$read_tok" gh api \
              "repos/${repository}/commits/${head}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "verification / workspace" and .external_id == env.POLICY_ID)]
                    | if length == 0 then "absent"
                      elif .[0].status == "in_progress" then "in_progress"
                      elif .[0].conclusion == "success" then "success"
                      else "stale" end' \
              2>/dev/null || echo "absent")
            if [[ "$existing_state" == "success" || "$existing_state" == "in_progress" ]]; then
              return 0
            fi

            : > "${candidates_dir}/${policy_id}"
            if [[ "$DRY_RUN" == "true" ]]; then
              return 0
            fi

            # Mark the trusted check in_progress BEFORE any subject code
            # runs (point A.6) — using the separate, fleet-scoped,
            # checks-write-ONLY token minted once above (`mark-token`
            # step) — never the sweep-wide read-only GH_TOKEN, and never a
            # token that also carries contents or statuses write. Every
            # `gh api` call in this function defaults to `GH_TOKEN`
            # (`gh`'s standard resolution order), so the write call below
            # passes the per-org checks-write token explicitly for this one
            # invocation rather than mutating the function's ambient
            # environment.
            GH_TOKEN="$mark_tok" gh api --method POST "repos/${repository}/check-runs" \
              -f name="verification / workspace" \
              -f head_sha="${head}" \
              -f external_id="${policy_id}" \
              -f status="in_progress" \
              >/dev/null

            # Dispatch Stage B/C. `client_payload` never appears in this
            # run's own log or summary — it is read only from
            # `github.event.client_payload` inside the triggered run, and
            # this step never echoes it either (the body travels on stdin,
            # not argv).
            #
            # `client_payload` accepts at most TEN top-level properties,
            # and the API rejects the whole dispatch with HTTP 422 when it
            # gets eleven — which is exactly what adding
            # `inventoryDigestCause` beside `inventoryDigest` did: every
            # dispatch in run 31138691252 failed
            # "No more than 10 properties are allowed; 11 were supplied".
            # The digest and its cause are one fact about one measurement,
            # so they are now one property carrying both, which restores
            # the count to ten and keeps the pair together by construction.
            # The body is built with jq rather than repeated `-f` flags so
            # the nesting is explicit and the count is countable.
            jq -n \
              --arg repository "$repository" \
              --arg head "$head" \
              --arg default_branch "$default_branch" \
              --arg visibility "$visibility" \
              --arg layer "$layer" \
              --arg digest "$inventory_digest" \
              --arg cause "$inventory_digest_cause" \
              --arg workspace_revision "$WORKSPACE_REVISION" \
              --arg policy_revision "$POLICY_REVISION" \
              --arg request_id "$policy_id" \
              --arg nonce "$nonce" \
              '{event_type: "private-verification",
                client_payload: {
                  repository: $repository,
                  head: $head,
                  defaultBranch: $default_branch,
                  visibility: $visibility,
                  layer: $layer,
                  inventory: {digest: $digest, cause: $cause},
                  workspaceRevision: $workspace_revision,
                  policyRevision: $policy_revision,
                  requestId: $request_id,
                  nonce: $nonce
                }}' \
              | GH_TOKEN="$CENTRAL_DISPATCH_TOKEN" gh api --method POST \
                  "repos/${CENTRAL_REPOSITORY}/dispatches" --input - \
              >/dev/null

            : > "${dispatched_dir}/${policy_id}"
          }
          export -f dispatch_one
          export candidates_dir dispatched_dir POLICY_REVISION DRY_RUN WORKSPACE_REVISION CENTRAL_REPOSITORY

          # Repository/PR enumeration happens in the top-level shell (never
          # inside a piped subshell) precisely so `candidate_count` below —
          # read in THIS shell to enforce MAX_TOTAL — sees every marker file
          # dispatch_one's background subshells have written so far.
          org_list_file="${RUNNER_TEMP}/orgs.jsonl"
          echo "$ORGS_JSON" | jq -c '.[]' > "$org_list_file"

          enumerated_private=0
          unmeasured_orgs=""
          # PHASE 1 — enumerate the effective private population.
          #
          # Enumeration is now separated from dispatch, because the
          # effective-inventory digest is a property of the WHOLE
          # population and every dispatch carries it: a roster truncated at
          # MAX_TOTAL would digest a population that does not exist. Only
          # the per-subject work (topics, heads, open PRs) stays bounded,
          # in phase 3.
          roster_rows_file="${RUNNER_TEMP}/roster-rows.jsonl"
          subjects_file="${RUNNER_TEMP}/subjects.jsonl"
          : > "$roster_rows_file"
          : > "$subjects_file"
          while IFS= read -r org_raw; do
            org=$(jq -r '.' <<<"$org_raw")

            # G1 repair: loud, typed enumeration. A failed per-org token
            # mint or listing is recorded UNMEASURED, never silently
            # written as an empty file (the exact R10 false-zero this
            # sweep shipped with).
            if ! org_token_ensure "$org" read || ! org_token_ensure "$org" checks; then
              echo "::warning::${org}: installation token mint failed — private population UNMEASURED this pass"
              unmeasured_orgs="${unmeasured_orgs} ${org}"
              continue
            fi
            org_tok=$(org_token "$org" read)
            repo_list_file="${RUNNER_TEMP}/repos-${org}.jsonl"
            if ! GH_TOKEN="$org_tok" gh api "orgs/${org}/repos?type=private&per_page=100" --paginate \
              --jq '.[] | select(.archived == false and .disabled == false) | {name: .full_name, default_branch: .default_branch}' \
              > "$repo_list_file" 2>/dev/null; then
              echo "::warning::${org}: private repository listing failed — population UNMEASURED this pass"
              unmeasured_orgs="${unmeasured_orgs} ${org}"
              continue
            fi
            enumerated_private=$((enumerated_private + $(wc -l < "$repo_list_file" | tr -d ' ')))

            while IFS= read -r repo_raw; do
              repository=$(jq -r '.name' <<<"$repo_raw")
              default_branch=$(jq -r '.default_branch' <<<"$repo_raw")

              # The same eligibility the live private pass applies
              # (`Client.discoverPrivate`): a repository is on the
              # effective inventory exactly when it carries a manifest.
              has_manifest=$(GH_TOKEN="$org_tok" gh api "repos/${repository}/contents/Package.swift?ref=${default_branch}" \
                --jq '.type == "file"' 2>/dev/null || echo "false")
              [[ "$has_manifest" == "true" ]] || continue

              jq -cn --arg c "$repository" '$c' >> "$roster_rows_file"
              jq -cn --arg r "$repository" --arg b "$default_branch" \
                '{repository: $r, default_branch: $b}' >> "$subjects_file"
            done < "$repo_list_file"
          done < "$org_list_file"

          # PHASE 2 — digest the enumerated population, or record why not.
          #
          # The digest is computed by Workspace at the pinned revision from
          # the roster above: this sweep holds per-organization credentials
          # no single `gh` credential can replace, so it discovers and
          # Workspace digests (swift-institute/Workspace#147). Every
          # failure path below lands a typed cause, never a bare
          # "unmeasured" and never an invented digest — a receipt schema
          # that accepts "unmeasured" without a cause is exactly what this
          # repair removed.
          # `workspace inventory` reads the committed roster from the
          # Workspace checkout it is STANDING IN — the CLI resolves its
          # root from the working directory, not from `--package-path`,
          # which selects the SwiftPM package to run. Run 31138691252 ran
          # it from this repository's checkout, where there is no
          # Workspace.json, so it could not have succeeded; it recorded a
          # typed cause, which is the honest outcome of a wrong invocation
          # but not a measurement. The subshell below puts it in the right
          # root without moving this step's own working directory.
          roster_file="${RUNNER_TEMP}/roster.json"
          digest_log="${RUNNER_TEMP}/inventory-digest.log"
          report_file="${RUNNER_TEMP}/effective-inventory.json"
          jq -n \
            --slurpfile rows "$roster_rows_file" \
            --arg orgs "${unmeasured_orgs:-}" \
            '{schemaVersion: 1,
              repositories: $rows,
              unmeasured: ($orgs | split(" ") | map(select(length > 0))
                | map({kind: "organization", coordinate: ., reason: "the sweep could not enumerate this organization on this pass"}))}' \
            > "$roster_file"

          inventory_digest="unmeasured"
          inventory_digest_cause=""
          if [[ "$enumerated_private" -eq 0 ]]; then
            inventory_digest_cause="the sweep enumerated no private repositories, so there is no population to digest"
          elif ! (cd .workspace && swift run --package-path Application -c release \
                    workspace inventory effective \
                      --inventory-scope effective \
                      --inventory-private-roster "$roster_file" \
                      --inventory-output "$report_file") > "$digest_log" 2>&1; then
            # Exit 2 means the report was written with UNMEASURED residue;
            # anything else means no report at all. Both are read from the
            # report's own presence rather than from the exit status, so a
            # partially-measured population still cannot pass as complete.
            if [[ -s "$report_file" ]]; then
              inventory_digest_cause="the effective inventory carries unmeasured residue: $(jq -r '.unmeasured | length' "$report_file") organization(s) this pass could not enumerate"
            else
              # A coarse, fixed classification of the captured output —
              # never the output itself, which names this runner's own
              # filesystem and lands in a PUBLIC log. Without it, a cold
              # build that ran out of time and a genuine CLI refusal are
              # the same opaque sentence, which is how run 31138691252's
              # wrong working directory stayed invisible.
              digest_class="unclassified"
              if grep -qF "Workspace.json" "$digest_log" 2>/dev/null; then
                digest_class="no Workspace inventory at the checkout it ran in"
              elif grep -qF "error: " "$digest_log" 2>/dev/null; then
                digest_class="the build or the command failed"
              elif [[ ! -s "$digest_log" ]]; then
                digest_class="the command produced no output at all"
              fi
              inventory_digest_cause="Workspace could not compute an effective-inventory digest on this runner (${digest_class})"
            fi
          fi
          if [[ -s "$report_file" && -z "$inventory_digest_cause" ]]; then
            candidate_digest=$(jq -r '.combined.digest // empty' "$report_file")
            if [[ "$candidate_digest" =~ ^[0-9a-f]{64}$ ]]; then
              inventory_digest="$candidate_digest"
            else
              inventory_digest_cause="the effective-inventory report carried no 64-hex combined digest"
            fi
          fi
          if [[ "$inventory_digest" == "unmeasured" && -z "$inventory_digest_cause" ]]; then
            inventory_digest_cause="no effective-inventory digest was established on this pass"
          fi
          # The digest is a hash and the cause is fixed text this file
          # authors — neither carries a private coordinate, so both are
          # safe to log in this PUBLIC repository. The roster and the
          # report are not: they stay in RUNNER_TEMP and are never printed,
          # uploaded, or added to the step summary.
          echo "inventory digest: ${inventory_digest}${inventory_digest_cause:+ (${inventory_digest_cause})}"
          export inventory_digest inventory_digest_cause

          # PHASE 3 — dispatch, bounded by MAX_TOTAL.
          while IFS= read -r subject_raw; do
            [[ "$(candidate_count)" -lt "$MAX_TOTAL" ]] || break
            repository=$(jq -r '.repository' <<<"$subject_raw")
            default_branch=$(jq -r '.default_branch' <<<"$subject_raw")
            org="${repository%%/*}"
            org_tok=$(org_token "$org" read) || continue

            layer=$(GH_TOKEN="$org_tok" gh api "repos/${repository}/topics" \
              --jq '[.names[] | select(startswith("layer-"))] | first // "layer-applications" | sub("^layer-"; "")' \
              2>/dev/null || echo "applications")

            default_head=$(GH_TOKEN="$org_tok" gh api "repos/${repository}/commits/${default_branch}" --jq '.sha' 2>/dev/null || echo "")
            [[ -n "$default_head" ]] || continue

            open_pr_heads=$(GH_TOKEN="$org_tok" gh api "repos/${repository}/pulls?state=open&per_page=100" \
              --jq '[.[].head.sha]' 2>/dev/null || echo '[]')

            for head in "$default_head" $(jq -r '.[]' <<<"$open_pr_heads"); do
              [[ "$(candidate_count)" -lt "$MAX_TOTAL" ]] || break
              dispatch_one "$repository" "$head" "$default_branch" "private" "$layer" \
                "$inventory_digest" "$inventory_digest_cause" &
              running=$((running + 1))
              if [[ "$running" -ge "$MAX_CONCURRENT" ]]; then
                wait -n
                running=$((running - 1))
              fi
            done
          done < "$subjects_file"
          wait

          # Positive control (R10): the fleet census records a large private
          # population, so a pass that enumerated zero private repositories
          # is a broken instrument, never a clean sweep. Partial
          # unmeasured-org residue is loud but non-fatal; TOTAL zero fails.
          if [[ "$enumerated_private" -eq 0 ]]; then
            echo "::error::enumerated zero private repositories across every org — the enumeration instrument is broken (R10 false-zero); refusing to report a clean sweep. Unmeasured orgs:${unmeasured_orgs:- none}"
            exit 1
          fi

          {
            echo "candidates=$(find "$candidates_dir" -type f | wc -l | tr -d ' ')"
            echo "dispatched=$(find "$dispatched_dir" -type f | wc -l | tr -d ' ')"
            echo "enumerated-private=${enumerated_private}"
            echo "unmeasured-orgs=${unmeasured_orgs:-}"
          } >> "$GITHUB_OUTPUT"

      - name: Save the pinned Workspace build (acceleration only)
        if: ${{ steps.workspace-build-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .workspace/Application/.build
          key: workspace-build-${{ steps.workspace.outputs.revision }}-linux-x86_64-swift-6.3

      - name: Summary
        shell: bash
        env:
          CANDIDATES: ${{ steps.sweep.outputs.candidates }}
          DISPATCHED: ${{ steps.sweep.outputs.dispatched }}
          DRY_RUN: ${{ inputs.dry-run || 'false' }}
        run: |
          {
            echo "## private-verification-sweep"
            echo ""
            echo "- candidates lacking a current successful check: ${CANDIDATES:-0}"
            echo "- dispatched this pass: ${DISPATCHED:-0}"
            echo "- dry-run: ${DRY_RUN}"
          } >> "$GITHUB_STEP_SUMMARY"
