# lint-validators-weekly.yml — weekly cross-org orchestrator for the
# per-package-org-sweep validator corpus.
#
# Phase D-2 execution of the 2026-05-14 CI Review arc. Operationalizes
# the four cross-org-consumer-sweep validators by dispatching each over
# the 17-active-org universe on a weekly schedule. Findings surface via
# per-cell $GITHUB_STEP_SUMMARY tables and a single aggregated tracking
# issue at swift-institute/.github (idempotent upsert; close-on-clean).
#
# Provenance:
#   Design doc:  Audits/CI-REVIEW-PHASE-D-DESIGN-2026-05-14.md (sealed by
#                principal adjudication 2026-05-14).
#   Handoff:     HANDOFF-phase-d-2-execution.md (Phase D-2 execution).
#   Structural precedent: .github/workflows/link-check-weekly.yml.
#   Phase D-2.1 fix-forward: see § Phase D-2.1 below.
#
# Validators in scope (manifest's discovery-mode: per-package-org-sweep
# + status: active):
#   - validate-thin-callers      [CI-030], [CI-059], [GH-REPO-074]
#   - validate-file-naming       [API-IMPL-006]
#   - validate-github-metadata   [GH-REPO-METADATA]
#   - validate-package-structure [PACKAGE-STRUCTURE]
#   - validate-gitignore         [GH-IGNORE-001], [GH-IGNORE-002]
#
# Out of scope: validate-sub-org-wrappers (already self-firing with its
# own hardcoded sub-org matrix; structurally different axis from the
# cross-org-consumer-sweep axis this orchestrator covers).
#
# Cadence: Tuesday 06:00 UTC. Picks an uncongested slot relative to the
# cron-audit-base cohort's Monday 06:00-06:45 cluster, link-check-weekly's
# Monday 06:00, validate-sub-org-wrappers' Monday 05:00, and
# lint-org-bot-coverage-weekly's Sunday 06:30.
#
# Chain depth (per [CI-004b] 4-level workflow_call limit):
#   orchestrator (L1) → validate-X.yml (L2). Depth 2 of 4; headroom 2.
#
# Per [CI-090] standalone workflow (no workflow_call: trigger) →
# top-level permissions: {} deny-all floor + explicit per-job grants.
#
# Token-mint pattern: orchestrator does NOT pre-mint per-org tokens for
# the scan jobs. Each validate-X.yml mints its own per-org-scoped
# swift-institute-bot App-installation token internally (via
# actions/create-github-app-token@v1.12.0). Orchestrator passes
# secrets: inherit per [CI-059]; called workflows use the inherited
# SWIFT_INSTITUTE_BOT_APP_CLIENT_ID + SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY
# secrets. The report job mints its own swift-institute-scoped token
# for issues:write.
#
# Tracking-issue grouping: one issue per orchestrator run, idempotent
# upsert via swift-institute/.github/.github/actions/upsert-tracking-issue
# (matches link-check-weekly.yml + cron-audit-base.yml report-job
# precedent). Per-validator readability via H3 sectioning in body.
# Auto-close when all 4 scan jobs report success across their respective
# 17-org matrix cells (4 × 17 = 68 reusable-workflow invocations total).
#
# dry-run posture: defaults to false (matrix cells fail naturally on
# findings; per-validator scan job result aggregates to 'failure'; report
# job fires when ANY scan job is not 'success'). Matches
# link-check-weekly.yml's `dry-run: ${{ inputs.dry-run || false }}`
# precedent exactly. The design doc's Phase D-2 spec text included a
# `dry-run: true` hardcode, but that posture is structurally
# incompatible with the cited link-check-weekly precedent (it would
# prevent the report job from distinguishing findings-present from
# findings-absent runs without per-cell artifact aggregation, which is
# forbidden under ground rule 7 "MUST NOT modify any per-validator
# workflow file"). The deviation is noted in
# Audits/Outcome-CI-REVIEW-Phase-D-2026-05-14.md.
#
# § Phase D-2.1 (2026-05-14) fix-forward
#
# The initial Phase D-2 commit (cec6778) authored the scan stage as a
# single 2D-matrix job (`matrix: { validator: [...], org: [...] }`) with
# matrix-interpolated `uses: ./.github/workflows/validate-${{ matrix.validator }}.yml`.
# GitHub Actions rejected this at workflow-load time with HTTP 422
# "Unrecognized named-value: 'matrix'" — the `uses:` field is resolved
# BEFORE matrix expansion, so `matrix.*` context is not available in
# `uses:` for reusable-workflow-call jobs at the job level. The
# `inputs.*` and `vars.*` contexts ARE supported in `uses:`; `matrix.*`
# is not.
#
# Phase D-2.1 rewrites the scan stage as 4 SEPARATE scan jobs, each
# with its own 1D matrix over `org` and a STATIC `uses:` reference to
# the corresponding validate-X.yml. Same effective coverage (4 × 17
# = 68 reusable-workflow invocations across the 4 scan jobs); different
# YAML shape. Matches link-check-weekly.yml's exact structural precedent
# (single 1D matrix + static uses) extended to 4 parallel-shaped
# scan jobs (one per validator).

name: lint-validators-weekly

# [CI-090] Standalone workflow → deny-all floor at workflow level;
# per-job permissions blocks below provide the actual grants.
permissions: {}

on:
  schedule:
    - cron: '0 6 * * 2'   # weekly Tuesday 06:00 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run validators but skip aggregated issue create/update.'
        type: boolean
        required: false
        default: false
      visibility:
        description: 'Filter consumer repos by visibility (public | private | internal | all). Default public per [CI-094] + [CI-095].'
        type: string
        required: false
        default: 'public'

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      orgs: ${{ steps.read.outputs.orgs }}
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - id: read
        uses: swift-institute/.github/.github/actions/read-orgs@main
        with:
          # All 17 active orgs (.name); archived orgs auto-excluded by the
          # composite. Repo-level visibility filter is applied inside each
          # validate-X.yml's gh repo list call (default: public).
          filter: '.name'

  # Each scan-* job below: 1D matrix over orgs × static uses: to its
  # respective validate-X.yml. Per [CI-106] caller's per-job grant
  # (contents: read) must be ≥ the called reusable's per-job grant; each
  # validate-X.yml's scan job either declares contents: read explicitly
  # or inherits from caller. Verified by reading each .yml's scan: block.
  #
  # All twelve scan-* jobs below use the SAME shape: a 1D matrix.org from
  # config.outputs.orgs (at most active-organization-count legs each — 17
  # at last measurement, so at most 17 legs × 12 validators = at most 204
  # jobs total across this workflow, each strategy well under GitHub's
  # 256-job-per-matrix limit). The six validators below the first six
  # (scan-docc-structure onward) previously depended on a repository-wide
  # 2D (organization, repository) `resolve-targets` matrix instead —
  # removed by Task 0B-01 (swift-institute/.github#280) because it does
  # not scale under the 256-job limit (~478 public non-archived repos
  # alone), and because a broken pagination fix once made it enumerate 0
  # pairs, silently `skipped` all six, and had the report job count that
  # as clean (see #62). Each of the six now enumerates its org's repos
  # itself, inside the (validator, organization) job, through
  # validate-base.yml's per-package-org-sweep discovery mode.

  scan-thin-callers:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-thin-callers.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  scan-file-naming:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-file-naming.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  scan-github-metadata:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-github-metadata.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  scan-package-structure:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-package-structure.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  scan-gitignore:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-gitignore.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  scan-branch-pins:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-branch-pins.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  # The remaining six scan-* jobs (originally Phase D Wave B, 2026-05-15)
  # dispatch validate-*.yml callers whose scan job resolves
  # discovery-mode to per-package-org-sweep (validate-base.yml) because
  # `org:` is set and `repo:` is not — see Task 0B-01 comment above.
  # Same 1D matrix.org shape as the first six scan-* jobs.

  scan-docc-structure:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-docc-structure.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  scan-package-shape:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-package-shape.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  scan-platform-architecture:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-platform-architecture.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  scan-readme:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-readme.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  scan-diagnostic-format:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-diagnostic-format.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  scan-layer-deps:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-layer-deps.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  report:
    needs:
      - scan-thin-callers
      - scan-file-naming
      - scan-github-metadata
      - scan-package-structure
      - scan-docc-structure
      - scan-package-shape
      - scan-platform-architecture
      - scan-readme
      - scan-diagnostic-format
      - scan-layer-deps
      - scan-branch-pins
      - scan-gitignore
    if: always() && (needs.scan-thin-callers.result != 'skipped' || needs.scan-file-naming.result != 'skipped' || needs.scan-github-metadata.result != 'skipped' || needs.scan-package-structure.result != 'skipped' || needs.scan-docc-structure.result != 'skipped' || needs.scan-package-shape.result != 'skipped' || needs.scan-platform-architecture.result != 'skipped' || needs.scan-readme.result != 'skipped' || needs.scan-diagnostic-format.result != 'skipped' || needs.scan-layer-deps.result != 'skipped' || needs.scan-branch-pins.result != 'skipped' || needs.scan-gitignore.result != 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Mint installation token (issues:write at swift-institute/.github)
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: swift-institute
          repositories: .github
          permission-issues: write

      # The per-leg breakdown used to exist only in each cell's step summary,
      # which is not reachable from the run list, the API, or a notification.
      # So a reader who saw "72 jobs, some red" had to open cells one at a time
      # to learn anything, and for three consecutive weeks nobody did. The job
      # list for this very run IS available over the API, so name the failing
      # legs in the issue itself.
      - name: Enumerate this run's failing legs
        id: legs
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api --paginate \
                 "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
                 --jq '.jobs[] | [.conclusion, .name] | @tsv' > /tmp/jobs.tsv 2>/tmp/jobs.err; then
            # Fail soft, loudly. Losing the breakdown must not lose the issue.
            echo "::warning::Could not enumerate this run's jobs ($(head -c 200 /tmp/jobs.err)); the issue will carry job-level status only."
            : > /tmp/jobs.tsv
          fi
          total=$(wc -l < /tmp/jobs.tsv | tr -d ' ')
          failed=$(awk -F'\t' '$1 != "success" && $1 != "skipped" && $2 ~ /^scan-/' /tmp/jobs.tsv | wc -l | tr -d ' ')
          {
            if [ "$total" -eq 0 ]; then
              echo "_The per-leg breakdown could not be retrieved for this run._"
            else
              echo "**${failed} of ${total} jobs failing.** The failing scan legs:"
              echo
              awk -F'\t' '$1 != "success" && $1 != "skipped" && $2 ~ /^scan-/ {
                printf("- `%s`\n", $2)
              }' /tmp/jobs.tsv | sort
            fi
          } > /tmp/legs.md
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"
          echo "total=${total}"   >> "$GITHUB_OUTPUT"
          cat /tmp/legs.md

      - name: Build issue body
        env:
          FAILED_LEGS: ${{ steps.legs.outputs.failed }}
          TOTAL_JOBS: ${{ steps.legs.outputs.total }}
          RESULT_THIN_CALLERS: ${{ needs.scan-thin-callers.result }}
          RESULT_FILE_NAMING: ${{ needs.scan-file-naming.result }}
          RESULT_GITHUB_METADATA: ${{ needs.scan-github-metadata.result }}
          RESULT_PACKAGE_STRUCTURE: ${{ needs.scan-package-structure.result }}
          RESULT_DOCC_STRUCTURE: ${{ needs.scan-docc-structure.result }}
          RESULT_PACKAGE_SHAPE: ${{ needs.scan-package-shape.result }}
          RESULT_PLATFORM_ARCHITECTURE: ${{ needs.scan-platform-architecture.result }}
          RESULT_README: ${{ needs.scan-readme.result }}
          RESULT_DIAGNOSTIC_FORMAT: ${{ needs.scan-diagnostic-format.result }}
          RESULT_LAYER_DEPS: ${{ needs.scan-layer-deps.result }}
          RESULT_BRANCH_PINS: ${{ needs.scan-branch-pins.result }}
          RESULT_GITIGNORE: ${{ needs.scan-gitignore.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          today=$(date -u '+%Y-%m-%d')

          # Aggregate per-validator scan job results. Only 'success' is clean.
          #
          # `skipped` used to count as clean. It does not mean "nothing to
          # check" — for a matrix job it means the matrix was EMPTY and the job
          # never existed. That is exactly what happened to the six Wave-B
          # validators when resolve-targets enumerated 0 pairs: they produced
          # no jobs, reported `skipped`, and this loop called the run clean over
          # them. A validator that did not run must never be reportable as a
          # validator that found nothing.
          ALL_CLEAN=true
          SKIPPED=""
          # TOTAL_VALIDATORS derives the validator count from the pair
          # list's own length at run time (#117) instead of a hard-coded
          # "12" that silently goes stale the next time a scan-* leg is
          # added here without a matching count bump elsewhere. Persisted
          # via GITHUB_ENV so the close-when-clean step (a separate step)
          # can read it too.
          TOTAL_VALIDATORS=0
          for pair in "thin-callers:$RESULT_THIN_CALLERS" "file-naming:$RESULT_FILE_NAMING" \
                      "github-metadata:$RESULT_GITHUB_METADATA" "package-structure:$RESULT_PACKAGE_STRUCTURE" \
                      "docc-structure:$RESULT_DOCC_STRUCTURE" "package-shape:$RESULT_PACKAGE_SHAPE" \
                      "platform-architecture:$RESULT_PLATFORM_ARCHITECTURE" "readme:$RESULT_README" \
                      "diagnostic-format:$RESULT_DIAGNOSTIC_FORMAT" "layer-deps:$RESULT_LAYER_DEPS" \
                      "branch-pins:$RESULT_BRANCH_PINS" "gitignore:$RESULT_GITIGNORE"; do
            TOTAL_VALIDATORS=$((TOTAL_VALIDATORS + 1))
            name="${pair%%:*}"; r="${pair#*:}"
            case "$r" in
              success) ;;
              skipped) ALL_CLEAN=false; SKIPPED="${SKIPPED} ${name}" ;;
              *) ALL_CLEAN=false ;;
            esac
          done
          echo "TOTAL_VALIDATORS=${TOTAL_VALIDATORS}" >> "$GITHUB_ENV"
          if [ -n "$SKIPPED" ]; then
            echo "::error::These validators did NOT RUN (empty matrix or skipped job):${SKIPPED}. A validator that did not run is not a validator that found nothing."
          fi

          if [[ "$ALL_CLEAN" == "true" ]]; then
            echo "All ${TOTAL_VALIDATORS} scan jobs converged cleanly (success/skipped) — no tracking issue needed."
            echo "FILE_ISSUE=false" >> "$GITHUB_ENV"
            echo "CLEAN_RUN=true" >> "$GITHUB_ENV"
            exit 0
          fi

          cat > "${RUNNER_TEMP}/issue-body.md" <<EOF
          # Validators weekly sweep — ${today}

          $(cat /tmp/legs.md 2>/dev/null || echo "_Per-leg breakdown unavailable._")

          Each failing leg's step summary names the specific repos and rules;
          the [run summary](${RUN_URL}) links them all.

          ## Per-validator coverage (cross-org per-package-org-sweep)

          ### validate-thin-callers ([CI-030] / [CI-059] / [GH-REPO-074])
          Job status: \`${RESULT_THIN_CALLERS}\`. Per-org breakdown in run summary;
          per-cell step summaries name the specific consumer repos with violations.

          ### validate-file-naming ([API-IMPL-006])
          Job status: \`${RESULT_FILE_NAMING}\`. Per-org breakdown in run summary.

          ### validate-github-metadata ([GH-REPO-METADATA])
          Job status: \`${RESULT_GITHUB_METADATA}\`. Per-org breakdown in run summary.

          ### validate-package-structure ([PACKAGE-STRUCTURE])
          Job status: \`${RESULT_PACKAGE_STRUCTURE}\`. Per-org breakdown in run summary.

          ### validate-gitignore ([GH-IGNORE-001] / [GH-IGNORE-002])
          Job status: \`${RESULT_GITIGNORE}\`. Per-org breakdown in run summary.

          ### validate-branch-pins ([BRANCH-PIN-001], #75)
          Job status: \`${RESULT_BRANCH_PINS}\`. Per-org breakdown in run summary;
          baselined declarations are the burn-down ledger, not violations.

          ## Per-validator coverage (cross-org single-target, Phase D Wave B)

          ### validate-docc-structure ([DOC-*])
          Job status: \`${RESULT_DOCC_STRUCTURE}\`. Per-(org, repo) breakdown in run summary.

          ### validate-package-shape ([PATTERN-*])
          Job status: \`${RESULT_PACKAGE_SHAPE}\`. Per-(org, repo) breakdown in run summary.

          ### validate-platform-architecture ([PLAT-ARCH-*])
          Job status: \`${RESULT_PLATFORM_ARCHITECTURE}\`. Per-(org, repo) breakdown in run summary.

          ### validate-readme ([README-*])
          Job status: \`${RESULT_README}\`. Per-(org, repo) breakdown in run summary.

          ### validate-diagnostic-format ([API-NAME-009])
          Job status: \`${RESULT_DIAGNOSTIC_FORMAT}\`. Per-(org, repo) breakdown in run summary.

          ### validate-layer-deps ([PLAT-ARCH-008])
          Job status: \`${RESULT_LAYER_DEPS}\`. Per-(org, repo) breakdown in run summary.

          ## What this means

          One or more scan legs reported violations, a validator error, or did
          not run at all. Drill into the failed legs listed above.

          A validator whose status reads \`skipped\` DID NOT RUN — for a matrix
          job that means the matrix was empty and no job was ever created. It is
          not a clean result. Until 2026-07-28 this workflow counted \`skipped\`
          as clean, and the six single-target validators had been reporting it
          for as long as the retained run history goes back.

          ## What to do

          - Review the per-cell step summaries for specific violations.
          - For each finding, either fix the consumer repo to conform or amend
            the rule via /promote-rule.
          - This issue is updated in place by the next weekly run; auto-closed
            when all ${TOTAL_VALIDATORS} validators report 0 violations across their respective coverage.

          *Idempotent: this issue is updated in place.*
          EOF

          # The count goes in the TITLE, not only the body. The issue list is
          # the only surface anyone sees without clicking, and a title that
          # reads the same whether one leg or forty are failing carries no
          # information at all.
          {
            echo "ISSUE_TITLE=Validators weekly sweep — ${FAILED_LEGS:-?} leg(s) failing (${today})"
            echo "FILE_ISSUE=true"
            echo "CLEAN_RUN=false"
          } >> "$GITHUB_ENV"

      # ON THE LABEL, because Skills/github forbids minting a taxonomy:
      #
      #   "Labels are stock GitHub defaults and carry no Institute meaning —
      #    never encode routing, priority, or ownership in one, and do not mint
      #    a taxonomy without changing this rule."
      #
      # `lint-validators` encodes none of routing, priority or ownership. It
      # identifies WHICH SWEEP FILED a bot-authored divergence report — the
      # category the same skill sets apart with "issues opened by
      # swift-institute-bot report machine-detected divergence — do not board
      # them and do not hand-close them". Eleven sibling workflows in this repo
      # already pass exactly such a label to this same composite (`link-check`,
      # `license-audit`, `spine-audit`, `dep-graph`, `metadata-sync`, …), so
      # this is the twelfth instance of an established convention rather than a
      # new taxonomy.
      #
      # Critically, it is NOT load-bearing. The close-when-clean step below
      # mirrors the upsert's own title-prefix search, so auto-close works with
      # or without a label. That was the actual defect: the close step searched
      # `--label lint-validators` while the upsert searched by title, the label
      # did not exist, and the two never referred to the same issue — so
      # auto-close could not fire even on a fully clean fleet.
      #
      # If the rule is meant to bind bot-filed sweep issues too, the fix is
      # fleet-wide across those twelve callers, not a local deviation here.
      #
      # Mechanics: upsert-tracking-issue applies the label on CREATE only, and
      # silently falls back to a label-less create when the label does not
      # exist. `lint-validators` did not exist when issue #34 was created on
      # 2026-05-19, so it never got one, and the edit path cannot repair that.
      - name: Ensure the tracking label exists
        if: ${{ inputs.dry-run != true }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh label create lint-validators \
            --repo swift-institute/.github \
            --color 'B60205' \
            --description 'Weekly cross-org validator sweep findings' \
            2>/dev/null && echo "created label lint-validators" \
            || echo "label lint-validators already present"

      - name: Upsert tracking issue
        id: upsert
        if: ${{ env.FILE_ISSUE == 'true' && inputs.dry-run != true }}
        uses: swift-institute/.github/.github/actions/upsert-tracking-issue@main
        with:
          repo: swift-institute/.github
          title: ${{ env.ISSUE_TITLE }}
          title-prefix: 'Validators weekly sweep'
          body-file: ${{ runner.temp }}/issue-body.md
          label: 'lint-validators'
          gh-token: ${{ steps.token.outputs.token }}

      # The upsert labels on CREATE only, so an issue that was created before
      # the label existed stays unlabelled forever — it is edited, never
      # recreated. Issue #34 had been in exactly that state since 2026-05-19.
      # Applying the label on every run makes it self-healing, and `gh issue
      # edit --add-label` is idempotent.
      - name: Reconcile the label on the tracking issue
        if: ${{ env.FILE_ISSUE == 'true' && inputs.dry-run != true && steps.upsert.outputs.issue-number != '' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE: ${{ steps.upsert.outputs.issue-number }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE" --repo swift-institute/.github \
            --add-label lint-validators
          echo "issue #${ISSUE} carries label lint-validators"

      # `gh issue edit --body-file` rewrites the body and NOTIFIES NOBODY. That
      # is the mechanism by which this sweep went unread: issue #34 was created
      # once in May and silently rewritten every week after, accumulating zero
      # comments and zero notifications while the fleet stayed red.
      #
      # A comment does notify, and it leaves a dated trail, so the tenth
      # consecutive red week is visible as such instead of looking like the
      # first. Posted only when the failing-leg count CHANGES, so the issue does
      # not become a weekly drip that trains everyone to mute it — the case this
      # is trying to fix, arrived at from the other direction.
      - name: Comment when the failing-leg count changes
        if: ${{ env.FILE_ISSUE == 'true' && inputs.dry-run != true && steps.upsert.outputs.issue-number != '' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE: ${{ steps.upsert.outputs.issue-number }}
          FAILED_LEGS: ${{ steps.legs.outputs.failed }}
          TOTAL_JOBS: ${{ steps.legs.outputs.total }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- lint-validators-legcount -->'
          previous=$(gh issue view "$ISSUE" --repo swift-institute/.github \
            --json comments --jq \
            "[.comments[] | select(.body | contains(\"${marker}\"))] | last | .body // \"\"" \
            | grep -oE 'legs=[0-9]+' | tail -1 | cut -d= -f2 || true)
          previous="${previous:-none}"
          current="${FAILED_LEGS:-?}"
          if [ "$previous" = "$current" ]; then
            echo "Failing-leg count unchanged at ${current}; not commenting."
            exit 0
          fi
          # Written to a file rather than passed inline: a multi-line --body
          # argument has to sit at column 0 to render, which terminates the
          # enclosing YAML block scalar. The repo's own CI-090/CI-103/CI-105
          # validators caught that on the first attempt.
          {
            printf '%s legs=%s\n\n' "$marker" "$current"
            printf '**Failing legs: %s → %s** (of %s jobs) — [run](%s)\n\n' \
              "$previous" "$current" "${TOTAL_JOBS:-?}" "$RUN_URL"
            cat /tmp/legs.md 2>/dev/null || true
          } > "${RUNNER_TEMP}/leg-comment.md"
          gh issue comment "$ISSUE" --repo swift-institute/.github \
            --body-file "${RUNNER_TEMP}/leg-comment.md"
          echo "commented: ${previous} -> ${current}"

      # Mirrors the upsert's own lookup. This searched `--label lint-validators`
      # while the upsert searches by title-prefix, and the issue carries no
      # label — so the two never referred to the same issue and the close path
      # could not fire even on a fully clean fleet. Guard mirror conditions on
      # mirrored predicates, or the path you did not exercise is the broken one.
      - name: Close tracking issue when clean
        if: ${{ env.CLEAN_RUN == 'true' && inputs.dry-run != true }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # Set by the "Build issue body" step via GITHUB_ENV; carries the
          # run-time-derived validator count (#117) into this later step.
          TOTAL_VALIDATORS: ${{ env.TOTAL_VALIDATORS }}
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh issue list \
            --repo swift-institute/.github \
            --state open \
            --search 'Validators weekly sweep in:title' \
            --json number \
            --jq '.[].number' || echo "")
          if [ -z "$existing" ]; then
            echo "Fleet clean and no open sweep issue to close."
            exit 0
          fi
          for n in $existing; do
            gh issue close "$n" \
              --repo swift-institute/.github \
              --comment "All ${TOTAL_VALIDATORS} validators clean as of run ${{ github.run_id }}; auto-closing."
            echo "closed #${n}"
          done
