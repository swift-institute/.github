# Weekly cross-org orchestrator for the per-package-org-sweep validator
# corpus: dispatches each validator over the 17 active orgs. Findings surface
# as per-cell step-summary tables plus one aggregated tracking issue
# (idempotent upsert, close-on-clean).
#
# In scope: validate-thin-callers [CI-030]/[CI-059]/[GH-REPO-074],
# validate-file-naming [API-IMPL-006], validate-github-metadata
# [GH-REPO-METADATA], validate-package-structure [PACKAGE-STRUCTURE],
# validate-gitignore [GH-IGNORE-001]/[GH-IGNORE-002]. NOT
# validate-sub-org-wrappers — it self-fires on a different axis.
#
# Cadence Tuesday 06:00 UTC: an uncongested slot against cron-audit-base
# (Mon 06:00-06:45), link-check-weekly (Mon 06:00), validate-sub-org-wrappers
# (Mon 05:00), and lint-org-bot-coverage-weekly (Sun 06:30).
#
# Chain depth 2 of the [CI-004b] 4-level limit: orchestrator → validate-X.yml.
# Standalone workflow, so [CI-090] deny-all floor + explicit per-job grants.
#
# TRAP that dictates the shape below: `uses:` is resolved BEFORE matrix
# expansion, so `matrix.*` is unavailable there and a single 2D matrix over
# {validator, org} fails workflow load with HTTP 422 "Unrecognized named-value:
# 'matrix'". `inputs.*` and `vars.*` ARE available; `matrix.*` is not. Hence
# ONE SCAN JOB PER VALIDATOR, each with a 1D matrix over `org` and a STATIC
# `uses:`. Do not re-collapse them.
#
# Tokens: the orchestrator pre-mints nothing. Each validate-X.yml mints its own
# per-org App-installation token from the inherited secrets; the report job
# mints its own swift-institute-scoped token for issues:write.
#
# dry-run defaults FALSE: cells fail naturally on findings and the report job
# fires when any scan job is not 'success'. A `true` default would leave the
# report unable to distinguish findings-present from findings-absent without
# per-cell artifact aggregation.

name: lint-validators-weekly

# [CI-090] Standalone workflow → deny-all floor at workflow level;
# per-job permissions blocks below provide the actual grants.
permissions: {}

on:
  schedule:
    - cron: '0 6 * * 2'   # weekly Tuesday 06:00 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run validators but skip aggregated issue create/update.'
        type: boolean
        required: false
        default: false
      visibility:
        description: 'Filter consumer repos by visibility (public | private | internal | all). Default public per [CI-094] + [CI-095].'
        type: string
        required: false
        default: 'public'

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      orgs: ${{ steps.read.outputs.orgs }}
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - id: read
        uses: swift-institute/.github/.github/actions/read-orgs@main
        with:
          # All 17 active orgs (.name); archived orgs auto-excluded by the
          # composite. Repo-level visibility filter is applied inside each
          # validate-X.yml's gh repo list call (default: public).
          filter: '.name'

  # Every scan-* job below has the SAME shape: a 1D matrix over
  # config.outputs.orgs plus a static `uses:`. Per [CI-106] the caller's
  # per-job grant (contents: read) must be >= the called reusable's.
  #
  # Keep the 1D shape. A repository-wide 2D (org, repo) matrix was removed
  # (#280): it does not scale under GitHub's 256-job-per-matrix limit (~478
  # public non-archived repos), and a broken pagination fix once made it
  # enumerate 0 pairs, silently skip every dependent validator, and have the
  # report job score that as CLEAN (#62). Each validator now enumerates its
  # org's repos inside the (validator, org) job via validate-base.yml's
  # per-package-org-sweep discovery mode.

  scan-thin-callers:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-thin-callers.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  scan-file-naming:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-file-naming.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  scan-github-metadata:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-github-metadata.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  scan-package-structure:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-package-structure.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  scan-gitignore:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-gitignore.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  scan-branch-pins:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-branch-pins.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  # The remaining scan-* jobs dispatch validate-*.yml callers whose scan job
  # resolves discovery-mode to per-package-org-sweep because `org:` is set and
  # `repo:` is not. Same 1D matrix shape.

  scan-docc-structure:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-docc-structure.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  scan-package-shape:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-package-shape.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  scan-platform-architecture:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-platform-architecture.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  scan-readme:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-readme.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  scan-diagnostic-format:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-diagnostic-format.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  scan-layer-deps:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    permissions:
      contents: read
    uses: ./.github/workflows/validate-layer-deps.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      visibility: ${{ inputs.visibility || 'public' }}
    secrets: inherit

  report:
    needs:
      - scan-thin-callers
      - scan-file-naming
      - scan-github-metadata
      - scan-package-structure
      - scan-docc-structure
      - scan-package-shape
      - scan-platform-architecture
      - scan-readme
      - scan-diagnostic-format
      - scan-layer-deps
      - scan-branch-pins
      - scan-gitignore
    if: always() && (needs.scan-thin-callers.result != 'skipped' || needs.scan-file-naming.result != 'skipped' || needs.scan-github-metadata.result != 'skipped' || needs.scan-package-structure.result != 'skipped' || needs.scan-docc-structure.result != 'skipped' || needs.scan-package-shape.result != 'skipped' || needs.scan-platform-architecture.result != 'skipped' || needs.scan-readme.result != 'skipped' || needs.scan-diagnostic-format.result != 'skipped' || needs.scan-layer-deps.result != 'skipped' || needs.scan-branch-pins.result != 'skipped' || needs.scan-gitignore.result != 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Mint installation token (issues:write at swift-institute/.github)
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: swift-institute
          repositories: .github
          permission-issues: write

      # Name the failing legs in the issue itself: a cell's step summary is not
      # reachable from the run list, the API, or a notification, so a red sweep
      # otherwise costs one cell-open per leg to read. The run's job list IS
      # available over the API.
      - name: Enumerate this run's failing legs
        id: legs
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api --paginate \
                 "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
                 --jq '.jobs[] | [.conclusion, .name] | @tsv' > /tmp/jobs.tsv 2>/tmp/jobs.err; then
            # Fail soft, loudly. Losing the breakdown must not lose the issue.
            echo "::warning::Could not enumerate this run's jobs ($(head -c 200 /tmp/jobs.err)); the issue will carry job-level status only."
            : > /tmp/jobs.tsv
          fi
          total=$(wc -l < /tmp/jobs.tsv | tr -d ' ')
          failed=$(awk -F'\t' '$1 != "success" && $1 != "skipped" && $2 ~ /^scan-/' /tmp/jobs.tsv | wc -l | tr -d ' ')
          {
            if [ "$total" -eq 0 ]; then
              echo "_The per-leg breakdown could not be retrieved for this run._"
            else
              echo "**${failed} of ${total} jobs failing.** The failing scan legs:"
              echo
              awk -F'\t' '$1 != "success" && $1 != "skipped" && $2 ~ /^scan-/ {
                printf("- `%s`\n", $2)
              }' /tmp/jobs.tsv | sort
            fi
          } > /tmp/legs.md
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"
          echo "total=${total}"   >> "$GITHUB_OUTPUT"
          cat /tmp/legs.md

      - name: Build issue body
        env:
          FAILED_LEGS: ${{ steps.legs.outputs.failed }}
          TOTAL_JOBS: ${{ steps.legs.outputs.total }}
          RESULT_THIN_CALLERS: ${{ needs.scan-thin-callers.result }}
          RESULT_FILE_NAMING: ${{ needs.scan-file-naming.result }}
          RESULT_GITHUB_METADATA: ${{ needs.scan-github-metadata.result }}
          RESULT_PACKAGE_STRUCTURE: ${{ needs.scan-package-structure.result }}
          RESULT_DOCC_STRUCTURE: ${{ needs.scan-docc-structure.result }}
          RESULT_PACKAGE_SHAPE: ${{ needs.scan-package-shape.result }}
          RESULT_PLATFORM_ARCHITECTURE: ${{ needs.scan-platform-architecture.result }}
          RESULT_README: ${{ needs.scan-readme.result }}
          RESULT_DIAGNOSTIC_FORMAT: ${{ needs.scan-diagnostic-format.result }}
          RESULT_LAYER_DEPS: ${{ needs.scan-layer-deps.result }}
          RESULT_BRANCH_PINS: ${{ needs.scan-branch-pins.result }}
          RESULT_GITIGNORE: ${{ needs.scan-gitignore.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          today=$(date -u '+%Y-%m-%d')

          # Aggregate per-validator scan job results. Only 'success' is clean.
          #
          # `skipped` used to count as clean. It does not mean "nothing to
          # check" — for a matrix job it means the matrix was EMPTY and the job
          # never existed. That is exactly what happened to the six Wave-B
          # validators when resolve-targets enumerated 0 pairs: they produced
          # no jobs, reported `skipped`, and this loop called the run clean over
          # them. A validator that did not run must never be reportable as a
          # validator that found nothing.
          ALL_CLEAN=true
          SKIPPED=""
          # TOTAL_VALIDATORS derives the validator count from the pair
          # list's own length at run time (#117) instead of a hard-coded
          # "12" that silently goes stale the next time a scan-* leg is
          # added here without a matching count bump elsewhere. Persisted
          # via GITHUB_ENV so the close-when-clean step (a separate step)
          # can read it too.
          TOTAL_VALIDATORS=0
          for pair in "thin-callers:$RESULT_THIN_CALLERS" "file-naming:$RESULT_FILE_NAMING" \
                      "github-metadata:$RESULT_GITHUB_METADATA" "package-structure:$RESULT_PACKAGE_STRUCTURE" \
                      "docc-structure:$RESULT_DOCC_STRUCTURE" "package-shape:$RESULT_PACKAGE_SHAPE" \
                      "platform-architecture:$RESULT_PLATFORM_ARCHITECTURE" "readme:$RESULT_README" \
                      "diagnostic-format:$RESULT_DIAGNOSTIC_FORMAT" "layer-deps:$RESULT_LAYER_DEPS" \
                      "branch-pins:$RESULT_BRANCH_PINS" "gitignore:$RESULT_GITIGNORE"; do
            TOTAL_VALIDATORS=$((TOTAL_VALIDATORS + 1))
            name="${pair%%:*}"; r="${pair#*:}"
            case "$r" in
              success) ;;
              skipped) ALL_CLEAN=false; SKIPPED="${SKIPPED} ${name}" ;;
              *) ALL_CLEAN=false ;;
            esac
          done
          echo "TOTAL_VALIDATORS=${TOTAL_VALIDATORS}" >> "$GITHUB_ENV"
          if [ -n "$SKIPPED" ]; then
            echo "::error::These validators did NOT RUN (empty matrix or skipped job):${SKIPPED}. A validator that did not run is not a validator that found nothing."
          fi

          if [[ "$ALL_CLEAN" == "true" ]]; then
            echo "All ${TOTAL_VALIDATORS} scan jobs converged cleanly (success/skipped) — no tracking issue needed."
            echo "FILE_ISSUE=false" >> "$GITHUB_ENV"
            echo "CLEAN_RUN=true" >> "$GITHUB_ENV"
            exit 0
          fi

          cat > "${RUNNER_TEMP}/issue-body.md" <<EOF
          # Validators weekly sweep — ${today}

          $(cat /tmp/legs.md 2>/dev/null || echo "_Per-leg breakdown unavailable._")

          Each failing leg's step summary names the specific repos and rules;
          the [run summary](${RUN_URL}) links them all.

          ## Per-validator coverage (cross-org per-package-org-sweep)

          ### validate-thin-callers ([CI-030] / [CI-059] / [GH-REPO-074])
          Job status: \`${RESULT_THIN_CALLERS}\`. Per-org breakdown in run summary;
          per-cell step summaries name the specific consumer repos with violations.

          ### validate-file-naming ([API-IMPL-006])
          Job status: \`${RESULT_FILE_NAMING}\`. Per-org breakdown in run summary.

          ### validate-github-metadata ([GH-REPO-METADATA])
          Job status: \`${RESULT_GITHUB_METADATA}\`. Per-org breakdown in run summary.

          ### validate-package-structure ([PACKAGE-STRUCTURE])
          Job status: \`${RESULT_PACKAGE_STRUCTURE}\`. Per-org breakdown in run summary.

          ### validate-gitignore ([GH-IGNORE-001] / [GH-IGNORE-002])
          Job status: \`${RESULT_GITIGNORE}\`. Per-org breakdown in run summary.

          ### validate-branch-pins ([BRANCH-PIN-001], #75)
          Job status: \`${RESULT_BRANCH_PINS}\`. Per-org breakdown in run summary;
          baselined declarations are the burn-down ledger, not violations.

          ## Per-validator coverage (cross-org single-target, Phase D Wave B)

          ### validate-docc-structure ([DOC-*])
          Job status: \`${RESULT_DOCC_STRUCTURE}\`. Per-(org, repo) breakdown in run summary.

          ### validate-package-shape ([PATTERN-*])
          Job status: \`${RESULT_PACKAGE_SHAPE}\`. Per-(org, repo) breakdown in run summary.

          ### validate-platform-architecture ([PLAT-ARCH-*])
          Job status: \`${RESULT_PLATFORM_ARCHITECTURE}\`. Per-(org, repo) breakdown in run summary.

          ### validate-readme ([README-*])
          Job status: \`${RESULT_README}\`. Per-(org, repo) breakdown in run summary.

          ### validate-diagnostic-format ([API-NAME-009])
          Job status: \`${RESULT_DIAGNOSTIC_FORMAT}\`. Per-(org, repo) breakdown in run summary.

          ### validate-layer-deps ([PLAT-ARCH-008])
          Job status: \`${RESULT_LAYER_DEPS}\`. Per-(org, repo) breakdown in run summary.

          ## What this means

          One or more scan legs reported violations, a validator error, or did
          not run at all. Drill into the failed legs listed above.

          A validator whose status reads \`skipped\` DID NOT RUN — for a matrix
          job that means the matrix was empty and no job was ever created. It is
          not a clean result. Until 2026-07-28 this workflow counted \`skipped\`
          as clean, and the six single-target validators had been reporting it
          for as long as the retained run history goes back.

          ## What to do

          - Review the per-cell step summaries for specific violations.
          - For each finding, either fix the consumer repo to conform or amend
            the rule via /promote-rule.
          - This issue is updated in place by the next weekly run; auto-closed
            when all ${TOTAL_VALIDATORS} validators report 0 violations across their respective coverage.

          *Idempotent: this issue is updated in place.*
          EOF

          # The count goes in the TITLE, not only the body. The issue list is
          # the only surface anyone sees without clicking, and a title that
          # reads the same whether one leg or forty are failing carries no
          # information at all.
          {
            echo "ISSUE_TITLE=Validators weekly sweep — ${FAILED_LEGS:-?} leg(s) failing (${today})"
            echo "FILE_ISSUE=true"
            echo "CLEAN_RUN=false"
          } >> "$GITHUB_ENV"

      # ON THE LABEL. The github skill forbids minting a label taxonomy and
      # bars encoding routing, priority, or ownership in one. `lint-validators`
      # encodes none of those — it identifies WHICH SWEEP filed a bot-authored
      # divergence report, and sibling workflows here already pass the same
      # class of label to this composite (`link-check`, `license-audit`,
      # `spine-audit`, `dep-graph`, `metadata-sync`, …). If the rule is meant to
      # bind bot-filed sweep issues too, that fix is fleet-wide, not local.
      #
      # It is NOT load-bearing: close-when-clean mirrors the upsert's
      # title-prefix search, so auto-close works with or without a label. That
      # mismatch WAS the defect — the close step searched `--label
      # lint-validators` while the upsert searched by title and no label
      # existed, so the two never named the same issue and auto-close could not
      # fire even on a clean fleet.
      #
      # Mechanics: upsert-tracking-issue labels on CREATE only and silently
      # falls back to a label-less create when the label does not exist, so an
      # issue created before the label stays unlabelled — the edit path cannot
      # repair it. Hence the reconcile step below.
      - name: Ensure the tracking label exists
        if: ${{ inputs.dry-run != true }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh label create lint-validators \
            --repo swift-institute/.github \
            --color 'B60205' \
            --description 'Weekly cross-org validator sweep findings' \
            2>/dev/null && echo "created label lint-validators" \
            || echo "label lint-validators already present"

      - name: Upsert tracking issue
        id: upsert
        if: ${{ env.FILE_ISSUE == 'true' && inputs.dry-run != true }}
        uses: swift-institute/.github/.github/actions/upsert-tracking-issue@main
        with:
          repo: swift-institute/.github
          title: ${{ env.ISSUE_TITLE }}
          title-prefix: 'Validators weekly sweep'
          body-file: ${{ runner.temp }}/issue-body.md
          label: 'lint-validators'
          gh-token: ${{ steps.token.outputs.token }}

      # Applying the label every run makes an issue created before the label
      # existed self-healing; `gh issue edit --add-label` is idempotent.
      - name: Reconcile the label on the tracking issue
        if: ${{ env.FILE_ISSUE == 'true' && inputs.dry-run != true && steps.upsert.outputs.issue-number != '' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE: ${{ steps.upsert.outputs.issue-number }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE" --repo swift-institute/.github \
            --add-label lint-validators
          echo "issue #${ISSUE} carries label lint-validators"

      # `gh issue edit --body-file` rewrites the body and NOTIFIES NOBODY —
      # that is how this sweep went unread for months, silently rewritten every
      # week while the fleet stayed red. A comment notifies and leaves a dated
      # trail, so a tenth consecutive red week reads as one. Posted ONLY when
      # the failing-leg count CHANGES, so it never becomes a weekly drip
      # everyone learns to mute — the same failure from the other direction.
      - name: Comment when the failing-leg count changes
        if: ${{ env.FILE_ISSUE == 'true' && inputs.dry-run != true && steps.upsert.outputs.issue-number != '' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE: ${{ steps.upsert.outputs.issue-number }}
          FAILED_LEGS: ${{ steps.legs.outputs.failed }}
          TOTAL_JOBS: ${{ steps.legs.outputs.total }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- lint-validators-legcount -->'
          previous=$(gh issue view "$ISSUE" --repo swift-institute/.github \
            --json comments --jq \
            "[.comments[] | select(.body | contains(\"${marker}\"))] | last | .body // \"\"" \
            | grep -oE 'legs=[0-9]+' | tail -1 | cut -d= -f2 || true)
          previous="${previous:-none}"
          current="${FAILED_LEGS:-?}"
          if [ "$previous" = "$current" ]; then
            echo "Failing-leg count unchanged at ${current}; not commenting."
            exit 0
          fi
          # Written to a file rather than passed inline: a multi-line --body
          # argument has to sit at column 0 to render, which terminates the
          # enclosing YAML block scalar. The repo's own CI-090/CI-103/CI-105
          # validators caught that on the first attempt.
          {
            printf '%s legs=%s\n\n' "$marker" "$current"
            printf '**Failing legs: %s → %s** (of %s jobs) — [run](%s)\n\n' \
              "$previous" "$current" "${TOTAL_JOBS:-?}" "$RUN_URL"
            cat /tmp/legs.md 2>/dev/null || true
          } > "${RUNNER_TEMP}/leg-comment.md"
          gh issue comment "$ISSUE" --repo swift-institute/.github \
            --body-file "${RUNNER_TEMP}/leg-comment.md"
          echo "commented: ${previous} -> ${current}"

      # MUST mirror the upsert's own lookup. It once searched by label while the
      # upsert searched by title-prefix, so the two never named the same issue
      # and close could not fire even on a clean fleet. Guard mirror conditions
      # on mirrored predicates, or the path you never exercise is the broken one.
      - name: Close tracking issue when clean
        if: ${{ env.CLEAN_RUN == 'true' && inputs.dry-run != true }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # Set by the "Build issue body" step via GITHUB_ENV; carries the
          # run-time-derived validator count (#117) into this later step.
          TOTAL_VALIDATORS: ${{ env.TOTAL_VALIDATORS }}
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh issue list \
            --repo swift-institute/.github \
            --state open \
            --search 'Validators weekly sweep in:title' \
            --json number \
            --jq '.[].number' || echo "")
          if [ -z "$existing" ]; then
            echo "Fleet clean and no open sweep issue to close."
            exit 0
          fi
          for n in $existing; do
            gh issue close "$n" \
              --repo swift-institute/.github \
              --comment "All ${TOTAL_VALIDATORS} validators clean as of run ${{ github.run_id }}; auto-closing."
            echo "closed #${n}"
          done
