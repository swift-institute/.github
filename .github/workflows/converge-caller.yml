# converge-caller.yml — bot-authored single-repository caller convergence
# transaction (Task 5-02, swift-institute/.github#276, #282).
#
# Dispatched once per target repository by
# `.github/scripts/converge-callers.py`, the Task 5-02 orchestrator. This
# workflow is the ONLY place a bot installation token capable of writing
# `.github/workflows/**` in a target repository is minted — minting that
# token locally, from a Claude Code lane, is closed by the harness safety
# classifier (R5's documented precedent for the identical constraint on
# review-pr-transaction.yml). Doing the mutation here, inside an Actions
# run, is the sole available path, not merely the preferred one.
#
# Mirrors the proven bot-commit/bot-PR shape of generate-metadata.yml /
# generate-metadata.sh: org-scoped installation token (not narrowed to a
# single `repositories:` entry, so it draws from that org installation's
# own rate-limit pool per R23a property 3), `gh repo clone` +
# `git remote set-url` with the token embedded, commit as the bot identity,
# `git push`, then `gh api .../pulls` to open the PR — which is what makes
# the PR bot-authored (R11 / 5-01 Change item 10), not merely bot-pushed.
#
# Content is NEVER passed in as workflow_dispatch input text. The typed
# spec (layer + approved inputs) is passed; this job checks out
# swift-institute/.github at its OWN triggering ref and calls the landed
# `generate-caller.py` to render the canonical `ci.yml` itself. That keeps
# exactly one generator in the whole pipeline (Task 5-01's), with no
# second copy of its output logic living in this workflow that could drift
# from it.
#
# Rollback ordering (R23a property 2 / the document's own Task 5-02
# rollback clause): the pre-image of every file this job is about to
# touch is captured and written to the job's artifact BEFORE the branch
# is created or anything is committed — never after, and never only in
# the driver's own local copy.
#
# TERMINAL WAVE (R28.1 / TX6A, CI/CD Completion Programme): `mode:
# direct-push` commits the regenerated terminal caller straight to the
# target's default branch as the bot, through the R28-authorized App
# bypass actor on the compatibility ruleset. Rollback pre-image capture
# stays BEFORE the push; the landed blob is read back and byte-compared
# before the run reports success. `preserve-existing-inputs` recovers
# each target's approved typed inputs from its live caller via the
# generator's own parse mode, so a bespoke caller fails closed to
# typed-exception review instead of being overwritten.
#
# In pr mode this workflow does not approve or merge. Approval is a separate,
# distinct-identity step the driver performs as `coenttb` (R11: the bot
# authors and pushes; a reviewer that did not author the change approves)
# — folding it in here would make the pusher and the approver
# indistinguishable in intent even where the platform permits it.

name: converge-caller

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Target repository, owner/name.'
        required: true
        type: string
      layer:
        description: 'Workspace semantic layer: primitives | standards | institute.'
        required: true
        type: string
      mode:
        description: >-
          pr (default): open a bot-authored candidate PR for distinct-identity
          review. direct-push (R28.1, terminal wave): commit the regenerated
          terminal caller straight to the default branch as the bot, through
          the R28-authorized App bypass window; rollback pre-image capture
          stays BEFORE the push, and the landed blob is read back and
          byte-compared before the run reports success.
        required: false
        type: string
        default: 'pr'
      preserve-existing-inputs:
        description: >-
          Recover the target's approved typed inputs (platform-support,
          docs-* overrides, …) from its CURRENT ci.yml via the landed
          generator's own parse mode, instead of trusting dispatch inputs.
          An unparseable/bespoke caller fails the run (typed-exception
          route), never gets overwritten.
        required: false
        type: boolean
        default: true
      platform-support:
        description: 'Approved typed input: platform-support value, or empty.'
        required: false
        type: string
        default: ''
      enable-private-repos:
        description: 'Approved typed input: enable-private-repos, or empty for unset.'
        required: false
        type: string
        default: ''
      test-filter:
        description: 'Approved typed input: test-filter value, or empty.'
        required: false
        type: string
        default: ''
      delete-standalone-format-lint:
        description: 'Delete standalone swift-format.yml/swiftlint.yml if present (post-consolidation duplicates).'
        required: false
        type: boolean
        default: false
      task-issue:
        description: 'owner/repo#number this PR relates to (never Closes/Fixes).'
        required: false
        type: string
        default: 'swift-institute/.github#282'
      branch-suffix:
        description: 'Uniqueness suffix for the working branch (driver supplies a run-scoped value).'
        required: true
        type: string

permissions: {}

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      pr-number: ${{ steps.open-pr.outputs.pr-number }}
      pr-url: ${{ steps.open-pr.outputs.pr-url }}
      branch: ${{ steps.prep.outputs.branch }}
      outcome: ${{ steps.open-pr.outputs.outcome }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Validate target shape
        id: prep
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          BRANCH_SUFFIX: ${{ inputs.branch-suffix }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::'repository' must be one exact owner/name coordinate, got '${TARGET_REPOSITORY}'."
            exit 1
          fi
          if [[ ! "$BRANCH_SUFFIX" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::'branch-suffix' must be a plain token, got '${BRANCH_SUFFIX}'."
            exit 1
          fi
          echo "owner=${TARGET_REPOSITORY%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${TARGET_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          echo "branch=bot/5-02-converge-caller-${BRANCH_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Checkout swift-institute/.github (generator + this workflow's own ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          ref: ${{ job.workflow_sha }}
          path: institute-github

      - name: Resolve target repository metadata
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          info=$(gh api "repos/${TARGET_REPOSITORY}")
          archived=$(jq -r '.archived' <<<"$info")
          if [[ "$archived" == "true" ]]; then
            echo "::error::${TARGET_REPOSITORY} is archived; not a convergence target."
            exit 1
          fi
          echo "default-branch=$(jq -r '.default_branch' <<<"$info")" >> "$GITHUB_OUTPUT"
          echo "private=$(jq -r '.private' <<<"$info")" >> "$GITHUB_OUTPUT"

      - name: Mint org-scoped installation token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ steps.prep.outputs.owner }}
          permission-metadata: read
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write

      - name: Build canonical caller + capture rollback pre-image + open PR
        id: open-pr
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_OWNER: ${{ steps.prep.outputs.owner }}
          TARGET_NAME: ${{ steps.prep.outputs.name }}
          DEFAULT_BRANCH: ${{ steps.target.outputs.default-branch }}
          BRANCH: ${{ steps.prep.outputs.branch }}
          LAYER: ${{ inputs.layer }}
          PLATFORM_SUPPORT: ${{ inputs.platform-support }}
          ENABLE_PRIVATE_REPOS: ${{ inputs.enable-private-repos }}
          TEST_FILTER: ${{ inputs.test-filter }}
          DELETE_STANDALONE: ${{ inputs.delete-standalone-format-lint }}
          TASK_ISSUE: ${{ inputs.task-issue }}
          MODE: ${{ inputs.mode }}
          PRESERVE_EXISTING: ${{ inputs.preserve-existing-inputs }}
        run: |
          set -euo pipefail

          if [[ "$MODE" != "pr" && "$MODE" != "direct-push" ]]; then
            echo "::error::mode must be 'pr' or 'direct-push', got '${MODE}'."
            exit 1
          fi

          # Idempotency (pr mode): never open a second convergence PR onto
          # an existing open one for the same repository (retry/resume
          # safety). direct-push mode instead relies on the byte-identity
          # short-circuit below.
          if [[ "$MODE" == "pr" ]]; then
            existing=$(gh api "repos/${TARGET_REPOSITORY}/pulls?state=open" \
              --jq '[.[] | select(.head.ref | startswith("bot/5-02-converge-caller-"))] | .[0].number // empty')
            if [[ -n "$existing" ]]; then
              echo "::notice::${TARGET_REPOSITORY} already has an open convergence PR #${existing}; not opening a second one."
              echo "outcome=already-open" >> "$GITHUB_OUTPUT"
              echo "pr-number=${existing}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          workdir=$(mktemp -d)
          gh repo clone "$TARGET_REPOSITORY" "$workdir/repo" -- --depth 1 --quiet
          cd "$workdir/repo"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPOSITORY}.git"
          base_sha=$(git rev-parse HEAD)

          # ---- Rollback pre-image, captured BEFORE any mutation ----------
          # Plain bash/printf, deliberately not a python heredoc: this
          # `run:` block is YAML-indented, and any interpreter that is
          # itself indentation-sensitive (python) would receive that
          # editor/YAML indentation as literal leading whitespace on its
          # first statement, which is a syntax error. printf's format
          # strings live on one physical line each, so no such leakage is
          # possible.
          rollback="$workdir/rollback.json"
          {
            printf '{\n'
            printf '  "repository": "%s",\n' "$TARGET_REPOSITORY"
            printf '  "base_sha": "%s",\n' "$base_sha"
            printf '  "pre_image_base64": {\n'
            sep=""
            for rel in .github/workflows/ci.yml .github/workflows/swift-format.yml .github/workflows/swiftlint.yml; do
              printf '%s' "$sep"
              if [[ -f "$rel" ]]; then
                content=$(base64 -w0 < "$rel")
                printf '    "%s": "%s"' "$rel" "$content"
              else
                printf '    "%s": null' "$rel"
              fi
              sep=$',\n'
            done
            printf '\n  }\n}\n'
          } > "$rollback"
          mkdir -p "$GITHUB_WORKSPACE/rollback"
          # `tr '/' '__'` is a real defect this task's own canary run
          # exposed: tr does single-CHARACTER-to-single-CHARACTER
          # translation, not substring replacement, so it silently
          # collapsed to a SINGLE underscore — while the artifact's own
          # NAME above (built via literal YAML `__` interpolation, not
          # tr) correctly used a double underscore, and the driver's
          # download_rollback_artifact() expects double-underscore too.
          # That mismatch made every successful dispatch's rollback file
          # undiscoverable by the driver, which is precisely backwards
          # for the one property (rollback pre-image capture) this whole
          # workflow exists to make non-negotiable. Bash parameter
          # expansion replaces ALL occurrences correctly.
          cp "$rollback" "$GITHUB_WORKSPACE/rollback/${TARGET_REPOSITORY//\//__}.json"

          # ---- Canonical content, from the ONE landed generator -----------
          # With preserve-existing-inputs (the terminal-wave default), the
          # target's CURRENT caller is parsed by the generator's own parse
          # mode: its approved typed inputs (platform-support, docs-*
          # overrides, …) are recovered rather than trusted from dispatch
          # inputs, and a bespoke/unparseable caller FAILS the run (typed
          # exception route) instead of being overwritten.
          spec="$workdir/spec.json"
          if [[ "$PRESERVE_EXISTING" == "true" && -f .github/workflows/ci.yml ]]; then
            parsed="$workdir/parsed.json"
            if ! python3 "$GITHUB_WORKSPACE/institute-github/.github/scripts/generate-caller.py" \
                parse .github/workflows/ci.yml "$TARGET_REPOSITORY" > "$parsed"; then
              echo "::error::${TARGET_REPOSITORY}: existing ci.yml is not a shape the canonical generator models; routing to typed-exception review, not overwriting."
              echo "outcome=unknown-customization" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            parsed_layer=$(jq -r '.layer' "$parsed")
            if [[ "$parsed_layer" != "$LAYER" ]]; then
              echo "::error::${TARGET_REPOSITORY}: live caller resolves layer '${parsed_layer}' but dispatch said '${LAYER}'; stopping."
              echo "outcome=layer-mismatch" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            jq --arg repository "$TARGET_REPOSITORY" \
              'del(.same_org) | with_entries(select(.value != null)) + {repository: $repository}' \
              "$parsed" > "$spec"
          else
            jq -n \
              --arg repository "$TARGET_REPOSITORY" \
              --arg layer "$LAYER" \
              --arg platform_support "$PLATFORM_SUPPORT" \
              --arg enable_private_repos "$ENABLE_PRIVATE_REPOS" \
              --arg test_filter "$TEST_FILTER" \
              '{
                repository: $repository,
                layer: $layer
              }
              + (if $platform_support != "" then {platform_support: $platform_support} else {} end)
              + (if $enable_private_repos != "" then {enable_private_repos: ($enable_private_repos == "true")} else {} end)
              + (if $test_filter != "" then {test_filter: $test_filter} else {} end)
              ' > "$spec"
          fi

          python3 "$GITHUB_WORKSPACE/institute-github/.github/scripts/generate-caller.py" generate "$spec" \
            > /tmp/generated-ci.yml

          if cmp -s /tmp/generated-ci.yml .github/workflows/ci.yml 2>/dev/null; then
            echo "::notice::${TARGET_REPOSITORY} is already byte-identical to the canonical output; nothing to converge."
            echo "outcome=already-canonical" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$MODE" != "direct-push" ]]; then
            git checkout -b "$BRANCH"
          fi
          mkdir -p .github/workflows
          cp /tmp/generated-ci.yml .github/workflows/ci.yml
          git add .github/workflows/ci.yml

          deleted=()
          if [[ "$DELETE_STANDALONE" == "true" ]]; then
            for f in .github/workflows/swift-format.yml .github/workflows/swiftlint.yml; do
              if [[ -f "$f" ]]; then
                git rm -q "$f"
                deleted+=("$f")
              fi
            done
          fi

          commit_msg=$(printf 'ci: converge %s to the canonical terminal caller (TX6A, #276)\n\nGenerated by generate-caller.py (TX2, swift-institute/.github#282)\nfrom the typed spec {layer=%s}. Relates to swift-institute/.github#276.\n' \
            "$TARGET_REPOSITORY" "$LAYER")
          git -c user.name='swift-institute-bot' \
              -c user.email='swift-institute-bot@users.noreply.github.com' \
              commit -q -m "$commit_msg"

          if [[ "$MODE" == "direct-push" ]]; then
            # R28.1 terminal-wave path: the bot pushes the regenerated
            # caller straight to the default branch through the authorized
            # App bypass window. The rollback pre-image above was captured
            # BEFORE this push (R28.1's binding ordering). The landed blob
            # is read back through the API and byte-compared before this
            # run may report success.
            git push -q origin "HEAD:${DEFAULT_BRANCH}"
            head_sha=$(git rev-parse HEAD)
            gh api \
              "repos/${TARGET_REPOSITORY}/contents/.github/workflows/ci.yml?ref=${DEFAULT_BRANCH}" \
              --jq '.content' | tr -d '\n' | base64 -d > /tmp/landed-ci.yml
            if ! cmp -s /tmp/landed-ci.yml /tmp/generated-ci.yml; then
              echo "::error::${TARGET_REPOSITORY}: post-push readback of ci.yml does not match the generated bytes; investigate before trusting this convergence."
              echo "outcome=readback-mismatch" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            jq --arg head_sha "$head_sha" '. + {mode: "direct-push", head_sha: $head_sha}' \
              "$rollback" > "$rollback.tmp" && mv "$rollback.tmp" "$rollback"
            cp "$rollback" "$GITHUB_WORKSPACE/rollback/${TARGET_REPOSITORY//\//__}.json"
            echo "outcome=pushed" >> "$GITHUB_OUTPUT"
            {
              echo "## converge-caller (direct-push): ${TARGET_REPOSITORY}"
              echo "base: ${base_sha}"
              echo "head: ${head_sha}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git push -q --set-upstream origin "$BRANCH"
          head_sha=$(git rev-parse HEAD)

          deletions_note="No standalone format/lint workflow files were present to delete."
          if [[ ${#deleted[@]} -gt 0 ]]; then
            deletions_note="Deleted post-consolidation duplicate(s): ${deleted[*]}."
          fi

          # Same printf discipline as the rollback blob above: every line of
          # DATA lives entirely inside one printf format string so none of
          # this step's own YAML/editor indentation can leak into the PR
          # body (a heredoc or multi-line quoted literal here would put
          # 8+ leading spaces on every body line, which GitHub Markdown
          # renders as an unwanted code block).
          pr_body_file="$workdir/pr-body.md"
          {
            printf 'Task 5-02 (swift-institute/.github#276, swift-institute/.github#282):\n'
            printf 'converge `.github/workflows/ci.yml` in `%s` to the canonical\n' "$TARGET_REPOSITORY"
            printf 'output of `generate-caller.py` (Task 5-01, swift-institute/.github#282).\n'
            printf '%s\n' "$deletions_note"
            printf '\n'
            printf 'Rollback pre-image (base `%s`, everything this PR touches) was\n' "$base_sha"
            printf 'captured before this branch existed and is retained by the\n'
            printf 'dispatching orchestrator run.\n'
            printf '\n'
            printf '**Programme exemption from #113:** the principal expressly scoped\n'
            printf '`swift-institute/.github#113` out of this CI/CD refactor. Existing\n'
            printf 'Python/shell may be repaired or rewritten, and new executable logic\n'
            printf 'may use the narrowest correct owner. This PR is governed by the\n'
            printf 'definitive CI/CD implementation programme;\n'
            printf '`swift-institute/.github#246` remains the separate record that the\n'
            printf 'general no-new-debt rule is mechanically unenforced.\n'
            printf '\n'
            printf 'Relates to %s.\n' "$TASK_ISSUE"
            printf '\n'
            printf 'Programme document SHA-256\n'
            printf '`184db8ef230cd7e532f9aeb167a51508bc897f8221ec935cb5a776ca1eaf62ef`.\n'
          } > "$pr_body_file"
          pr_body=$(cat "$pr_body_file")

          pr_json=$(gh api "repos/${TARGET_REPOSITORY}/pulls" \
            --method POST \
            --field title="ci: converge to the canonical caller (Task 5-02)" \
            --field head="$BRANCH" \
            --field base="$DEFAULT_BRANCH" \
            --field body="$pr_body")
          pr_number=$(jq -r '.number' <<<"$pr_json")
          pr_url=$(jq -r '.html_url' <<<"$pr_json")

          # Append post-mutation facts (pr_number/pr_url/head_sha) to the
          # SAME rollback blob captured before the branch existed, via jq
          # rather than a python one-liner (no shell-quoting-into-python
          # risk from values that are already jq-safe arguments).
          jq --argjson pr_number "$pr_number" --arg pr_url "$pr_url" --arg head_sha "$head_sha" \
            '. + {pr_number: $pr_number, pr_url: $pr_url, head_sha: $head_sha}' \
            "$rollback" > "$rollback.tmp" && mv "$rollback.tmp" "$rollback"
          # `tr '/' '__'` is a real defect this task's own canary run
          # exposed: tr does single-CHARACTER-to-single-CHARACTER
          # translation, not substring replacement, so it silently
          # collapsed to a SINGLE underscore — while the artifact's own
          # NAME above (built via literal YAML `__` interpolation, not
          # tr) correctly used a double underscore, and the driver's
          # download_rollback_artifact() expects double-underscore too.
          # That mismatch made every successful dispatch's rollback file
          # undiscoverable by the driver, which is precisely backwards
          # for the one property (rollback pre-image capture) this whole
          # workflow exists to make non-negotiable. Bash parameter
          # expansion replaces ALL occurrences correctly.
          cp "$rollback" "$GITHUB_WORKSPACE/rollback/${TARGET_REPOSITORY//\//__}.json"

          echo "outcome=opened" >> "$GITHUB_OUTPUT"
          echo "pr-number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "pr-url=${pr_url}" >> "$GITHUB_OUTPUT"
          {
            echo "## converge-caller: ${TARGET_REPOSITORY}"
            echo "PR: ${pr_url}"
            echo "base: ${base_sha}"
            echo "head: ${head_sha}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rollback pre-image artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rollback-${{ steps.prep.outputs.owner }}__${{ steps.prep.outputs.name }}
          path: rollback/
          if-no-files-found: warn
          retention-days: 90
