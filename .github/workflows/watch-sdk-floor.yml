# watch-sdk-floor.yml — weekly watcher for the coupled swift-version bump
# preconditions (#67).
#
# The Embedded Wasm exit condition (Issues#65) is the L1 wrapper's
# `swift-version` input moving past 6.3.3. That input deliberately moves
# embedded-wasm-sdk, android-build, and static-linux-musl-build together with
# the universal matrix, so the bump is taken as one coupled three-job change —
# but nothing was watching for the moment it becomes possible. This workflow
# evaluates the three machine-checkable preconditions from the #67 plan:
#
#   (a) a `swift:X` container image exists on Docker Hub for a stable X >= 6.4;
#   (b) the swift.org releases.json record for X publishes all three SDK
#       platforms (wasm-sdk, android-sdk, static-sdk) with checksums;
#   (c) the fleet manifest floor (SWIFT_TOOLCHAIN_VERSION in
#       validate-package-structure.yml, tied to the floor per #61) is <= X.
#
# Comment-on-change discipline: it comments on #67 only when the computed
# state differs from the last state it posted (marker-tagged), not weekly.
# Retire this workflow when #67 closes; the run also no-ops once #67 is
# closed so a forgotten retirement cannot reopen a settled decision.
#
# [CI-104] canary: schedule-only workflow — after any change, exercise it with
# `gh workflow run watch-sdk-floor.yml --repo swift-institute/.github --ref main`.

name: watch-sdk-floor

# [CI-090] Standalone workflow (schedule + workflow_dispatch, no workflow_call)
# MUST declare a top-level permissions floor. Deny-all here; the watch job
# grants exactly what its steps need.
permissions: {}

on:
  schedule:
    - cron: '10 7 * * 1'   # weekly Monday 07:10 UTC (offset from the 06:00–07:00 cron family)
  workflow_dispatch: {}

env:
  TRACKING_ISSUE: '67'

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write  # comment on the tracking issue in this repository
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout swift-institute/.github (fleet-floor source of record)
        uses: actions/checkout@v7

      - name: Evaluate bump preconditions
        id: evaluate
        run: |
          set -euo pipefail

          # (c) source of record for the fleet manifest floor: the pinned
          # toolchain validate-package-structure.yml scans with (#61 tied it
          # to the floor). A missing pin is a broken instrument, not "ready".
          floor=$(grep -m1 "SWIFT_TOOLCHAIN_VERSION:" .github/workflows/validate-package-structure.yml \
            | sed -E "s/.*'([0-9.]+)'.*/\1/")
          [ -n "$floor" ] || { echo "::error::could not read the fleet floor pin"; exit 2; }
          echo "Fleet manifest floor: $floor"

          # Newest stable release at or past 6.4, from swift.org.
          curl -sf "https://www.swift.org/api/v1/install/releases.json" > /tmp/releases.json
          candidate=$(jq -r '.[].name' /tmp/releases.json | sort -V \
            | awk '$0 !~ /^6\.[0-3](\.|$)/ && $0 !~ /^[0-5]\./' | tail -n1)

          state="not-ready"
          detail="no stable swift.org release >= 6.4 (latest: $(jq -r '.[-1].name' /tmp/releases.json))"

          if [ -n "$candidate" ]; then
            # (b) all three SDK platforms published with checksums for X.
            missing=$(jq -r --arg v "$candidate" '
              ["wasm-sdk","android-sdk","static-sdk"]
              - [.[] | select(.name == $v) | .platforms[]
                 | select(.checksum != null and .checksum != "") | .platform]
              | .[]' /tmp/releases.json)

            # (a) swift:X container image on Docker Hub.
            container_ok=false
            if curl -sf -o /dev/null "https://hub.docker.com/v2/repositories/library/swift/tags/${candidate}"; then
              container_ok=true
            fi

            # (c) floor <= X.
            floor_ok=false
            if [ "$(printf '%s\n%s\n' "$floor" "$candidate" | sort -V | tail -n1)" = "$candidate" ]; then
              floor_ok=true
            fi

            if [ -z "$missing" ] && [ "$container_ok" = "true" ] && [ "$floor_ok" = "true" ]; then
              state="ready"
              detail="Swift ${candidate}: swift:${candidate} container published, wasm-sdk/android-sdk/static-sdk all published with checksums, fleet floor ${floor} <= ${candidate}"
            else
              detail="Swift ${candidate} exists but: container=${container_ok}, missing SDK platforms=[$(echo $missing | tr '\n' ' ')], floor-ok=${floor_ok} (floor ${floor})"
            fi
          fi

          echo "State: ${state} — ${detail}"
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          echo "detail=${detail}" >> "$GITHUB_OUTPUT"

      - name: Comment on the tracking issue only when the answer changes
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.evaluate.outputs.state }}
          DETAIL: ${{ steps.evaluate.outputs.detail }}
        run: |
          set -euo pipefail
          issue_state=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${TRACKING_ISSUE}" --jq .state)
          if [ "$issue_state" != "open" ]; then
            echo "#${TRACKING_ISSUE} is ${issue_state}; this watcher should be retired. Doing nothing."
            exit 0
          fi
          last=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${TRACKING_ISSUE}/comments" \
            --jq '[.[] | select(.body | contains("<!-- watch-sdk-floor:"))] | last | .body // ""' \
            | grep -oE '<!-- watch-sdk-floor: [a-z-]+ -->' | tail -n1 || true)
          current="<!-- watch-sdk-floor: ${STATE} -->"
          if [ "$last" = "$current" ]; then
            echo "State unchanged (${STATE}); not commenting."
            exit 0
          fi
          if [ "$STATE" = "ready" ]; then
            heading="## Bump preconditions are now MET"
            action="Execute plan step 4: raise the L1 wrapper's swift-version default as one coupled change; verify the Wasm, Android, and musl legs green in one full-tier dispatch."
          else
            heading="## Bump preconditions not met"
            action="No action; this watcher re-evaluates weekly and comments only on change."
          fi
          printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "$current" "$heading" "Automated weekly evaluation: ${DETAIL}." "$action" \
            > /tmp/comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${TRACKING_ISSUE}/comments" \
            -F body=@/tmp/comment.md --jq .html_url
