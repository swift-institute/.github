# lint-validator-fixtures.yml — run the validator fixture suite.
#
# The suite in .github/scripts/tests/ asserts that every validator still fires
# on the inputs it is supposed to reject: each fixture under fail/ MUST produce
# a finding, each under pass/ and edge/ MUST produce none, and run.sh exits
# nonzero if any of that stops being true. It also fails on a silent SKIP, so a
# fixture directory that no longer resolves to a registered validator is an
# error rather than quiet attrition.
#
# Until now nothing ran it. An untriggered test suite is the same category of
# artifact as an unproven gate: it looks like coverage and provides none. The
# repository learned this the expensive way from the retired skill-description
# gate, which reported success over a population it was violating wholesale
# because nothing ever proved it could fail.
#
# Triggers on any change to a validator, the shared helper library, the runner
# or a fixture, plus a weekly run so bit-rot from an external dependency (a
# Python or PyYAML bump on the runner image) surfaces on a schedule rather than
# on whichever unlucky pull request touches a validator next.
#
# Standalone workflow with no workflow_call trigger, so it carries a deny-all
# permissions floor and grants read on the job that needs it.

name: lint-validator-fixtures

permissions: {}

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/validate-*.py'
      - '.github/scripts/validate_lib.py'
      - '.github/scripts/detect-startup-failures.py'
      - '.github/scripts/check-lint-validators-weekly-parity.py'
      - '.github/scripts/check-scheduled-workflow-alert-parity.py'
      - '.github/scripts/.branch-pin-baseline'
      - '.github/scripts/tests/**'
      - '.github/workflows/lint-validator-fixtures.yml'
      # test-ci-ok-aggregate.py extracts its control-plane shell subjects from
      # swift-ci.yml, so an edit there is an edit to what this suite tests.
      - '.github/workflows/swift-ci.yml'
      # check-lint-validators-weekly-parity.py parses this file's report job;
      # an edit here is an edit to what that checker's own test asserts.
      - '.github/workflows/lint-validators-weekly.yml'
      # check-scheduled-workflow-alert-parity.py parses this file's watch
      # list and every workflow's on: block (#123); an edit to the alert
      # workflow or to any workflow's schedule: trigger is an edit to what
      # that checker's own test asserts.
      - '.github/workflows/alert-scheduled-workflow-failure.yml'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/scripts/validate-*.py'
      - '.github/scripts/validate_lib.py'
      - '.github/scripts/detect-startup-failures.py'
      - '.github/scripts/check-lint-validators-weekly-parity.py'
      - '.github/scripts/check-scheduled-workflow-alert-parity.py'
      - '.github/scripts/.branch-pin-baseline'
      - '.github/scripts/tests/**'
      - '.github/workflows/lint-validator-fixtures.yml'
      # test-ci-ok-aggregate.py extracts its control-plane shell subjects from
      # swift-ci.yml, so an edit there is an edit to what this suite tests.
      - '.github/workflows/swift-ci.yml'
      # check-lint-validators-weekly-parity.py parses this file's report job;
      # an edit here is an edit to what that checker's own test asserts.
      - '.github/workflows/lint-validators-weekly.yml'
      # check-scheduled-workflow-alert-parity.py parses this file's watch
      # list and every workflow's on: block (#123); an edit to the alert
      # workflow or to any workflow's schedule: trigger is an edit to what
      # that checker's own test asserts.
      - '.github/workflows/alert-scheduled-workflow-failure.yml'
      - '.github/workflows/*.yml'
  schedule:
    - cron: '0 7 * * 3'   # weekly Wednesday 07:00 UTC, clear of the Tuesday sweep
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # validate-swiftlint-witness-exemption.py's fixtures shell out to the real
  # swiftlint binary (the only faithful arbiter of the ICU/NSRegularExpression
  # regex behavior swift-institute/.github#219's exemption depends on).
  # Mirrors swift-ci.yml's SWIFTLINT_VERSION/SWIFTLINT_SHA256 pin; re-lock
  # both together on any version bump.
  SWIFTLINT_VERSION: "0.63.3"
  SWIFTLINT_SHA256: "26db741d43f2f2dc26c0cf16911100a3e186c3d1dbb59e55ad3ac87b0de4538f"

jobs:
  fixtures:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      # The validators exit 2 when PyYAML is absent, which the suite would
      # report as a fixture failure rather than as the environment defect it is.
      # Assert it up front so that distinction stays legible.
      - name: Assert PyYAML is available
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: Cache SwiftLint binary
        id: cache-swiftlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /usr/local/bin/swiftlint
          key: ${{ runner.os }}-swiftlint-${{ env.SWIFTLINT_VERSION }}

      # swiftlint-witness-exemption fixtures need the real binary; the
      # validator exits 2 (environment defect, not a finding) when it is
      # absent, which run.sh's fail/ fixtures would otherwise misreport as
      # the exemption predicate itself being broken.
      - name: Install SwiftLint ${{ env.SWIFTLINT_VERSION }}
        if: steps.cache-swiftlint.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${{ env.SWIFTLINT_VERSION }}/swiftlint_linux_amd64.zip"
          # [CI-082] verify against pinned SHA-256 before unpack/install. Fails
          # closed on digest mismatch (no `|| true` swallow).
          echo "${SWIFTLINT_SHA256}  /tmp/swiftlint.zip" | sha256sum -c -
          unzip -q /tmp/swiftlint.zip -d /tmp/swiftlint_extracted
          sudo mv /tmp/swiftlint_extracted/swiftlint /usr/local/bin/
          sudo chmod +x /usr/local/bin/swiftlint
          rm -rf /tmp/swiftlint.zip /tmp/swiftlint_extracted

      - name: Assert swiftlint is available
        shell: bash
        run: swiftlint --version

      - name: Run fixture suite
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/tests/run.sh | tee /tmp/fixtures.txt

      # swift-ci.yml's tier classifier, ci-ok aggregator, and configured
      # swift-linter path are shell embedded in a workflow, so run.sh's
      # repo-shaped fixtures cannot reach them. This suite extracts the shipped
      # step bodies and feeds them the shapes they must reject.
      - name: Run Swift CI shell controls
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tests/test-ci-ok-aggregate.py 2>&1 | tee /tmp/ci-ok-controls.txt

      # Task 1-01 (swift-institute/.github#276, #281): the machine-readable
      # verdict inventory (fixtures/verdict-inventory.json) and its
      # characterization suite — the population-completeness, outer/inner
      # aggregate, private-visibility, nested-test-execution, token-boundary,
      # cache-policy, required-check-context, and runner-wave coverage that
      # test-ci-ok-aggregate.py's classifier/aggregator/subject-resolution
      # extraction does not reach. The drift test regenerates the committed
      # inventory from THIS checkout's live swift-ci.yml (plus the vendored
      # wrapper snapshots under fixtures/wrappers/) and fails if it no
      # longer matches what is actually shipped.
      - name: Run CI verdict inventory controls
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tests/test-verdict-inventory.py 2>&1 | tee /tmp/verdict-inventory-controls.txt

      # The prebuilt-linter identity gate (#43 item 4) is likewise embedded
      # shell: these controls extract the shipped download step and prove it
      # falls back closed when the fetched manifest omits or mismatches the
      # engine identity.
      - name: Run ci-binaries identity controls
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tests/test-ci-binaries-identity.py 2>&1 | tee /tmp/ci-binaries-controls.txt

      # The shared system-dependency action must derive packages from every
      # package graph a Test step compiles, including Tests/Package.swift.
      # This hermetic positive control proves a nested dependency's uuid
      # declaration reaches apt rather than silently reporting no packages.
      - name: Run system-dependency derivation controls
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tests/test-install-system-deps.py 2>&1 | tee /tmp/system-deps-controls.txt

      # The secret-transport contract (#92 ruling, enforced per #108)
      # includes class-exactness of typed exemptions, which cannot be a
      # second repo-shaped fixture because an exemption keys the exact
      # repository name. These unit controls cover that surface; until
      # 2026-07-30 this suite existed but nothing ran it.
      - name: Run secret-transport contract controls
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tests/test-validate-thin-callers.py 2>&1 | tee /tmp/thin-caller-controls.txt

      # The file-naming validator's diagnostic-precedence rules operate on
      # synthetic module trees the unit suite builds itself, a surface run.sh's
      # repo-shaped fixtures do not exercise; until 2026-07-30 this suite
      # existed but nothing ran it.
      - name: Run file-naming validator controls
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tests/test-validate-file-naming.py 2>&1 | tee /tmp/file-naming-controls.txt

      # The startup-failure probe's prove-it-can-fail controls: the detector
      # must flag a synthetic startup_failure (function and exit code) and
      # stay green on clean data. startup-failure-probe-weekly.yml cites this
      # suite, but until 2026-07-30 nothing ran it.
      - name: Run startup-failure detector controls
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tests/test-detect-startup-failures.py 2>&1 | tee /tmp/startup-failure-controls.txt

      # The branch-pin guard's contract surface (baseline suppression, the
      # exit code the swift-ci fast-check keys on, --orgs-file resolution)
      # is not reachable through run.sh's repo-shaped fixtures.
      - name: Run branch-pin baseline controls
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tests/test-validate-branch-pins.py 2>&1 | tee /tmp/branch-pin-controls.txt

      # #117: lint-validators-weekly.yml's report job repeats its scan-leg
      # set across five hand-synchronized surfaces with nothing checking
      # they stay in correspondence with the scan-* jobs actually defined
      # in the workflow. This suite's own leg-removed positive controls
      # prove the checker can fail; its real-workflow assertion is the
      # fail-closed gate itself.
      - name: Run lint-validators-weekly report-surface drift controls
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tests/test-lint-validators-weekly-drift.py 2>&1 | tee /tmp/lint-validators-drift-controls.txt

      # #123: alert-scheduled-workflow-failure.yml's workflow_run trigger
      # requires an exact name list of scheduled workflows, which is a
      # second hand-maintained copy of "which workflows in this repository
      # run on a schedule" and can drift the same way the #120 incident
      # showed a scheduled workflow can fail silently. This suite's own
      # leg-removed/leg-added positive controls prove the checker can
      # fail; its real-watch-list assertion is the fail-closed gate itself.
      - name: Run scheduled-workflow-alert watch-list drift controls
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tests/test-scheduled-workflow-alert-drift.py 2>&1 | tee /tmp/scheduled-workflow-alert-drift-controls.txt

      # [CI-117] (swift-institute/.github#286, corrigendum §11.1, R4/R4a/R4b):
      # self-referential composite-action `uses:` sites must stay identity-
      # pinned to a full 40-hex SHA. The mandatory positive control includes
      # test_real_repository_workflows_are_clean, which runs the validator
      # against this checkout's own workflows and is what turns red if a
      # future PR reverts a converged site back to `@main`.
      - name: Run composite-action pin controls
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tests/test-validate-composite-action-pins.py 2>&1 | tee /tmp/composite-action-pin-controls.txt

      # The branch-pin baseline is a shrink-only ratchet: entries may be
      # pruned as repointings land, never added — a new branch pin is a
      # regression the guard exists to reject, not baseline material. An
      # absent prior version (initial seeding) and an unresolvable base
      # (schedule/dispatch on a shallow clone) are allowed through with a
      # notice; growth against a resolvable base fails.
      - name: Branch-pin baseline is shrink-only
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          file=.github/scripts/.branch-pin-baseline
          count() { { grep -v '^[[:space:]]*#' | grep -c -v '^[[:space:]]*$'; } || true; }
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --quiet --depth 1 origin "$BASE_REF"
            base="origin/${BASE_REF}"
          else
            git fetch --quiet --deepen 1 origin || true
            base="HEAD^"
          fi
          if ! git rev-parse --verify --quiet "$base" > /dev/null; then
            echo "::notice::No resolvable base revision for the shrink-only check on event ${EVENT_NAME}; skipping."
            exit 0
          fi
          new=0
          if [ -f "$file" ]; then new=$(count < "$file"); fi
          if old_content=$(git show "${base}:${file}" 2>/dev/null); then
            old=$(printf '%s\n' "$old_content" | count)
          else
            echo "::notice::${file} absent at ${base} (initial seeding); shrink-only enforcement starts at the next change."
            exit 0
          fi
          echo "branch-pin baseline entries: ${old} at base, ${new} now"
          if [ "$new" -gt "$old" ]; then
            echo "::error::${file} grew from ${old} to ${new} entries. The baseline is shrink-only: a new branch-pinned Institute dependency is a regression the guard must reject, not a baseline addition."
            exit 1
          fi

      - name: Step summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Validator fixture suite"
            echo
            echo "Each \`fail/\` fixture is a positive control: it MUST produce a"
            echo "finding. A validator that stops firing turns its own fixture red."
            echo
            echo '```'
            tail -n 40 /tmp/fixtures.txt 2>/dev/null || echo "(suite produced no output)"
            echo '```'
            echo
            echo "### Swift CI shell controls"
            echo
            echo '```'
            tail -n 30 /tmp/ci-ok-controls.txt 2>/dev/null || echo "(controls produced no output)"
            echo '```'
            echo
            echo "### CI verdict inventory controls"
            echo
            echo '```'
            tail -n 30 /tmp/verdict-inventory-controls.txt 2>/dev/null || echo "(controls produced no output)"
            echo '```'
            echo
            echo "### Branch-pin baseline controls"
            echo
            echo '```'
            tail -n 15 /tmp/branch-pin-controls.txt 2>/dev/null || echo "(controls produced no output)"
            echo '```'
            echo
            echo "### File-naming validator controls"
            echo
            echo '```'
            tail -n 15 /tmp/file-naming-controls.txt 2>/dev/null || echo "(controls produced no output)"
            echo '```'
            echo
            echo "### Startup-failure detector controls"
            echo
            echo '```'
            tail -n 15 /tmp/startup-failure-controls.txt 2>/dev/null || echo "(controls produced no output)"
            echo '```'
            echo
            echo "### lint-validators-weekly report-surface drift controls"
            echo
            echo '```'
            tail -n 20 /tmp/lint-validators-drift-controls.txt 2>/dev/null || echo "(controls produced no output)"
            echo '```'
            echo
            echo "### scheduled-workflow-alert watch-list drift controls"
            echo
            echo '```'
            tail -n 20 /tmp/scheduled-workflow-alert-drift-controls.txt 2>/dev/null || echo "(controls produced no output)"
            echo '```'
            echo
            echo "### composite-action pin controls"
            echo
            echo '```'
            tail -n 20 /tmp/composite-action-pin-controls.txt 2>/dev/null || echo "(controls produced no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
