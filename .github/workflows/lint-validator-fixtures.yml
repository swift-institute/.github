# lint-validator-fixtures.yml — run the validator fixture suite.
#
# The suite in .github/scripts/tests/ asserts that every validator still fires
# on the inputs it is supposed to reject: each fixture under fail/ MUST produce
# a finding, each under pass/ and edge/ MUST produce none, and the gate exits
# nonzero if any of that stops being true. It also fails on a silent SKIP, so a
# fixture directory that no longer resolves to a registered validator is an
# error rather than quiet attrition.
#
# Until now nothing ran it. An untriggered test suite is the same category of
# artifact as an unproven gate: it looks like coverage and provides none. The
# repository learned this the expensive way from the retired skill-description
# gate, which reported success over a population it was violating wholesale
# because nothing ever proved it could fail.
#
# Triggers on any change to a validator, the shared helper library, the runner
# or a fixture, plus a weekly run so bit-rot from an external dependency (a
# Python or PyYAML bump on the runner image) surfaces on a schedule rather than
# on whichever unlucky pull request touches a validator next.
#
# Standalone workflow with no workflow_call trigger, so it carries a deny-all
# permissions floor and grants read on the job that needs it.

name: lint-validator-fixtures

permissions: {}

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/validate-*.py'
      - '.github/scripts/validate_lib.py'
      - '.github/scripts/.branch-pin-baseline'
      - '.github/scripts/tests/**'
      - '.github/workflows/lint-validator-fixtures.yml'
      # the embedded-shell controls and the Swift validators live here.
      - 'Tools/institute-ci/**'
      # the system-dependency control extracts the shipped action step.
      - '.github/actions/install-system-deps/action.yml'
      # the embedded-shell controls extract their subjects from
      # swift-ci.yml, so an edit there is an edit to what this suite tests.
      - '.github/workflows/swift-ci.yml'
      # CI.Validation.Drift.LintValidatorsWeekly parses this file's report
      # job; an edit here is an edit to what that checker's own test asserts.
      - '.github/workflows/lint-validators-weekly.yml'
      # CI.Validation.Drift.ScheduledWorkflowAlert parses this file's watch
      # list and every workflow's on: block (#123); an edit to the alert
      # workflow or to any workflow's schedule: trigger is an edit to what
      # that checker's own test asserts.
      - '.github/workflows/alert-scheduled-workflow-failure.yml'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/scripts/validate-*.py'
      - '.github/scripts/validate_lib.py'
      - '.github/scripts/.branch-pin-baseline'
      - '.github/scripts/tests/**'
      - '.github/workflows/lint-validator-fixtures.yml'
      # the embedded-shell controls and the Swift validators live here.
      - 'Tools/institute-ci/**'
      # the system-dependency control extracts the shipped action step.
      - '.github/actions/install-system-deps/action.yml'
      # the embedded-shell controls extract their subjects from
      # swift-ci.yml, so an edit there is an edit to what this suite tests.
      - '.github/workflows/swift-ci.yml'
      # CI.Validation.Drift.LintValidatorsWeekly parses this file's report
      # job; an edit here is an edit to what that checker's own test asserts.
      - '.github/workflows/lint-validators-weekly.yml'
      # CI.Validation.Drift.ScheduledWorkflowAlert parses this file's watch
      # list and every workflow's on: block (#123); an edit to the alert
      # workflow or to any workflow's schedule: trigger is an edit to what
      # that checker's own test asserts.
      - '.github/workflows/alert-scheduled-workflow-failure.yml'
      - '.github/workflows/*.yml'
  schedule:
    - cron: '0 7 * * 3'   # weekly Wednesday 07:00 UTC, clear of the Tuesday sweep
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # validate-swiftlint-witness-exemption.py's fixtures shell out to the real
  # swiftlint binary (the only faithful arbiter of the ICU/NSRegularExpression
  # regex behavior swift-institute/.github#219's exemption depends on).
  # Mirrors swift-ci.yml's SWIFTLINT_VERSION/SWIFTLINT_SHA256 pin; re-lock
  # both together on any version bump.
  SWIFTLINT_VERSION: "0.63.3"
  SWIFTLINT_SHA256: "26db741d43f2f2dc26c0cf16911100a3e186c3d1dbb59e55ad3ac87b0de4538f"

jobs:
  fixtures:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    # 60, up from 10: the F12 cold bootstrap (a Workspace source build of
    # institute-ci) runs in this job on a cache miss and takes ~30 minutes;
    # warm-cache runs restore in seconds. Same allowance swift-ci.yml's plan
    # job already carries. Measured the hard way — the first canary
    # (run 31164499832) was killed at exactly 10 minutes mid-bootstrap.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      # The validators exit 2 when PyYAML is absent, which the suite would
      # report as a fixture failure rather than as the environment defect it is.
      # Assert it up front so that distinction stays legible.
      - name: Assert PyYAML is available
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: Cache SwiftLint binary
        id: cache-swiftlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /usr/local/bin/swiftlint
          key: ${{ runner.os }}-swiftlint-${{ env.SWIFTLINT_VERSION }}

      # swiftlint-witness-exemption fixtures need the real binary; the
      # validator exits 2 (environment defect, not a finding) when it is
      # absent, which the fail/ fixtures would otherwise misreport as
      # the exemption predicate itself being broken.
      - name: Install SwiftLint ${{ env.SWIFTLINT_VERSION }}
        if: steps.cache-swiftlint.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${{ env.SWIFTLINT_VERSION }}/swiftlint_linux_amd64.zip"
          # [CI-082] verify against pinned SHA-256 before unpack/install. Fails
          # closed on digest mismatch (no `|| true` swallow).
          echo "${SWIFTLINT_SHA256}  /tmp/swiftlint.zip" | sha256sum -c -
          unzip -q /tmp/swiftlint.zip -d /tmp/swiftlint_extracted
          sudo mv /tmp/swiftlint_extracted/swiftlint /usr/local/bin/
          sudo chmod +x /usr/local/bin/swiftlint
          rm -rf /tmp/swiftlint.zip /tmp/swiftlint_extracted

      - name: Assert swiftlint is available
        shell: bash
        run: swiftlint --version

      - name: Provision the Institute CI binary
        id: institute-ci
        uses: ./.github/actions/institute-ci
        with:
          sources-root: ${{ github.workspace }}

      # F16: the corpus gate is `institute-ci validate-fixtures` — C0's
      # Swift owner of the retired `tests/run.sh`. `--scripts` arms the
      # transitional fallback, so a rule directory whose validator is not
      # ported yet is still exercised through its retired script and a
      # directory NEITHER engine owns fails the run. That is the invariant
      # run.sh enforced through its SKIP count, and it is why run.sh could
      # not survive the first Python deletion: a deleted script dangles its
      # dispatch arm, and removing the arm turns the directory into a
      # counted skip.
      - name: Run fixture suite
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.institute-ci.outputs.binary }}" validate-fixtures \
            --corpus .github/scripts/tests/fixtures \
            --scripts .github/scripts | tee /tmp/fixtures.txt

      # The provisioning action above installs a toolchain only on a
      # cold cache; the embedded-shell suites are run with `swift test`,
      # which needs one on every run.
      - name: Set up Swift
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: '6.3'

      # swift-ci.yml's ci-ok aggregator, subject resolver and configured
      # swift-linter path are shell embedded in a workflow, so the corpus'
      # repo-shaped fixtures cannot reach them; the shared system-dependency
      # action must likewise derive packages from every graph a Test step
      # compiles, including Tests/Package.swift. Both suites extract the
      # shipped step bodies by name and run them against hermetic shims.
      - name: Run embedded-shell controls
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Tools/institute-ci \
            --filter 'ControlPlaneShellTests|SystemDependencyDerivationTests' \
            2>&1 | tee /tmp/embedded-shell-controls.txt

      # The CI verdict inventory (Task 1-01, #276/#281) moved to Swift in
      # F16 class C7: `CI.Inventory` in Tools/institute-ci, with its
      # drift and live-run gates as `CI Inventory Tests`. It is verified
      # by the tools-tests.yml gate (PS-3), which runs the full
      # institute-ci suite through `workspace package test`, not by a
      # step here, so a stale inventory fails the package rather than
      # one workflow job.


      # The prebuilt-linter identity gate (#43 item 4) moved to Swift in F16
      # class C6 as `Institute.Receipt.Bootstrap.Installer` with its controls
      # as `Institute Receipt Tests`. It is verified by `workspace package
      # test`, not by a step here.

      # The secret-transport contract (#92 ruling, enforced per #108),
      # including class-exactness of typed exemptions, moved to Swift in
      # F16 class C3 as `CI.Validation.ThinCallers` with its controls as
      # `CI.Validation.ThinCallers Tests`. It is verified by the
      # tools-tests.yml gate (PS-3), not by a step here; the Python suite
      # was retired in #446.

      # Task 4-01 (swift-institute/.github#276, #284): the TEMPORARY
      # The file-naming validator's diagnostic-precedence rules operate on
      # synthetic module trees the unit suite builds itself, a surface the corpus'
      # repo-shaped fixtures do not exercise; until 2026-07-30 this suite
      # existed but nothing ran it.
      - name: Run file-naming validator controls
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tests/test-validate-file-naming.py 2>&1 | tee /tmp/file-naming-controls.txt

      # The startup-failure detector moved to Swift in F16 class C6 as
      # `Institute.Receipt.Run.Startup` (the `startup-failures` face
      # startup-failure-probe-weekly.yml now invokes), with its
      # prove-it-can-fail controls as `Institute Receipt Tests`.

      # The branch-pin guard's contract surface (baseline suppression, the
      # exit code the swift-ci fast-check keys on, --orgs-file resolution)
      # is covered by `CI.Validation.BranchPins Tests`, the F16 class C2 port
      # of these controls. validate-branch-pins.py itself remains live as the
      # permanent guard exception; only its Python controls were retired.

      # #117: lint-validators-weekly.yml's report job repeats its scan-leg
      # set across five hand-synchronized surfaces with nothing checking
      # they stay in correspondence with the scan-* jobs actually defined
      # in the workflow. This suite's own leg-removed positive controls
      # prove the checker can fail; its real-workflow assertion is the
      # fail-closed gate itself.
      # Owner: `CI.Validation.Drift.LintValidatorsWeekly` (F16 class C5),
      # controls as `CI.Validation.Drift Tests`.

      # #123: alert-scheduled-workflow-failure.yml's workflow_run trigger
      # requires an exact name list of scheduled workflows, which is a
      # second hand-maintained copy of "which workflows in this repository
      # run on a schedule" and can drift the same way the #120 incident
      # showed a scheduled workflow can fail silently. This suite's own
      # leg-removed/leg-added positive controls prove the checker can
      # fail; its real-watch-list assertion is the fail-closed gate itself.
      # Owner: `CI.Validation.Drift.ScheduledWorkflowAlert` (F16 class C5),
      # controls as `CI.Validation.Drift Tests`.

      # [CI-117] (swift-institute/.github#286, corrigendum §11.1, R4/R4a/R4b):
      # self-referential composite-action `uses:` sites must stay identity-
      # pinned to a full 40-hex SHA. The mandatory positive control includes
      # test_real_repository_workflows_are_clean, which runs the validator
      # against this checkout's own workflows and is what turns red if a
      # future PR reverts a converged site back to `@main`.
      # Owner: `CI.Validation.CompositeActionPins` (F16 class C2), controls
      # as `CI.Validation.CompositeActionPins Tests`.

      # The branch-pin baseline is a shrink-only ratchet: entries may be
      # pruned as repointings land, never added — a new branch pin is a
      # regression the guard exists to reject, not baseline material. An
      # absent prior version (initial seeding) and an unresolvable base
      # (schedule/dispatch on a shallow clone) are allowed through with a
      # notice; growth against a resolvable base fails.
      - name: Branch-pin baseline is shrink-only
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          file=.github/scripts/.branch-pin-baseline
          count() { { grep -v '^[[:space:]]*#' | grep -c -v '^[[:space:]]*$'; } || true; }
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --quiet --depth 1 origin "$BASE_REF"
            base="origin/${BASE_REF}"
          else
            git fetch --quiet --deepen 1 origin || true
            base="HEAD^"
          fi
          if ! git rev-parse --verify --quiet "$base" > /dev/null; then
            echo "::notice::No resolvable base revision for the shrink-only check on event ${EVENT_NAME}; skipping."
            exit 0
          fi
          new=0
          if [ -f "$file" ]; then new=$(count < "$file"); fi
          if old_content=$(git show "${base}:${file}" 2>/dev/null); then
            old=$(printf '%s\n' "$old_content" | count)
          else
            echo "::notice::${file} absent at ${base} (initial seeding); shrink-only enforcement starts at the next change."
            exit 0
          fi
          echo "branch-pin baseline entries: ${old} at base, ${new} now"
          if [ "$new" -gt "$old" ]; then
            echo "::error::${file} grew from ${old} to ${new} entries. The baseline is shrink-only: a new branch-pinned Institute dependency is a regression the guard must reject, not a baseline addition."
            exit 1
          fi

      - name: Step summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Validator fixture suite"
            echo
            echo "Each \`fail/\` fixture is a positive control: it MUST produce a"
            echo "finding. A validator that stops firing turns its own fixture red."
            echo
            echo '```'
            tail -n 40 /tmp/fixtures.txt 2>/dev/null || echo "(suite produced no output)"
            echo '```'
            echo
            echo "### Embedded-shell controls"
            echo
            echo '```'
            tail -n 30 /tmp/embedded-shell-controls.txt 2>/dev/null || echo "(controls produced no output)"
            echo '```'
            echo
            echo "### Secret-transport contract controls"
            echo
            echo '```'
            tail -n 15 /tmp/thin-caller-controls.txt 2>/dev/null || echo "(controls produced no output)"
            echo '```'
            echo
            echo "### File-naming validator controls"
            echo
            echo '```'
            tail -n 15 /tmp/file-naming-controls.txt 2>/dev/null || echo "(controls produced no output)"
            echo '```'
            echo
            echo "### integrated-docs compatibility controls"
            echo
            echo '```'
            tail -n 20 /tmp/integrated-docs-compat-controls.txt 2>/dev/null || echo "(controls produced no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
