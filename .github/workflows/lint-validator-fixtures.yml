# lint-validator-fixtures.yml — run the validator fixture suite.
#
# The suite in .github/scripts/tests/ asserts that every validator still fires
# on the inputs it is supposed to reject: each fixture under fail/ MUST produce
# a finding, each under pass/ and edge/ MUST produce none, and run.sh exits
# nonzero if any of that stops being true. It also fails on a silent SKIP, so a
# fixture directory that no longer resolves to a registered validator is an
# error rather than quiet attrition.
#
# Until now nothing ran it. An untriggered test suite is the same category of
# artifact as an unproven gate: it looks like coverage and provides none. The
# repository learned this the expensive way from the retired skill-description
# gate, which reported success over a population it was violating wholesale
# because nothing ever proved it could fail.
#
# Triggers on any change to a validator, the shared helper library, the runner
# or a fixture, plus a weekly run so bit-rot from an external dependency (a
# Python or PyYAML bump on the runner image) surfaces on a schedule rather than
# on whichever unlucky pull request touches a validator next.
#
# Standalone workflow with no workflow_call trigger, so it carries a deny-all
# permissions floor and grants read on the job that needs it.

name: lint-validator-fixtures

permissions: {}

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/validate-*.py'
      - '.github/scripts/validate_lib.py'
      - '.github/scripts/.branch-pin-baseline'
      - '.github/scripts/tests/**'
      - '.github/workflows/lint-validator-fixtures.yml'
      # test-ci-ok-aggregate.py extracts its control-plane shell subjects from
      # swift-ci.yml, so an edit there is an edit to what this suite tests.
      - '.github/workflows/swift-ci.yml'
  pull_request:
    paths:
      - '.github/scripts/validate-*.py'
      - '.github/scripts/validate_lib.py'
      - '.github/scripts/.branch-pin-baseline'
      - '.github/scripts/tests/**'
      - '.github/workflows/lint-validator-fixtures.yml'
      # test-ci-ok-aggregate.py extracts its control-plane shell subjects from
      # swift-ci.yml, so an edit there is an edit to what this suite tests.
      - '.github/workflows/swift-ci.yml'
  schedule:
    - cron: '0 7 * * 3'   # weekly Wednesday 07:00 UTC, clear of the Tuesday sweep
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      # The validators exit 2 when PyYAML is absent, which the suite would
      # report as a fixture failure rather than as the environment defect it is.
      # Assert it up front so that distinction stays legible.
      - name: Assert PyYAML is available
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: Run fixture suite
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/tests/run.sh | tee /tmp/fixtures.txt

      # swift-ci.yml's tier classifier, ci-ok aggregator, and configured
      # swift-linter path are shell embedded in a workflow, so run.sh's
      # repo-shaped fixtures cannot reach them. This suite extracts the shipped
      # step bodies and feeds them the shapes they must reject.
      - name: Run Swift CI shell controls
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tests/test-ci-ok-aggregate.py 2>&1 | tee /tmp/ci-ok-controls.txt

      # The prebuilt-linter identity gate (#43 item 4) is likewise embedded
      # shell: these controls extract the shipped download step and prove it
      # falls back closed when the fetched manifest omits or mismatches the
      # engine identity.
      - name: Run ci-binaries identity controls
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tests/test-ci-binaries-identity.py 2>&1 | tee /tmp/ci-binaries-controls.txt

      # The branch-pin guard's contract surface (baseline suppression, the
      # exit code the swift-ci fast-check keys on, --orgs-file resolution)
      # is not reachable through run.sh's repo-shaped fixtures.
      - name: Run branch-pin baseline controls
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tests/test-validate-branch-pins.py 2>&1 | tee /tmp/branch-pin-controls.txt

      # The branch-pin baseline is a shrink-only ratchet: entries may be
      # pruned as repointings land, never added — a new branch pin is a
      # regression the guard exists to reject, not baseline material. An
      # absent prior version (initial seeding) and an unresolvable base
      # (schedule/dispatch on a shallow clone) are allowed through with a
      # notice; growth against a resolvable base fails.
      - name: Branch-pin baseline is shrink-only
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          file=.github/scripts/.branch-pin-baseline
          count() { { grep -v '^[[:space:]]*#' | grep -c -v '^[[:space:]]*$'; } || true; }
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --quiet --depth 1 origin "$BASE_REF"
            base="origin/${BASE_REF}"
          else
            git fetch --quiet --deepen 1 origin || true
            base="HEAD^"
          fi
          if ! git rev-parse --verify --quiet "$base" > /dev/null; then
            echo "::notice::No resolvable base revision for the shrink-only check on event ${EVENT_NAME}; skipping."
            exit 0
          fi
          new=0
          if [ -f "$file" ]; then new=$(count < "$file"); fi
          if old_content=$(git show "${base}:${file}" 2>/dev/null); then
            old=$(printf '%s\n' "$old_content" | count)
          else
            echo "::notice::${file} absent at ${base} (initial seeding); shrink-only enforcement starts at the next change."
            exit 0
          fi
          echo "branch-pin baseline entries: ${old} at base, ${new} now"
          if [ "$new" -gt "$old" ]; then
            echo "::error::${file} grew from ${old} to ${new} entries. The baseline is shrink-only: a new branch-pinned Institute dependency is a regression the guard must reject, not a baseline addition."
            exit 1
          fi

      - name: Step summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Validator fixture suite"
            echo
            echo "Each \`fail/\` fixture is a positive control: it MUST produce a"
            echo "finding. A validator that stops firing turns its own fixture red."
            echo
            echo '```'
            tail -n 40 /tmp/fixtures.txt 2>/dev/null || echo "(suite produced no output)"
            echo '```'
            echo
            echo "### Swift CI shell controls"
            echo
            echo '```'
            tail -n 30 /tmp/ci-ok-controls.txt 2>/dev/null || echo "(controls produced no output)"
            echo '```'
            echo
            echo "### Branch-pin baseline controls"
            echo
            echo '```'
            tail -n 15 /tmp/branch-pin-controls.txt 2>/dev/null || echo "(controls produced no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
