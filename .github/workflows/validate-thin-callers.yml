# validate-thin-callers.yml — verify per-package CI workflows are thin callers.
#
# Reusable workflow. For the given `org` (or single `repo`), enumerates
# non-archived repos, clones each (shallow), and runs
# `.github/scripts/validate-thin-callers.py` against the cloned tree.
#
# Pilot 7 of `/promote-rule` (2026-05-14); extended at pilot 17 (2026-05-14)
# with [CI-030] @main-pin and [CI-059] secrets:inherit checks compose-in-script.
#
# Rules checked: [GH-REPO-074], [CI-030], [CI-059]. See companion script for details.

name: validate-thin-callers

on:
  workflow_call:
    inputs:
      repo:
        description: 'Owner/name of a single repo to scan.'
        type: string
        required: false
        default: ''
      org:
        description: 'Org to sweep (ignored if repo is set).'
        type: string
        required: false
        default: ''
      dry-run:
        description: 'Run checks but do not fail the job on findings.'
        type: boolean
        required: false
        default: false
      visibility:
        description: 'Filter by visibility (public | private | internal | all).'
        type: string
        required: false
        default: 'public'
    outputs:
      total-violations:
        description: 'Total count of individual violations.'
        value: ${{ jobs.scan.outputs.total-violations }}

  workflow_dispatch:
    inputs:
      repo:
        description: 'Owner/name of a single repo (optional).'
        type: string
        required: false
      org:
        description: 'Org to sweep (optional; ignored if repo is set).'
        type: string
        required: false
      dry-run:
        description: 'Run checks but do not fail the job on findings.'
        type: boolean
        required: false
        default: false
      visibility:
        description: 'Filter by visibility (public | private | internal | all).'
        type: string
        required: false
        default: 'public'

jobs:
  scan:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      total-violations: ${{ steps.aggregate.outputs.total-violations }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Mint installation token (swift-institute-bot)
        id: mint-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ inputs.org || github.repository_owner }}

      - name: Checkout swift-institute/.github (validator)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          path: institute-github
          ref: ${{ job.workflow_sha }}

      - name: Resolve target repos
        id: targets
        env:
          GH_TOKEN: ${{ steps.mint-token.outputs.token }}
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_ORG: ${{ inputs.org }}
          INPUT_VISIBILITY: ${{ inputs.visibility }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_REPO" ]; then
            echo "$INPUT_REPO" > /tmp/targets.txt
          else
            : "${INPUT_ORG:?org or repo input required}"
            gh repo list "$INPUT_ORG" --no-archived --limit 1000 \
              --visibility "$INPUT_VISIBILITY" \
              --json nameWithOwner --jq '.[].nameWithOwner' > /tmp/targets.txt
          fi

      - name: Provision the Institute CI binary
        id: institute-ci
        uses: ./institute-github/.github/actions/institute-ci
        with:
          sources-root: ${{ github.workspace }}/institute-github

      - name: Run thin-callers validation
        id: check
        env:
          GH_TOKEN: ${{ steps.mint-token.outputs.token }}
          INSTITUTE_CI: ${{ steps.institute-ci.outputs.binary }}
          INSTITUTE_CI_SUPPORT_ROOT: ${{ github.workspace }}/institute-github
          # The registry key. See validate-base.yml's scan loop: exit 3
          # means no Swift owner, and only that code falls back to python3.
          VALIDATOR_ID: .github/scripts/validate-thin-callers.py
          VALIDATOR: ${{ github.workspace }}/institute-github/.github/scripts/validate-thin-callers.py
        run: |
          set -euo pipefail
          : > /tmp/findings.tsv
          : > /tmp/swift.tsv
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            workdir=$(mktemp -d)
            (
              cd "$workdir"
              if ! gh repo clone "$repo" . -- --depth 1 --quiet 2>/dev/null; then
                echo "$repo	clone-failed	-" >> /tmp/findings.tsv
                exit 0
              fi
              # The old `|| true` swallowed a validator crash and left no
              # trace, so an interpreter error read as "no findings". Record
              # the crash as a sentinel row and let Aggregate fail on it,
              # matching validate-base.yml.
              rc=0
              "$INSTITUTE_CI" validate --script "$VALIDATOR_ID" \
                --repository "$repo" --root "$workdir" >> /tmp/swift.tsv || rc=$?
              if [ "$rc" -eq 3 ]; then
                : > /tmp/swift.tsv
                rc=0
                python3 "$VALIDATOR" "$repo" "$workdir" >> /tmp/findings.tsv || rc=$?
              else
                cat /tmp/swift.tsv >> /tmp/findings.tsv
                : > /tmp/swift.tsv
              fi
              if [ "$rc" -ne 0 ]; then
                echo "$repo	validator-crashed	-" >> /tmp/findings.tsv
              fi
            )
            rm -rf "$workdir"
          done < /tmp/targets.txt

      - name: Aggregate findings
        id: aggregate
        run: |
          set -euo pipefail
          # RULE_RE must list EVERY rule validate-thin-callers.py can emit.
          # It counted GH-REPO-074 alone until 2026-07-28, while the validator
          # has emitted CI-030 and CI-059 since Pilot 17 — so every CI-030 and
          # CI-059 finding was computed, discarded, and left out of the table
          # too. Measured across the 473 public non-archived repos that day:
          # 9 live CI-059 findings, of which the ones in swift-standards and
          # swift-ieee were the whole of those orgs' findings, so both legs
          # reported success while carrying real violations.
          RULE_RE='^(GH-REPO-074|CI-030|CI-059)$'
          violations=$(awk -F'\t' -v re="$RULE_RE" '$2 ~ re' /tmp/findings.tsv | wc -l | tr -d ' ')
          clone_failures=$(awk -F'\t' '$2 == "clone-failed"' /tmp/findings.tsv | wc -l | tr -d ' ')
          validator_crashes=$(awk -F'\t' '$2 == "validator-crashed"' /tmp/findings.tsv | wc -l | tr -d ' ')
          echo "total-violations=$violations" >> "$GITHUB_OUTPUT"
          {
            echo "## validate-thin-callers findings"
            echo "Total violations: $violations"
            echo
            if [ "$clone_failures" -gt 0 ] || [ "$validator_crashes" -gt 0 ]; then
              echo "> [!CAUTION]"
              echo "> ${clone_failures} target(s) failed to clone and ${validator_crashes} crashed the validator — those repos were NOT scanned, so the count above is a floor, not a total. Treat this run as failed."
              echo
              awk -F'\t' '$2 == "clone-failed" || $2 == "validator-crashed" { printf("- %s: `%s`\n", $2, $1) }' /tmp/findings.tsv
              echo
            fi
            if [ "$violations" -gt 0 ]; then
              echo "| Repo | Rule | Message |"
              echo "|---|---|---|"
              awk -F'\t' -v re="$RULE_RE" '$2 ~ re {
                gsub(/\|/, "\\|", $3);
                printf("| `%s` | `%s` | %s |\n", $1, $2, $3)
              }' /tmp/findings.tsv
            fi
          } > "$GITHUB_STEP_SUMMARY"
          # Also to stdout. The block above is redirected to the step summary,
          # which is invisible from the run list, from the API, and from a
          # notification — so a leg that failed said nothing anyone could read
          # without opening it. This line is what makes the cause legible.
          echo "validate-thin-callers: ${violations} violation(s), ${clone_failures} clone failure(s), ${validator_crashes} validator crash(es)"
          if [ "$clone_failures" -gt 0 ] || [ "$validator_crashes" -gt 0 ]; then
            echo "::error::${clone_failures} clone failure(s) and ${validator_crashes} validator crash(es) — those targets were never scanned, so a green result here would be false."
          fi
          if { [ "$violations" -gt 0 ] || [ "$clone_failures" -gt 0 ] || [ "$validator_crashes" -gt 0 ]; } \
             && [ "${{ inputs.dry-run }}" != "true" ]; then
            exit 1
          fi
