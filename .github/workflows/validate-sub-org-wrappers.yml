# validate-sub-org-wrappers.yml — verify [CI-004b] sub-org wrapper absence.
#
# Pilot 28 of `/promote-rule` (2026-05-14).
#
# Peer-institute consumption (#212): `manifest-repository` swaps the org
# manifest feeding the sub-org matrix, and the declared workflow_call
# secrets let a cross-org caller supply its own App credentials
# (`secrets: inherit` does not cross the org boundary). Defaults are
# inert: absent both, behavior is identical to pre-#212 and
# swift-institute's own automation scope is unchanged. The family-root
# exclusion filter below names swift-institute orgs; records in a peer
# manifest simply pass it, so every peer org is scanned as a sub-org.
# See the PEER-INSTITUTE CONSUMPTION section in
# actions/read-orgs/action.yml.

name: validate-sub-org-wrappers

on:
  schedule:
    - cron: '0 5 * * 1'   # Mondays 05:00 UTC (before other weekly orchestrators)
  workflow_call:
    inputs:
      repo:
        type: string
        required: false
        default: ''
      dry-run:
        type: boolean
        required: false
        default: false
      manifest-repository:
        description: 'Peer-institute owner/repo whose root orgs.yaml replaces the canonical org manifest (#212). Empty default: the canonical swift-institute manifest.'
        type: string
        required: false
        default: ''
    secrets:
      SWIFT_INSTITUTE_BOT_APP_CLIENT_ID:
        required: false
        description: |
          GitHub App client ID used to mint per-org installation tokens.
          Same-org callers pass it via `secrets: inherit`; a peer
          institute maps its own App's client ID onto this slot (#212).
      SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY:
        required: false
        description: |
          GitHub App private key; counterpart of
          SWIFT_INSTITUTE_BOT_APP_CLIENT_ID. Same inherit/peer-mapping
          split as the client ID (#212).
    outputs:
      total-violations:
        value: ${{ jobs.scan.outputs.total-violations }}
  workflow_dispatch:
    inputs:
      repo:
        type: string
        required: false
      dry-run:
        type: boolean
        required: false
        default: false
      manifest-repository:
        description: 'Peer-institute owner/repo whose root orgs.yaml replaces the canonical org manifest (#212, optional).'
        type: string
        required: false

# Top-level `permissions:` OMITTED per [CI-090] — this is a combined
# (workflow_call + schedule + workflow_dispatch) workflow, treated as
# reusable. Per-job `permissions:` below provides the per-job floor.
# The schedule path inherits the same per-job grant.

jobs:
  # Sub-org population from the canonical read-orgs manifest (#43 item 7):
  # every active org EXCEPT the three family roots and the meta org, which
  # own (or host) the layer wrappers this rule says sub-orgs must not
  # carry. A new sub-org propagates here without editing this workflow.
  config:
    if: ${{ !github.event.repository.private }}     # [CI-032]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      orgs: ${{ steps.read.outputs.orgs }}
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - id: read
        uses: swift-institute/.github/.github/actions/read-orgs@6f73c2ebff00e4f05375794905926bdd7a0ca14b  # main 2026-08-04, identity-pin to main HEAD (swift-institute/.github#286); no functional change to this action in range
        with:
          filter: 'select((.name == "swift-primitives" or .name == "swift-standards" or .name == "swift-foundations" or .name == "swift-institute") | not) | .name'
          # Empty for every swift-institute path; a peer institute's
          # manifest swaps in here (#212).
          manifest-repository: ${{ inputs.manifest-repository }}

  scan:
    needs: config
    if: ${{ !github.event.repository.private }}     # [CI-032]
    runs-on: ubuntu-latest
    # 60, up from 10: the F12 cold bootstrap (a Workspace source build of
    # institute-ci) runs in this job on a cache miss and takes ~30 minutes;
    # warm-cache runs restore in seconds. Same allowance swift-ci.yml's plan
    # job already carries. Measured the hard way — the first canary
    # (run 31164499832) was killed at exactly 10 minutes mid-bootstrap.
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      total-violations: ${{ steps.aggregate.outputs.total-violations }}
    strategy:
      fail-fast: false
      matrix:
        sub-org: ${{ fromJSON(needs.config.outputs.orgs) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Mint installation token
        id: mint-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ matrix.sub-org }}

      - name: Checkout swift-institute/.github (validator)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          path: institute-github
          ref: ${{ job.workflow_sha }}

      - name: Provision the Institute CI binary
        id: institute-ci
        uses: ./institute-github/.github/actions/institute-ci
        with:
          sources-root: ${{ github.workspace }}/institute-github

      - name: Run validation against ${{ matrix.sub-org }}/.github
        env:
          GH_TOKEN: ${{ steps.mint-token.outputs.token }}
          INSTITUTE_CI: ${{ steps.institute-ci.outputs.binary }}
          INSTITUTE_CI_SUPPORT_ROOT: ${{ github.workspace }}/institute-github
          VALIDATOR_ID: .github/scripts/validate-sub-org-wrappers.py
          VALIDATOR: ${{ github.workspace }}/institute-github/.github/scripts/validate-sub-org-wrappers.py
          TARGET_ORG: ${{ matrix.sub-org }}
        run: |
          set -euo pipefail
          : > /tmp/findings-${TARGET_ORG}.tsv
          workdir=$(mktemp -d)
          (
            cd "$workdir"
            if ! gh repo clone "${TARGET_ORG}/.github" . -- --depth 1 --quiet 2>/dev/null; then
              # sub-org .github repo doesn't exist — that's GOOD (no wrapper to fire on)
              exit 0
            fi
            rc=0
            "$INSTITUTE_CI" validate --script "$VALIDATOR_ID" \
              --repository "${TARGET_ORG}/.github" --root "$workdir" \
              >> "/tmp/findings-${TARGET_ORG}.tsv" || rc=$?
            if [ "$rc" -eq 3 ]; then
              : > "/tmp/findings-${TARGET_ORG}.tsv"
              python3 "$VALIDATOR" "${TARGET_ORG}/.github" "$workdir" \
                >> "/tmp/findings-${TARGET_ORG}.tsv" || true
            fi
          )
          rm -rf "$workdir"

      - name: Aggregate
        id: aggregate
        run: |
          set -euo pipefail
          violations=$(cat /tmp/findings-*.tsv 2>/dev/null | grep -cE "	CI-004b") || violations=0
          echo "total-violations=$violations" >> "$GITHUB_OUTPUT"
          {
            echo "## validate-sub-org-wrappers findings"
            echo "Total: $violations"
            if [ "$violations" -gt 0 ]; then
              echo
              echo "| Repo | Rule | Message |"
              echo "|---|---|---|"
              cat /tmp/findings-*.tsv 2>/dev/null | awk -F'\t' '$2 ~ /^CI-004b/{ gsub(/\|/, "\\|", $3); printf("| `%s` | `%s` | %s |\n", $1, $2, $3) }'
            fi
          } > "$GITHUB_STEP_SUMMARY"
          if [ "$violations" -gt 0 ] && [ "${{ inputs.dry-run }}" != "true" ]; then
            exit 1
          fi
