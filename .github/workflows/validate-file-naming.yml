# validate-file-naming.yml — verify file naming convention [API-IMPL-006].
#
# Reusable workflow. For the given `org` (or single `repo`), enumerates
# non-archived repos, clones each (shallow), and runs
# `.github/scripts/validate-file-naming.py` against the cloned tree.
#
# Wave 1 mechanization (2026-05-10).

name: validate-file-naming

on:
  workflow_call:
    inputs:
      repo:
        description: 'Owner/name of a single repo to scan.'
        type: string
        required: false
        default: ''
      org:
        description: 'Org to sweep (ignored if repo is set).'
        type: string
        required: false
        default: ''
      dry-run:
        description: 'Run checks but do not fail the job on findings.'
        type: boolean
        required: false
        default: false
      visibility:
        description: 'Filter by visibility (public | private | internal | all).'
        type: string
        required: false
        default: 'public'
    outputs:
      total-violations:
        description: 'Total count of individual violations.'
        value: ${{ jobs.scan.outputs.total-violations }}

  workflow_dispatch:
    inputs:
      repo:
        description: 'Owner/name of a single repo (optional).'
        type: string
        required: false
      org:
        description: 'Org to sweep (optional; ignored if repo is set).'
        type: string
        required: false
      dry-run:
        description: 'Run checks but do not fail the job on findings.'
        type: boolean
        required: false
        default: false
      visibility:
        description: 'Filter by visibility (public | private | internal | all).'
        type: string
        required: false
        default: 'public'

jobs:
  scan:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      total-violations: ${{ steps.aggregate.outputs.total-violations }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Mint installation token (swift-institute-bot)
        id: mint-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ inputs.org || github.repository_owner }}

      - name: Checkout swift-institute/.github (validator)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          path: institute-github
          ref: ${{ job.workflow_sha }}

      - name: Resolve target repos
        id: targets
        env:
          GH_TOKEN: ${{ steps.mint-token.outputs.token }}
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_ORG: ${{ inputs.org }}
          INPUT_VISIBILITY: ${{ inputs.visibility }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_REPO" ]; then
            echo "$INPUT_REPO" > /tmp/targets.txt
          else
            : "${INPUT_ORG:?org or repo input required}"
            gh repo list "$INPUT_ORG" --no-archived --limit 1000 \
              --visibility "$INPUT_VISIBILITY" \
              --json nameWithOwner --jq '.[].nameWithOwner' > /tmp/targets.txt
          fi

      - name: Run file-naming validation
        id: check
        env:
          GH_TOKEN: ${{ steps.mint-token.outputs.token }}
          VALIDATOR: ${{ github.workspace }}/institute-github/.github/scripts/validate-file-naming.py
        run: |
          set -euo pipefail
          : > /tmp/findings.tsv
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            workdir=$(mktemp -d)
            (
              cd "$workdir"
              if ! gh repo clone "$repo" . -- --depth 1 --quiet 2>/dev/null; then
                echo "$repo	clone-failed	-" >> /tmp/findings.tsv
                exit 0
              fi
              # validate-file-naming.py exits 1 to mean "found violations" and
              # 2 for a usage error, so only rc >= 2 is a crash. Getting this
              # wrong in the other direction — treating rc 1 as a crash —
              # marks every repo WITH findings as unscanned.
              rc=0
              python3 "$VALIDATOR" "$repo" "$workdir" >> /tmp/findings.tsv || rc=$?
              if [ "$rc" -gt 1 ]; then
                echo "$repo	validator-crashed	-" >> /tmp/findings.tsv
              fi
            )
            rm -rf "$workdir"
          done < /tmp/targets.txt

      - name: Aggregate findings
        id: aggregate
        run: |
          set -euo pipefail
          # RULE_RE must list EVERY rule validate-file-naming.py can emit.
          # It counted API-IMPL-* alone until 2026-07-28, while the validator
          # has emitted TEST-009 since Pilot 9 — so TEST-009 was scanned,
          # found, and then dropped from both the count and the table.
          # Measured across the 473 public non-archived repos that day: 753
          # live TEST-009 findings in 181 repos, entirely invisible. In
          # swift-ecma the single TEST-009 finding was the org's only finding,
          # so that leg reported success while carrying a real violation.
          RULE_RE='^(API-IMPL-[0-9]+|TEST-009)$'
          violations=$(awk -F'\t' -v re="$RULE_RE" '$2 ~ re' /tmp/findings.tsv | wc -l | tr -d ' ')
          clone_failures=$(awk -F'\t' '$2 == "clone-failed"' /tmp/findings.tsv | wc -l | tr -d ' ')
          validator_crashes=$(awk -F'\t' '$2 == "validator-crashed"' /tmp/findings.tsv | wc -l | tr -d ' ')
          echo "total-violations=$violations" >> "$GITHUB_OUTPUT"
          {
            echo "## validate-file-naming findings"
            echo "Total violations: $violations"
            echo
            if [ "$clone_failures" -gt 0 ] || [ "$validator_crashes" -gt 0 ]; then
              echo "> [!CAUTION]"
              echo "> ${clone_failures} target(s) failed to clone and ${validator_crashes} crashed the validator — those repos were NOT scanned, so the count above is a floor, not a total. Treat this run as failed."
              echo
              awk -F'\t' '$2 == "clone-failed" || $2 == "validator-crashed" { printf("- %s: `%s`\n", $2, $1) }' /tmp/findings.tsv
              echo
            fi
            if [ "$violations" -gt 0 ]; then
              echo "### By rule"
              echo
              awk -F'\t' -v re="$RULE_RE" '$2 ~ re {n[$2]++} END {for (r in n) printf("- `%s`: %d\n", r, n[r])}' /tmp/findings.tsv | sort
              echo
              echo "| Repo | Rule | Message |"
              echo "|---|---|---|"
              awk -F'\t' -v re="$RULE_RE" '$2 ~ re {
                gsub(/\|/, "\\|", $3);
                printf("| `%s` | `%s` | %s |\n", $1, $2, $3)
              }' /tmp/findings.tsv
            fi
          } > "$GITHUB_STEP_SUMMARY"
          # Also to stdout — see the note in validate-thin-callers.yml on why
          # a step-summary-only report is a report nobody reads.
          echo "validate-file-naming: ${violations} violation(s), ${clone_failures} clone failure(s), ${validator_crashes} validator crash(es)"
          if [ "$clone_failures" -gt 0 ] || [ "$validator_crashes" -gt 0 ]; then
            echo "::error::${clone_failures} clone failure(s) and ${validator_crashes} validator crash(es) — those targets were never scanned, so a green result here would be false."
          fi
          if { [ "$violations" -gt 0 ] || [ "$clone_failures" -gt 0 ] || [ "$validator_crashes" -gt 0 ]; } \
             && [ "${{ inputs.dry-run }}" != "true" ]; then
            exit 1
          fi
