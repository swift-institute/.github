# Centralized GitHub dep-graph submission. Per-org cron orchestrator
# submitting a SwiftPM dependency-graph snapshot for every public,
# non-archived, non-fork repo in each in-scope org. Mondays 06:50 UTC, offset
# from the rest of the weekly cron family (06:00 through 06:45).
#
# CENTRALIZED, not per package: `vapor-community/swift-dependency-submission`
# submits only to ${{ github.repository }} and cannot be redirected, so
# per-package opt-in would fan out 132+ workflow files. Direct API submission
# from one workflow keeps the logic in one place.
#
# One installation token per org (the bot holds cross-org code:write) serves
# every repo in that org. Snapshot JSON comes from `institute-ci-control
# dependency-snapshot` over `swift package show-dependencies --format json`.
#
# POST /repos/<owner>/<repo>/dependency-graph/snapshots
#
# Provenance: research §3.4.5b (γ-2b spec); v1.3.0 §3.5.4 (permissions-chain
# lesson — why centralized over transitive); [README-167] tracking-issue;
# [PRIM-FOUND-001]/[CI-041] (Package.resolved gitignored ecosystem-wide;
# explicit dep-graph submission compensates for absent autodetection).

name: submit-dep-graph-weekly

# [CI-090] deny-all floor lived at workflow level while this file was
# schedule/workflow_dispatch only. #244 blocker 3 adds a `workflow_call`
# trigger below, and a `workflow_call` workflow must NOT declare
# workflow-level `permissions: {}` — the reusable-call intersection would
# cap every caller at zero regardless of what its jobs request. Every job
# below already declares its own least-privilege `permissions:` block, so
# dropping the workflow-level floor changes nothing about what actually
# runs.

# [CI-082] sha256sum -c pin for the gh CLI apt-keyring fetched from
# cli.github.com. The keyring is the trust root for downstream `apt-get
# install gh`; its integrity MUST be verified before placement in
# /etc/apt/keyrings/. Re-lock if/when GitHub rotates the keyring digest.
env:
  GH_KEYRING_SHA256: "6084d5d7bd8e288441e0e94fc6275570895da18e6751f70f057485dc2d1a811b"

on:
  schedule:
    - cron: '50 6 * * 1'   # weekly Monday 06:50 UTC
  # workflow_call (#244 blocker 3, "fork trap"): forking this file and
  # editing the workflow_dispatch `visibility`/`exclude-archived` defaults
  # does nothing for the peer's own cron — `inputs` is entirely unpopulated
  # on a `schedule`-triggered run, and the `sweep` job's schedule leg
  # resolves through a hardcoded 'public'/true fallback regardless of any
  # edited default (see the "Resolve visibility/exclude-archived defaults"
  # step below). A peer calls this workflow directly from their own
  # scheduled wrapper with explicit inputs instead. See
  # swift-institute/.github#251 for the trap itself.
  workflow_call:
    inputs:
      dry-run:
        description: 'Build snapshots but skip POSTing them.'
        type: boolean
        required: false
        default: false
      visibility:
        description: 'Filter targets by visibility: public | private | internal | all. Default public — swift-institute''s own fleet is public; a peer institute with a private fleet (#244) supplies its own value.'
        type: string
        required: false
        default: 'public'
      exclude-archived:
        description: 'Exclude archived repos from org-mode enumeration. Default true. A peer''s archived-repo posture need not match ours (#244).'
        type: boolean
        required: false
        default: true
    secrets:
      SWIFT_INSTITUTE_BOT_APP_CLIENT_ID:
        required: false
        description: |
          GitHub App client ID used to mint per-org installation tokens for
          both the `sweep` and `report` jobs. Same-org callers pass it via
          `secrets: inherit`; a peer institute maps its own App's client ID
          onto this slot (#212 pattern).
      SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY:
        required: false
        description: |
          GitHub App private key; counterpart of
          SWIFT_INSTITUTE_BOT_APP_CLIENT_ID.
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build snapshots but skip POSTing them.'
        type: boolean
        required: false
        default: false
      visibility:
        description: 'Filter targets by visibility: public | private | internal | all. Default public — swift-institute''s own fleet is public; a peer institute with a private fleet (#244) supplies its own value.'
        type: string
        required: false
        default: 'public'
      exclude-archived:
        description: 'Exclude archived repos from org-mode enumeration. Default true. A peer''s archived-repo posture need not match ours (#244).'
        type: boolean
        required: false
        default: true

jobs:
  config:
    if: ${{ !github.event.repository.private }}     # [CI-032]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      orgs: ${{ steps.read.outputs.orgs }}
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - id: read
        uses: swift-institute/.github/.github/actions/read-orgs@6f73c2ebff00e4f05375794905926bdd7a0ca14b  # main 2026-08-04 (identity-pin)
        with:
          # Pilot scope: swift-primitives only. Expansion candidates as
          # ecosystem orgs accept dep-graph submission: swift-standards,
          # swift-foundations. Widen by changing this filter.
          filter: 'select(.name=="swift-primitives") | .name'

  sweep:
    needs: config
    if: ${{ !github.event.repository.private }}     # [CI-032]
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    runs-on: ubuntu-latest
    # 60 minutes was insufficient for real fleet-scale throughput: a fresh
    # exact-head dispatch (run 30918885155, swift-institute/.github#279) was
    # cancelled by this ceiling with `Targets enumerated: 204` and no further
    # progress — a real, sequential clone+resolve+show-dependencies sweep of
    # a 200+ repo org, bounded local timing puts real per-target cost at
    # roughly 15-70s (dominated by network-cold `swift package resolve`),
    # i.e. ~150 minutes aggregate for this org alone. 180 minutes gives that
    # observed throughput headroom while staying well under GitHub's
    # 360-minute hard per-job ceiling.
    timeout-minutes: 180
    # Swift toolchain pin per [CI-011]; bump in lockstep with the universal reusable's default.
    # Hardcoded literal: env.* and workflow-level env: are not bound when GitHub Actions
    # resolves container: at job-startup. vars.* (org/repo variables) is the only working
    # centralization mechanism here; deferred as out-of-scope for this recovery.
    container: swift:6.3
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Mint installation token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ matrix.org }}
          repositories: ''

      - name: Install dependencies (curl, gh, jq, uuid-dev)
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          # uuid-dev: swift-linux-standard's CLinuxKernelShim `#include`s
          # <uuid/uuid.h>, which `institute-ci-control` reaches transitively
          # through swift-github. `.linkedLibrary` affects only the LINK
          # step, so without the header the C module fails to build and the
          # sweep never starts (canary runs 31175005924 / 31175007454). Same
          # typed provisioning input as `.github/actions/institute-ci`; that
          # action installs it explicitly for the same reason this does —
          # `install-system-deps` derives from the workspace root, and this
          # package lives under `.swift-institute-github/`, where the
          # derivation cannot see it.
          apt-get install -qq -y curl jq ca-certificates gnupg uuid-dev
          mkdir -p -m 755 /etc/apt/keyrings
          # [CI-082] fetch to file, sha256sum -c against pinned digest,
          # only then place in /etc/apt/keyrings/. Restructured from the
          # prior `curl | tee` pipe to enable verification (the keyring
          # is the trust root for subsequent apt-get install gh).
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /tmp/gh-keyring.gpg
          echo "${GH_KEYRING_SHA256}  /tmp/gh-keyring.gpg" | sha256sum -c -
          mv /tmp/gh-keyring.gpg /etc/apt/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update -qq
          apt-get install -qq -y gh

      - name: Fetch the snapshot tool (sparse-checkout from swift-institute/.github)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          ref: ${{ job.workflow_sha }}
          path: .swift-institute-github
          sparse-checkout: Tools/institute-ci-control
          sparse-checkout-cone-mode: false

      - name: Build the snapshot tool
        shell: bash
        run: |
          set -euo pipefail
          # Built at the pinned workflow_sha's own sources, once, before
          # the sweep. The tool holds no credential — it renders the
          # document this job then POSTs.
          swift build -c release \
            --package-path .swift-institute-github/Tools/institute-ci-control \
            --product institute-ci-control
          swift build -c release \
            --package-path .swift-institute-github/Tools/institute-ci-control \
            --show-bin-path >> "$GITHUB_PATH"

      - name: Resolve visibility/exclude-archived defaults
        # GitHub Actions expression comparison against a boolean literal
        # (`inputs.exclude-archived != false`) coerces the other operand to
        # boolean first — and coerces an unset/null `inputs.exclude-archived`
        # (this workflow's `schedule` trigger leaves the whole `inputs`
        # context unpopulated) to `false`, not to the input's declared
        # `default: true`. `false != false` is `false`, so the schedule path
        # silently flipped to including archived repos — a live regression
        # against the 17-org nightly this workflow already runs, caught in
        # review before landing. Resolving in bash instead: an empty string
        # compares as itself, not as a coerced boolean, so "unset" and
        # "explicitly false" are distinguishable exactly once, here.
        id: defaults
        shell: bash
        env:
          INPUT_VISIBILITY: ${{ inputs.visibility }}
          INPUT_EXCLUDE_ARCHIVED: ${{ inputs.exclude-archived }}
        run: |
          set -euo pipefail
          visibility="${INPUT_VISIBILITY:-public}"
          exclude_archived=true
          [ "$INPUT_EXCLUDE_ARCHIVED" = "false" ] && exclude_archived=false
          echo "visibility=${visibility}" >> "$GITHUB_OUTPUT"
          echo "exclude-archived=${exclude_archived}" >> "$GITHUB_OUTPUT"

      - name: Enumerate org repos
        id: enum
        uses: swift-institute/.github/.github/actions/enumerate-org-public-repos@6f73c2ebff00e4f05375794905926bdd7a0ca14b  # main 2026-08-04 (identity-pin)
        with:
          org: ${{ matrix.org }}
          visibility: ${{ steps.defaults.outputs.visibility }}
          exclude-forks: 'true'
          exclude-archived: ${{ steps.defaults.outputs.exclude-archived }}
          gh-token: ${{ steps.token.outputs.token }}

      - name: Sweep org
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ matrix.org }}
          DRY_RUN: ${{ inputs.dry-run || 'false' }}
          ENUM_REPOS: ${{ steps.enum.outputs.repos }}
          INPUT_VISIBILITY: ${{ steps.defaults.outputs.visibility }}
        run: |
          set -euo pipefail
          # Read repos from composite output; drop any blank lines defensively.
          targets=()
          while IFS= read -r line; do
            [[ -n "$line" ]] && targets+=("$line")
          done <<< "$ENUM_REPOS"
          echo "Targets enumerated: ${#targets[@]}"
          # Loud-empty-reach (#244), three-rule discriminator per review:
          #   1. Caller explicitly scoped a non-default visibility and this
          #      org reached zero -> HARD FAILURE. Nobody passes
          #      visibility: private to an org they believe has none; there
          #      is no benign reading, so fail this leg immediately.
          #   2. Default-public (our own fleet's own value) reaching zero
          #      for ONE org -> warning only, tracked below for rule 3.
          #   3. Aggregate zero across every org in this sweep -> HARD
          #      FAILURE, decided in the `report` job once every leg's
          #      count is in (this job only sees its own org).
          zero_reach=0
          if [[ "${#targets[@]}" -eq 0 ]]; then
            zero_reach=1
            if [[ "$INPUT_VISIBILITY" != "public" ]]; then
              echo "::error::submit-dep-graph-weekly reached 0 repos for org '${ORG}' with explicitly-scoped visibility='${INPUT_VISIBILITY}'. No benign reading — the caller asked for this visibility and it matched nothing."
              exit 1
            fi
            echo "::warning::submit-dep-graph-weekly reached 0 repos for org '${ORG}' (visibility=${INPUT_VISIBILITY}). This leg will report success, but it submitted nothing."
          fi
          successes=0
          failures=0
          skipped=0
          per_target_failures=()
          target_index=0
          for target in "${targets[@]}"; do
            target_index=$((target_index+1))
            # Prior to this line, the loop produced no output between
            # "Targets enumerated" and the final summary write, so a
            # signal-killed target (#279) or a job-timeout cancellation
            # (#279, run 30918885155) left zero evidence of how far the
            # sweep had reached. One line per target costs nothing and
            # makes that observable going forward.
            echo "[${target_index}/${#targets[@]}] ${target}"
            workdir=$(mktemp -d)
            if ! git clone --depth 1 --quiet \
                "https://x-access-token:${GH_TOKEN}@github.com/${target}.git" \
                "$workdir" 2>/dev/null; then
              failures=$((failures+1))
              per_target_failures+=("- \`${target}\`: clone failed")
              rm -rf "$workdir"
              continue
            fi
            if [[ ! -f "$workdir/Package.swift" ]]; then
              skipped=$((skipped+1))
              rm -rf "$workdir"
              continue
            fi
            (
              cd "$workdir"
              # `swift package resolve` may fail for branch-pinned private deps
              # if the token doesn't have read access; tolerate and continue.
              # Bounded with `timeout` so one hung/pathological target's
              # manifest resolution cannot consume the org's entire step
              # budget on its own.
              timeout 300 swift package resolve 2>/dev/null || true
              # Guarded the same way as `resolve` above, and for the same
              # reason: this line sits in a bare, unguarded statement under
              # `set -euo pipefail` (top of this step). Without `|| true`,
              # an ordinary failure OR a signal kill (observed: OOM SIGKILL,
              # exit 137, in run 30805660536 / swift-institute/.github#279)
              # propagates through `errexit` and aborts this entire step —
              # every remaining target in this org's sweep — instead of
              # being classified as one target's failure by the check just
              # below. `timeout` additionally bounds a hang that would
              # otherwise never produce an exit status to catch.
              timeout 300 swift package show-dependencies --format json > /tmp/deps.json 2>/dev/null || true
            )
            if [[ ! -s /tmp/deps.json ]]; then
              failures=$((failures+1))
              per_target_failures+=("- \`${target}\`: show-dependencies failed")
              rm -rf "$workdir"
              continue
            fi
            sha=$(cd "$workdir" && git rev-parse HEAD)
            if ! GITHUB_SHA="$sha" GITHUB_REF=refs/heads/main \
                 GITHUB_RUN_ID="${GITHUB_RUN_ID:-0}" \
                 institute-ci-control dependency-snapshot --dependencies /tmp/deps.json \
                 > /tmp/snapshot.json 2>/dev/null; then
              failures=$((failures+1))
              per_target_failures+=("- \`${target}\`: snapshot build failed")
              rm -rf "$workdir"
              continue
            fi
            if [[ "$DRY_RUN" == "true" ]]; then
              dep_count=$(jq '.manifests."Package.swift".resolved | length' /tmp/snapshot.json)
              echo "(dry-run) ${target}: $dep_count deps"
              successes=$((successes+1))
              rm -rf "$workdir"
              continue
            fi
            if gh api -X POST "repos/${target}/dependency-graph/snapshots" \
                 --input /tmp/snapshot.json > /dev/null 2>&1; then
              successes=$((successes+1))
            else
              failures=$((failures+1))
              per_target_failures+=("- \`${target}\`: POST failed")
            fi
            rm -rf "$workdir"
          done
          {
            echo "## Org $ORG — dep-graph submission (γ-2b)"
            if [[ $zero_reach -eq 1 ]]; then
              echo ""
              echo "> [!WARNING]"
              echo "> 0 repos enumerated for org \`${ORG}\` (visibility=${INPUT_VISIBILITY}). This leg reports success, but it reached nothing."
              echo ""
            fi
            echo "- Targets:    ${#targets[@]}"
            echo "- Successes:  $successes"
            echo "- Skipped:    $skipped (no Package.swift)"
            echo "- Failures:   $failures"
            if (( failures > 0 )); then
              echo ""
              echo "### Failed targets"
              echo ""
              printf '%s\n' "${per_target_failures[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "${successes},${failures},${skipped}" > "/tmp/${ORG}-counts.txt"
          printf '%s\n' "${per_target_failures[@]}" > "/tmp/${ORG}-failures.txt" 2>/dev/null || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: depgraph-counts-${{ matrix.org }}
          path: |
            /tmp/${{ matrix.org }}-counts.txt
            /tmp/${{ matrix.org }}-failures.txt

  report:
    needs: sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always() && needs.sweep.result != 'skipped' && !github.event.repository.private     # [CI-032]
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Mint installation token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: swift-institute
          repositories: .github
          permission-issues: write

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/counts

      - name: Aggregate + build body
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          DRY_RUN: ${{ inputs.dry-run || 'false' }}
          INPUT_VISIBILITY: ${{ inputs.visibility || 'public' }}
        shell: bash
        run: |
          set -euo pipefail
          today=$(date -u '+%Y-%m-%d')
          total_s=0
          total_f=0
          total_skip=0
          org_legs=0
          per_org=()
          all_failures=""
          # Layout-agnostic per Path A: download-artifact@v8 flattens to
          # /tmp/counts/<file> when only one artifact matches and nests
          # to /tmp/counts/<artifact>/<file> otherwise. See
          # Research/download-artifact-ladder-migration.md.
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            org=$(basename "$f" | sed 's/-counts\.txt$//')
            IFS=',' read -r s fl sk < "$f"
            org_legs=$((org_legs + 1))
            total_s=$((total_s + s))
            total_f=$((total_f + fl))
            total_skip=$((total_skip + sk))
            per_org+=("- \`${org}\`: $s succeeded, $fl failed, $sk skipped")
          done < <(find /tmp/counts -type f -name '*-counts.txt' 2>/dev/null)
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            [[ -s "$f" ]] && all_failures="${all_failures}$(cat "$f")"$'\n'
          done < <(find /tmp/counts -type f -name '*-failures.txt' 2>/dev/null)
          # Loud-empty-reach (#244) rule 3: aggregate zero across every org
          # in the sweep is a hard failure. This is the case that covers our
          # own fleet — default-public by construction, so it can never
          # trip rule 1 (which only fires on an explicitly-scoped
          # visibility) — a token-scope or org-rename regression that
          # zeroes every leg must not stay warning-only forever. Every leg
          # here already succeeded (rule 1 would have failed the job
          # otherwise), so `total_s+total_f+total_skip == 0` means every
          # org genuinely enumerated nothing, not that some orgs failed.
          total_targets=$((total_s + total_f + total_skip))
          if [[ "$org_legs" -gt 0 && "$total_targets" -eq 0 ]]; then
            echo "::error::submit-dep-graph-weekly reached 0 repos across all ${org_legs} org(s) swept (visibility=${INPUT_VISIBILITY}). Every leg reported success individually, but the aggregate sweep converged nothing — this is the class defect #244 was filed about, at fleet scope."
            exit 1
          fi
          if [[ "$total_f" -eq 0 ]]; then
            echo "Dep-graph submission clean across all orgs — no tracking issue."
            echo "FILE_ISSUE=false" >> "$GITHUB_ENV"
            # Convergence self-closure (#159): a clean, non-dry-run sweep
            # closes its own open tracking issue in the same run.
            if [[ "$DRY_RUN" != "true" ]]; then
              echo "CLOSE_ISSUE=true" >> "$GITHUB_ENV"
            fi
            exit 0
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "(dry-run; would have opened/updated issue)"
            echo "FILE_ISSUE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          # Write body to a file for the upsert-tracking-issue composite.
          cat > "${RUNNER_TEMP}/issue-body.md" <<EOF
          The weekly γ-2b dep-graph submission sweep at 06:50 UTC on ${today}
          had failures.

          ## Aggregate
          - Successes: ${total_s}
          - Failures:  ${total_f}
          - Skipped:   ${total_skip} (no Package.swift)

          ## Per-org

          $(printf '%s\n' "${per_org[@]}")

          ## Failed targets

          ${all_failures}

          ## What this means

          γ-2b explicitly submits a SwiftPM dependency-graph snapshot for each
          public consumer repo, compensating for the [CI-041] gitignored
          \`Package.resolved\` (which prevents Dependabot autodetection of
          resolved versions). Failures are typically infra-class — clone
          failed, swift package resolve failed for branch-pinned private deps,
          or the API call returned non-2xx.

          ## What to do

          - Inspect the failed-targets list above; classify by failure mode.
          - If clone failures cluster on private repos: swift-institute-bot's
            installation scope on that org needs widening.
          - If show-dependencies failures cluster on packages that have
            transitive private deps: the install token needs read access to
            those private dep repos (cross-org token scope).
          - If POST failures: check rate limiting / API status.
          - Close this issue when fixed; the next weekly sweep reopens it
            if drift recurs.

          *Idempotent: this issue is updated in place.*
          EOF
          {
            echo "ISSUE_TITLE=Dep-graph submission sweep ${today}"
            echo "FILE_ISSUE=true"
          } >> "$GITHUB_ENV"

      - name: Upsert tracking issue
        if: env.FILE_ISSUE == 'true'
        uses: swift-institute/.github/.github/actions/upsert-tracking-issue@6f73c2ebff00e4f05375794905926bdd7a0ca14b  # main 2026-08-04 (identity-pin)
        with:
          repo: swift-institute/.github
          title: ${{ env.ISSUE_TITLE }}
          title-prefix: 'Dep-graph submission sweep'
          body-file: ${{ runner.temp }}/issue-body.md
          label: 'dep-graph'
          gh-token: ${{ steps.token.outputs.token }}

      # Convergence self-closure (swift-institute/.github#159): a clean sweep
      # closes its own open tracking issue, per the bot-issue contract.
      # Title-matched, never label-keyed — a label that was never created
      # would silently disable this close path.
      - name: Close tracking issue on clean convergence
        if: env.CLOSE_ISSUE == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TITLE_PREFIX: 'Dep-graph submission sweep'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing=$(gh issue list \
            --repo swift-institute/.github \
            --state open \
            --search "\"${TITLE_PREFIX}\" in:title" \
            --json number \
            --jq '.[].number' || echo "")
          if [[ -z "$existing" ]]; then
            echo "Sweep clean and no open tracking issue to close."
            exit 0
          fi
          for n in $existing; do
            gh issue close "$n" \
              --repo swift-institute/.github \
              --reason completed \
              --comment "Clean sweep: zero submission failures across all orgs — ${RUN_URL}. An issue stays open only if the perfect end-state contains its fix; convergence proven by the cited clean run closes it. Auto-closed as completed by the owning workflow."
            echo "closed #${n}"
          done
