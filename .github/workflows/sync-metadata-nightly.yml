# sync-metadata-nightly.yml — daily full-sweep autopilot.
#
# Calls sync-metadata.yml once per ecosystem org via a matrix strategy at
# 04:00 UTC daily. Each org gets its own auth scope. When any org applies
# edits, opens or updates a tracking issue in swift-institute/.github
# summarising what converged. Also heals ruleset drift on repositories that
# already carry an Institute ruleset (`heal-rulesets: true`); it never
# creates a first ruleset — first application on a previously unenforced
# repository stays explicit-opt-in only (swift-institute/.github#204).
#
# Provenance: Skills/github-repository [GH-REPO-070] / [GH-REPO-071];
# Research/github-metadata-harmonization.md § 4.2 / § 7 Q8.

name: sync-metadata-nightly

# [CI-090] Deny-all floor; per-job blocks below declare the actual grants.
permissions: {}

on:
  schedule:
    - cron: '0 4 * * *'   # daily 04:00 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Preview edits without applying.'
        type: boolean
        required: false
        default: false

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      orgs: ${{ steps.read.outputs.orgs }}
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - id: read
        uses: swift-institute/.github/.github/actions/read-orgs@4eb5e080688dfca88bd99d09fdba6077c360534e  # main 2026-08-04, identity-pin to main HEAD (swift-institute/.github#286); no functional change to this action in range
        # Default filter `.name` emits all active orgs.

  sweep:
    needs: config
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.config.outputs.orgs) }}
    # [CI-106] Caller must grant equivalent or greater than the called
    # reusable's per-job permissions (sync-metadata.yml `sync` job:
    # contents: read).
    permissions:
      contents: read
    uses: ./.github/workflows/sync-metadata.yml
    with:
      org: ${{ matrix.org }}
      dry-run: ${{ inputs.dry-run || false }}
      # Re-admit ruleset convergence to the nightly as post-wave drift
      # repair (swift-institute/.github#204): heals an Institute ruleset
      # that already exists, never creates one where absent.
      # `apply-rulesets` stays unset (false) here — first application on a
      # previously unenforced repository remains explicit-opt-in only.
      heal-rulesets: true
    secrets: inherit

  report:
    needs: sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always() && needs.sweep.result != 'skipped'
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Mint installation token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: swift-institute
          repositories: .github
          permission-issues: write

      - name: Build issue body
        env:
          SWEEP_RESULT: ${{ needs.sweep.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Only post when a sweep actually applied or attempted edits.
          # The aggregated `result` from a matrix job is `success` if all
          # matrix entries succeeded, `failure` if any failed. We post on
          # failure (something to investigate) or when run from
          # workflow_dispatch with dry-run=false (signal of intent).
          if [[ "$SWEEP_RESULT" == "success" ]]; then
            echo "All orgs converged cleanly — no tracking issue needed."
            echo "FILE_ISSUE=false" >> "$GITHUB_ENV"
            # Convergence self-closure (#159): a clean sweep closes its own
            # open tracking issue in the same run (step below).
            echo "CLOSE_ISSUE=true" >> "$GITHUB_ENV"
            exit 0
          fi

          today=$(date -u '+%Y-%m-%d')
          cat > "${RUNNER_TEMP}/issue-body.md" <<EOF
          The nightly metadata sweep at 04:00 UTC on ${today} completed with status: \`${SWEEP_RESULT}\`.

          See the [run summary](${RUN_URL}) for the per-org breakdown of edits applied (or attempted).

          ### What this means

          GitHub-side metadata had drifted from per-repo \`.github/metadata.yaml\` source-of-truth in one or more orgs. The sweep attempted to revert state to match the YAMLs.

          - To **accept** drift instead of reverting it, edit the relevant repo's \`.github/metadata.yaml\` to match GitHub state.
          - To **investigate** drift origins, check each affected repo's audit log around the change time.
          - If \`${SWEEP_RESULT}\` == \`failure\`, one or more matrix legs failed (auth, rate-limit, malformed YAML); follow the run logs.

          See \`Skills/github-repository\` § [GH-REPO-002] for the single-source discipline.
          EOF
          {
            echo "ISSUE_TITLE=Metadata sync run ${today} — ${SWEEP_RESULT}"
            echo "FILE_ISSUE=true"
          } >> "$GITHUB_ENV"

      - name: Upsert tracking issue
        if: env.FILE_ISSUE == 'true'
        uses: swift-institute/.github/.github/actions/upsert-tracking-issue@4eb5e080688dfca88bd99d09fdba6077c360534e  # main 2026-08-04, identity-pin to main HEAD (swift-institute/.github#286); no functional change to this action in range
        with:
          repo: swift-institute/.github
          title: ${{ env.ISSUE_TITLE }}
          title-prefix: 'Metadata sync run'
          body-file: ${{ runner.temp }}/issue-body.md
          label: 'metadata-sync'
          gh-token: ${{ steps.token.outputs.token }}

      # Convergence self-closure (swift-institute/.github#159): a clean sweep
      # closes its own open tracking issue, per the bot-issue contract.
      # Title-matched, never label-keyed — a label that was never created
      # would silently disable this close path. Dry-run runs never close
      # (a dry-run success plans edits without applying them, so it is not
      # convergence evidence).
      - name: Close tracking issue on clean convergence
        if: ${{ env.CLOSE_ISSUE == 'true' && inputs.dry-run != true }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TITLE_PREFIX: 'Metadata sync run'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing=$(gh issue list \
            --repo swift-institute/.github \
            --state open \
            --search "\"${TITLE_PREFIX}\" in:title" \
            --json number \
            --jq '.[].number' || echo "")
          if [[ -z "$existing" ]]; then
            echo "Sweep clean and no open tracking issue to close."
            exit 0
          fi
          for n in $existing; do
            gh issue close "$n" \
              --repo swift-institute/.github \
              --reason completed \
              --comment "Clean sweep: every org leg converged — ${RUN_URL}. An issue stays open only if the perfect end-state contains its fix; convergence proven by the cited clean run closes it. Auto-closed as completed by the owning workflow."
            echo "closed #${n}"
          done
