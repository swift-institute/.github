# ecosystem-coherence.yml — weekly composed-graph coherence measurement (#125).
#
# PURPOSE
# Per-package CI proves each package against its own resolution; nothing
# measures whether the fleet's canonical `main` heads compose as one graph.
# swift-institute/Workspace#80 shipped the instrument (`institute coherence`:
# sync -> doctor -> graph -> build -> population, emitting a content-addressed
# receipt). This workflow is the Institute wiring around that instrument:
# cadence, quota placement, receipt persistence, and scheduled-failure
# observability. Per the ownership split recorded on #125, Workspace owns the
# measurement; this repository owns everything below.
#
# INSTRUMENT PIN — WHERE IT DOES AND DOES NOT REACH
# The `uses:` action references below are pinned to commits per [CI-030]/
# doctrine. The Workspace *checkout* is deliberately NOT pinned — `ref: main`
# is a floating ref on purpose, because the whole point of this lane is to
# measure Workspace's own current main composed with the rest of the fleet's
# current mains. That is not a "green tick proves nothing" gap: the resolved
# Workspace commit SHA is captured into the receipt itself
# (`instrument.workspaceCommit`), so every run is self-describing about
# exactly which Workspace revision produced it, even though the trigger that
# selected it floats.
#
# CADENCE (constraint: #71's 20-runner-backed-job org cap)
# `workflow_dispatch` for on-demand calibration/attribution runs, plus a
# weekly `schedule:` chosen off GitHub's global peaks and off this
# repository's own cron cluster (04:00 UTC metadata sync, 05:15 UTC Project
# reconciler, the 06:xx weekly family) — Sunday 02:40 UTC, per the #125
# recorded disposition. Not per push: a multi-hour job per push would be
# strictly wrong against the 20-job cap (#71).
#
# QUOTA PLACEMENT (ci-sweep.yml precedent)
# Hosted here, in swift-institute/.github, so the job runs under the
# `swift-institute` org's own quota and never competes with consumer-push
# queues in the layer orgs — one macOS job, one of the 5-concurrent macOS
# pool, weekly, off-peak. This placement also buys alert routing for free
# (see below).
#
# MATERIALIZATION AND CACHING
# Steps mirror Workspace's own contributor-path.yml: no credentials on the
# measured path (plain HTTPS clone, `persist-credentials: false`), floor
# toolchain via `xcode-select`, zero caches (branch-based deps mean no cache
# key can prove it represents the resolved graph — the from-scratch path is
# the thing being measured).
#
# CALIBRATION VS. REAL RUNS
# `dry-run: true` verifies this workflow's own wiring — bootstrap install,
# CLI surface, receipt-artifact upload, step summary — WITHOUT running the
# real sync -> build measurement, so the wiring can be dispatched and proven
# without spending a multi-hour macOS job slot or exercising the tracking-
# issue path on synthetic data. `dry-run: false` (the schedule's own trigger,
# and any calibration dispatch) runs the real instrument; per #125's recorded
# sequencing, 2-3 such calibration dispatches establish wall-clock and 6-hour
# fit before the cron is trusted, and are a separate decision from landing
# this wiring.
#
# ALERT ROUTING (#123, zero new machinery)
# This workflow's `name:` is entered in alert-scheduled-workflow-failure.yml's
# `on.workflow_run.workflows` list below. check-scheduled-workflow-alert-
# parity.py (run by lint-validator-fixtures.yml on every push touching any
# workflow file) fails closed the moment a `schedule:`-triggered workflow's
# name diverges from that list in either direction — landing this file next
# to that list entry is therefore a checked pair, not an unchecked promise.
#
# RECEIPT PERSISTENCE AND TRACKING ISSUE
# The receipt (`receipt.canonical`, content-addressed per the #90/#94
# pattern) is uploaded as a run artifact and its digest/verdict quoted in the
# step summary on every real run. On `incoherent` or `unmeasured`, one
# TITLE-matched tracking issue is upserted via the existing
# upsert-tracking-issue composite, quoting digest, verdict, and attribution;
# it auto-closes on the next `coherent` schedule-triggered green run, the
# same lifecycle alert-scheduled-workflow-failure.yml already established.
# Bot-authored, never admitted to the Project.

name: ecosystem-coherence

permissions: {}

on:
  # schedule: DISABLED until calibration (coordinator, 2026-07-30): #125's own
  # sequencing requires 2-3 workflow_dispatch calibration runs (wall-clock and
  # 6-hour-limit fit) BEFORE the cron is trusted; calibration is blocked on the
  # Workspace front door (swift-foundations/swift-posix#4). Re-enable by
  # restoring the block below once calibration is recorded on #125.
  # schedule:
  #   - cron: '40 2 * * 0'   # weekly Sunday 02:40 UTC — off GitHub's global peaks and off the 04:00/05:15/06:xx cron cluster
  workflow_dispatch:
    inputs:
      narrowing:
        description: >
          Manual-bisect input: JSON object rendered verbatim into
          Selection.local.json's delta ({"version":1,"add":[...],
          "remove":[...]}) to rebuild only a suspect closure for
          attribution re-runs. Empty = full-roster policy selection (the
          only canonical shape; a narrowed receipt is marked non-canonical).
        type: string
        required: false
        default: ''
      dry-run:
        description: >
          Verify this workflow's own wiring (bootstrap install, CLI
          surface, artifact upload, step summary) WITHOUT running the real
          sync -> build coherence measurement. Use for wiring/calibration
          verification only — leave false for a real coherence run.
        type: boolean
        required: false
        default: false

concurrency:
  group: ecosystem-coherence
  cancel-in-progress: false

jobs:
  coherence:
    name: coherence (${{ inputs.dry-run == true && 'dry-run' || 'real' }})
    if: ${{ !github.event.repository.private }}
    runs-on: macos-26
    # #125's cost model: 2-5h against the 6-hour job hard limit. The 6-hour
    # ceiling itself is the one open measurement calibration dispatches
    # exist to resolve; timeout-minutes is set to that ceiling rather than
    # an unverified guess, so a run that genuinely does not fit reports as
    # the timeout it is instead of being silently truncated by a tighter one.
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.coherence.outputs.verdict }}
      digest: ${{ steps.coherence.outputs.digest }}
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # No `path:` — checks out swift-institute/institute-application directly to
      # $GITHUB_WORKSPACE, the same shape contributor-path.yml's own job has
      # when it checks out itself. `ref: main` is the deliberately floating
      # instrument pin discussed above. persist-credentials: false keeps the
      # rest of this job's `institute sync` credential-free by construction,
      # the same property contributor-path.yml proves.
      - name: Checkout the Workspace front door
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/institute-application
          ref: main
          persist-credentials: false

      # Institute.json's floor is Swift 6.3.3 / Xcode 26.6; select it the
      # way a contributor following the README would, per contributor-
      # path.yml. A nightly-only red on a newer default image would be
      # toolchain data, not coherence data.
      - name: Select the documented minimum Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Quickstart — install the canonical command
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          if command -v institute; then
            echo "::error::clean runner unexpectedly already exposes an institute command"
            exit 1
          fi
          # TX-APP1Z: the package is at the repository root after the flatten;
          # Application/ is only reachable through a pre-flatten ref.
          institute_package_path=.
          if [ -f Application/Package.swift ]; then institute_package_path=Application; fi
          swift run --package-path "$institute_package_path" institute install
          test "$(command -v institute)" = "$HOME/.local/bin/institute"
          institute --help >/dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Render selection narrowing (manual bisect input)
        if: ${{ inputs.narrowing != '' }}
        env:
          NARROWING: ${{ inputs.narrowing }}
        run: |
          set -euo pipefail
          printf '%s' "$NARROWING" > Selection.local.json
          # Fail fast on malformed JSON rather than letting `workspace
          # coherence` reject it deep into a multi-hour run.
          python3 -c 'import json,sys; json.load(open("Selection.local.json"))'

      # --- Dry-run leg: proves the wiring, spends no multi-hour build. ---
      - name: Dry run — verify the CLI surface only
        if: ${{ inputs.dry-run == true }}
        run: |
          set -euo pipefail
          institute coherence --help >/dev/null
          echo "dry-run: 'institute coherence' CLI surface present and parses --help"

      - name: Dry run — synthesize a schema-shaped receipt for artifact/summary wiring
        id: dry-receipt
        if: ${{ inputs.dry-run == true }}
        run: |
          set -euo pipefail
          cat > receipt.json <<'JSON'
          {"version":1,"kind":"ecosystem-coherence","instrument":{"workspaceCommit":"dry-run","workspaceJsonBlob":"dry-run","selection":"policy","buildPath":"xcodebuild-merged"},"environment":{"platform":"macos-26","swift":"6.3.3","xcode":"26.6","runner":"github-hosted","fresh":true,"cachesUsed":[]},"population":{"inventoryCount":0,"materializedCount":0,"builtTargetCount":0,"expectedTargetCount":0},"heads":{},"stages":[],"verdict":"dry-run","attribution":null,"priorGreenReceipt":null}
          JSON
          echo "verdict=dry-run" >> "$GITHUB_OUTPUT"
          echo "digest=(none - synthetic dry-run receipt, not content-addressed)" >> "$GITHUB_OUTPUT"

      # --- Real leg: the actual measurement. ---
      - name: Quickstart — sync the full inventory
        if: ${{ inputs.dry-run != true }}
        run: |
          set -euo pipefail
          institute sync --dry-run
          institute sync

      - name: Facts — doctor
        if: ${{ inputs.dry-run != true }}
        run: institute doctor

      - name: Coherence — composed build with content-addressed receipt
        id: coherence
        if: ${{ inputs.dry-run != true }}
        run: |
          set -euo pipefail
          set -o pipefail
          # `institute coherence` prints exactly three lines: the selection
          # origin, the receipt's canonical (single-line, sorted-key) JSON,
          # and a "coherence: verdict <v>[, digest <d>]" summary — in that
          # order (Workspace.CLI.swift's `.coherence` case). Extracting by
          # fixed line position is intentional, not incidental: the receipt
          # line is documented as compact/canonical specifically so it can
          # be lifted verbatim without a JSON-aware CLI on this side.
          status=0
          institute coherence > coherence-output.txt 2>&1 || status=$?
          cat coherence-output.txt
          sed -n '2p' coherence-output.txt > receipt.json
          summary_line=$(grep -m1 '^coherence: verdict' coherence-output.txt || true)
          verdict=$(sed -nE 's/^coherence: verdict ([a-z]+).*/\1/p' <<<"$summary_line")
          digest=$(sed -nE 's/.*digest ([0-9a-f]+).*/\1/p' <<<"$summary_line")
          echo "verdict=${verdict:-unknown}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest:-unavailable}" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload receipt artifact
        if: ${{ always() && (steps.coherence.outcome == 'success' || steps.coherence.outcome == 'failure' || steps.dry-receipt.outcome == 'success') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecosystem-coherence-receipt
          path: receipt.json
          if-no-files-found: warn
          retention-days: 90

      - name: Step summary
        if: always()
        env:
          VERDICT: ${{ steps.coherence.outputs.verdict || steps.dry-receipt.outputs.verdict || 'not-run' }}
          DIGEST: ${{ steps.coherence.outputs.digest || steps.dry-receipt.outputs.digest || 'unavailable' }}
        run: |
          {
            echo "## ecosystem-coherence"
            echo
            echo "- verdict: \`${VERDICT}\`"
            echo "- receipt digest: \`${DIGEST}\`"
            echo "- dry-run: \`${{ inputs.dry-run == true }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  tracking-issue:
    name: upsert tracking issue on red verdict
    needs: coherence
    if: >
      ${{ !cancelled() && inputs.dry-run != true &&
          (needs.coherence.outputs.verdict == 'incoherent' ||
           needs.coherence.outputs.verdict == 'unmeasured') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Download receipt artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ecosystem-coherence-receipt
          path: ${{ runner.temp }}/receipt

      - name: Mint installation token (issue write)
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: swift-institute
          repositories: .github
          permission-issues: write

      - name: Build issue body
        id: body
        env:
          VERDICT: ${{ needs.coherence.outputs.verdict }}
          DIGEST: ${{ needs.coherence.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/ecosystem-coherence-body.md"
          {
            echo "Ecosystem coherence measurement concluded \`${VERDICT}\`."
            echo
            echo "- Run: ${RUN_URL}"
            echo "- Receipt digest: \`${DIGEST}\`"
            echo
            echo "### Receipt"
            echo
            echo '```json'
            cat "${RUNNER_TEMP}/receipt/receipt.json" 2>/dev/null || echo "(receipt artifact unavailable)"
            echo '```'
            echo
            echo "---"
            echo "Filed by \`ecosystem-coherence.yml\` (#125). Upserted by title match,"
            echo "never label-keyed; auto-closes on this workflow's next"
            echo "schedule-triggered \`coherent\` green run."
          } > "$body"
          echo "body-file=${body}" >> "$GITHUB_OUTPUT"

      - name: Upsert tracking issue
        uses: swift-institute/.github/.github/actions/upsert-tracking-issue@6f73c2ebff00e4f05375794905926bdd7a0ca14b  # main 2026-08-04, identity-pin to main HEAD (swift-institute/.github#286); no functional change to this action in range
        with:
          repo: swift-institute/.github
          title: 'Ecosystem coherence: ${{ needs.coherence.outputs.verdict }}'
          title-prefix: 'Ecosystem coherence:'
          body-file: ${{ steps.body.outputs.body-file }}
          label: ecosystem-coherence
          gh-token: ${{ steps.token.outputs.token }}

  close-tracking-issue:
    name: close tracking issue on green verdict
    needs: coherence
    if: >
      ${{ !cancelled() && inputs.dry-run != true &&
          needs.coherence.outputs.verdict == 'coherent' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Mint installation token (issue write)
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: swift-institute
          repositories: .github
          permission-issues: write

      - name: Close tracking issue when coherent
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          DIGEST: ${{ needs.coherence.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Title-matched, never label-keyed — same doctrine as
          # alert-scheduled-workflow-failure.yml and
          # reconcile-project-invariants.yml: a minted label that was never
          # created would otherwise silently disable this path. Any prior
          # open tracking issue (incoherent or unmeasured) closes here,
          # since either verdict shares the 'Ecosystem coherence:' prefix.
          existing=$(gh issue list \
            --repo swift-institute/.github \
            --state open \
            --search "\"Ecosystem coherence:\" in:title" \
            --json number,title \
            --jq '.[] | select(.title | startswith("Ecosystem coherence:")) | .number')
          for n in $existing; do
            gh issue close "$n" \
              --repo swift-institute/.github \
              --comment "Most recent scheduled run concluded \`coherent\` (receipt digest \`${DIGEST}\`, ${RUN_URL}); auto-closing."
          done
