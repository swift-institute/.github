# validate-skill-hygiene.yml — publication hygiene for a public skill corpus.
#
# Reusable workflow. Consumer repos that publish skills call this from their
# `ci.yml` to gate pushes and pull requests that touch skill files.
#
# What this gates, and what it deliberately does not
#
# It checks mechanical, objective facts about the artifact: does the frontmatter
# parse, does the skill have a name and a description, does every relative link
# resolve, and is anything published that should not have been (a maintainer's
# machine path, an internal rule ID). It checks NOTHING about the writing. There
# is no length ceiling, no line cap, no required section, and no opinion about
# tone or structure. Skills are lightweight guides that carry judgment rather
# than prescription; the only things worth gating are the facts that decide
# whether a skill loads at all and whether it is safe to have published.
#
# The predecessor to this workflow gated on a description character ceiling that
# no skill in the corpus could meet, so it was red from its first run. A gate
# nobody can pass teaches contributors to read red as normal, which is worse than
# having no gate. Every check here was verified green against the corpus before
# landing, and each one has a fixture that proves it can still fail --
# `.github/scripts/tests/fixtures/skill-*/fail/`, run by the self-test job below.
# A check never proven to fail is not evidence of anything.
#
# Free-account / no-billing constraint: this only runs on PUBLIC consumer repos.
# On a free org with no billing, private-repo CI is unrunnable, so a gate that
# fired there would be a gate that can never report. The visibility guard lives
# on validate-base.yml's scan job, which this delegates to.
#
# The `scan` job runs only when a target repo is named explicitly. This host repo
# publishes no skills, so an unguarded self-scan would find no corpus and fail --
# and the fixtures below deliberately contain violations. Editing the validator
# therefore runs the self-test, not the scan.
#
# Chain depth: consumer ci.yml (L1) -> this (L2) -> validate-base.yml (L3), one
# level inside the 4-level workflow_call limit.
#
# Per the reusable-call permission intersection, this declares NO workflow-level
# `permissions:` block -- a zero floor here would cap every caller at zero. Least
# privilege sits on the job that performs the operation.

name: validate-skill-hygiene

on:
  workflow_call:
    inputs:
      repo:
        description: 'Owner/name of the skill-publishing repo to validate. Required; the scan is skipped when empty.'
        type: string
        required: false
        default: ''
      dry-run:
        description: 'Run checks but do not fail the job on findings.'
        type: boolean
        required: false
        default: false
    outputs:
      total-violations:
        description: 'Count of skill-hygiene findings.'
        value: ${{ jobs.scan.outputs.total-violations }}

  workflow_dispatch:
    inputs:
      repo:
        description: 'Owner/name of the skill-publishing repo to validate (e.g. swift-institute/Skills).'
        type: string
        required: false
        default: ''
      dry-run:
        description: 'Run checks but do not fail the job on findings.'
        type: boolean
        required: false
        default: false

  # Self-test only. These paths change the checker, not any corpus, so they run
  # the fixtures and leave `scan` skipped.
  push:
    branches: [main]
    paths:
      - '.github/scripts/validate-skill-hygiene.py'
      - '.github/scripts/tests/fixtures/skill-**'
      - '.github/scripts/tests/run.sh'
      - '.github/workflows/validate-skill-hygiene.yml'
  pull_request:
    paths:
      - '.github/scripts/validate-skill-hygiene.py'
      - '.github/scripts/tests/fixtures/skill-**'
      - '.github/scripts/tests/run.sh'
      - '.github/workflows/validate-skill-hygiene.yml'

jobs:
  # Proves each check can still fail. Every skill-* fixture under fail/ must
  # produce a finding and every pass/ and edge/ fixture must produce none;
  # run.sh exits nonzero otherwise. Scoped to the `skill-` prefix so this job
  # gates only the rules it owns.
  self-test:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Run skill-hygiene fixtures
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/tests/run.sh skill- | tee /tmp/fixtures.txt

      - name: Step summary
        if: always()
        shell: bash
        run: |
          {
            echo "## validate-skill-hygiene self-test"
            echo
            echo "Each check's positive control: a fixture under"
            echo "\`fixtures/skill-*/fail/\` that MUST produce a finding."
            echo
            echo '```'
            cat /tmp/fixtures.txt 2>/dev/null || echo "(fixture run produced no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  scan:
    if: ${{ inputs.repo != '' }}
    uses: ./.github/workflows/validate-base.yml
    with:
      validator-script: .github/scripts/validate-skill-hygiene.py
      rule-id-regex: '^skill-'
      discovery-mode: single-target
      target-repo: ${{ inputs.repo }}
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit
