name: reconcile-project-invariants

# Scheduled reconciler for the Institute Work Project (org swift-institute,
# ProjectV2 number 2) partitioned-authority invariants (#68, ratified
# 2026-07-30; filed as #103).
#
# The org is on the free plan: the Project has no auto-add/auto-archive
# workflows and Actions has no ProjectV2 trigger, so the coordination
# invariants of the partitioned-authority model are observable only if
# something observes them on a schedule. This workflow observes and
# reports; per the #114 ruling (ratified 2026-07-30, comment
# 5129159993) it also applies exactly two idempotent mutations to the
# Project itself, and — per #76/#121 (the org Issue Types permission was
# confirmed granted on the installation, 2026-08-10) — assigns an org
# issue type to open issues whose type is mechanically derivable from
# the issue-form headers rendered in their bodies. Everything else it
# finds remains report-only, and beyond that type assignment it never
# mutates any issue except the lifecycle of its single divergence issue
# in this repository.
#
# The two ratified mutations (#116):
#   (a) set Priority = Normal on any Project row whose Priority is unset
#       — the ratified admission default applied mechanically, not a
#       judgment. Closes the known residue of the one adopted built-in
#       workflow (auto-add sub-issues), whose rows always arrive with
#       Priority unset.
#   (b) clear the built-in Status field on any row where it is set —
#       mechanical enforcement of the keep-Status-unset invariant.
# The third mutation class (#76/#121): assign an issue type to any open
# untyped issue in the minted org whose type is derivable from the
# issue-form header signature in its body (each form in
# .github/ISSUE_TEMPLATE stamps a `type:` on new filings, so the residue
# is issues filed before the forms carried types, plus machine-filed
# reports). Derivation is exact-signature matching, never guessing; the
# underivable remainder is reported in its own section.
# Not-planned row detection and removal stay report-only per the same
# ruling: a mistaken not-planned closure would silently lose programme
# history, so removal remains a coordinator judgment.
#
# Both mutations are idempotent (setting Normal on an already-Normal row,
# or clearing an already-unset Status, is a no-op) and are listed in the
# divergence report under their own section rather than folded into the
# gap count — a row this run just fixed is not a lingering divergence.
# `dry-run` (validation dispatches) skips both mutations as well as the
# issue lifecycle, so a validation run never writes to the live Project.
#
# One report section is informational rather than an invariant: assigned
# open rows. Per the assignee-on-dispatch ruling (#68, ratified
# 2026-07-30, comment 5130968260; reconciler change #119), an open
# Issue's assignee asserts "in flight now", so the report lists every
# assigned open row with its assignees and updatedAt. A nonzero set is
# normal and never counts as divergence; a row lingering across runs is
# drift for the coordinator to judge. Report-only — no third mutation.
#
# Invariants checked each run:
#   - every Project item has a Priority; every on-Project issue has an
#     issue type
#   - the built-in Status field is unset on all items
#   - no draft items, no pull-request rows, no archived rows
#   - no rows for issues closed as not planned or as duplicates
#     (flagged for removal; the removal itself remains a judgment)
#   - no bot-authored issues on the Project
#   - open human-filed issues in Institute orgs absent from the Project
#     are surfaced for an admission decision — never auto-admitted
#   - issue-type parity per org: Task/Bug/Feature everywhere; Goal only
#     in swift-institute
#   - every open issue in every reconciled org carries an issue type:
#     derivable gaps in the minted org are assigned, everything else is
#     reported (#76/#121)
#   - every open Goal issue (swift-institute/.github, the only repository
#     where the Goal issue type is enabled) carries the record-grammar
#     core fields the goal.yml form renders (#126 §5/§6, filed as #129/
#     #130): Kind, Owner coordinate, Grammar version. Report-only and
#     decidable-core-only by design — the Status field predicate and the
#     rest of §6's predicate catalogue are deferred, not covered here.
#
# Reporting mechanics: one divergence issue in this repository, found by
# TITLE match — never by label (a prior sweep keyed control flow off a
# label that had never been created, so its close-when-clean path could
# not fire even on a clean fleet). The label passed to the upsert
# composite is identification only; no step's control flow reads it.
# The issue is closed when a run finds the fleet clean.
#
# Failure shape: `gh api graphql` can exit 0 while reporting a GraphQL
# error on stderr and null data on stdout (observed on run 30526232415:
# "Resource not accessible by integration" followed by a jq
# iterate-over-null crash). Every response is therefore validated with
# `jq -e` before use, and a failed or null response fails the run with
# the raw API error surfaced — never a downstream jq stack trace.
#
# Quota discipline: the REST/GraphQL budget is shared. One paginated
# Project read, one paginated issue search per org, one issue-type read
# per org, one field-metadata read; no polling. The ratified mutations
# are necessarily per-item (a Project field-value write has no batch
# form; neither does updateIssueIssueType), bounded to the rows actually
# missing Priority, carrying a set Status, or missing a derivable issue
# type, and idempotent.
#
# Known scope limits, recorded rather than silently assumed away:
#   - the minted App token is the swift-institute org installation, so
#     open issues in OTHER orgs' private repositories are not visible to
#     the search leg (private repositories do not run CI and their
#     issues are not expected on the Project);
#   - Project rows whose content lives in a repository the token cannot
#     read resolve with null/REDACTED content; they are reported in
#     their own section instead of crashing or being misclassified;
#   - the org issueTypes resource is org-local to the minted
#     installation. The Issue Types permission is granted and minted
#     here (issue_types: write, confirmed 2026-08-10 per #121), so the
#     home-org read and the assignment mutation work — but a read
#     against ANOTHER org can still come back FORBIDDEN, which degrades
#     to a per-org "parity unobservable" line in the report instead of
#     failing the run. Issue-type assignment is likewise bounded to the
#     minted org; a derivable issue elsewhere is reported, not written.

on:
  schedule:
    - cron: '15 5 * * *'   # daily, offset from the 04:00 UTC metadata cron
  workflow_dispatch:
    inputs:
      dry-run:
        description: >
          Report to the run summary only; do not create, update, or
          close the divergence issue, and do not apply the Priority or
          Status mutations to the Project. Validation dispatches use
          this.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: reconcile-project-invariants
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Read Institute orgs
        id: orgs
        uses: swift-institute/.github/.github/actions/read-orgs@4a6824c8ccf6ef97bc1fdfb12a193d4bd9151329  # main 2026-08-04, identity-pin to main HEAD (swift-institute/.github#286); no functional change to this action in range

      # organization-projects: write, per #116 — the ratified Priority and
      # Status mutations write Project-owned fields (field-value writes are
      # gated on the Projects permission; there is no separate item-mutate
      # scope). issues: divergence-issue lifecycle plus issue content on
      # items. pull-requests: item content casts (a PR row is itself a
      # reported divergence, but reading it must not be denied).
      # issue-types write: the org issueTypes read (parity) plus the
      # updateIssueIssueType assignment mutation (#76/#121). The org
      # Issue Types permission is in the installation's granted set
      # (confirmed 2026-08-10; installation key `issue_types`), which
      # supersedes the earlier organization-administration probe — that
      # probe grant is dropped here. metadata is implied by any grant;
      # named for clarity.
      - name: Mint installation token (project read/write, issue + issue-type write)
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: swift-institute
          permission-organization-projects: write
          permission-issue-types: write
          permission-issues: write
          permission-pull-requests: read
          permission-metadata: read

      - name: Observe Project and issue invariants
        id: scan
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ORGS: ${{ steps.orgs.outputs.orgs }}
          DRY_RUN: ${{ inputs.dry-run == true }}
        run: |
          set -euo pipefail
          workdir="${RUNNER_TEMP}/project-reconciler"
          mkdir -p "$workdir"

          # Run a GraphQL query into <out>; keep stderr beside it. gh can
          # exit 0 while reporting a GraphQL error on stderr with null
          # data on stdout, so success here means only "a response was
          # written" — require_data does the semantic validation.
          gql() {
            local out="$1"; shift
            if ! gh api graphql "$@" > "$out" 2> "${out}.stderr"; then
              echo "::error::GraphQL call failed (${out##*/}); API error follows"
              cat "${out}.stderr" >&2
              [ -s "$out" ] && cat "$out" >&2
              return 1
            fi
            if [ -s "${out}.stderr" ]; then
              echo "GraphQL reported errors alongside ${out##*/}:" >&2
              cat "${out}.stderr" >&2
            fi
          }

          # Fail the run with the raw response and API error surfaced when
          # a response does not satisfy the expected-shape predicate.
          require_data() {
            local file="$1" predicate="$2" label="$3"
            if ! jq -e "$predicate" "$file" > /dev/null; then
              echo "::error::${label}: response missing expected data; raw response and API error follow"
              cat "$file" >&2
              [ -s "${file}.stderr" ] && cat "${file}.stderr" >&2
              return 1
            fi
          }

          # ── One paginated read of every Project item ────────────────
          gql "$workdir/items-raw.json" --paginate --slurp -f query='
            query($endCursor: String) {
              organization(login: "swift-institute") {
                projectV2(number: 2) {
                  items(first: 50, after: $endCursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      id
                      type
                      isArchived
                      priority: fieldValueByName(name: "Priority") {
                        ... on ProjectV2ItemFieldSingleSelectValue { name }
                      }
                      status: fieldValueByName(name: "Status") {
                        ... on ProjectV2ItemFieldSingleSelectValue { name }
                      }
                      content {
                        __typename
                        ... on Issue {
                          url
                          state
                          stateReason
                          updatedAt
                          author { login }
                          issueType { name }
                          assignees(first: 10) { nodes { login } }
                        }
                        ... on PullRequest { url }
                        ... on DraftIssue { title }
                      }
                    }
                  }
                }
              }
            }'
          require_data "$workdir/items-raw.json" \
            'type == "array" and length > 0 and all(.[]; .data.organization.projectV2.items.nodes != null)' \
            "Project items query (org swift-institute, ProjectV2 2)"
          jq '[.[].data.organization.projectV2.items.nodes[] | select(. != null)]' \
            "$workdir/items-raw.json" > "$workdir/items.json"

          item_name='(.content.url // .content.title // "unidentified item")'
          jq -r "[.[] | select(.priority == null) | $item_name] | .[]" \
            "$workdir/items.json" > "$workdir/missing-priority.txt"
          # id-carrying form of the same selection: the mutation loop below
          # needs the Project item id, not just the display name.
          jq -c "[.[] | select(.priority == null) | {id, name: $item_name}] | .[]" \
            "$workdir/items.json" > "$workdir/missing-priority.json"
          jq -r "[.[] | select(.content.__typename == \"Issue\" and .content.issueType == null) | $item_name] | .[]" \
            "$workdir/items.json" > "$workdir/missing-type.txt"
          jq -r "[.[] | select(.status != null) | $item_name] | .[]" \
            "$workdir/items.json" > "$workdir/status-set.txt"
          jq -c "[.[] | select(.status != null) | {id, name: $item_name}] | .[]" \
            "$workdir/items.json" > "$workdir/status-set.json"
          # Item `type` (not content __typename): it stays readable even
          # when the token cannot read the content itself.
          jq -r "[.[] | select(.type == \"DRAFT_ISSUE\") | $item_name] | .[]" \
            "$workdir/items.json" > "$workdir/draft-rows.txt"
          jq -r "[.[] | select(.type == \"PULL_REQUEST\") | $item_name] | .[]" \
            "$workdir/items.json" > "$workdir/pull-request-rows.txt"
          jq -r "[.[] | select(.isArchived) | $item_name] | .[]" \
            "$workdir/items.json" > "$workdir/archived-rows.txt"
          jq -r "[.[] | select(.content.__typename == \"Issue\"
                   and .content.state == \"CLOSED\"
                   and (.content.stateReason == \"NOT_PLANNED\" or .content.stateReason == \"DUPLICATE\"))
                 | $item_name] | .[]" \
            "$workdir/items.json" > "$workdir/not-planned-rows.txt"
          jq -r "[.[] | select(.content.__typename == \"Issue\"
                   and (.content.author.login // \"\" | startswith(\"swift-institute-bot\")))
                 | $item_name] | .[]" \
            "$workdir/items.json" > "$workdir/bot-rows.txt"
          # Rows whose content the token cannot read (REDACTED type, or an
          # issue/PR row with null content): private or foreign-org content.
          jq -r '[.[] | select(.type == "REDACTED" or (.type != "DRAFT_ISSUE" and .content == null))
                 | "row of type \(.type) whose content is not readable by the bot token"] | .[]' \
            "$workdir/items.json" > "$workdir/unreadable-rows.txt"
          jq -r '[.[] | select(.content.__typename == "Issue") | .content.url] | .[]' \
            "$workdir/items.json" | sort -u > "$workdir/admitted-urls.txt"
          # Assigned open rows: the in-flight claim set per the
          # assignee-on-dispatch ruling (#68). Informational — never a
          # divergence, never mutated.
          jq -r '[.[] | select(.content.__typename == "Issue"
                   and .content.state == "OPEN"
                   and ((.content.assignees.nodes // []) | length > 0))
                 | "\(.content.url) — \([.content.assignees.nodes[].login] | join(", ")); issue updatedAt \(.content.updatedAt)"] | .[]' \
            "$workdir/items.json" > "$workdir/assigned-open.txt"

          # ── Ratified mutations (#114/#116) ──────────────────────────
          # Exactly two idempotent writes to the Project itself: set
          # Priority = Normal on rows missing it, clear Status on rows
          # where it is set. Everything else observed above stays
          # report-only. dry-run (validation dispatches) skips both, so
          # a validation run never writes to the live Project.
          : > "$workdir/applied-priority.txt"
          : > "$workdir/applied-status.txt"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "dry-run: skipping the Priority/Status mutations." >&2
          else
            # One field-metadata read to resolve the Project id, the
            # Priority field id + its "Normal" option id, and the Status
            # field id. Not paginated: a Project has a small, fixed field
            # set, unrelated to the paginated item count above.
            gql "$workdir/project-fields.json" -f query='
              query {
                organization(login: "swift-institute") {
                  projectV2(number: 2) {
                    id
                    priorityField: field(name: "Priority") {
                      ... on ProjectV2SingleSelectField { id options { id name } }
                    }
                    statusField: field(name: "Status") {
                      ... on ProjectV2SingleSelectField { id }
                    }
                  }
                }
              }'
            require_data "$workdir/project-fields.json" \
              '.data.organization.projectV2.id != null
               and .data.organization.projectV2.priorityField.id != null
               and .data.organization.projectV2.statusField.id != null' \
              "Project field metadata (Priority/Status field ids)"

            project_id=$(jq -r '.data.organization.projectV2.id' "$workdir/project-fields.json")
            priority_field_id=$(jq -r '.data.organization.projectV2.priorityField.id' "$workdir/project-fields.json")
            status_field_id=$(jq -r '.data.organization.projectV2.statusField.id' "$workdir/project-fields.json")
            normal_option_id=$(jq -r '.data.organization.projectV2.priorityField.options[]
              | select(.name == "Normal") | .id' "$workdir/project-fields.json")
            if [[ -z "$normal_option_id" || "$normal_option_id" == "null" ]]; then
              echo "::error::Priority field has no 'Normal' option; cannot apply the ratified default. Refusing to mutate."
              exit 1
            fi

            mutation_failures=0

            # (a) Priority = Normal on every row missing it.
            while IFS= read -r row; do
              [ -z "$row" ] && continue
              item_id=$(jq -r '.id' <<< "$row")
              item_label=$(jq -r '.name' <<< "$row")
              out="$workdir/mutate-priority-${item_id//[!A-Za-z0-9]/_}.json"
              if gh api graphql -f query='
                  mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $project, itemId: $item, fieldId: $field,
                      value: { singleSelectOptionId: $option }
                    }) { projectV2Item { id } }
                  }' -f project="$project_id" -f item="$item_id" -f field="$priority_field_id" \
                  -f option="$normal_option_id" > "$out" 2> "${out}.stderr" \
                && jq -e '.data.updateProjectV2ItemFieldValue.projectV2Item.id != null' "$out" > /dev/null; then
                echo "$item_label" >> "$workdir/applied-priority.txt"
              else
                echo "::error::Setting Priority=Normal failed for ${item_label}; API response/error follows"
                cat "${out}.stderr" >&2 2>/dev/null || true
                [ -s "$out" ] && cat "$out" >&2
                mutation_failures=$((mutation_failures + 1))
              fi
            done < "$workdir/missing-priority.json"

            # (b) clear Status on every row where it is set.
            while IFS= read -r row; do
              [ -z "$row" ] && continue
              item_id=$(jq -r '.id' <<< "$row")
              item_label=$(jq -r '.name' <<< "$row")
              out="$workdir/mutate-status-${item_id//[!A-Za-z0-9]/_}.json"
              if gh api graphql -f query='
                  mutation($project: ID!, $item: ID!, $field: ID!) {
                    clearProjectV2ItemFieldValue(input: {
                      projectId: $project, itemId: $item, fieldId: $field
                    }) { projectV2Item { id } }
                  }' -f project="$project_id" -f item="$item_id" -f field="$status_field_id" \
                  > "$out" 2> "${out}.stderr" \
                && jq -e '.data.clearProjectV2ItemFieldValue.projectV2Item.id != null' "$out" > /dev/null; then
                echo "$item_label" >> "$workdir/applied-status.txt"
              else
                echo "::error::Clearing Status failed for ${item_label}; API response/error follows"
                cat "${out}.stderr" >&2 2>/dev/null || true
                [ -s "$out" ] && cat "$out" >&2
                mutation_failures=$((mutation_failures + 1))
              fi
            done < "$workdir/status-set.json"

            if [[ "$mutation_failures" -gt 0 ]]; then
              echo "::error::${mutation_failures} Project mutation(s) failed; see surfaced API errors above. Refusing to file a report against an incompletely-applied mutation set."
              exit 1
            fi
          fi

          # ── Per-org sweeps: open human issues + issue-type parity ───
          # Collect every org failure before failing, so one red run
          # defines the complete blocker set instead of the first one.
          : > "$workdir/open-issues.txt"
          : > "$workdir/type-parity.txt"
          org_failures=0
          for org in $(jq -r '.[]' <<< "$ORGS"); do
            if ! gql "$workdir/search-${org}.json" --paginate --slurp \
              -f query="
                query(\$endCursor: String) {
                  search(type: ISSUE, first: 100, after: \$endCursor,
                         query: \"org:${org} is:issue is:open archived:false\") {
                    pageInfo { hasNextPage endCursor }
                    nodes { ... on Issue { id url body author { login } issueType { name } } }
                  }
                }"; then
              org_failures=$((org_failures + 1)); continue
            fi
            if ! require_data "$workdir/search-${org}.json" \
              'type == "array" and all(.[]; .data.search.nodes != null)' \
              "Open-issue search (org ${org})"; then
              org_failures=$((org_failures + 1)); continue
            fi
            jq -r '[.[].data.search.nodes[]
                    | select(. != null and .url != null)
                    | select(.author.login // "" | startswith("swift-institute-bot") | not)
                    | .url] | .[]' \
              "$workdir/search-${org}.json" >> "$workdir/open-issues.txt"

            # The org issueTypes list is gated on the org-level Issue
            # Types permission, which no installation of the App has been
            # granted, and the resource is org-local to the minted
            # installation besides — so a FORBIDDEN read is an
            # observability gap the report states per org, not a run
            # failure. Every other failure class still fails the run.
            types_out="$workdir/types-${org}.json"
            if gh api graphql -f query='
                query($org: String!) {
                  organization(login: $org) {
                    issueTypes(first: 25) { nodes { id name isEnabled } }
                  }
                }' -f org="$org" > "$types_out" 2> "${types_out}.stderr" \
              && jq -e '.data.organization.issueTypes.nodes != null' "$types_out" > /dev/null; then
              : # readable; parity is checked below
            elif jq -e '[.errors[]? | select(.type == "FORBIDDEN")] | length > 0' "$types_out" > /dev/null 2>&1 \
              || grep -q "Resource not accessible by integration" "${types_out}.stderr"; then
              echo "${org}: issue-type parity unobservable — the bot token was denied the org issueTypes read" \
                >> "$workdir/type-parity.txt"
              continue
            else
              echo "::error::GraphQL call failed (types-${org}.json); API error follows"
              cat "${types_out}.stderr" >&2
              { [ -s "$types_out" ] && cat "$types_out" >&2; } || true
              org_failures=$((org_failures + 1)); continue
            fi
            types=$(jq -r '[.data.organization.issueTypes.nodes[] | select(.isEnabled) | .name] | sort | join(",")' \
              "$workdir/types-${org}.json")
            for required in Task Bug Feature; do
              case ",${types}," in
                *",${required},"*) ;;
                *) echo "${org}: missing enabled issue type ${required}" >> "$workdir/type-parity.txt" ;;
              esac
            done
            case ",${types}," in
              *",Goal,"*)
                if [[ "$org" != "swift-institute" ]]; then
                  echo "${org}: Goal issue type enabled outside swift-institute" >> "$workdir/type-parity.txt"
                fi
                ;;
              *)
                if [[ "$org" == "swift-institute" ]]; then
                  echo "${org}: Goal issue type missing" >> "$workdir/type-parity.txt"
                fi
                ;;
            esac
          done
          if [[ "$org_failures" -gt 0 ]]; then
            echo "::error::${org_failures} org sweep(s) failed; see the surfaced API errors above. Observation data is incomplete, so no report is filed."
            exit 1
          fi
          # ── Issue-type enforcement (#76/#121) ───────────────────────
          # Every open issue in a reconciled org must carry an org issue
          # type. Where the type is mechanically derivable from the
          # issue-form header signature rendered in the body, the
          # reconciler assigns it; everything underivable is reported,
          # never guessed. Assignment is bounded to the minted
          # installation's org (swift-institute); a derivable issue in
          # another org is reported as pending that org's own mint, not
          # silently skipped.
          #
          # Header-signature derivation, mirroring .github/ISSUE_TEMPLATE
          # (an Issue Forms field renders as a "### <Label>" header):
          #   bug.yml           → Bug     (Observed behavior + Expected behavior)
          #   goal.yml          → Goal    (Kind + Owner coordinate + Objective)
          #   task.yml          → Task    (Kind + Owner coordinate + Problem + Proposed outcome)
          #   documentation.yml → Task    (Documentation gap + Proposed correction)
          #   change.yml        → Feature (Problem + Proposed outcome, without Kind)
          # Order matters: the more specific signatures are tested first,
          # so change.yml's pair only matches when task.yml's record-
          # grammar headers are absent.
          derive_type() {
            local body="$1"
            has_header() { grep -qFx "### $1" <<< "$body"; }
            if has_header "Observed behavior" && has_header "Expected behavior"; then echo "Bug"
            elif has_header "Kind" && has_header "Owner coordinate" && has_header "Objective"; then echo "Goal"
            elif has_header "Kind" && has_header "Owner coordinate" && has_header "Problem" && has_header "Proposed outcome"; then echo "Task"
            elif has_header "Documentation gap" && has_header "Proposed correction"; then echo "Task"
            elif has_header "Problem" && has_header "Proposed outcome"; then echo "Feature"
            else echo ""
            fi
          }

          : > "$workdir/applied-type.txt"
          : > "$workdir/type-underivable.txt"
          : > "$workdir/type-derived-unapplied.txt"
          type_mutation_failures=0
          for org in $(jq -r '.[]' <<< "$ORGS"); do
            [ -s "$workdir/search-${org}.json" ] || continue
            jq -c '.[].data.search.nodes[]
                    | select(. != null and .url != null and .issueType == null)
                    | {id, url, body}' \
              "$workdir/search-${org}.json" > "$workdir/untyped-${org}.jsonl"
            while IFS= read -r row; do
              [ -z "$row" ] && continue
              issue_id=$(jq -r '.id' <<< "$row")
              issue_url=$(jq -r '.url' <<< "$row")
              issue_body=$(jq -r '.body // ""' <<< "$row")
              derived=$(derive_type "$issue_body")
              if [ -z "$derived" ]; then
                echo "$issue_url" >> "$workdir/type-underivable.txt"
                continue
              fi
              if [[ "$org" != "swift-institute" ]]; then
                echo "${issue_url} — derivable as ${derived}; not applied (token is the swift-institute installation)" \
                  >> "$workdir/type-derived-unapplied.txt"
                continue
              fi
              if [[ "$DRY_RUN" == "true" ]]; then
                echo "${issue_url} — derivable as ${derived} (dry-run: not applied)" \
                  >> "$workdir/type-derived-unapplied.txt"
                continue
              fi
              type_id=$(jq -r --arg n "$derived" \
                '.data.organization.issueTypes.nodes[] | select(.name == $n and .isEnabled) | .id' \
                "$workdir/types-swift-institute.json" 2>/dev/null || true)
              if [[ -z "$type_id" || "$type_id" == "null" ]]; then
                echo "::error::Derived type ${derived} has no enabled id in the swift-institute issueTypes read; refusing to mutate ${issue_url}"
                type_mutation_failures=$((type_mutation_failures + 1))
                continue
              fi
              out="$workdir/mutate-type-${issue_id//[!A-Za-z0-9]/_}.json"
              if gh api graphql -f query='
                  mutation($issue: ID!, $type: ID!) {
                    updateIssueIssueType(input: { issueId: $issue, issueTypeId: $type }) {
                      issue { id }
                    }
                  }' -f issue="$issue_id" -f type="$type_id" > "$out" 2> "${out}.stderr" \
                && jq -e '.data.updateIssueIssueType.issue.id != null' "$out" > /dev/null; then
                echo "${issue_url} — ${derived}" >> "$workdir/applied-type.txt"
              else
                echo "::error::Assigning issue type ${derived} failed for ${issue_url}; API response/error follows"
                cat "${out}.stderr" >&2 2>/dev/null || true
                [ -s "$out" ] && cat "$out" >&2
                type_mutation_failures=$((type_mutation_failures + 1))
              fi
            done < "$workdir/untyped-${org}.jsonl"
          done
          if [[ "$type_mutation_failures" -gt 0 ]]; then
            echo "::error::${type_mutation_failures} issue-type assignment(s) failed; see the surfaced API errors above. Refusing to file a report against an incompletely-applied mutation set."
            exit 1
          fi

          sort -u "$workdir/open-issues.txt" > "$workdir/open-issues-sorted.txt"
          comm -23 "$workdir/open-issues-sorted.txt" "$workdir/admitted-urls.txt" \
            > "$workdir/awaiting-admission.txt"

          # ── Record-grammar core presence on Goal issues (#126 §5/§6, filed as #130) ──
          # Report-only, per the enforcement-host ruling: new predicates land
          # report-only first. Decidable slice only — the three record-grammar
          # core fields the goal.yml form (#129) renders as headers (Kind,
          # Owner coordinate, Grammar version). Status is deferred (#130):
          # its value space is not yet fixed anywhere machine-readable. The
          # Goal issue type is swift-institute-only (enforced by the
          # issue-type parity check above), so this reads one repository,
          # not every org.
          : > "$workdir/goal-grammar-gaps.txt"
          gql "$workdir/goal-issues.json" --paginate --slurp -f query='
            query($endCursor: String) {
              repository(owner: "swift-institute", name: ".github") {
                issues(states: OPEN, first: 50, after: $endCursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes { url body issueType { name } }
                }
              }
            }'
          require_data "$workdir/goal-issues.json" \
            'type == "array" and length > 0 and all(.[]; .data.repository.issues.nodes != null)' \
            "Goal-issue body read (swift-institute/.github)"
          jq '[.[].data.repository.issues.nodes[] | select(.issueType.name == "Goal")]' \
            "$workdir/goal-issues.json" > "$workdir/goal-issues-only.json"

          # A rendered Issue Forms field is a "### <Label>" header followed
          # by its answer (or the literal "_No response_" placeholder when
          # left blank). Missing the header entirely (a Goal filed before
          # #129, or filed blank) and an explicit "_No response_" both count
          # as absent — this predicate reports absence, not just blankness.
          field_present() {
            local body="$1" label="$2"
            awk -v label="### ${label}" '
              BEGIN { found = 0; in_field = 0; answered = 0 }
              $0 == label { in_field = 1; found = 1; next }
              in_field && /^### / { in_field = 0 }
              in_field {
                line = $0; gsub(/^[ \t]+|[ \t]+$/, "", line)
                if (line != "" && line != "_No response_") answered = 1
              }
              END { print (found && answered) ? "1" : "0" }
            ' <<< "$body"
          }
          goal_count=$(jq 'length' "$workdir/goal-issues-only.json")
          for i in $(seq 0 $((goal_count - 1))); do
            [ "$goal_count" -eq 0 ] && break
            url=$(jq -r ".[$i].url" "$workdir/goal-issues-only.json")
            gbody=$(jq -r ".[$i].body" "$workdir/goal-issues-only.json")
            missing=""
            for label in "Kind" "Owner coordinate" "Grammar version"; do
              if [ "$(field_present "$gbody" "$label")" != "1" ]; then
                missing="${missing}${missing:+, }${label}"
              fi
            done
            if [ -n "$missing" ]; then
              echo "${url} — missing: ${missing}" >> "$workdir/goal-grammar-gaps.txt"
            fi
          done

          # ── Assemble the report ─────────────────────────────────────
          body="$workdir/body.md"
          gap_count=0
          {
            echo "Report-only reconciliation of the Institute Work Project"
            echo "invariants (#68 partitioned-authority model; reconciler per #103)."
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
          } > "$body"
          section() {
            local title="$1" file="$2" note="${3:-}"
            local count
            count=$(wc -l < "$file" | tr -d ' ')
            gap_count=$((gap_count + count))
            {
              echo "### ${title} (${count})"
              if [[ -n "$note" ]]; then echo "${note}"; echo ""; fi
              if [[ "$count" -gt 0 ]]; then
                sed 's/^/- /' "$file"
              else
                echo "None."
              fi
              echo ""
            } >> "$body"
          }
          # Same shape as section(), but does not add to gap_count: applied
          # mutations and informational listings (the assigned-open set) are
          # not lingering divergences requiring anyone's attention.
          section_uncounted() {
            local title="$1" file="$2" note="${3:-}"
            local count
            count=$(wc -l < "$file" | tr -d ' ')
            {
              echo "### ${title} (${count})"
              if [[ -n "$note" ]]; then echo "${note}"; echo ""; fi
              if [[ "$count" -gt 0 ]]; then
                sed 's/^/- /' "$file"
              else
                echo "None."
              fi
              echo ""
            } >> "$body"
          }
          if [[ "$DRY_RUN" == "true" ]]; then
            # No mutation ran; report the two categories as plain
            # divergences, same as every other report-only invariant.
            section "Items without a Priority (dry-run: not mutated)" "$workdir/missing-priority.txt"
            section "Items with the built-in Status field set (dry-run: not mutated)" "$workdir/status-set.txt"
          else
            section_uncounted "Priority set to Normal (mutation applied this run, #114/#116)" \
              "$workdir/applied-priority.txt" \
              "Idempotent: rows missing Priority are set to the ratified admission default. Not a lingering divergence."
            section_uncounted "Status cleared (mutation applied this run, #114/#116)" \
              "$workdir/applied-status.txt" \
              "Idempotent: the built-in Status field is cleared wherever set, enforcing the keep-Status-unset invariant. Not a lingering divergence."
          fi
          section "On-Project issues without an issue type" "$workdir/missing-type.txt"
          section "Draft items" "$workdir/draft-rows.txt"
          section "Pull-request rows" "$workdir/pull-request-rows.txt"
          section "Archived rows" "$workdir/archived-rows.txt"
          section "Rows for issues closed as not planned or duplicate" \
            "$workdir/not-planned-rows.txt" \
            "Flagged for removal; the removal itself remains a judgment and is never automated."
          section "Bot-authored issues on the Project" "$workdir/bot-rows.txt"
          section "Rows whose content the bot token cannot read" \
            "$workdir/unreadable-rows.txt" \
            "Private or foreign-org content; verify these rows by hand or widen the App installation."
          section "Issue-type parity" "$workdir/type-parity.txt"
          section_uncounted "Issue types assigned (mutation applied this run, #76/#121)" \
            "$workdir/applied-type.txt" \
            "Bounded to open issues in the minted org whose type is mechanically derivable from the issue-form header signature in their body. Not a lingering divergence."
          section "Open issues with a derivable type not applied" \
            "$workdir/type-derived-unapplied.txt" \
            "Dry-run entries, plus issues outside the minted swift-institute installation — applying those needs that org's own installation mint."
          section "Open issues without a derivable issue type" \
            "$workdir/type-underivable.txt" \
            "Reported, never guessed: no issue-form header signature matched. Machine-filed reports land here pending a typing ruling (#76)."
          section "Open issues awaiting an admission decision" \
            "$workdir/awaiting-admission.txt" \
            "Surfaced only; admission is a judgment no filter expresses, so nothing is auto-admitted."
          section "Goal issues missing record-grammar core fields" \
            "$workdir/goal-grammar-gaps.txt" \
            "Report-only per #126 §6 (enforcement-host ruling: new predicates land report-only first); decidable core only, filed as #130 — Kind / Owner coordinate / Grammar version presence, per the goal.yml form (#129). The Status field predicate and the remainder of §6's catalogue are deferred, not silently covered here."
          section_uncounted "Assigned open rows (claimed in-flight)" \
            "$workdir/assigned-open.txt" \
            "Informational, per the assignee-on-dispatch ruling (#68): an open Issue's assignee asserts in-flight-now. A nonzero set is normal; a row lingering across runs without activity is drift for the coordinator to judge. Nothing is mutated."

          echo "gap-count=${gap_count}" >> "$GITHUB_OUTPUT"
          echo "body-file=${body}" >> "$GITHUB_OUTPUT"
          {
            echo "## Project reconciler — ${gap_count} divergence(s)"
            echo ""
            cat "$body"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert divergence issue
        if: ${{ steps.scan.outputs.gap-count != '0' && inputs.dry-run != true }}
        uses: swift-institute/.github/.github/actions/upsert-tracking-issue@4a6824c8ccf6ef97bc1fdfb12a193d4bd9151329  # main 2026-08-04, identity-pin to main HEAD (swift-institute/.github#286); no functional change to this action in range
        with:
          repo: swift-institute/.github
          title: '[Project reconciler] Institute Work Project invariant divergence'
          title-prefix: '[Project reconciler]'
          body-file: ${{ steps.scan.outputs.body-file }}
          label: project-reconciler
          gh-token: ${{ steps.token.outputs.token }}

      - name: Close divergence issue when clean
        if: ${{ steps.scan.outputs.gap-count == '0' && inputs.dry-run != true }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          # Title-matched, never label-keyed: a minted label that was never
          # created would silently disable this close path.
          existing=$(gh issue list \
            --repo swift-institute/.github \
            --state open \
            --search '"[Project reconciler]" in:title' \
            --json number \
            --jq '.[].number')
          for n in $existing; do
            gh issue close "$n" \
              --repo swift-institute/.github \
              --comment "All Institute Work Project invariants clean as of run ${GITHUB_RUN_ID}; auto-closing."
          done
