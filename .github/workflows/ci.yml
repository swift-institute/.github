name: Embedded image canary

on:
  workflow_dispatch:
    inputs:
      subject-repository:
        description: Exact public package repository to exercise.
        required: false
        default: swift-atoms/swift-async
      subject-sha:
        description: Exact package commit to exercise.
        required: false
        default: 5fc20b1d2b1d1ba854c4070e67ef94b34898e9f9

permissions:
  actions: read
  contents: read

jobs:
  pal:
    name: Embedded PAL · Linux x86-64
    runs-on: ubuntu-latest
    container: swiftlang/swift@sha256:3f2ab3ce827824c997aed9e6b387641be37a0c7352d1527c01984b99448d9c29
    timeout-minutes: 10
    steps:
      - name: Compile, link and run through PAL
        shell: bash
        run: |
          set -euo pipefail
          swift --version
          PACKAGE="$RUNNER_TEMP/PAL"
          mkdir -p "$PACKAGE/Sources/PAL"
          cat > "$PACKAGE/Package.swift" <<'SWIFT'
          // swift-tools-version: 6.4
          import PackageDescription

          let package = Package(
            name: "PAL",
            products: [.executable(name: "PAL", targets: ["PAL"])],
            targets: [.executableTarget(name: "PAL")]
          )
          SWIFT
          cat > "$PACKAGE/Sources/PAL/PAL.swift" <<'SWIFT'
          @main
          struct Main {
            static func main() {
              print("Embedded PAL linked and ran")
            }
          }
          SWIFT
          swift build --package-path "$PACKAGE" -c release \
            -Xswiftc -enable-experimental-feature -Xswiftc Embedded \
            -Xlinker -lswiftEmbeddedPlatformPOSIX \
            -Xlinker -lswiftEmbeddedPlatformSingleThreaded
          "$PACKAGE/.build/release/PAL"

  package:
    name: ${{ inputs.subject-repository }}
    uses: ./.github/workflows/swift-ci.yml
    with:
      subject-repository: ${{ inputs.subject-repository }}
      subject-sha: ${{ inputs.subject-sha }}
