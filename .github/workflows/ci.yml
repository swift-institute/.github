name: Planner adoption canaries

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Immutable package subject to canary.
        required: true
        type: choice
        options:
          - swift-atoms/swift-cursor
          - swift-atoms/swift-either
          - swift-ietf/swift-rfc-1123

permissions:
  actions: read
  contents: read

jobs:
  swift-cursor:
    name: swift-atoms/swift-cursor
    if: ${{ inputs.repository == 'swift-atoms/swift-cursor' }}
    uses: ./.github/workflows/swift-ci.yml
    with:
      subject-repository: swift-atoms/swift-cursor
      subject-sha: 6bec11bc897abaff33bb4bfc5042c49e08f5eead

  swift-either:
    name: swift-atoms/swift-either
    if: ${{ inputs.repository == 'swift-atoms/swift-either' }}
    uses: ./.github/workflows/swift-ci.yml
    with:
      subject-repository: swift-atoms/swift-either
      subject-sha: a384d782b76cefd677efa98347609e003caed2e6

  swift-rfc-1123:
    name: swift-ietf/swift-rfc-1123
    if: ${{ inputs.repository == 'swift-ietf/swift-rfc-1123' }}
    uses: ./.github/workflows/swift-ci.yml
    with:
      subject-repository: swift-ietf/swift-rfc-1123
      subject-sha: d1882afef626d8bfb331821b4b9c5c88175dbee3
