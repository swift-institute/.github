name: Embedded image canary

on:
  workflow_dispatch:
    inputs:
      subject-repository:
        description: Exact public package repository to exercise.
        required: false
        default: swift-atoms/swift-async
      subject-sha:
        description: Exact package commit to exercise.
        required: false
        default: 5fc20b1d2b1d1ba854c4070e67ef94b34898e9f9

permissions:
  actions: read
  contents: read

jobs:
  pal:
    name: Embedded PAL · Linux x86-64
    runs-on: ubuntu-latest
    container: swiftlang/swift@sha256:3ae5234721c87bda6ab232a2346fc143ac5688159626c8800e66a5eef2a31a16
    timeout-minutes: 10
    steps:
      - name: Compile, link and run through PAL
        shell: bash
        run: |
          set -euo pipefail
          swift --version
          cat > "$RUNNER_TEMP/pal.swift" <<'SWIFT'
          @main
          struct Main {
            static func main() {
              print("Embedded PAL linked and ran")
            }
          }
          SWIFT
          swiftc "$RUNNER_TEMP/pal.swift" \
            -parse-as-library \
            -wmo \
            -warnings-as-errors \
            -enable-experimental-feature Embedded \
            -o "$RUNNER_TEMP/pal"
          "$RUNNER_TEMP/pal"

  package:
    name: ${{ inputs.subject-repository }}
    uses: ./.github/workflows/swift-ci.yml
    with:
      subject-repository: ${{ inputs.subject-repository }}
      subject-sha: ${{ inputs.subject-sha }}
