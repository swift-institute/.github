# review-pr-transaction.yml — public manual exact-head bot approval.
#
# This public workflow accepts only public target coordinates and public plans.
# Private repositories use the canonical caller distributed to their own
# private Actions surface; no private coordinate or plan enters this run.

name: review-pr-transaction

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Exact public Institute target repository in owner/name form.'
        required: true
        default: 'swift-institute/.github'
        type: string
      pull:
        description: 'Open pull-request number in the exact target repository.'
        required: true
        type: string
      accepted-plan:
        description: 'Exact accepted public plan JSON, including owning Issue and verification profile.'
        required: true
        type: string

permissions: {}

jobs:
  approve:
    if: ${{ !github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      contents: read
    uses: ./.github/workflows/review-pr-transaction-core.yml
    with:
      route: public
      repository: ${{ inputs.repository }}
      pull: ${{ inputs.pull }}
      accepted-plan: ${{ inputs.accepted-plan }}
    secrets:
      SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
