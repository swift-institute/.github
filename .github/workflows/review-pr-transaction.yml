# review-pr-transaction.yml — a manually invoked, exact-head bot approval.
#
# This workflow deliberately has no merge step. It approves only after the
# independent transaction model accepts a public, exact-head plan and all
# current-head merge prerequisites other than the approval it is about to add.
# `accepted-plan` is `Snapshot.Source.Plan` JSON. Its `verification` is exactly
# `{ "package": {} }`, `{ "control": { "checks": [<non-empty names>] } }`,
# `{ "reviewOnly": {} }`, or `{ "waveMechanical": { "checks": [<non-empty
# names>], "mechanical": true } }`; absent, empty, duplicate, or additional
# profile fields fail closed. `reviewOnly` is reserved for legitimately
# check-less PRs (paths outside every path-filtered workflow's trigger, e.g.
# Tools-only changes in this repository — swift-institute/.github#200): the
# Swift verification (PullRequest.Transaction+Verification.swift) accepts it only when
# the exact-head check-run collection is empty, and fails closed the instant
# any check run — including a synthesized full-tier run — is cited at that
# head. `waveMechanical` is the mechanical-remediation fast lane
# (swift-institute/.github#211): every named check must be green at the exact
# head, like `control`, but it deliberately admits no full-tier requirement —
# the mandatory post-merge full tier (verify-post-merge.yml) is the deferred
# gate. It is admissible only when the plan's own `mechanical: true` field
# attests the mechanical-remediation class; selecting the profile without
# that attestation fails closed exactly as an absent check list does.
# The approval body records which profile was used, naming the fast lane in
# the audit trail whenever it is the one that admitted the transaction.
# The target App token is scoped to one selected repository. Minting fails when
# that owner/repository is outside the App's existing Institute installations.
#
# The "Validate the guarded transaction" step never lets `set -e` fail a
# predicate silently (swift-institute/.github#288 Defect B): every gate
# evaluates its predicates independently and prints which one rejected the
# plan, and why, before exiting. The task-binding gate additionally admits an
# owning Issue whose `issueType` is `Goal`, not only `Task`/`Bug`/`Feature`
# (swift-institute/.github#288 Defect A) — a PR that founds a Goal (e.g. its
# governing programme document) legitimately has no narrower child issue to
# cite yet. This does not touch the `reviewOnly` security property itself:
# PullRequest.Transaction+Verification.swift still fails closed the instant any check
# run is cited at the exact head, unconditionally of the owning Issue's type.

name: review-pr-transaction

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Exact Institute target repository in owner/name form.'
        required: true
        default: 'swift-institute/.github'
        type: string
      pull:
        description: 'Open pull-request number in the exact target repository.'
        required: true
        type: string
      accepted-plan:
        description: 'Exact accepted plan JSON, including owning Issue and verification profile.'
        required: true
        type: string

permissions: {}

jobs:
  approve:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout transaction guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Never execute PR-controlled source while the App token exists.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # TX-1 of the reduction census (swift-institute/.github#515): the
      # transaction model now lives in its seeded repository,
      # swift-institute/institute-pull-request-transaction, and this workflow
      # consumes it from there instead of the retiring Tools/ copy. The seed
      # is private, so the checkout rides a transient App token scoped to
      # exactly that one repository with contents:read — the same
      # narrowed-mint shape private-verification.yml uses for its subject.
      # The token is minted BEFORE the reviewer token below and is never
      # persisted; the source it fetches is pinned, not PR-controlled, so
      # the "never execute PR-controlled source while the App token exists"
      # invariant on the self-checkout above is preserved.
      - name: Mint read-only token for the seeded transaction package
        id: prt-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: swift-institute
          repositories: institute-pull-request-transaction
          permission-contents: read

      - name: Checkout the seeded transaction package at exact main pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/institute-pull-request-transaction
          # Advance with pin-advance flow; must stay a full SHA (branch-pin
          # guard). Same pin as verify-post-merge.yml and tools-tests.yml.
          ref: 5528f99b5792c6bd65269b74f19d6e54e8b8316d
          path: .pr-transaction
          token: ${{ steps.prt-token.outputs.token }}
          persist-credentials: false

      - name: Select Swift 6.3
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: '6.3'

      - name: Resolve exact target scope
        id: target
        shell: bash
        env:
          # The workflow token, not the App token: this step only reads public
          # repository metadata, and it runs before any App token is minted.
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_PULL: ${{ inputs.pull }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::'repository' must be one exact owner/name coordinate."
            exit 1
          fi
          if [[ ! "$TARGET_PULL" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::'pull' must be one positive decimal pull-request number."
            exit 1
          fi
          target=$(gh api "repos/${TARGET_REPOSITORY}" | jq -ce \
            --arg repository "$TARGET_REPOSITORY" '
              select(.full_name == $repository and .visibility == "public")
              | { repository: .full_name, visibility }
            ')
          echo "repository=${TARGET_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "owner=${TARGET_REPOSITORY%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${TARGET_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          echo "pull=${TARGET_PULL}" >> "$GITHUB_OUTPUT"
          echo "target=${target}" >> "$GITHUB_OUTPUT"

      - name: Mint narrowed reviewer token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-metadata: read
          permission-contents: read
          permission-pull-requests: write

      - name: Validate the guarded transaction
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TARGET_REPOSITORY: ${{ steps.target.outputs.repository }}
          TARGET: ${{ steps.target.outputs.target }}
          PULL: ${{ steps.target.outputs.pull }}
          ACCEPTED_PLAN: ${{ inputs.accepted-plan }}
        run: |
          set -euo pipefail
          # Every rejection below prints which predicate rejected and why
          # before exiting, instead of relying on `set -e` to stop the
          # script silently (swift-institute/.github#288 Defect B). Each
          # gate below evaluates its predicates independently (never inside
          # a `select` chain) so a false result cannot be swallowed.
          repository="$TARGET_REPOSITORY"

          plan_check=$(jq -c '
            def nonempty_strings:
              type == "array" and length > 0 and all(.[]; type == "string" and length > 0);
            def exact_revision:
              type == "string" and test("^[0-9a-f]{40}$");
            def verification_ok:
              (keys == ["package"] and .package == {}) or
              (
                keys == ["control"] and
                (.control | keys == ["checks"]) and
                (.control.checks | nonempty_strings) and
                (.control.checks | unique | length) == (.control.checks | length)
              ) or
              (keys == ["reviewOnly"] and .reviewOnly == {}) or
              (
                keys == ["waveMechanical"] and
                (.waveMechanical | keys == ["checks","mechanical"]) and
                (.waveMechanical.checks | nonempty_strings) and
                (.waveMechanical.checks | unique | length) == (.waveMechanical.checks | length) and
                (.waveMechanical.mechanical == true)
              );
            if type != "object" then
              { ok: false, reasons: ["accepted-plan: top-level payload is not a JSON object"] }
            else
              ([
                { name: "accepted",           ok: (.accepted == true) },
                { name: "repository",         ok: (.repository | type == "string" and length > 0) },
                { name: "pull",               ok: (.pull | type == "number" and . > 0 and floor == .) },
                { name: "base",               ok: (.base | exact_revision) },
                { name: "head",               ok: (.head | exact_revision) },
                { name: "task",               ok: (
                                                 (.task | type == "object") and
                                                 (.task.repository | type == "string" and length > 0) and
                                                 (.task.number | type == "number" and . > 0 and floor == .) and
                                                 (.task.state == "OPEN")
                                               ) },
                { name: "verification",       ok: (.verification | verification_ok) },
                { name: "paths",              ok: (.paths | nonempty_strings) },
                { name: "evidence",           ok: (
                                                 (.evidence | type == "array" and length > 0) and
                                                 all(.evidence[]; (.command | type == "string" and length > 0) and .result == "success" and (.head | exact_revision))
                                               ) },
                { name: "payloadPreflighted", ok: (.payloadPreflighted == true) },
                { name: "nextOwner",          ok: (.nextOwner == "swift-institute-bot[bot]") }
              ]) as $predicates
              | {
                  ok: ([$predicates[].ok] | all),
                  reasons: [$predicates[] | select(.ok | not) | "accepted-plan: predicate \"\(.name)\" failed"],
                  plan: .
                }
            end
          ' <<<"$ACCEPTED_PLAN")
          if [[ "$(jq -r '.ok' <<<"$plan_check")" != "true" ]]; then
            jq -r '.reasons[] | "::error::" + .' <<<"$plan_check"
            exit 1
          fi
          plan=$(jq -c '.plan' <<<"$plan_check")

          pull=$(gh api "repos/${repository}/pulls/${PULL}")
          head=$(jq -er '.head.sha' <<<"$pull")
          base=$(jq -er '.base.sha' <<<"$pull")
          fixer=$(jq -er '.user.login' <<<"$pull")

          pr_state=$(jq -r '.state' <<<"$pull")
          if [[ "$pr_state" != "open" ]]; then
            echo "::error::pull request ${repository}#${PULL} state is '${pr_state}', not open."
            exit 1
          fi
          pr_draft=$(jq -r '.draft' <<<"$pull")
          if [[ "$pr_draft" != "false" ]]; then
            echo "::error::pull request ${repository}#${PULL} is a draft."
            exit 1
          fi
          plan_repository=$(jq -r '.repository' <<<"$plan")
          if [[ "$plan_repository" != "$repository" ]]; then
            echo "::error::accepted-plan repository '${plan_repository}' does not match target repository '${repository}'."
            exit 1
          fi
          plan_pull=$(jq -r '.pull' <<<"$plan")
          if [[ "$plan_pull" != "$PULL" ]]; then
            echo "::error::accepted-plan pull '${plan_pull}' does not match target pull '${PULL}'."
            exit 1
          fi

          task_repository=$(jq -er '.task.repository' <<<"$plan")
          task_number=$(jq -er '.task.number' <<<"$plan")
          if [[ ! "$task_repository" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Accepted-plan Task repository must be one exact owner/name coordinate."
            exit 1
          fi
          task_owner="${task_repository%/*}"
          task_name="${task_repository#*/}"
          target_owner="${repository%/*}"
          target_name="${repository#*/}"

          task_issue_json=$(gh api "repos/${task_repository}/issues/${task_number}")
          owning_task=$(jq -ce --arg repository "$task_repository" --argjson number "$task_number" '
            select(.number == $number and .state == "open" and (has("pull_request") | not))
            | { repository: $repository, number, state: "OPEN" }
          ' <<<"$task_issue_json") || {
            actual_number=$(jq -r '.number // "null"' <<<"$task_issue_json")
            actual_state=$(jq -r '.state // "null"' <<<"$task_issue_json")
            is_pull=$(jq -r 'has("pull_request")' <<<"$task_issue_json")
            echo "::error::task issue ${task_repository}#${task_number} is not an admissible owning task (number=${actual_number}, state=${actual_state}, isPullRequest=${is_pull})."
            exit 1
          }

          gh api --paginate --slurp \
            "repos/${repository}/pulls/${PULL}/reviews?per_page=100" \
            > "$RUNNER_TEMP/review-pages.json"
          # Preserve every API page and its declared total for the typed producer.
          # The producer combines the pages and fails closed if pagination is
          # absent, inconsistent, or incomplete.
          gh api --paginate --slurp \
            "repos/${repository}/commits/${head}/check-runs?per_page=100" \
            > "$RUNNER_TEMP/check-pages.json"
          gh api --paginate --slurp \
            "repos/${repository}/actions/runs?head_sha=${head}&per_page=100" \
            > "$RUNNER_TEMP/run-pages.json"
          gh api graphql -F owner="$target_owner" -F name="$target_name" -F number="${PULL}" \
            -F taskOwner="$task_owner" -F taskName="$task_name" -F task="${task_number}" -f query='
            query(
              $owner: String!, $name: String!, $number: Int!,
              $taskOwner: String!, $taskName: String!, $task: Int!
            ) {
              target: repository(owner: $owner, name: $name) {
                mergeCommitAllowed
                rebaseMergeAllowed
                squashMergeAllowed
                pullRequest(number: $number) {
                  reviewThreads(first: 100) { nodes { isResolved } pageInfo { hasNextPage } }
                  timelineItems(itemTypes: [CROSS_REFERENCED_EVENT], first: 100) {
                    nodes {
                      ... on CrossReferencedEvent {
                        source {
                          __typename
                          ... on Issue {
                            number
                            repository { nameWithOwner }
                          }
                          ... on PullRequest {
                            number
                            repository { nameWithOwner }
                          }
                        }
                      }
                    }
                    pageInfo { hasNextPage }
                  }
                }
              }
              taskRepository: repository(owner: $taskOwner, name: $taskName) {
                issue(number: $task) {
                  number
                  state
                  issueType { name }
                  repository { nameWithOwner }
                  timelineItems(itemTypes: [CROSS_REFERENCED_EVENT], first: 100) {
                    nodes {
                      ... on CrossReferencedEvent {
                        source {
                          __typename
                          ... on PullRequest {
                            number
                            repository { nameWithOwner }
                          }
                        }
                      }
                    }
                    pageInfo { hasNextPage }
                  }
                }
              }
            }' > "$RUNNER_TEMP/graph.json"

          graph_check=$(jq -c '
            (.data.target != null) as $targetExists
            | (.data.target.pullRequest != null) as $prExists
            | (.data.taskRepository.issue != null) as $issueExists
            | [
              { name: "target-repository", ok: $targetExists,
                message: "target repository \"\($repository)\" not found or inaccessible" },
              { name: "target-pull-request", ok: (if $targetExists then $prExists else true end),
                message: "pull request \($repository)#\($number) not found" },
              { name: "task-issue", ok: $issueExists,
                message: "task issue \($taskRepository)#\($task) not found" },
              { name: "task-issue-timeline-page",
                ok: (if $issueExists then (.data.taskRepository.issue.timelineItems.pageInfo.hasNextPage == false) else true end),
                message: "task issue \($taskRepository)#\($task) has more than 100 cross-referenced timeline items" },
              { name: "pr-review-threads-page",
                ok: (if $prExists then (.data.target.pullRequest.reviewThreads.pageInfo.hasNextPage == false) else true end),
                message: "pull request \($repository)#\($number) has more than 100 review threads" },
              { name: "pr-timeline-page",
                ok: (if $prExists then (.data.target.pullRequest.timelineItems.pageInfo.hasNextPage == false) else true end),
                message: "pull request \($repository)#\($number) has more than 100 cross-referenced timeline items" },
              { name: "task-issue-repository",
                ok: (if $issueExists then (.data.taskRepository.issue.repository.nameWithOwner == $taskRepository) else true end),
                message: "task issue repository \"\(.data.taskRepository.issue.repository.nameWithOwner // "null")\" does not match declared task repository \"\($taskRepository)\"" },
              { name: "task-issue-number",
                ok: (if $issueExists then (.data.taskRepository.issue.number == $task) else true end),
                message: "task issue number \(.data.taskRepository.issue.number // "null") does not match declared task number \($task)" },
              { name: "task-issue-open",
                ok: (if $issueExists then (.data.taskRepository.issue.state == "OPEN") else true end),
                message: "task issue \($taskRepository)#\($task) state is \"\(.data.taskRepository.issue.state // "null")\", not OPEN" },
              { name: "task-issue-type",
                # Goal is admissible alongside Task/Bug/Feature: a PR that
                # establishes a Goal itself (e.g. its founding programme
                # document) legitimately has no narrower child issue to cite
                # yet (swift-institute/.github#288 Defect A).
                ok: (if $issueExists then (.data.taskRepository.issue.issueType.name as $t | ($t == "Task" or $t == "Bug" or $t == "Feature" or $t == "Goal")) else true end),
                message: "task issue \($taskRepository)#\($task) issueType is \"\(.data.taskRepository.issue.issueType.name // "unset")\"; must be Task, Bug, Feature, or Goal" },
              { name: "task-pull-cross-reference",
                ok: (if ($issueExists and $prExists) then (
                  ([ (.data.taskRepository.issue.timelineItems.nodes // [])[].source
                     | select(.__typename == "PullRequest" and .repository.nameWithOwner == $repository and .number == $number) ] | length > 0)
                  or
                  ([ (.data.target.pullRequest.timelineItems.nodes // [])[].source
                     | select(.__typename == "Issue" and .repository.nameWithOwner == $taskRepository and .number == $task) ] | length > 0)
                ) else true end),
                message: "neither task issue \($taskRepository)#\($task) nor pull request \($repository)#\($number) cross-references the other" }
            ] as $predicates
            | {
                ok: ([$predicates[].ok] | all),
                reasons: [$predicates[] | select(.ok | not) | "task/PR binding: " + .message]
              }
          ' --arg repository "$repository" --arg taskRepository "$task_repository" \
            --argjson task "$task_number" --argjson number "$PULL" \
            "$RUNNER_TEMP/graph.json")
          if [[ "$(jq -r '.ok' <<<"$graph_check")" != "true" ]]; then
            jq -r '.reasons[] | "::error::" + .' <<<"$graph_check"
            exit 1
          fi

          jq -n \
            --arg repository "$repository" \
            --argjson target "$TARGET" \
            --argjson pull "$PULL" \
            --arg head "$head" \
            --arg base "$base" \
            --arg fixer "$fixer" \
            --argjson owningTask "$owning_task" \
            --argjson plan "$plan" \
            --slurpfile reviews "$RUNNER_TEMP/review-pages.json" \
            --slurpfile checks "$RUNNER_TEMP/check-pages.json" \
            --slurpfile runs "$RUNNER_TEMP/run-pages.json" \
            --slurpfile graph "$RUNNER_TEMP/graph.json" '
              {
                repository: $repository,
                target: $target,
                pull: $pull,
                base: $base,
                head: $head,
                fixer: $fixer,
                owningTask: $owningTask,
                plan: $plan,
                reviews: [ $reviews[0][][] | { actor: .user.login, state: .state, head: (.commit_id // "") } ],
                checkPages: [
                  $checks[0][]
                  | {
                      total: .total_count,
                      values: [
                        .check_runs[]
                        | { name: .name, head: .head_sha, conclusion: .conclusion }
                      ]
                    }
                ],
                runPages: [
                  $runs[0][]
                  | {
                      total: .total_count,
                      values: [
                        .workflow_runs[]
                        | { name: .name, event: .event, head: .head_sha, conclusion: .conclusion }
                      ]
                    }
                ],
                unresolvedThreads: ([ $graph[0].data.target.pullRequest.reviewThreads.nodes[] | select(.isResolved | not) ] | length),
                merge: {
                  squash: $graph[0].data.target.squashMergeAllowed,
                  mergeCommit: $graph[0].data.target.mergeCommitAllowed,
                  rebase: $graph[0].data.target.rebaseMergeAllowed
                }
              }
            ' > producer-input.json
          swift run --package-path .pr-transaction pr-transaction produce producer-input.json \
            > transaction.json
          swift run --package-path .pr-transaction pr-transaction review transaction.json
          # The plan already passed the closed-union `verification` gate
          # above, so its sole top-level key is exactly one of the four
          # known profile names — safe to interpolate into the approval
          # body verbatim below.
          profile=$(jq -er '.verification | keys[0]' <<<"$plan")
          echo "head=${head}" >> "$GITHUB_OUTPUT"
          echo "profile=${profile}" >> "$GITHUB_OUTPUT"

      - name: Approve the still-current head
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TARGET_REPOSITORY: ${{ steps.target.outputs.repository }}
          PULL: ${{ steps.target.outputs.pull }}
          HEAD: ${{ steps.guard.outputs.head }}
          PROFILE: ${{ steps.guard.outputs.profile }}
        run: |
          set -euo pipefail
          repository="$TARGET_REPOSITORY"
          current=$(gh api "repos/${repository}/pulls/${PULL}" --jq .head.sha)
          test "$current" = "$HEAD"
          gh api --method POST "repos/${repository}/pulls/${PULL}/reviews" \
            -f event=APPROVE \
            -f commit_id="$HEAD" \
            -f body="Independent transaction review: exact-head guards satisfied via the ${PROFILE} profile; approval is not merge authorization." >/dev/null
