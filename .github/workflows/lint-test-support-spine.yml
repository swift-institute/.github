# lint-test-support-spine.yml — CI gate for existing Test Support dependency
# integrity.
#
# Reusable workflow. For the checked-out package, runs the per-package audit
# (audit-test-support-spine.py --package-dir .) and exits 1 on VIOLATION
# or MISSING findings. The advisory-vs-gating decision is made at the CALLING
# site via the `advisory` input.
#
# Phase β (current): called from swift-institute/.github/.github/workflows/
# swift-ci.yml with `with: { advisory: true }`. Findings surface in the
# job log + step summary as warnings; the workflow exits 0 regardless
# (parent CI is not gated).
#
# Phase γ (future, after two consecutive weeks of ecosystem-wide zero
# violations confirmed by lint-test-support-spine-weekly.yml): drop the
# `with:` block at the calling site (advisory defaults to false → gating).
# The audit becomes gating; drift recurrence fails the parent CI.
#
# Why an input instead of `continue-on-error: true` on the `uses:` job:
# GitHub Actions does NOT permit `continue-on-error` on workflow_call
# jobs, only on regular jobs and steps. The advisory/gating switch
# therefore lives as a workflow input that gates the `exit 1` line below.
#
# Audit script source:
#   swift-institute/.github/.github/scripts/audit-test-support-spine.py
# Public fetch URL (used by the run step below):
#   https://raw.githubusercontent.com/swift-institute/.github/main/.github/scripts/audit-test-support-spine.py
#
# Architecture: [CI-001], [CI-002], and [LINT-CI].

name: lint-test-support-spine

on:
  workflow_call:
    inputs:
      advisory:
        type: boolean
        default: false
        description: |
          If true, findings emit warnings only and the workflow exits 0
          regardless of violation count.
      swift-version:
        type: string
        default: "6.3"
        description: |
          Swift toolchain pin (per [CI-011]). Used as the container tag
          since this audit invokes `swift package dump-package`. Mirrors
          the universal reusable's input so callers bumping the floor
          flip every container reference in lockstep.
      subject-repository:
        type: string
        required: true
        description: |
          The exact repository to audit, already resolved by the caller's
          own Plan (swift-institute/.github#277/#292). This workflow reads
          the single resolved subject rather than deriving one of its own —
          it has no `target-repo`/`ref` fallback and none may be added.
      subject-sha:
        type: string
        required: true
        description: |
          The exact 40-character commit SHA to audit, matching
          `subject-repository`. See `subject-repository`.
    outputs:
      ok-count:
        description: 'Number of existing Test Support targets with valid dependencies.'
        value: ${{ jobs.audit.outputs.ok-count }}
      violation-count:
        description: 'Number of VIOLATION findings (TS targets with non-TS cross-package deps).'
        value: ${{ jobs.audit.outputs.violation-count }}

  workflow_dispatch: {}

jobs:
  audit:
    name: Test Support Spine audit
    if: ${{ !github.event.repository.private }}     # [CI-032]
    runs-on: ubuntu-latest
    container: swift:${{ inputs.swift-version }}    # [CI-011] toolchain pin
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      ok-count: ${{ steps.audit.outputs.ok-count }}
      violation-count: ${{ steps.audit.outputs.violation-count }}
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.subject-repository }}
          ref: ${{ inputs.subject-sha }}

      - name: Install dependencies (python3, git for sparse-checkout)
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -qq -y python3 git

      - name: Verify checked-out subject HEAD
        shell: bash
        env:
          SUBJECT_SHA: ${{ inputs.subject-sha }}
        run: |
          set -euo pipefail
          if [ -z "${SUBJECT_SHA:-}" ]; then
            echo "No subject SHA supplied (direct workflow_dispatch, not the swift-ci.yml workflow_call path); skipping verification."
            exit 0
          fi
          # Job-level `container:` steps execute via a fresh `docker exec`
          # per step, so a bare shell `git` call sees the checkout owned by
          # the runner's host UID and refuses it as dubious ownership
          # (2.35.2+).
          git config --global --add safe.directory '*'
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$SUBJECT_SHA" ]; then
            echo "::error::checked-out HEAD '$ACTUAL' does not match the caller's resolved subject SHA '$SUBJECT_SHA'. Refusing to proceed against an unverified checkout."
            exit 1
          fi

      - name: Fetch audit script (sparse-checkout from swift-institute/.github)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          ref: ${{ job.workflow_sha }}
          path: .swift-institute-github
          sparse-checkout: .github/scripts/audit-test-support-spine.py
          sparse-checkout-cone-mode: false

      - name: Run audit
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          python3 .swift-institute-github/.github/scripts/audit-test-support-spine.py \
            --package-dir . \
            --json /tmp/audit.json \
            | tee /tmp/audit.log
          read -r ok viol < <(python3 - <<'PYEOF'
          import json
          t = json.load(open('/tmp/audit.json'))['aggregate']['totals']
          print(t['ok_findings'], t['violation_findings'])
          PYEOF
          )
          echo "ok-count=$ok"          >> "$GITHUB_OUTPUT"
          echo "violation-count=$viol" >> "$GITHUB_OUTPUT"
          {
            echo "## Test Support dependency integrity"
            echo ""
            echo "- OK:        $ok"
            echo "- VIOLATION: $viol"
            echo ""
            if [[ "$viol" -gt 0 ]]; then
              echo "### Findings"
              echo ""
              echo '```'
              cat /tmp/audit.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$viol" -gt 0 ]]; then
            echo "::warning::Test Support dependency drift detected — $viol violations"
            if [[ "${{ inputs.advisory }}" != "true" ]]; then
              exit 1
            fi
          fi
