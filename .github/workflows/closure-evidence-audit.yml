# closure-evidence-audit.yml — scheduled enforcement of the ratified
# closure-evidence rule (swift-institute/.github#512).
#
# PURPOSE
# 2026-08-09 triage found 23 completed closures claimed on "fix pushed
# at <SHA>" comments alone; only 11 verified, and in two repositories
# the claimed fix commit itself failed CI on main. The ratified rule: a
# completion closure must cite an Actions run URL whose own `conclusion`
# is success at-or-after the fix commit. A commit SHA alone is not
# closure evidence; a cancelled run is not evidence.
#
# MECHANISM
# The predicate is Swift ([CI-081]/Institute-semantics-in-Swift):
# `Closure.Evidence` (Tools/institute-ci-control) parses citations and
# judges verdicts over recorded facts; the credentialed edge
# (`Institute.CI.Control.Application.ClosureEvidence`) enumerates issues
# closed as completed since the lookback window across the org
# manifest, resolves each cited run against GitHub's own run object
# (`conclusion`, `head_sha`) and each cited commit against the compare
# API, and applies the ratified mutations:
#   (a) one marker-deduplicated flag comment on a violating issue;
#   (b) reopen-with-evidence, only for the observed-broken class — a
#       cited fix run whose conclusion is `failure`. Missing-citation
#       classes stay flag-and-report (#512 records the tightening as a
#       follow-up decision).
#
# KNOWN SCOPE LIMITS, recorded rather than silently assumed away:
#   - the minted App token is the swift-institute installation. Issues
#     and runs in other orgs' PUBLIC repositories are readable, so the
#     audit is fleet-wide; mutations outside swift-institute are denied
#     by GitHub and degrade to a "(mutation denied)" report line. The
#     per-org token matrix (the cron-audit-base shape) is the recorded
#     follow-up on #512.
#   - private repositories are invisible to the search leg, matching
#     the reconcile-project-invariants posture.
#
# REPORTING
# One tracking issue in this repository, found by TITLE match — never by
# label (see reconcile-project-invariants.yml's provenance note) — via
# the upsert-tracking-issue composite; closed when a run finds the
# fleet clean.
#
# Canary: gh workflow run closure-evidence-audit.yml \
#   -R swift-institute/.github -f dry-run=true

name: closure-evidence-audit

permissions: {}

on:
  schedule:
    - cron: '35 6 * * *'   # daily; clear of the 00:11 ci-sweep, 04:00 metadata and 05:15 reconciler crons
  workflow_dispatch:
    inputs:
      dry-run:
        description: >
          Report to the run summary and tracking-issue body only; do not
          comment on or reopen any violating issue, and do not touch the
          tracking issue. Validation dispatches use this.
        type: boolean
        default: false
      since-days:
        description: >
          Lookback window in days over closed-as-completed issues.
          Default 2 covers the daily cadence with overlap; widen for a
          backfill dispatch.
        type: string
        default: '2'

concurrency:
  group: closure-evidence-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    # Cold SwiftPM build of institute-ci-control dominates (~15 min,
    # no .build cache by policy); the audit itself is API-bound.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Read Institute orgs
        id: orgs
        uses: swift-institute/.github/.github/actions/read-orgs@4eb5e080688dfca88bd99d09fdba6077c360534e  # main 2026-08-04, identity-pin to main HEAD (swift-institute/.github#286)

      - name: Swift toolchain
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9  # v1.14.0
        with:
          swift-version: '6.3'

      # uuid-dev: swift-linux-standard's CLinuxKernelShim includes
      # <uuid/uuid.h>, reached transitively through institute-ci-control's
      # GitHub Control dependencies; absent on the bare runner.
      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y uuid-dev

      - name: Build institute-ci-control
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release \
            --package-path Tools/institute-ci-control \
            --product institute-ci-control
          swift build -c release \
            --package-path Tools/institute-ci-control \
            --show-bin-path >> "$GITHUB_PATH"

      # issues: write — the flag comment, the ratified reopen, and the
      # tracking-issue lifecycle. actions: read — resolving a cited
      # run's own `conclusion`/`head_sha`. contents: read — the compare
      # API for run-head-vs-fix-commit ordering. metadata is implied by
      # any grant; named for clarity.
      - name: Mint installation token (issue write, run read)
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.SWIFT_INSTITUTE_BOT_APP_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: swift-institute
          permission-issues: write
          permission-actions: read
          permission-contents: read
          permission-metadata: read

      - name: Audit completed closures
        id: audit
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ORGS_JSON: ${{ steps.orgs.outputs.orgs }}
          SINCE_DAYS: ${{ inputs.since-days || '2' }}
          DRY_RUN: ${{ inputs.dry-run == true }}
        shell: bash
        run: |
          set -euo pipefail
          orgs="$(jq -r 'join(",")' <<< "$ORGS_JSON")"
          args=(closure-evidence-audit
            --orgs "$orgs"
            --since-days "$SINCE_DAYS"
            --report "$RUNNER_TEMP/closure-evidence-report.md")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          counts="$(institute-ci-control "${args[@]}")"
          echo "$counts"
          echo "violations=${counts##*violations=}" >> "$GITHUB_OUTPUT"

      - name: Upsert tracking issue
        if: ${{ inputs.dry-run != true && steps.audit.outputs.violations != '0' }}
        uses: ./.github/actions/upsert-tracking-issue
        with:
          repo: swift-institute/.github
          title: 'Closure-evidence audit: completed closures without run-cited evidence'
          title-prefix: 'Closure-evidence audit:'
          body-file: ${{ runner.temp }}/closure-evidence-report.md
          gh-token: ${{ steps.token.outputs.token }}

      # TITLE match, never label (see the provenance note above): a
      # clean run closes the tracking issue with the clean report.
      - name: Close tracking issue when clean
        if: ${{ inputs.dry-run != true && steps.audit.outputs.violations == '0' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo swift-institute/.github --state open \
            --search "Closure-evidence audit: in:title" --json number \
            --jq '.[0].number // ""')
          if [[ -n "$existing" ]]; then
            gh issue close "$existing" --repo swift-institute/.github \
              --comment "$(cat "$RUNNER_TEMP/closure-evidence-report.md")"
          fi
