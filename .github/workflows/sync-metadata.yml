
# sync-metadata.yml — propagate .github/metadata.yaml to GitHub state.
#
# Reusable workflow. Reads each in-scope repo's .github/metadata.yaml, diffs
# against current GitHub state, and applies divergent fields via `gh repo edit`.
#
# Provenance: Skills/github-repository [GH-REPO-070]; Research/github-metadata-
# harmonization.md § 4.2.
#
# Inputs:
#   repo:           "owner/name" form. When set, scope to one repo.
#   org:            org name. When set, scope to one org. Ignored if `repo` set.
#   dry-run:        when true, print proposed edits without applying.
#   apply-rulesets: when true, converge the protected-main ruleset and permit
#                   creating a first ruleset on a repository that has none.
#                   Defaults false: first application is an explicit,
#                   deliberate act, never a nightly side effect
#                   (swift-institute/.github#193).
#   heal-rulesets:  when true, converge the protected-main ruleset over
#                   repositories that already have an Institute ruleset
#                   (drift repair) but never create one where absent.
#                   Defaults false; the nightly caller sets this true so the
#                   scheduled sweep heals drift without ever initiating
#                   enforcement on a previously unenforced repository
#                   (swift-institute/.github#204).
# (When both repo and org are unset, sweeps all 17 ecosystem orgs.)
#
# Authentication: swift-institute-bot GitHub App (per Skills/github-repository
# [GH-REPO-073]). App secrets SWIFT_INSTITUTE_BOT_APP_CLIENT_ID + SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY at
# org level on swift-institute/.github.
#
# Peer-institute consumption (#212): the workflow_call secrets below are
# DECLARED so a cross-org thin caller can supply its own App credentials
# explicitly (`secrets: inherit` does not cross the org boundary; a peer
# maps e.g. rule-institute-bot's credentials onto these slots). Same-org
# callers keep `secrets: inherit` unchanged, and absent any explicit
# mapping behavior is identical to pre-#212 — swift-institute's own
# automation scope is unchanged. A peer's fleet driver enumerates its own
# orgs via the read-orgs composite's `manifest-repository` input and fans
# out into this workflow per org; see the PEER-INSTITUTE CONSUMPTION
# section in actions/read-orgs/action.yml.

name: sync-metadata

on:
  workflow_call:
    inputs:
      repo:
        description: 'Owner/name of a single repo to sync.'
        type: string
        required: false
        default: ''
      org:
        description: 'Org to sweep (ignored if repo is set).'
        type: string
        required: false
        default: ''
      dry-run:
        description: 'Print proposed edits without applying.'
        type: boolean
        required: false
        default: false
      apply-rulesets:
        description: 'Converge the protected-main ruleset (skipped unless explicitly true).'
        type: boolean
        required: false
        default: false
      heal-rulesets:
        description: 'Re-apply the class-correct ruleset over an existing Institute ruleset only; never creates one where absent.'
        type: boolean
        required: false
        default: false
      visibility:
        description: 'Filter targets by visibility: public | private | internal | all. Default public — swift-institute''s own fleet is public; a peer institute with a private fleet (#244) supplies its own value.'
        type: string
        required: false
        default: 'public'
      exclude-archived:
        description: 'Exclude archived repos from org-mode enumeration. Default true. A peer''s archived-repo posture need not match ours (#244).'
        type: boolean
        required: false
        default: true
    outputs:
      edits-applied:
        description: 'Number of fields actually edited (0 in dry-run).'
        value: ${{ jobs.sync.outputs.edits-applied }}
      diffs-found:
        description: 'Number of fields divergent (whether or not applied).'
        value: ${{ jobs.sync.outputs.diffs-found }}
    secrets:
      SWIFT_INSTITUTE_BOT_APP_CLIENT_ID:
        required: false
        description: |
          GitHub App client ID used to mint per-org installation tokens.
          Same-org callers pass it via `secrets: inherit`; a peer
          institute maps its own App's client ID onto this slot (#212).
      SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY:
        required: false
        description: |
          GitHub App private key; counterpart of
          SWIFT_INSTITUTE_BOT_APP_CLIENT_ID. Same inherit/peer-mapping
          split as the client ID (#212).

  workflow_dispatch:
    inputs:
      repo:
        description: 'Owner/name of a single repo to sync (optional).'
        type: string
        required: false
      org:
        description: 'Org to sweep (optional; ignored if repo is set).'
        type: string
        required: false
      dry-run:
        description: 'Print proposed edits without applying.'
        type: boolean
        required: false
        default: false
      apply-rulesets:
        description: 'Converge the protected-main ruleset (skipped unless explicitly true).'
        type: boolean
        required: false
        default: false
      heal-rulesets:
        description: 'Re-apply the class-correct ruleset over an existing Institute ruleset only; never creates one where absent.'
        type: boolean
        required: false
        default: false
      visibility:
        description: 'Filter targets by visibility: public | private | internal | all.'
        type: string
        required: false
        default: 'public'
      exclude-archived:
        description: 'Exclude archived repos from org-mode enumeration.'
        type: boolean
        required: false
        default: true

jobs:
  # `surfaces` and `sync` are INDEPENDENT — no `needs:` between them, by
  # design. They previously shared one job, with the surface-policy gate
  # running first; because that gate throws on any REPO-ACTIONS violation
  # (before RepositoryPolicy.run is reached, so `dry-run: true` fails
  # identically), a surface-policy opinion silently blocked metadata and
  # secret-scanning convergence across every repo in the org. On 2026-07-28
  # all 16 nightly legs failed that way and skipped the sync entirely.
  # Surface enforcement and settings convergence are unrelated concerns:
  # each must be free to fail on its own merits. Do not reintroduce a
  # dependency between them — the workflow still reports failure when
  # either fails, which is the loudness that matters.

  sync:
    if: ${{ !github.event.repository.private }}     # [CI-032]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      edits-applied: ${{ steps.sync.outputs.edits-applied }}
      diffs-found: ${{ steps.sync.outputs.diffs-found }}
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Validate inputs
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_ORG: ${{ inputs.org }}
        run: |
          if [[ -z "$INPUT_REPO" && -z "$INPUT_ORG" ]]; then
            echo "::error::Either 'repo' (owner/name) or 'org' input is required."
            echo "::error::For cross-org sweeps, use sync-metadata-nightly.yml which calls this workflow per-org via matrix."
            exit 1
          fi

      - name: Compute auth scope
        id: scope
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_ORG: ${{ inputs.org }}
        run: |
          if [[ -n "$INPUT_REPO" ]]; then
            owner="${INPUT_REPO%/*}"
            name="${INPUT_REPO#*/}"
            echo "owner=${owner}" >> "$GITHUB_OUTPUT"
            echo "repositories=${name}" >> "$GITHUB_OUTPUT"
          else
            echo "owner=${INPUT_ORG}" >> "$GITHUB_OUTPUT"
            # Empty repositories means: token covers all repos in the org installation.
            echo "repositories=" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint installation token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ steps.scope.outputs.owner }}
          repositories: ${{ steps.scope.outputs.repositories }}
          permission-administration: write
          permission-contents: read
          permission-metadata: read

      - name: Enumerate org repos
        if: ${{ inputs.repo == '' }}
        id: enum
        uses: swift-institute/.github/.github/actions/enumerate-org-public-repos@6f73c2ebff00e4f05375794905926bdd7a0ca14b  # main 2026-08-04, identity-pin to main HEAD (swift-institute/.github#286); no functional change to this action in range
        with:
          org: ${{ inputs.org }}
          visibility: ${{ inputs.visibility }}
          exclude-archived: ${{ inputs.exclude-archived }}
          gh-token: ${{ steps.token.outputs.token }}

      - name: Sync metadata
        id: sync
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          DRY_RUN: ${{ inputs.dry-run }}
          SINGLE_REPO: ${{ inputs.repo }}
          INPUT_ORG: ${{ inputs.org }}
          INPUT_VISIBILITY: ${{ inputs.visibility }}
          ENUM_REPOS: ${{ steps.enum.outputs.repos }}
        run: |
          set -euo pipefail

          edits_applied=0
          diffs_found=0
          summary_lines=()
          unentitled=0
          unentitled_sample=""
          # Set once the first repo in this run proves the sub-features are not
          # entitled. The cause is org-wide, so probing every remaining repo
          # would cost 2 API calls each per night to relearn the same fact.
          sub_unsupported=0

          # Build target list — single-repo mode bypasses enumeration; org-mode
          # reads from the enumerate-org-public-repos composite output.
          if [[ -n "$SINGLE_REPO" ]]; then
            targets=("$SINGLE_REPO")
          else
            targets=()
            while IFS= read -r line; do
              [[ -n "$line" ]] && targets+=("$line")
            done <<< "$ENUM_REPOS"
          fi

          echo "Targets: ${#targets[@]} repos"

          # Loud-empty-reach (#244), three-rule discriminator per review:
          #   1. Caller explicitly scoped a non-default visibility and this
          #      org reached zero -> HARD FAILURE. Nobody passes
          #      visibility: private to an org they believe has none; no
          #      benign reading exists, so fail this run immediately.
          #   2. Default-public (this workflow's own value) reaching zero
          #      -> warning, both as an annotation and a step-summary
          #      callout below. This workflow is dispatched per-org, so a
          #      hard failure here would redden a run that converged
          #      everything it was actually scoped to reach.
          #   3. Aggregate zero across every org in a fleet-wide sweep is
          #      NOT decidable here — this job only ever sees one org per
          #      invocation. That rule lives in whichever caller fans this
          #      workflow out across the fleet (sync-metadata-nightly.yml),
          #      which is out of this PR's file scope.
          zero_reach=0
          if [[ -z "$SINGLE_REPO" && "${#targets[@]}" -eq 0 ]]; then
            zero_reach=1
            if [[ "$INPUT_VISIBILITY" != "public" ]]; then
              echo "::error::sync-metadata reached 0 repos for org '${INPUT_ORG}' with explicitly-scoped visibility='${INPUT_VISIBILITY}'. No benign reading — the caller asked for this visibility and it matched nothing."
              exit 1
            fi
            echo "::warning::sync-metadata reached 0 repos for org '${INPUT_ORG}' (visibility=${INPUT_VISIBILITY}). This run will report success, but it converged nothing — verify visibility/exclude-archived scope before treating a green run as evidence of convergence."
          fi

          # Per-repo sync -------------------------------------------------------
          for target in "${targets[@]}"; do
            # 1. Read .github/metadata.yaml from the target's main branch.
            yaml_content=$(gh api "repos/${target}/contents/.github/metadata.yaml" \
              --jq '.content' 2>/dev/null | base64 -d 2>/dev/null) || {
              echo "  ${target}: skipped (no .github/metadata.yaml)"
              continue
            }

            # 2. Parse YAML; bail loud on malformed.
            desired=$(echo "$yaml_content" | yq -o=json) || {
              echo "  ${target}: ERROR — malformed metadata.yaml"
              exit 1
            }

            desired_desc=$(echo "$desired" | jq -r '.description // ""')
            desired_homepage=$(echo "$desired" | jq -r '.homepage // ""')
            desired_topics=$(echo "$desired" | jq -r '.topics // [] | .[]' | sort -u)
            desired_issues=$(echo "$desired" | jq -r '.settings.hasIssuesEnabled // true')
            desired_disc=$(echo "$desired" | jq -r '.settings.hasDiscussionsEnabled // false')
            desired_wiki=$(echo "$desired" | jq -r '.settings.hasWikiEnabled // false')
            desired_projects=$(echo "$desired" | jq -r '.settings.hasProjectsEnabled // false')
            desired_branch=$(echo "$desired" | jq -r '.settings.defaultBranch // "main"')

            # 3. Read current GitHub state.
            current=$(gh repo view "$target" \
              --json description,repositoryTopics,homepageUrl,hasIssuesEnabled,hasDiscussionsEnabled,hasWikiEnabled,hasProjectsEnabled,defaultBranchRef,mergeCommitAllowed,squashMergeAllowed,rebaseMergeAllowed,deleteBranchOnMerge,visibility)

            current_desc=$(echo "$current" | jq -r '.description // ""')
            current_homepage=$(echo "$current" | jq -r '.homepageUrl // ""')
            current_topics=$(echo "$current" | jq -r '.repositoryTopics // [] | .[].name' | sort -u)
            current_issues=$(echo "$current" | jq -r '.hasIssuesEnabled')
            current_disc=$(echo "$current" | jq -r '.hasDiscussionsEnabled')
            current_wiki=$(echo "$current" | jq -r '.hasWikiEnabled')
            current_projects=$(echo "$current" | jq -r '.hasProjectsEnabled')
            current_branch=$(echo "$current" | jq -r '.defaultBranchRef.name // "main"')

            # 4. Compute diffs.
            edit_args=()
            repo_diffs=0

            if [[ "$desired_desc" != "$current_desc" ]]; then
              edit_args+=(--description "$desired_desc")
              repo_diffs=$((repo_diffs+1))
            fi
            if [[ "$desired_homepage" != "$current_homepage" ]]; then
              edit_args+=(--homepage "$desired_homepage")
              repo_diffs=$((repo_diffs+1))
            fi

            # Topic set-diff: add (desired ∖ current); remove (current ∖ desired).
            to_add=$(comm -23 <(echo "$desired_topics") <(echo "$current_topics") || true)
            to_remove=$(comm -13 <(echo "$desired_topics") <(echo "$current_topics") || true)
            while IFS= read -r t; do
              [[ -z "$t" ]] && continue
              edit_args+=(--add-topic "$t")
              repo_diffs=$((repo_diffs+1))
            done <<< "$to_add"
            while IFS= read -r t; do
              [[ -z "$t" ]] && continue
              edit_args+=(--remove-topic "$t")
              repo_diffs=$((repo_diffs+1))
            done <<< "$to_remove"

            # Settings diff. gh repo edit flag names are --enable-{feature}={bool}.
            if [[ "$desired_issues" != "$current_issues" ]]; then
              edit_args+=(--enable-issues="$desired_issues")
              repo_diffs=$((repo_diffs+1))
            fi
            if [[ "$desired_disc" != "$current_disc" ]]; then
              edit_args+=(--enable-discussions="$desired_disc")
              repo_diffs=$((repo_diffs+1))
            fi
            if [[ "$desired_wiki" != "$current_wiki" ]]; then
              edit_args+=(--enable-wiki="$desired_wiki")
              repo_diffs=$((repo_diffs+1))
            fi
            if [[ "$desired_projects" != "$current_projects" ]]; then
              edit_args+=(--enable-projects="$desired_projects")
              repo_diffs=$((repo_diffs+1))
            fi
            if [[ "$desired_branch" != "$current_branch" ]]; then
              edit_args+=(--default-branch "$desired_branch")
              repo_diffs=$((repo_diffs+1))
            fi

            # Merge-method + branch-cleanup settings per [GH-REPO-056].
            # gh repo edit exposes no flag for the merge-method allows, so
            # these apply via `gh api PATCH` (delete_branch_on_merge folded in).
            desired_mc=$(echo "$desired" | jq -r '.settings.allowMergeCommit // false')
            desired_sq=$(echo "$desired" | jq -r '.settings.allowSquashMerge // true')
            desired_rb=$(echo "$desired" | jq -r '.settings.allowRebaseMerge // false')
            desired_del=$(echo "$desired" | jq -r '.settings.deleteBranchOnMerge // true')
            current_mc=$(echo "$current" | jq -r '.mergeCommitAllowed')
            current_sq=$(echo "$current" | jq -r '.squashMergeAllowed')
            current_rb=$(echo "$current" | jq -r '.rebaseMergeAllowed')
            current_del=$(echo "$current" | jq -r '.deleteBranchOnMerge')
            merge_args=()
            [[ "$desired_mc"  != "$current_mc"  ]] && merge_args+=(-F "allow_merge_commit=$desired_mc")
            [[ "$desired_sq"  != "$current_sq"  ]] && merge_args+=(-F "allow_squash_merge=$desired_sq")
            [[ "$desired_rb"  != "$current_rb"  ]] && merge_args+=(-F "allow_rebase_merge=$desired_rb")
            [[ "$desired_del" != "$current_del" ]] && merge_args+=(-F "delete_branch_on_merge=$desired_del")
            repo_diffs=$((repo_diffs + ${#merge_args[@]}))

            # Secret scanning + push protection per [GH-REPO-057]. PUBLIC ONLY,
            # and the skip below is deliberate, not defensive: a private repo
            # returns NO `security_and_analysis` object at all — not one with
            # the features disabled — so there is no state to read and nothing
            # to converge. Verified 2026-07-28 against rule-legal/rule and
            # swift-institute/higher-order-app with `permissions.admin: true`,
            # so it is not a token-scope artifact. Covering private repos needs
            # GitHub Advanced Security, a purchase the Institute has declined,
            # so this branch is permanently public-only by decision rather than
            # by limitation. gh repo view exposes no security surface, so
            # current state is a dedicated call.
            # The two sub-features (non-provider patterns, validity checks) are
            # rejected by GitHub unless secret scanning itself is enabled, so
            # they apply in a SECOND PATCH after the base pair, and are forced
            # off whenever secretScanning is authored false.
            sec_args=()
            sub_args=()
            desired_ss=false; desired_pp=false; desired_np=false; desired_vc=false
            if [[ "$(echo "$current" | jq -r '.visibility')" == "PUBLIC" ]]; then
              desired_ss=$(echo "$desired" | jq -r '.settings.secretScanning // true')
              desired_pp=$(echo "$desired" | jq -r '.settings.secretScanningPushProtection // true')
              desired_np=$(echo "$desired" | jq -r '.settings.secretScanningNonProviderPatterns // true')
              desired_vc=$(echo "$desired" | jq -r '.settings.secretScanningValidityChecks // true')
              # Dependent features cannot outlive their parent.
              if [[ "$desired_ss" != "true" ]]; then
                desired_np=false
                desired_vc=false
              fi
              sec=$(gh api "repos/$target" --jq '{ss:(.security_and_analysis.secret_scanning.status // "disabled"), pp:(.security_and_analysis.secret_scanning_push_protection.status // "disabled"), np:(.security_and_analysis.secret_scanning_non_provider_patterns.status // "disabled"), vc:(.security_and_analysis.secret_scanning_validity_checks.status // "disabled")}')
              current_ss=$([[ "$(echo "$sec" | jq -r .ss)" == "enabled" ]] && echo true || echo false)
              current_pp=$([[ "$(echo "$sec" | jq -r .pp)" == "enabled" ]] && echo true || echo false)
              current_np=$([[ "$(echo "$sec" | jq -r .np)" == "enabled" ]] && echo true || echo false)
              current_vc=$([[ "$(echo "$sec" | jq -r .vc)" == "enabled" ]] && echo true || echo false)
              [[ "$desired_ss" != "$current_ss" ]] && sec_args+=(secret_scanning)
              [[ "$desired_pp" != "$current_pp" ]] && sec_args+=(secret_scanning_push_protection)
              [[ "$desired_np" != "$current_np" ]] && sub_args+=(secret_scanning_non_provider_patterns)
              [[ "$desired_vc" != "$current_vc" ]] && sub_args+=(secret_scanning_validity_checks)
              # Already proven unattainable in this run — count the repo and
              # drop the attempt rather than re-probing the same org fact.
              if [[ $sub_unsupported -eq 1 && ${#sub_args[@]} -gt 0 ]]; then
                unentitled=$((unentitled+1))
                sub_args=()
              fi
              repo_diffs=$((repo_diffs + ${#sec_args[@]} + ${#sub_args[@]}))
            else
              echo "  ${target}: security settings skipped (not public — no security_and_analysis surface exists)"
            fi

            diffs_found=$((diffs_found + repo_diffs))

            # 5. Apply (or print).
            if [[ $repo_diffs -eq 0 ]]; then
              echo "  ${target}: converged"
              continue
            fi

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "  ${target}: ${repo_diffs} diff(s) — would run:"
              if [[ ${#edit_args[@]} -gt 0 ]]; then
                printf '    gh repo edit %q' "$target"
                for a in "${edit_args[@]}"; do printf ' %q' "$a"; done
                printf '\n'
              fi
              if [[ ${#merge_args[@]} -gt 0 ]]; then
                printf '    gh api -X PATCH %q' "repos/$target"
                for a in "${merge_args[@]}"; do printf ' %q' "$a"; done
                printf '\n'
              fi
              if [[ ${#sec_args[@]} -gt 0 ]]; then
                printf '    gh api -X PATCH %q  # security_and_analysis: secret_scanning=%s push_protection=%s\n' "repos/$target" "$desired_ss" "$desired_pp"
              fi
              if [[ ${#sub_args[@]} -gt 0 ]]; then
                printf '    gh api -X PATCH %q  # security_and_analysis: non_provider_patterns=%s validity_checks=%s\n' "repos/$target" "$desired_np" "$desired_vc"
              fi
              summary_lines+=("- \`${target}\`: ${repo_diffs} field(s) — dry-run preview")
            else
              echo "  ${target}: ${repo_diffs} diff(s) — applying"
              [[ ${#edit_args[@]} -gt 0 ]] && gh repo edit "$target" "${edit_args[@]}"
              [[ ${#merge_args[@]} -gt 0 ]] && gh api -X PATCH "repos/$target" "${merge_args[@]}" >/dev/null
              if [[ ${#sec_args[@]} -gt 0 ]]; then
                ss_status=$([[ "$desired_ss" == true ]] && echo enabled || echo disabled)
                pp_status=$([[ "$desired_pp" == true ]] && echo enabled || echo disabled)
                jq -nc --arg ss "$ss_status" --arg pp "$pp_status" \
                  '{security_and_analysis:{secret_scanning:{status:$ss},secret_scanning_push_protection:{status:$pp}}}' \
                  | gh api -X PATCH "repos/$target" --input - >/dev/null
              fi
              # Second PATCH: sub-features, after secret scanning is known on.
              # These two are Secret Protection (Advanced Security) features.
              # Without that entitlement GitHub answers the PATCH 2xx and
              # silently ignores it — no error, no effect — so the status code
              # proves nothing. Read the state back and say so out loud rather
              # than reporting a phantom edit and re-diffing forever.
              if [[ ${#sub_args[@]} -gt 0 ]]; then
                np_status=$([[ "$desired_np" == true ]] && echo enabled || echo disabled)
                vc_status=$([[ "$desired_vc" == true ]] && echo enabled || echo disabled)
                jq -nc --arg np "$np_status" --arg vc "$vc_status" \
                  '{security_and_analysis:{secret_scanning_non_provider_patterns:{status:$np},secret_scanning_validity_checks:{status:$vc}}}' \
                  | gh api -X PATCH "repos/$target" --input - >/dev/null
                readback=$(gh api "repos/$target" --jq '{np:(.security_and_analysis.secret_scanning_non_provider_patterns.status // "disabled"), vc:(.security_and_analysis.secret_scanning_validity_checks.status // "disabled")}')
                got_np=$(echo "$readback" | jq -r .np)
                got_vc=$(echo "$readback" | jq -r .vc)
                if [[ "$got_np" != "$np_status" || "$got_vc" != "$vc_status" ]]; then
                  echo "    ${target}: sub-features did not take effect (want np=${np_status} vc=${vc_status}, got np=${got_np} vc=${got_vc}) — not retrying the rest of this run"
                  repo_diffs=$((repo_diffs - ${#sub_args[@]}))
                  unentitled=$((unentitled+1))
                  [[ -z "$unentitled_sample" ]] && unentitled_sample="$target"
                  sub_unsupported=1
                fi
              fi
              edits_applied=$((edits_applied + repo_diffs))
              summary_lines+=("- \`${target}\`: ${repo_diffs} field(s) applied")
            fi
          done

          echo "edits-applied=${edits_applied}" >> "$GITHUB_OUTPUT"
          echo "diffs-found=${diffs_found}" >> "$GITHUB_OUTPUT"

          # One warning for the whole run, not one per repo — the cause is
          # org-wide entitlement, so N identical warnings would be noise.
          if [[ $unentitled -gt 0 ]]; then
            echo "::warning::${unentitled} repo(s) want secret_scanning_non_provider_patterns / secret_scanning_validity_checks but cannot have them. Probed on ${unentitled_sample}: the PATCH returns HTTP 2xx and silently no-ops. Both require GitHub Secret Protection (Advanced Security), which this plan does not include; the probe is not repeated per repo because the cause is org-wide. Authored intent in metadata.yaml is correct and converges if the entitlement ever exists."
          fi

          {
            echo "## sync-metadata summary"
            echo ""
            if [[ $zero_reach -eq 1 ]]; then
              echo "> [!WARNING]"
              echo "> 0 repos enumerated for org \`${INPUT_ORG}\` (visibility=${INPUT_VISIBILITY}). This run reports success, but it reached nothing — do not read it as a converged fleet."
              echo ""
            fi
            echo "- targets: ${#targets[@]}"
            echo "- diffs found: ${diffs_found}"
            echo "- edits applied: ${edits_applied} (dry-run: ${DRY_RUN})"
            if [[ $unentitled -gt 0 ]]; then
              echo "- secret-scanning sub-features not applied (no Secret Protection entitlement): ${unentitled}"
            fi
            echo ""
            for line in "${summary_lines[@]}"; do echo "$line"; done
          } >> "$GITHUB_STEP_SUMMARY"

  rulesets:
    # The source-controlled contract is applied only by the trusted central
    # workflow. No write-capable credential is made available to PR code.
    # Ruleset convergence runs on either explicit opt-in: `apply-rulesets`
    # (may create a first ruleset — swift-institute/.github#193) or
    # `heal-rulesets` (heals drift on an existing ruleset only, set `true` by
    # the nightly caller — swift-institute/.github#204). The nightly sweep
    # must never INITIATE enforcement on a previously unenforced repository
    # as a side effect; healing an already-enforced repository's drift is the
    # one thing the scheduled path now does unattended.
    if: ${{ !github.event.repository.private && (inputs.apply-rulesets || inputs.heal-rulesets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out the central repository-policy product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          ref: ${{ job.workflow_sha }}
          path: institute-ci
          persist-credentials: false

      - name: Select Swift 6.3
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: '6.3'

      - name: Validate inputs
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_ORG: ${{ inputs.org }}
        run: |
          if [[ -z "$INPUT_REPO" && -z "$INPUT_ORG" ]]; then
            echo "::error::Either 'repo' (owner/name) or 'org' input is required."
            exit 1
          fi

      - name: Compute auth scope
        id: scope
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_ORG: ${{ inputs.org }}
        run: |
          if [[ -n "$INPUT_REPO" ]]; then
            echo "owner=${INPUT_REPO%/*}" >> "$GITHUB_OUTPUT"
            echo "repositories=${INPUT_REPO#*/}" >> "$GITHUB_OUTPUT"
          else
            echo "owner=${INPUT_ORG}" >> "$GITHUB_OUTPUT"
            echo "repositories=" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint installation token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ steps.scope.outputs.owner }}
          repositories: ${{ steps.scope.outputs.repositories }}
          permission-administration: write
          permission-contents: read
          permission-metadata: read

      - name: Enumerate org repos
        if: ${{ inputs.repo == '' }}
        id: enum
        uses: swift-institute/.github/.github/actions/enumerate-org-public-repos@6f73c2ebff00e4f05375794905926bdd7a0ca14b  # main 2026-08-04, identity-pin to main HEAD (swift-institute/.github#286); no functional change to this action in range
        with:
          org: ${{ inputs.org }}
          visibility: ${{ inputs.visibility }}
          exclude-forks: 'true'
          exclude-archived: ${{ inputs.exclude-archived }}
          gh-token: ${{ steps.token.outputs.token }}

      - name: Converge protected main ruleset
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SINGLE_REPO: ${{ inputs.repo }}
          INPUT_ORG: ${{ inputs.org }}
          INPUT_VISIBILITY: ${{ inputs.visibility }}
          ENUM_REPOS: ${{ steps.enum.outputs.repos }}
          APPLY_RULESETS: ${{ inputs.apply-rulesets }}
          REVERSE_DIR: ${{ runner.temp }}/reverse-payloads
        run: |
          set -euo pipefail
          mkdir -p "$REVERSE_DIR"
          # Three package-class-adjacent payloads (TX5,
          # swift-institute/.github#276, retired the migration-window
          # compatibility contract): the terminal public contract
          # (ci / matrix / ci-ok only), the private contract (verification /
          # workspace only — Task 2-01/2-02, #253), and the unchanged
          # control-plane contract. Visibility is NOT a fourth top-level
          # RepositoryClass — it selects among the package-class payloads
          # only (swift-institute/.github#276 Task 3-01).
          desired_package_public=$(swift run --package-path institute-ci/Tools/RepositoryPolicy repository-policy ruleset --policy institute-ci/Tools/RepositoryPolicy/Policy/protected-main-ruleset.json --class package --visibility public)
          desired_package_private=$(swift run --package-path institute-ci/Tools/RepositoryPolicy repository-policy ruleset --policy institute-ci/Tools/RepositoryPolicy/Policy/protected-main-private-ruleset.json --class package --visibility private)
          desired_control=$(swift run --package-path institute-ci/Tools/RepositoryPolicy repository-policy ruleset --policy institute-ci/Tools/RepositoryPolicy/Policy/protected-main-control-ruleset.json --class control-plane)
          normalize() {
            jq -S '{name, target, enforcement, conditions, bypass_actors, rules:(.rules | sort_by(.type) | map(if .parameters? then .parameters.required_status_checks? |= (if . then sort_by(.context) else . end) else . end))}'
          }
          desired_package_public_normalized=$(printf '%s' "$desired_package_public" | normalize)
          desired_package_private_normalized=$(printf '%s' "$desired_package_private" | normalize)
          desired_control_normalized=$(printf '%s' "$desired_control" | normalize)
          # explicit-apply (apply-rulesets: true) may create a first ruleset;
          # scheduled-heal (the nightly's heal-rulesets: true) never does
          # (swift-institute/.github#204) — the mechanical decision for each
          # target lives in RepositoryPolicy.Ruleset.decideConvergence, not
          # here.
          mode="scheduled-heal"
          if [[ "$APPLY_RULESETS" == "true" ]]; then
            mode="explicit-apply"
          fi
          if [[ -n "$SINGLE_REPO" ]]; then
            targets=("$SINGLE_REPO")
          else
            targets=()
            while IFS= read -r target; do [[ -n "$target" ]] && targets+=("$target"); done <<< "$ENUM_REPOS"
          fi
          echo "Targets: ${#targets[@]} repos"
          # Loud-empty-reach (#244): see the `sync` job's identical
          # three-rule rationale (rule 3 lives in the fleet-wide caller,
          # out of this PR's scope).
          if [[ -z "$SINGLE_REPO" && "${#targets[@]}" -eq 0 ]]; then
            if [[ "$INPUT_VISIBILITY" != "public" ]]; then
              echo "::error::sync-metadata rulesets convergence reached 0 repos for org '${INPUT_ORG}' with explicitly-scoped visibility='${INPUT_VISIBILITY}'. No benign reading — the caller asked for this visibility and it matched nothing."
              exit 1
            fi
            echo "::warning::sync-metadata rulesets convergence reached 0 repos for org '${INPUT_ORG}' (visibility=${INPUT_VISIBILITY}). This run will report success, but it converged nothing."
          fi
          # Declared per-repo class overrides (swift-institute/.github#266):
          # the mechanical Package.swift-presence probe below is right for
          # the fleet's general case but wrong for a repo whose CI structure
          # can never satisfy the package class's required status check
          # regardless of manifest presence. Overrides are a config file
          # under source control, converged the same way as every other
          # target — never a hand-mutation of live ruleset state. See
          # Tools/RepositoryPolicy/Policy/ruleset-class-overrides.json for
          # the current override list and each entry's cited rationale.
          override_repos=$(jq -r '.controlPlaneOverrides[].repo' institute-ci/Tools/RepositoryPolicy/Policy/ruleset-class-overrides.json)

          for target in "${targets[@]}"; do
            # Classify mechanically: a root Package.swift present at the
            # default branch means the package contract (the repo emits
            # `ci / matrix / ci-ok` if public, `verification / workspace` if
            # private — live visibility read below selects between them,
            # Task 3-01); its absence means the control-plane contract.
            # This mirrors RepositoryPolicy.GitHubClient.rootManifestKind's
            # `contents/Package.swift` probe (200 + type "file" vs 404),
            # which the `surfaces` job's private-vulnerability-reporting
            # eligibility gate already uses to the same end
            # (Repository.Policy.Run.swift, swift-institute/.github#200).
            #
            # Fail-closed, not fail-open: `gh api` reports the HTTP status on
            # any non-2xx response in its stderr (e.g. "gh: Not Found
            # (HTTP 404)"), so a genuine 404 (absent Package.swift — control)
            # is distinguished from every other failure (rate limit, 403,
            # 5xx, network error, token expiry, jq shape mismatch on a
            # 200) — those must stop the run rather than silently
            # misclassify the repo as control-plane and deploy the weaker
            # contract on what may be a package repository.
            #
            # A declared override (above) wins over the mechanical probe:
            # some repos have a root Package.swift but structurally cannot
            # emit the package class's required check (#266).
            if grep -qxF "$target" <<< "$override_repos"; then
              manifest_type="__control-override__"
            else
              manifest_error="$RUNNER_TEMP/manifest-kind-error-$$.txt"
              if manifest_type=$(gh api "repos/$target/contents/Package.swift" --jq '.type' 2>"$manifest_error"); then
                :
              elif grep -q '(HTTP 404)' "$manifest_error"; then
                manifest_type=""
              else
                echo "::error::$target: could not determine whether a root Package.swift exists: $(cat "$manifest_error")"
                rm -f "$manifest_error"
                exit 1
              fi
              rm -f "$manifest_error"
            fi

            package_name="Institute protected main"
            control_name="Institute protected main (control)"
            if [[ "$manifest_type" == "file" ]]; then
              ruleset_name="$package_name"
              opposite_name="$control_name"

              # Visibility is a live authenticated GitHub read, never a
              # declared policy file (swift-institute/.github#276 Task
              # 3-01, Task 0C-02 Change item 4: a manually maintained
              # private list drifts silently and a stale signal applies the
              # wrong required-check payload — exactly the failure Phase 3
              # exists to remove). Fail closed on anything other than an
              # unambiguous "public" or "private": a repository whose
              # visibility cannot be read is UNMEASURED, never defaulted to
              # either payload.
              visibility_error="$RUNNER_TEMP/visibility-error-$$.txt"
              if ! target_visibility=$(gh api "repos/$target" --jq '.visibility' 2>"$visibility_error"); then
                echo "::error::$target: UNMEASURED — could not read repository visibility: $(cat "$visibility_error")"
                rm -f "$visibility_error"
                exit 1
              fi
              rm -f "$visibility_error"

              case "$target_visibility" in
                public)
                  desired="$desired_package_public"
                  desired_normalized="$desired_package_public_normalized"
                  ;;
                private)
                  desired="$desired_package_private"
                  desired_normalized="$desired_package_private_normalized"
                  ;;
                *)
                  # Includes "internal" and any unrecognized value: fail
                  # closed rather than guess which payload applies. #3.1
                  # zero-result protocol — UNMEASURED, never a default.
                  echo "::error::$target: UNMEASURED — visibility '${target_visibility}' is neither 'public' nor 'private'; refusing to select a required-check payload rather than default one."
                  exit 1
                  ;;
              esac
            else
              ruleset_name="$control_name"
              opposite_name="$package_name"
              desired="$desired_control"
              desired_normalized="$desired_control_normalized"
            fi

            current=$(gh api --paginate "repos/$target/rulesets?per_page=100")
            matches=$(printf '%s' "$current" | jq --arg name "$ruleset_name" '[.[] | select(.name == $name)]')
            count=$(printf '%s' "$matches" | jq 'length')
            if [[ "$count" -gt 1 ]]; then
              echo "::error::$target has multiple $ruleset_name rulesets"
              exit 1
            fi
            # A stale ruleset under the OTHER class's name (a class flip
            # since the last sweep — e.g. a control-plane repo gained a root
            # Package.swift) must not be left enforcing while a second,
            # class-correct ruleset is created alongside it. Converge it in
            # place instead: the desired payload's own `name` field carries
            # the rename, so routing its id through the existing update path
            # below both renames and re-shapes it in one PUT.
            opposite_matches=$(printf '%s' "$current" | jq --arg name "$opposite_name" '[.[] | select(.name == $name)]')
            opposite_count=$(printf '%s' "$opposite_matches" | jq 'length')
            if [[ "$opposite_count" -gt 1 ]]; then
              echo "::error::$target has multiple $opposite_name rulesets"
              exit 1
            fi
            if [[ "$count" -eq 1 && "$opposite_count" -eq 1 ]]; then
              echo "::error::$target has both $ruleset_name and $opposite_name rulesets"
              exit 1
            fi

            if [[ "$count" -eq 1 ]]; then
              id=$(printf '%s' "$matches" | jq -r '.[0].id')
            elif [[ "$opposite_count" -eq 1 ]]; then
              id=$(printf '%s' "$opposite_matches" | jq -r '.[0].id')
              echo "$target: class flip — converging $opposite_name ($id) to $ruleset_name"
            else
              id=""
            fi

            # The heal-existing-vs-skip-absent decision (#204) is made by the
            # Swift tool, not here: existing (same class or a class flip)
            # always re-applies under either posture; absent only creates
            # under explicit-apply, and is reported and skipped under
            # scheduled-heal.
            existing_ruleset="false"
            [[ -n "$id" ]] && existing_ruleset="true"
            decision=$(swift run --package-path institute-ci/Tools/RepositoryPolicy repository-policy ruleset-convergence --mode "$mode" --existing-ruleset "$existing_ruleset")
            action=$(printf '%s' "$decision" | jq -r '.action')
            if [[ "$action" == "skipAbsentOnSchedule" ]]; then
              reason=$(printf '%s' "$decision" | jq -r '.reason')
              echo "$target: skipped — $reason"
              continue
            fi

            # Exact reverse payload per repository, captured before any
            # mutation (swift-institute/.github#276 Ruling R21/R22.2: "hold
            # exact reverse payloads per repository before each wave" is
            # what makes a wave bounded and reversible, and must be
            # "expressed in the payloads, not left to operator discipline").
            # Written whether or not this run actually applies the change,
            # so a dry-run preview shows the exact reverse an operator would
            # get. `id` is empty only for a genuine first CREATE, whose
            # reverse is DELETE (there is nothing prior to restore to) —
            # recorded once the created id is known, below.
            reverse_file="$REVERSE_DIR/$(printf '%s' "$target" | tr '/' '_').json"
            if [[ -n "$id" ]]; then
              actual_raw=$(gh api "repos/$target/rulesets/$id")
              actual=$(printf '%s' "$actual_raw" | normalize)
              jq -n --arg target "$target" --argjson payload "$actual_raw" --arg name "$ruleset_name" \
                '{target: $target, action: "restore", rulesetId: $payload.id, name: $name, payload: $payload}' \
                > "$reverse_file"
              if [[ "$actual" == "$desired_normalized" ]]; then
                echo "$target: $ruleset_name converged"
                rm -f "$reverse_file"  # nothing changes; no reverse needed
                continue
              fi
              if [[ "$DRY_RUN" == true ]]; then
                echo "$target: would update $ruleset_name ($id); reverse payload previewed at $reverse_file"
                continue
              fi
              printf '%s' "$desired" | gh api -X PUT "repos/$target/rulesets/$id" --input - >/dev/null
            else
              if [[ "$DRY_RUN" == true ]]; then
                echo "$target: would create $ruleset_name (reverse would be: delete)"
                continue
              fi
              id=$(printf '%s' "$desired" | gh api -X POST "repos/$target/rulesets" --input - --jq .id)
              jq -n --arg target "$target" --arg id "$id" --arg name "$ruleset_name" \
                '{target: $target, action: "delete", rulesetId: ($id | tonumber), name: $name}' \
                > "$reverse_file"
            fi
            readback=$(gh api "repos/$target/rulesets/$id" | normalize)
            if [[ "$readback" != "$desired_normalized" ]]; then
              echo "::error::$target ruleset read-back differs from the $ruleset_name contract"
              exit 1
            fi
            echo "$target: $ruleset_name converged ($id); reverse payload at $reverse_file"
          done
          echo "Reverse payloads written to $REVERSE_DIR:"
          find "$REVERSE_DIR" -type f -name '*.json' | sort

      # Every reverse payload this run computed, uploaded so it survives
      # the ephemeral runner (swift-institute/.github#276 Task 3-02: "hold
      # exact reverse payloads per repository before each wave" must be an
      # artefact an operator can retrieve, not a value that existed only in
      # a step's stdout). `if-no-files-found: warn` rather than `error`: a
      # fully-converged run (or a dry-run whose desired state already
      # matched everywhere) legitimately produces zero reverse files, and
      # that is not itself a failure. See `Operator-Runbook.md` for the
      # exact reversal procedure that consumes this artifact.
      - name: Upload reverse-ruleset payloads
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reverse-ruleset-payloads-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reverse-payloads/*.json
          if-no-files-found: warn
          retention-days: 90

  # Repository surface enforcement + private vulnerability reporting.
  # Deliberately NOT a dependency of `sync` — see the note under `jobs:`.
  # This job still fails loudly on REPO-ACTIONS violations, which fails the
  # workflow; it just no longer takes settings convergence down with it.
  # The single step below runs BOTH predicates (surface-policy validation,
  # then vulnerability-reporting reconciliation) unconditionally and fails
  # closed if either diverged; it does not let one gate the other
  # (swift-institute/.github#278, #222).
  surfaces:
    if: ${{ !github.event.repository.private }}     # [CI-032]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out the central repository-policy product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swift-institute/.github
          ref: ${{ job.workflow_sha }}
          path: institute-ci
          persist-credentials: false

      - name: Select Swift 6.3
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: '6.3'

      - name: Validate inputs
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_ORG: ${{ inputs.org }}
        run: |
          if [[ -z "$INPUT_REPO" && -z "$INPUT_ORG" ]]; then
            echo "::error::Either 'repo' (owner/name) or 'org' input is required."
            echo "::error::For cross-org sweeps, use sync-metadata-nightly.yml which calls this workflow per-org via matrix."
            exit 1
          fi

      - name: Compute auth scope
        id: scope
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_ORG: ${{ inputs.org }}
        run: |
          if [[ -n "$INPUT_REPO" ]]; then
            owner="${INPUT_REPO%/*}"
            name="${INPUT_REPO#*/}"
            echo "owner=${owner}" >> "$GITHUB_OUTPUT"
            echo "repositories=${name}" >> "$GITHUB_OUTPUT"
          else
            echo "owner=${INPUT_ORG}" >> "$GITHUB_OUTPUT"
            # Empty repositories means: token covers all repos in the org installation.
            echo "repositories=" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint installation token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ steps.scope.outputs.owner }}
          repositories: ${{ steps.scope.outputs.repositories }}
          permission-administration: write
          permission-contents: read
          permission-metadata: read

      - name: Validate repository surfaces and reconcile private vulnerability reporting
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_ORG: ${{ inputs.org }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          swift run \
            --package-path institute-ci/Tools/RepositoryPolicy \
            repository-policy \
            --repository "$INPUT_REPO" \
            --organization "$INPUT_ORG" \
            --dry-run "$DRY_RUN" \
            --journal "${RUNNER_TEMP}/repository-policy-journal.jsonl" \
            --receipt "${RUNNER_TEMP}/repository-policy-receipt.json"
