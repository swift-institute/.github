# swift-institute org-level metadata.
#
# Schema mirrors per-repo .github/metadata.yaml.

homepage: "https://swift-institute.org"

# Org-account profile fields (display name, description, email, website, X, location).
# Applied via `gh api -X PATCH /orgs/<org>`; no org-level sync workflow exists yet.
org:
  name: "Swift Institute"
  description: "A layered Swift package ecosystem organized around shared conventions."
  email: "coen@coenttb.com"
  blog: ""
  twitter: "coenttb"
  location: "Netherlands"

readme:
  family: G
layer: control

# The organizations this organization governs. Each states its own layer in its own `.github` repository.
governs:
  - swift-atoms
  - swift-molecules
  - swift-standards
  - swift-arm-ltd
  - swift-bipm
  - swift-ecma
  - swift-iec
  - swift-ieee
  - swift-ietf
  - swift-incits
  - swift-intel
  - swift-iso
  - swift-linux-foundation
  - swift-microsoft
  - swift-riscv
  - swift-w3c
  - swift-whatwg
  - swift-compositions
