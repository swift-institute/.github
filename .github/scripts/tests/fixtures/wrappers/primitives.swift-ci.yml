name: Swift CI (primitives layer)

# Layer wrapper for swift-institute/.github/.github/workflows/swift-ci.yml.
#
# Reduced to its stable `workflow_call` interface, fixed `lint-bundle`,
# pass-through typed inputs, closed secret forwarding, and one universal
# call (CI/CD refactor programme Task 1-04, swift-institute/.github#276).
#
# The L1 layer invariants this wrapper used to enforce with its own job
# copies — Foundation-free per [PRIM-FOUND-001], extended into
# freestanding-buildability per [PKG-BUILD-007]/[PKG-BUILD-008] — are now
# enforced inside the universal reusable itself, selected by
# `lint-bundle: primitives` (Task 1-03, swift-institute/.github#302): the
# `embedded`, `embedded-wasm-sdk`, `android-build`, and
# `static-linux-musl-build` jobs there are this wrapper's former job
# copies, relocated verbatim and kept in their prior non-gating,
# `continue-on-error: true` posture. See that workflow's own comments for
# the full invariant description (including the two-deliberately-different-
# axes rationale for `embedded` vs `embedded-wasm-sdk`) and the soak/flip
# criteria for the still-advisory legs. This wrapper carries no duplicate
# copy of that documentation or those jobs.
#
# Consume from a caller package's .github/workflows/ci.yml via:
#
#   jobs:
#     ci:
#       uses: swift-primitives/.github/.github/workflows/swift-ci.yml@main
#       secrets: inherit
#
# Default `enable-private-repos: true` covers the canonical L1 case (most
# primitives consumers depend on private intra-Institute siblings); pass
# `with: { enable-private-repos: false }` only for the rare public-only
# consumer that wants to suppress the configure-git step. Credential
# resolution order (see the configure-private-repos composite): per-job
# swift-institute-bot App installation tokens (contents:read,
# auto-expiring) minted from the org-level
# SWIFT_INSTITUTE_BOT_APP_CLIENT_ID/_APP_PRIVATE_KEY secrets; legacy
# PRIVATE_REPO_TOKEN as github.com-wide fallback. `secrets: inherit` is
# uniform across all consumers per [CI-031]/[CI-058]/[CI-059]
# post-uniformity-sweep, so the org-level secrets flow through without
# per-package ci.yml edits.
#
# `enable-embedded-check` is intentionally NOT exposed as an input — embedded
# buildability is a layer invariant for L1 primitives, not a per-package opt-in.
# `embedded-target` narrows only the build root for a package whose default trait
# selects a non-Embedded surface; it does not disable the invariant. It is
# forwarded verbatim to the universal reusable, which is the sole consumer
# of it now.

on:
  workflow_call:
    inputs:
      swift-version:
        type: string
        default: "6.3"
        description: "Swift stable floor used for the SDK-install jobs (Wasm, Android, Static-musl) and propagated to the universal matrix. Mirrors the universal reusable's input so callers bumping the floor flip both layer and universal in one input. Raising it moves embedded-wasm-sdk, android-build, and static-linux-musl-build together with the universal matrix — the swift-institute/.github#67 exit condition is taken as that coupled bump, verified in a single full-tier run, not as a per-job split."
      enable-private-repos:
        type: boolean
        default: true
        description: "If true, configure git to use PRIVATE_REPO_TOKEN for github.com clones. Default true: most L1 consumers depend on private deps."
      macos-runner:
        type: string
        default: "macos-26"
        description: "macOS runner image. Bump annually when GitHub adds a new image version. env.* is invalid in runs-on: per Actions context-availability rules — input is the working centralization mechanism."
      platform-support:
        type: string
        default: ""
        description: "Per-package CI platform-support declaration, passed through verbatim to the universal matrix. Empty default (every existing caller) = full matrix, bit-identical to before this input existed. Non-empty = comma-separated subset of `apple,linux,windows` (lowercase, no spaces). Declare ONLY platform-identity exclusions — a package whose specification or identity excludes a platform; NOT a cost knob and NOT derived from Package.swift `platforms:`. The L1-specific cross-compile legs (embedded / wasm / android / musl) are layer invariants enforced inside the universal reusable and deliberately do NOT consult it. Full semantics: the universal reusable's `platform-support` input doc (swift-institute/.github/.github/workflows/swift-ci.yml)."
      embedded-target:
        type: string
        default: ""
        description: "Optional target to build for Embedded with default traits disabled. Empty preserves the full-package Embedded build. Forwarded to the universal reusable's own `embedded-target` input, consulted only by its `embedded` job (`lint-bundle == 'primitives'`)."
      docs-umbrella-module:
        type: string
        default: ""
        description: "Pass-through override forwarded to the universal reusable's `docs-umbrella-module` input (TX9: universal integrated docs are unconditional)."
      docs-umbrella-display-name:
        type: string
        default: ""
        description: "Pass-through override forwarded to the universal reusable's `docs-umbrella-display-name` input (TX9: universal integrated docs are unconditional)."
      docs-umbrella-bundle-id:
        type: string
        default: ""
        description: "Pass-through override forwarded to the universal reusable's `docs-umbrella-bundle-id` input (TX9: universal integrated docs are unconditional)."
      docs-umbrella-docc-path:
        type: string
        default: ""
        description: "Pass-through override forwarded to the universal reusable's `docs-umbrella-docc-path` input (TX9: universal integrated docs are unconditional)."
      docs-exclude-modules:
        type: string
        default: ""
        description: "Pass-through override forwarded to the universal reusable's `docs-exclude-modules` input (TX9: universal integrated docs are unconditional)."
      docs-swift-version:
        type: string
        default: "6.3"
        description: "Pass-through override forwarded to the universal reusable's `docs-swift-version` input (TX9: universal integrated docs are unconditional)."
    secrets:
      PRIVATE_REPO_TOKEN:
        required: false
        description: |
          Legacy github.com-wide fallback credential for private-dep
          clones. Superseded by the App-token path; retained for orgs
          not yet provisioned with the App secrets.
      SWIFT_INSTITUTE_BOT_APP_CLIENT_ID:
        required: false
        description: |
          swift-institute-bot App client ID (org-level secret). With the
          private key, lets configure-private-repos mint per-job
          contents:read installation tokens for the layer orgs so
          `swift package resolve` can clone private intra-Institute deps.
      SWIFT_INSTITUTE_BOT_APP_ID:
        required: false
        description: |
          Legacy-era App ID secret name carried by some orgs (e.g.
          swift-primitives; numeric App ID value class). Accepted as
          fallback when _APP_CLIENT_ID is absent; client-id wins when
          both exist (create-github-app-token@v3 resolution order).
      SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY:
        required: false
        description: |
          swift-institute-bot App private key (org-level secret).
          Counterpart of SWIFT_INSTITUTE_BOT_APP_CLIENT_ID.

jobs:
  # Universal matrix delegated to the ecosystem-wide reusable. This is
  # this wrapper's ONLY job (TX9 deleted the temporary `ci-ok`
  # compatibility aggregate once zero rulesets required `ci / ci-ok`):
  # every job this wrapper used to define itself (embedded,
  # embedded-wasm-sdk, android-build, static-linux-musl-build) lives
  # there, selected by
  # `lint-bundle: primitives` and kept in the same non-gating,
  # `continue-on-error: true` posture (Task 1-03, swift-institute/.github#302).
  matrix:
    if: ${{ !github.event.repository.private }}
    # TX7b receipt contract (swift-institute/.github#276): forward the
    # actions: read grant the universal ci-ok aggregate needs to read its
    # own run/jobs objects. Reusable-call permissions intersect down the
    # chain; a called job requesting a scope its caller lacks is rejected
    # at run creation.
    permissions:
      contents: read
      actions: read
    uses: swift-institute/.github/.github/workflows/swift-ci.yml@main
    with:
      swift-version: ${{ inputs.swift-version }}
      enable-private-repos: ${{ inputs.enable-private-repos }}
      macos-runner: ${{ inputs.macos-runner }}
      platform-support: ${{ inputs.platform-support }}
      embedded-target: ${{ inputs.embedded-target }}
      docs-umbrella-module: ${{ inputs.docs-umbrella-module }}
      docs-umbrella-display-name: ${{ inputs.docs-umbrella-display-name }}
      docs-umbrella-bundle-id: ${{ inputs.docs-umbrella-bundle-id }}
      docs-umbrella-docc-path: ${{ inputs.docs-umbrella-docc-path }}
      docs-exclude-modules: ${{ inputs.docs-exclude-modules }}
      docs-swift-version: ${{ inputs.docs-swift-version }}
      # The rule bundle an UNCONFIGURED consumer (no root `Lint.swift`) is
      # linted against. A literal, not an input: the wrapper IS the layer, so a
      # package cannot elect a weaker set for itself. `universal` is a subset of
      # `institute` is a subset of `primitives`, so the layer's own bundle is
      # what keeps an unconfigured package measured against exactly what its
      # configured peers here already activate. Consumers carrying a
      # `Lint.swift` never read this. See swift-institute/Workspace#54.
      # Also the ONE layer-selection channel that gates the four relocated
      # cross-compile legs above (Task 1-03).
      lint-bundle: primitives
      # This wrapper is the subject boundary. Propagate the exact PR head
      # repository/SHA (including a fork) or exact push SHA to every package
      # checkout the universal workflow owns. Its CI scripts keep their own
      # `job.workflow_sha` trust anchor; no write-capable token runs PR code.
      target-repo: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    secrets:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      SWIFT_INSTITUTE_BOT_APP_CLIENT_ID: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
      SWIFT_INSTITUTE_BOT_APP_ID: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_ID }}
      SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}

